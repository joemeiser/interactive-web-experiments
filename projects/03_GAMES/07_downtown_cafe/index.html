<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Downtown Cafe">
<title>Downtown Cafe</title>
<style>
:root{--ink:#3a2a33;--cream:#fbf1dc;--teal:#4f9a94;--teal2:#3d7f7a;--wood:#b5733f;--wood2:#6b4030;--red:#e8524f;--gold:#f7c531;--green:#4fb86a;--kb:100px;
  --font:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;--slot:54px;--btnh:54px;--fs:16px}
body[data-mode=mobile]{--slot:42px;--btnh:46px;--fs:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1f2d;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas,.pix{image-rendering:pixelated;image-rendering:crisp-edges}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none}
.hidden{display:none!important}
.btn{font:800 var(--fs)/1 var(--font);letter-spacing:.6px;text-transform:uppercase;color:#fff;background:var(--teal);border:3px solid var(--ink);border-radius:6px;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.28);padding:0 16px;min-height:42px;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.btn:disabled{background:#a9a1a3;color:#e9e3e0;cursor:not-allowed;text-shadow:none}
.btn.gold{background:#e9a21f}.btn.alt{background:var(--red)}.btn.off{background:#b9b0b0}.btn.danger{background:var(--red)}
.btn:focus-visible,.slot:focus-visible,.pantry:focus-visible,#vac:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:8px;padding:6px 8px;pointer-events:none;z-index:6}
#money{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--ink);border-radius:6px;padding:0 10px 0 6px;height:34px;font:800 18px/1 var(--font);box-shadow:inset 0 -3px 0 rgba(58,42,51,.14)}
#money i{width:18px;height:18px;border-radius:50%;background:var(--gold);border:3px solid #b9820f;box-shadow:inset 2px 2px 0 #ffe88a;display:block}
#hud .sp{flex:1}
#bset{pointer-events:auto;min-height:34px;height:34px;padding:0 10px;font-size:13px;background:var(--wood2)}
#hint{position:absolute;left:50%;top:50px;transform:translateX(-50%) translateY(-8px);max-width:min(92vw,520px);text-align:center;background:var(--ink);color:#fff;font:700 15px/1.25 var(--font);padding:8px 14px;border-radius:6px;border:3px solid #fff;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:7}
#hint.show{opacity:1;transform:translateX(-50%)}
body.inkitchen #hint{top:auto;bottom:calc(var(--kb) + 12px)}body.inkitchen #toast{bottom:calc(var(--kb) + 70px)}
#toast{position:absolute;left:50%;bottom:calc(var(--kb) + 12px);transform:translateX(-50%);background:var(--red);color:#fff;font:700 14px/1.2 var(--font);padding:8px 12px;border:3px solid var(--ink);border-radius:6px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:9;white-space:nowrap;max-width:94vw}
#toast.show{opacity:1}
#floats{position:absolute;inset:0;pointer-events:none;z-index:5}
.float{position:absolute;transform:translate(-50%,-100%);font:800 18px/1 var(--font);color:#fff;text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 2px var(--ink),0 4px 0 rgba(0,0,0,.25);white-space:nowrap;animation:rise 1.25s ease-out forwards}
.float.gain{color:#ffe14d}
@keyframes rise{0%{opacity:0;margin-top:8px}12%{opacity:1}70%{opacity:1}100%{opacity:0;margin-top:-56px}}
/* bottom bar */
#bar{position:absolute;left:0;right:0;bottom:0;background:var(--wood2);border-top:4px solid var(--ink);box-shadow:inset 0 4px 0 #8a553a;padding:8px 8px calc(6px + env(safe-area-inset-bottom));z-index:8;display:flex;flex-direction:column;gap:6px}
#row1{display:flex;gap:8px;align-items:stretch}
#tray{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:#9fb3bd;border:3px solid var(--ink);border-radius:8px;padding:4px 6px;box-shadow:inset 0 -4px 0 #7f95a1,inset 0 3px 0 #c6d5dc}
#tray .tl{font:800 11px/1 var(--font);letter-spacing:1px;text-transform:uppercase;color:#42545f;writing-mode:vertical-rl;transform:rotate(180deg)}
#trayslots{display:flex;gap:4px;flex:1;min-width:0}
.slot{flex:1 1 0;max-width:var(--slot);min-width:0;aspect-ratio:1;padding:0;background:#b9c9d1;border:2px dashed #6f8591;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot:disabled{cursor:default}
.slot img{width:88%;height:88%;object-fit:contain;display:block}
.slot:not(:disabled){background:#eaf1f4;border-style:solid;border-color:var(--ink)}
#tray.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#btns{display:flex;gap:8px}
#btns .btn{min-height:var(--btnh);min-width:118px;position:relative;font-size:calc(var(--fs) + 1px)}
#bshop.badge::after{content:"!";position:absolute;right:-7px;top:-9px;width:22px;height:22px;border-radius:50%;background:var(--red);border:3px solid var(--ink);color:#fff;font:800 13px/16px var(--font);text-shadow:none;animation:bop .8s infinite}
@keyframes bop{50%{transform:translateY(-3px)}}
#vac{position:relative;height:28px;border:3px solid var(--ink);border-radius:6px;background:#42303a;padding:0;overflow:hidden;cursor:pointer;width:100%}
#vacfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#6fd0e8,#3fa8d8);box-shadow:inset 0 3px 0 rgba(255,255,255,.35);transition:width .4s}
#vaclabel{position:relative;display:block;font:800 13px/22px var(--font);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#vac.ready #vacfill{background:linear-gradient(#ffe36b,#f2a91f);animation:glow 1s infinite}
@keyframes glow{50%{filter:brightness(1.18)}}
body[data-mode=mobile] #bar{padding-top:6px}
body[data-mode=mobile] #btns .btn{min-width:98px;padding:0 10px}
body[data-mode=mobile] #vac{position:fixed;top:6px;left:50%;transform:translateX(-50%);width:min(56vw,460px);height:30px;z-index:7}
body[data-mode=mobile] #vaclabel{font-size:12px;line-height:24px}
body[data-mode=mobile] #hud{height:42px}body[data-mode=mobile] #money{height:30px;font-size:16px}body[data-mode=mobile] #bset{height:30px;min-height:30px;font-size:11px;padding:0 8px}
body[data-mode=mobile] #hint{top:auto;bottom:calc(var(--kb) + 8px);font-size:13px;padding:6px 10px}
body[data-mode=mobile] #toast{bottom:calc(var(--kb) + 52px)}
body[data-mode=mobile] #kitchen{padding-top:44px}
body[data-mode=mobile] .khead b{font-size:17px}
.float.burp{color:#c8f06a;font-size:24px;animation:rise 1.25s ease-out forwards,wob .18s 4}
@keyframes wob{50%{transform:translate(-50%,-100%) rotate(-7deg) scale(1.15)}}
/* kitchen */
#kitchen{position:absolute;left:0;right:0;top:0;bottom:var(--kb);z-index:4;overflow:auto;padding:54px 12px 14px;
  background:repeating-linear-gradient(90deg,#f1e2c4 0 38px,#ecd9b6 38px 40px);display:flex;flex-direction:column;gap:10px}
.khead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.khead b{font:800 22px/1 var(--font);text-transform:uppercase;letter-spacing:1px;color:var(--wood2)}
.khead>span{font:700 13px/1 var(--font);color:#7a5a4a}
#tickets{display:flex;gap:8px;flex-wrap:wrap}
.ticket{display:flex;align-items:center;gap:3px;background:#fffdf5;border:3px solid var(--ink);border-radius:6px;padding:2px 6px 2px 2px;position:relative;box-shadow:0 3px 0 rgba(58,42,51,.25)}
.ticket .face{width:52px;height:44px}
.ticket .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:var(--green);margin-right:2px}
.ticket.m1 .dot{background:var(--gold)}.ticket.m2 .dot{background:var(--red)}.ticket.m2{animation:shake .5s infinite}
.need{position:relative;display:block;width:40px;height:40px}.need img{width:40px;height:40px;display:block}
.need.have img{opacity:.35}.need.have::after{content:"";position:absolute;left:12px;top:8px;width:10px;height:18px;border:solid #2f9e5a;border-width:0 5px 5px 0;transform:rotate(40deg)}
.noticket{font:700 13px/1.2 var(--font);color:#8a6a58;padding:8px 0}
.slabel{font:800 12px/1 var(--font);letter-spacing:2px;text-transform:uppercase;color:#8a553a;margin:4px 0 -4px 4px}
.shelf{display:flex;flex-wrap:wrap;gap:8px;padding:8px 8px 6px;min-height:60px;border-bottom:12px solid #9a623a;border-radius:0 0 4px 4px;box-shadow:0 5px 0 #6b4030,inset 0 -3px 0 rgba(107,64,48,.18);background:rgba(138,85,58,.08)}
.pantry{display:flex;flex-direction:column;align-items:center;gap:2px;width:98px;padding:6px 2px 6px;background:#fffaf0;border:3px solid var(--ink);border-radius:8px;cursor:pointer;font:800 12px/1.1 var(--font);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(58,42,51,.14)}
.pantry img{width:72px;height:72px}
.pantry:active{transform:translateY(2px)}
body[data-mode=desktop] .pantry:hover{background:#fff3c9}
body[data-mode=mobile] .pantry{width:74px;font-size:11px;padding:4px 1px}body[data-mode=mobile] .pantry img{width:48px;height:48px}
.shelves{display:flex;gap:12px;align-items:flex-start}.shelves>div{display:flex;flex-direction:column;gap:8px}.shelves>.cf{flex:5}.shelves>.cd{flex:3}
.empty{font:700 13px/1.2 var(--font);color:#8a6a58;padding:14px 6px}
/* modal */
#modal,#trip,#start{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(34,22,30,.62);padding:10px}
.sheet{background:var(--cream);border:4px solid var(--ink);border-radius:10px;box-shadow:0 8px 0 rgba(0,0,0,.3),inset 0 4px 0 rgba(255,255,255,.6);width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--teal);border-bottom:4px solid var(--ink);color:#fff}
.shead b{font:800 22px/1 var(--font);text-transform:uppercase;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
#mclose{background:var(--red);min-height:38px;padding:0 12px}
#mbody{overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
#mbody h3{font:800 13px/1 var(--font);letter-spacing:2px;text-transform:uppercase;color:#8a553a;margin:14px 0 8px}
.wallet{font:700 14px/1.35 var(--font);background:#fff6d0;border:3px solid var(--ink);border-radius:6px;padding:8px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#fffaf0;border:3px solid var(--ink);border-radius:8px;padding:8px 6px}
.card .big{width:72px;height:72px}.card b{font:800 14px/1.1 var(--font)}.card small{font:600 12px/1.2 var(--font);color:#7a6a70;min-height:15px}
.card.owned{background:#e6f3e2}.card.up{justify-content:space-between;min-height:118px}
.tag{font:800 11px/1 var(--font);letter-spacing:.5px;text-transform:uppercase;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:4px;padding:5px 7px}
.tag.dim{background:#a9a1a3}
.buy{background:#e9a21f;min-height:38px;width:100%}
.trips{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tripcard{display:flex;gap:10px;align-items:center;background:#fffaf0;border:3px solid var(--ink);border-radius:8px;padding:8px}
.tripcard canvas{width:144px;height:104px;border:3px solid var(--ink);flex:none}
.tinfo{display:flex;flex-direction:column;gap:6px;align-items:flex-start;flex:1}.tinfo b{font:800 16px/1.1 var(--font)}.tinfo small{font:600 13px/1.3 var(--font);color:#6a5a60}
.tinfo .buy{width:auto;min-width:120px}.tripcard.done{background:#e6f3e2}
body[data-mode=mobile] .tripcard canvas{width:108px;height:78px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:2px dashed #d9c7a3;font:800 15px/1 var(--font)}
.seg{display:flex;gap:6px}.fine{font:600 13px/1.3 var(--font);color:#7a6a70}
/* trip */
#trip .sheet{align-items:center;padding:16px;gap:10px;text-align:center;width:min(560px,100%);overflow:auto}
#tripcv{width:min(432px,100%);aspect-ratio:72/52;border:4px solid #fff;outline:4px solid var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.2);transform:rotate(-2deg);margin:8px 0}
#trip h2{font:800 24px/1.1 var(--font);margin:6px 0 0;color:var(--teal2)}#trip p{font:600 15px/1.4 var(--font);margin:0;max-width:44ch}
.kick{font:800 12px/1 var(--font);letter-spacing:3px;text-transform:uppercase;color:#b5733f}
/* start */
#start{background:linear-gradient(rgba(42,31,45,.35),rgba(42,31,45,.78));flex-direction:column;z-index:30;overflow:auto}
.title{font:800 clamp(34px,9vw,76px)/.92 var(--font);letter-spacing:2px;text-transform:uppercase;color:#fff6d8;text-align:center;text-shadow:0 4px 0 #e8524f,0 8px 0 var(--ink),0 12px 0 rgba(0,0,0,.3);margin:0 0 4px}
.title small{display:block;font-size:.3em;letter-spacing:6px;color:#9fe0d8;text-shadow:0 3px 0 var(--ink);margin-bottom:10px}
#faces{display:flex;justify-content:center;gap:2px;margin:6px 0 -6px;flex-wrap:nowrap}
#faces canvas{width:calc(64px*1.5);height:calc(84px*1.5)}
.startcard{background:var(--cream);border:4px solid var(--ink);border-radius:10px;padding:14px;width:min(520px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.startcard h2{margin:0;font:800 15px/1 var(--font);letter-spacing:2px;text-transform:uppercase;color:#8a553a;text-align:center}
.modes{display:flex;gap:10px}
.mode{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fffaf0;border:3px solid var(--ink);border-radius:8px;padding:12px 6px;cursor:pointer;font:800 15px/1.15 var(--font);color:var(--ink);position:relative;opacity:.72}
.mode small{font:600 12px/1.2 var(--font);color:#7a6a70}
.mode.sel{opacity:1;background:#fff3c9;box-shadow:0 0 0 4px var(--gold),inset 0 -4px 0 rgba(58,42,51,.12)}
.mode.det::after{content:"Detected";position:absolute;top:-11px;right:8px;background:var(--teal);color:#fff;font:800 10px/1 var(--font);letter-spacing:1px;text-transform:uppercase;padding:4px 6px;border:2px solid var(--ink);border-radius:4px}
.ico{position:relative;width:54px;height:40px}
.ico.pc::before{content:"";position:absolute;left:4px;top:0;width:46px;height:30px;background:#9fe0d8;border:4px solid var(--ink);border-radius:4px}.ico.pc::after{content:"";position:absolute;left:14px;bottom:0;width:26px;height:6px;background:var(--ink);border-radius:2px}
.ico.ph::before{content:"";position:absolute;left:16px;top:0;width:22px;height:40px;background:#9fe0d8;border:4px solid var(--ink);border-radius:5px}.ico.ph::after{content:"";position:absolute;left:24px;bottom:5px;width:6px;height:3px;background:var(--ink)}
#detnote{font:600 13px/1.3 var(--font);color:#6a5a60;text-align:center;margin:0}
#go{min-height:58px;font-size:20px;background:var(--red)}
@media (max-height:640px){#faces canvas{width:64px;height:84px}.startcard{padding:10px;gap:8px}}
@media (max-width:520px){#faces canvas{width:calc(64px*.75);height:calc(84px*.75)}#faces canvas:nth-child(n+7){display:none}}
@media (max-height:440px){#faces{display:none}.title small{display:none}}
#rotate{display:none;position:absolute;inset:0;z-index:40;background:#2a1f2d;color:#fff6d8;align-items:center;justify-content:center;text-align:center;font:800 22px/1.3 var(--font);padding:20px}
#rotate{flex-direction:column;gap:18px}#rotate .ph{width:54px;height:92px;border:5px solid #fff6d8;border-radius:10px;animation:turn 2.2s infinite}@keyframes turn{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#usepc{background:var(--wood2);font-size:12px}
@media (orientation:portrait){body[data-mode=mobile] #rotate{display:flex}}
@media (max-height:480px){.title{font-size:38px;text-shadow:0 3px 0 #e8524f,0 6px 0 var(--ink)}.startcard{padding:8px 10px;gap:6px;width:min(560px,100%)}.mode{flex-direction:row;justify-content:center;padding:6px;gap:10px}.mode small{display:none}.ico{transform:scale(.7);margin:-6px}#go{min-height:46px;font-size:17px}#detnote{font-size:11px}
 #trip .sheet{flex-direction:row;flex-wrap:wrap;justify-content:center;padding:10px;width:min(760px,100%)}#tripcv{height:44vh;width:auto;margin:4px 8px}#trip h2{font-size:19px;width:100%}#trip .kick{width:100%}#trip p{font-size:13px}
 .tripcard canvas{width:108px!important;height:78px!important}.shead{padding:6px 10px}.shead b{font-size:18px}}
</style>
</head>
<body data-mode="desktop">
<div id="app">
  <canvas id="cv"></canvas>
  <div id="floats"></div>
  <div id="kitchen" class="hidden">
    <div class="khead"><b>Kitchen</b><span>Waiting orders:</span><div id="tickets"></div></div>
    <div class="shelves"><div class="cf"><div class="slabel">Food</div><div id="shelf-food" class="shelf"></div></div>
    <div class="cd"><div class="slabel">Drinks</div><div id="shelf-drink" class="shelf"></div></div></div>
  </div>
  <div id="hud"><div id="money" title="Your money"><i></i>$<span id="mval">0</span></div><div class="sp"></div><button id="bset" class="btn" type="button">Settings</button></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="bar">
    <div id="row1">
      <div id="tray"><span class="tl">Tray</span><div id="trayslots"></div></div>
      <div id="btns"><button id="bkitchen" class="btn" type="button"><span>Kitchen</span></button><button id="bshop" class="btn gold" type="button"><span>Shop</span></button></div>
    </div>
    <button id="vac" type="button"><i id="vacfill"></i><span id="vaclabel"></span></button>
  </div>
  <div id="modal" class="hidden"><div class="sheet"><div class="shead"><b id="mtitle"></b><button id="mclose" class="btn" type="button">Close</button></div><div id="mbody"></div></div></div>
  <div id="trip" class="hidden"><div class="sheet"><span class="kick">Vacation time!</span><canvas id="tripcv" class="pix"></canvas><h2 id="tripname"></h2><p id="tripblurb"></p><p id="tripmore" class="fine"></p><button id="tripok" class="btn" type="button">Back to the cafe</button></div></div>
  <div id="rotate"><div class="ph"></div><div>Turn your phone sideways to play Downtown Cafe.<br><small style="font-size:14px;opacity:.8">(or tap here to go full screen)</small></div><button id="usepc" class="btn" type="button">I am on a computer</button></div>
  <div id="start">
    <h1 class="title"><small>Welcome to the</small>Downtown Cafe</h1>
    <div id="faces"></div>
    <div class="startcard">
      <h2>How are you playing?</h2>
      <div class="modes">
        <button id="mdesk" class="mode" type="button"><span class="ico pc"></span>Computer<small>Play with a mouse</small></button>
        <button id="mmob" class="mode" type="button"><span class="ico ph"></span>Phone or tablet<small>Tap to play, held sideways</small></button>
      </div>
      <p id="detnote"></p>
      <button id="go" class="btn" type="button">Open the cafe!</button>
    </div>
  </div>
</div>
<script>
'use strict';
// ===================== PIXEL ART ENGINE =====================
// A tiny software rasterizer that draws crisp, shaded, outlined pixel shapes
// into Uint32 buffers. Everything in the game is drawn with it.
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=Math.round;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];

function h2r(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function pk(r,g,b,a){return((a===undefined?255:a)<<24|b<<16|g<<8|r)>>>0;}
function col(h){const c=h2r(h);return pk(c[0],c[1],c[2]);}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return[h,s,l];}
function hsl2rgb(h,s,l){h=(((h%360)+360)%360)/360;if(s===0){const v=rnd(l*255);return[v,v,v];}
  const q=l<0.5?l*(1+s):l+s-l*s,p=2*l-q;
  const f=t=>{if(t<0)t+=1;if(t>1)t-=1;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};
  return[rnd(f(h+1/3)*255),rnd(f(h)*255),rnd(f(h-1/3)*255)];}
function hueTo(h,target,amt){const d=((target-h+540)%360)-180;if(Math.abs(d)<=amt)return target;return h+Math.sign(d)*amt;}
// lighten/darken with hue shifting (warm highlights, cool shadows)
function tone(hex,dl,cool,ds){const c=h2r(hex);let[h,s,l]=rgb2hsl(c[0],c[1],c[2]);
  if(s<0.06)h=cool>0?255:45;
  h=hueTo(h,cool>0?265:50,Math.abs(cool));s=clamp(s+(ds||0),0,1);l=clamp(l+dl,0.03,0.985);
  const o=hsl2rgb(h,s,l);return pk(o[0],o[1],o[2]);}
const _rc=new Map();
// ramp = [highlight, mid, shadow, line]
function ramp(hex){let r=_rc.get(hex);if(r)return r;
  const l=rgb2hsl(...h2r(hex))[2];
  if(l<0.22)r=[tone(hex,0.11,-6,0),col(hex),tone(hex,-0.06,8,0.04),tone(hex,-0.11,12,0.06)];
  else if(l>0.86)r=[tone(hex,0.05,-6,0),col(hex),tone(hex,-0.09,14,0.16),tone(hex,-0.46,20,0.12)];
  else r=[tone(hex,0.10,-10,0.02),col(hex),tone(hex,-0.11,14,0.05),tone(hex,-Math.max(0.27,l*0.56),22,l>0.7?-0.2:0.06)];
  r.hex=hex;_rc.set(hex,r);return r;}
function mulc(c,fr,fg,fb){if(fg===undefined)fg=fb=fr;return pk((c&255)*fr|0,(c>>8&255)*fg|0,(c>>16&255)*fb|0);}
function mixc(a,b,t){return pk(lerp(a&255,b&255,t)|0,lerp(a>>8&255,b>>8&255,t)|0,lerp(a>>16&255,b>>16&255,t)|0);}

function Buf(w,h){this.w=w;this.h=h;this.d=new Uint32Array(w*h);}
Buf.prototype.clear=function(){this.d.fill(0);};
function blit(b,cv){cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(b.d.buffer),b.w,b.h),0,0);}
function bufCanvas(b){const c=document.createElement('canvas');c.width=b.w;c.height=b.h;blit(b,c);return c;}

let _tm=new Float32Array(8192);
// Generic shaded shape. fn(x,y) -> -9 outside, else light value (-1..1).
// o: {flat:idx, noRim, rim:idx, on:ramp (only paint over that ramp's fill colours)}
function shape(b,x0,y0,x1,y1,fn,rp,o){
  x0=Math.max(0,Math.floor(x0)-1);y0=Math.max(0,Math.floor(y0)-1);x1=Math.min(b.w-1,Math.ceil(x1)+1);y1=Math.min(b.h-1,Math.ceil(y1)+1);
  const w=x1-x0+1,h=y1-y0+1;if(w<=0||h<=0)return;
  if(_tm.length<w*h)_tm=new Float32Array(w*h*2);
  let i=0;for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)_tm[i++]=fn(x,y);
  const d=b.d,bw=b.w,flat=o?o.flat:undefined,noRim=o&&o.noRim,on=o&&o.on,rimc=o&&o.rim!=null?rp[o.rim]:rp[3];
  i=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++,i++){
    const v=_tm[i];if(v<-5)continue;
    const k=(y0+y)*bw+x0+x;
    if(on){const cur=d[k];if(cur!==on[0]&&cur!==on[1]&&cur!==on[2])continue;}
    let c;
    if(!noRim&&(x===0||x===w-1||y===0||y===h-1||_tm[i-1]<-5||_tm[i+1]<-5||_tm[i-w]<-5||_tm[i+w]<-5))c=rimc;
    else if(flat!=null)c=rp[flat];
    else c=v>0.42?rp[0]:v<-0.3?rp[2]:rp[1];
    d[k]=c;
  }
}
function ell(b,cx,cy,rx,ry,rp,o){shape(b,cx-rx,cy-ry,cx+rx,cy+ry,(x,y)=>{const nx=(x-cx)/rx,ny=(y-cy)/ry;return nx*nx+ny*ny>1?-9:-nx*0.6-ny*0.85;},rp,o);}
// squircle: the "slightly blocky" look
function sq(b,cx,cy,rx,ry,n,rp,o){const m=n-1;shape(b,cx-rx,cy-ry,cx+rx,cy+ry,(x,y)=>{const nx=(x-cx)/rx,ny=(y-cy)/ry,ax=Math.abs(nx),ay=Math.abs(ny);
  if(Math.pow(ax,n)+Math.pow(ay,n)>1)return -9;return -Math.sign(nx)*Math.pow(ax,m)*0.6-Math.sign(ny)*Math.pow(ay,m)*0.85;},rp,o);}
function cap(b,x0,y0,x1,y1,r0,r1,rp,o){const dx=x1-x0,dy=y1-y0,L=dx*dx+dy*dy||1e-6,rm=Math.max(r0,r1);
  shape(b,Math.min(x0,x1)-rm,Math.min(y0,y1)-rm,Math.max(x0,x1)+rm,Math.max(y0,y1)+rm,(x,y)=>{let t=((x-x0)*dx+(y-y0)*dy)/L;t=t<0?0:t>1?1:t;
    const r=r0+(r1-r0)*t,ex=x-(x0+dx*t),ey=y-(y0+dy*t);if(ex*ex+ey*ey>r*r)return -9;return(-ex*0.6-ey*0.85)/r;},rp,o);}
function poly(b,p,rp,o){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of p){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}
  const cx=(x0+x1)/2,cy=(y0+y1)/2,hw=(x1-x0)/2||1,hh=(y1-y0)/2||1,n=p.length;let ar=0;
  for(let i=0;i<n;i++){const a=p[i],c=p[(i+1)%n];ar+=a[0]*c[1]-c[0]*a[1];}const s=ar>=0?1:-1;
  shape(b,x0,y0,x1,y1,(x,y)=>{for(let i=0;i<n;i++){const a=p[i],c=p[(i+1)%n];if(s*((c[0]-a[0])*(y-a[1])-(c[1]-a[1])*(x-a[0]))<-0.01)return -9;}
    return -(x-cx)/hw*0.5-(y-cy)/hh*0.7;},rp,o);}
function px(b,x,y,c){x=rnd(x);y=rnd(y);if(x>=0&&y>=0&&x<b.w&&y<b.h)b.d[y*b.w+x]=c;}
function gp(b,x,y){x=rnd(x);y=rnd(y);return(x>=0&&y>=0&&x<b.w&&y<b.h)?b.d[y*b.w+x]:0;}
function fr(b,x,y,w,h,c){x=rnd(x);y=rnd(y);w=rnd(w);h=rnd(h);const x1=Math.min(b.w,x+w),y1=Math.min(b.h,y+h);x=Math.max(0,x);y=Math.max(0,y);
  for(let j=y;j<y1;j++){const o=j*b.w;for(let i=x;i<x1;i++)b.d[o+i]=c;}}
function ln(b,x0,y0,x1,y1,c){x0=rnd(x0);y0=rnd(y0);x1=rnd(x1);y1=rnd(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(let n=0;n<400;n++){px(b,x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function bez(b,p0,c,p1,r0,r1,rp,o){let px_=p0[0],py_=p0[1];const N=8;for(let i=1;i<=N;i++){const u=i/N,a=(1-u)*(1-u),q=2*u*(1-u),w=u*u,x=a*p0[0]+q*c[0]+w*p1[0],y=a*p0[1]+q*c[1]+w*p1[1];
  cap(b,px_,py_,x,y,lerp(r0,r1,(i-1)/N),lerp(r0,r1,i/N),rp,o||{noRim:1});px_=x;py_=y;}}
// beveled box for scenery
function bx(b,x,y,w,h,rp,flat){fr(b,x,y,w,h,rp[3]);fr(b,x+1,y+1,w-2,h-2,rp[1]);if(!flat&&w>3&&h>3){fr(b,x+1,y+1,w-2,1,rp[0]);fr(b,x+1,y+h-2,w-2,1,rp[2]);}}
// stamp ASCII pattern
function pat(b,x,y,rows,pal){x=rnd(x);y=rnd(y);for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<r.length;i++){const c=pal[r[i]];if(c!==undefined)px(b,x+i,y+j,c);}}}
function stamp(dst,src,x,y,flip){x=rnd(x);y=rnd(y);for(let j=0;j<src.h;j++){const yy=y+j;if(yy<0||yy>=dst.h)continue;for(let i=0;i<src.w;i++){const c=src.d[j*src.w+(flip?src.w-1-i:i)];if(!c)continue;const xx=x+i;if(xx<0||xx>=dst.w)continue;dst.d[yy*dst.w+xx]=c;}}}
function erase(b,cx,cy,rx,ry){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
  if(x<0||y<0||x>=b.w||y>=b.h)continue;const nx=(x-cx)/rx,ny=(y-cy)/ry;if(nx*nx+ny*ny<=1)b.d[y*b.w+x]=0;}}
// silhouette pass: guarantee a dark outline wherever art meets transparency
function sil(b){const d=b.d,w=b.w,h=b.h,out=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,c=d[i];if(!c)continue;
    if(x===0||y===0||x===w-1||y===h-1||!d[i-1]||!d[i+1]||!d[i-w]||!d[i+w]){if((c&255)*3+(c>>8&255)*6+(c>>16&255)>1150)out.push(i);}}
  for(let k=0;k<out.length;k++){const i=out[k];d[i]=mulc(d[i],0.46,0.38,0.52);}}

function geo(sp,ps){const br=ps.breath||0,sqz=ps.squash||0;
  const bry=sp.bry-br*0.5-sqz,brx=sp.brx+sqz*0.5;
  const bx=CX+(ps.lean|0),bcy=BASE-LEG-bry,btop=rnd(bcy-bry);
  const hx=bx+(ps.sway|0),hy=btop-sp.hry+sp.neck+(ps.hdy|0);
  return{bx,bcy,btop,brx,bry,hx,hy,mx:hx,my:hy+sp.mo,shy:btop+9,shl:bx-(sp.brx-3),shr:bx+(sp.brx-3)};}

// customers allowed at once ramps up each time the game is opened: 2 seats, 3 after 4 orders, 4 after 10
const SEAT_AT=[0,0,4,10];let sessServed=0;

function needRotate(){return G.mode==='mobile'&&window.innerHeight>window.innerWidth;}
function trayCap(){return 4+2*G.up.tray;}
function patienceMul(){return(1+0.3*G.up.plant+0.3*G.up.radio)*(G.served<3?1.6:1);}

// ---------------- layout ----------------
function layout(){
  const iw=window.innerWidth,ih=window.innerHeight,mob=G.mode==='mobile';
  P=Math.max(2,Math.floor(mob?Math.min(Math.max(iw,ih)/330,Math.min(iw,ih)/165):Math.min(iw/380,ih/225)));
  const W=Math.ceil(iw/P),H=Math.ceil(ih/P);
  cv.width=W;cv.height=H;cv.style.width=W*P+'px';cv.style.height=H*P+'px';
  const barH=$('bar').offsetHeight||100,hud=Math.ceil(($('hud').offsetHeight||44)/P)+1;
  const matH=26,yC=H-Math.ceil(barH/P)-(matH+9),yF=yC-22;
  const fit=clamp(Math.floor(W/80),1,4),n=Math.min(fit,seatGoal()),sp=Math.min(W/n,116),xs=[];
  for(let i=0;i<n;i++)xs.push(rnd(W/2-sp*(n-1)/2+sp*i));
  L={W,H,P,hud,yC,yF,matH,seats:xs,fit,laneY:yC-3,ctrY:yC+18};
  // sync seat objects
  for(let i=0;i<n;i++){if(!seats[i])seats[i]={cust:null,coins:0,tip:0,coinT:0,mess:[],puddle:null,next:0.5+i*7+(i?Math.random()*3:0)};seats[i].x=xs[i];seats[i].i=i;if(seats[i].cust&&seats[i].cust.st!=='enter')seats[i].cust.x=xs[i];}
  while(seats.length>n){const s=seats.pop();if(s.coins)collect(s,true);if(s.cust){s.cust.seat=null;s.cust.e=null;s.cust.st='leave';s.cust.z=0;s.cust.dir=-1;}}
  rebuild();
  document.documentElement.style.setProperty('--kb',barH+'px');
}
function rebuild(){if(!L)return;scene=buildScene(L,G);counterCv=buildCounter(L,G);}

let shakeT=0;
function makePers(sp){const mild=G.served<1&&!custs.length;
  let idle=mild?'calm':pick(['calm','wiggly','bouncy','dancer','sleepy','looker','wiggly','dancer']);
  if(!mild&&['turtle','koala','panda'].indexOf(sp.id)>=0&&Math.random()<0.45)idle='sleepy';
  return{walk:mild?'normal':(WALKS[sp.id]&&Math.random()<0.6?WALKS[sp.id]:pick(['normal','bouncy','zoom','shuffle','skip','waddle'])),idle,
    joy:mild?'jump':pick(['jump','mega','spin','dance','scream','pound']),yum:pick(['hum','nomnom','opera','squeal','smack','ooh']),
    chew:pick(['munch','smack','squish','chomp']),pitch:mild?1:rand(0.72,1.45),energy:rand(0.8,1.7),moon:!mild&&Math.random()<0.14};}
function dust(x,y,n){for(let i=0;i<n;i++)addPart(x+rand(-6,6),y+rand(-3,1),SPR.dust,rand(-18,18),rand(-14,-4),rand(0.35,0.6));}
const RUDE={pig:.55,hippo:.5,dog:.45,monkey:.5,frog:.45,bear:.4,raccoon:.4,cow:.33,elephant:.3,duck:.3};
function pickManner(sp,order){if(G.served<2)return'plain';let m;
  if(Math.random()<(RUDE[sp.id]||0.15))m=pick(['burp','slob','spill','burp','slob']);else m=pick(['plain','savor','sniff','gobble','dab','hiccup','faint','speedy']);
  if(m==='hiccup'&&!order.some(o=>IMAP[o.id].kind==='cup'))m='faint';
  if(m==='spill'&&!order.some(o=>IMAP[o.id].kind==='cup'))m=pick(['burp','slob']);return m;}
function reactAll(c){for(const o of custs)if(o!==c&&(o.st==='wait'||o.st==='pay')){o.react=1.3;o.reactDir=c.x>o.x?1:-1;}}
function addMess(c,n,colr){const s=c.seat;if(!s)return;for(let i=0;i<n&&s.mess.length<36;i++)s.mess.push({dx:rnd(rand(-29,29)),dy:rnd(rand(7,28)),c:colr});}
function ownedOf(type){return ITEMS.filter(i=>G.owned[i.id]&&i.type===type);}
function wpick(a){let t=0;const w=a.map((x,i)=>{const v=1+i*0.25;t+=v;return v;});let r=Math.random()*t;for(let i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i];}return a[a.length-1];}
function makeOrder(){const foods=ownedOf('food'),drinks=ownedOf('drink'),o=[];
  const f1=wpick(foods);o.push(f1.id);
  if(foods.length>=2&&Math.random()<(drinks.length?(foods.length>=3?0.45:0.25):0.5)){const rest=foods.filter(f=>f!==f1);o.push(wpick(rest).id);}
  if(drinks.length)o.push(wpick(drinks).id);
  return o.map(id=>({id,got:false,stage:0,held:false}));}
function spawn(seat){const here=custs.map(c=>c.sp.id),pool=SPECIES.filter(s=>here.indexOf(s.id)<0);
  const sp=G.served===0&&!custs.length?SPMAP.bunny:pick(pool.length?pool:SPECIES);
  const ord=makeOrder(),manner=pickManner(sp,ord);
  const c={sp,ac:randomAcc(),seat,st:'enter',t:0,x:-34,z:0,dir:1,order:ord,manner,pers:makePers(sp),tempo:clamp((TEMPO[sp.id]||1)*rand(0.72,1.35)*(manner==='savor'?1.3:manner==='gobble'?0.85:manner==='speedy'?0.55:1),0.4,1.8),greet:0,drop:0,zz:1,step:0,fainted:false,hicced:false,joyD:.9,smear:0,smearC:null,drip:null,react:0,reactDir:0,spilled:false,wait:0,mood:0,ph:0,ph0:Math.random()*10,blink:0,nb:rand(1,4),earT:0,ne:rand(2,6),
    look:0,nl:rand(2,5),shake:0,hop:0,bubS:0,stache:null,e:null,es:Object.assign({},EATD,EATS[sp.eat]||{},manner==='gobble'?{bites:1,biteT:.5,chews:6,gob:1}:manner==='savor'?{shut:1,sway2:1}:manner==='slob'?{crumbs:5,open:1}:{}),
    B:new Buf(SW,SH),F:new Buf(SW,SH),cB:document.createElement('canvas'),cF:document.createElement('canvas'),g:null,bubY:0};
  c.cB.width=c.cF.width=SW;c.cB.height=c.cF.height=SH;seat.cust=c;custs.push(c);SFX.bell();return c;}
function setState(c,st){c.st=st;c.t=0;
  if(st==='wait'){c.wait=0;c.mood=0;c.greet=0.85;SFX.voice(c.sp,0.13);}
  else if(st==='delight'){const j=c.pers.joy;c.joyD=JOYD[j];c.landed=0;
    if(j==='mega'||j==='spin')SFX.whee();else if(j==='dance')SFX.lala();else if(j==='pound')SFX.thuds(8);
    if(j==='scream'){SFX.squeal();shakeT=0.35;floatText(c.x,c.bubY+8,pick(['YAY!','WOW!','YUM!','WOOHOO!','FINALLY!']),'gain');}else SFX.voice(c.sp,0.22);for(let i=0;i<3;i++)addPart(c.x+rand(-16,16),c.bubY+rand(-4,10),SPR.heart,rand(-8,8),rand(-26,-14),1.1);}
  else if(st==='eat'){c.e={i:0};startItem(c);}
  else if(st==='pay'){const bill=c.order.reduce((s,o)=>s+IMAP[o.id].price,0),rate=c.mood===0?0.5+0.25*G.up.jar:c.mood===1?0.2+0.1*G.up.jar:0,tip=Math.ceil(bill*rate);

    if(seatGoal()>g0&&L.fit>=seatGoal()){layout();SFX.seat();toast('Word is spreading! '+(seatGoal()===3?'Three':'Four')+' customers can visit at once now.');}}

function slotX(c,i){return(i-(c.order.length-1)/2)*20;}

function buildSteps(c,o){const st=coreSteps(c,o),M=c.manner,it=IMAP[o.id],last=c.e.i===c.order.length-1;
  if(M==='sniff'&&c.e.i===0)st.unshift({k:'sniff',d:.85,at:.15});
  if(M==='spill'&&it.kind==='cup'&&!c.spilled){c.spilled=true;
    if(c.es.trunk){const i=st.findIndex(s=>s.k==='spray');st[i].spill=1;st.splice(i+1,0,{k:'oops',d:.8,at:.1,fix:1});}
    else{const sips=st.map((s,i)=>s.k==='sip'?i:-1).filter(i=>i>=0),a=sips[1],b=st.findIndex(s=>s.k==='lower');st.splice(a,b-a,{k:'spill',d:.9,at:.3,fix:1},{k:'oops',d:.8,at:.1,fix:1});}}
  if(last){if(M==='burp')st.push({k:'burp',d:1.05,at:.3,fix:1},{k:'oops',d:.75,at:.1,fix:1});else if(M==='dab')st.push({k:'dab',d:.85,at:.2});}
  if(M==='hiccup'&&it.kind==='cup'&&!c.hicced){c.hicced=true;for(let i=0;i<3;i++)st.push({k:'hic',d:.5,at:.02,fix:1});}
  if(M==='faint'&&it.kind!=='cup'&&it.kind!=='bowl'&&!c.fainted){const i=st.findIndex(s=>s.k==='bite'||s.k==='bigulp');if(i>=0){c.fainted=true;st.splice(i+1,0,{k:'faint',d:1.7,at:.08,fix:1});}}
  for(const s of st)if(s.k==='yum'&&!s.ahh){s.v=c.pers.yum;if(s.v==='opera'){s.d=1.3;s.fix=1;}else if(s.v==='nomnom'||s.v==='ooh')s.d*=1.35;}
  for(const s of st)if(!s.fix&&s.k!=='zap'&&s.k!=='retract')s.d*=c.tempo;return st;}
function coreSteps(c,o){const S=c.es,it=IMAP[o.id],st=[],drink=it.kind==='cup'||it.kind==='bowl';
  if(S.trunk&&it.kind==='cup'){st.push({k:'treach',d:.38});
    for(const sg of[2,4]){st.push({k:'slurp',d:.55,stage:sg,at:0.05},{k:'tcurl',d:.3},{k:'spray',d:.42,at:0.15});if(sg<4)st.push({k:'treach',d:.32});}
    st.push({k:'yum',d:S.yumT,ahh:1});return st;}
  if(S.tongue&&!drink){st.push({k:'aim',d:.42},{k:'zap',d:.1,at:0},{k:'retract',d:.12},{k:'bigulp',d:.6,at:.3},{k:'chew',d:S.chewT,n:0,at:.3},{k:'chew',d:S.chewT,n:1,at:.3},{k:'yum',d:S.yumT});return st;}
  st.push({k:'reach',d:S.reach});
  if(S.toss&&it.kind==='hand')st.push({k:'toss',d:.6});else st.push({k:'lift',d:S.lift});
  if(S.rub&&!drink)st.push({k:'rub',d:.6,at:0.1});

  for(let i=cars.length-1;i>=0;i--){const c=cars[i];c.x+=c.v*c.dir*dt;if(c.x<scene.win.x-60||c.x>scene.win.x+scene.win.w+60)cars.splice(i,1);}}
function drawSprite(c,layer){const x=rnd(c.x)-48,y=c.fy-BASE;if(c.side&&c.sdir<0){ctx.save();ctx.translate(x+SW,y);ctx.scale(-1,1);ctx.drawImage(layer,0,0);ctx.restore();}else ctx.drawImage(layer,x,y);}
function drawBubble(c){const n=c.order.length,w=n*20+8,h=28,ink='#3a2a33';
  let x=rnd(c.x-w/2+(c.shake>0?Math.sin(c.shake*40)*2:0)),y=Math.max(L.hud+7,rnd(c.bubY-h-6+(1-c.bubS)*5));x=clamp(x,1,L.W-w-6);
  ctx.fillStyle=ink;ctx.fillRect(x+2,y,w-4,h);ctx.fillRect(x,y+2,w,h-4);ctx.fillRect(x+1,y+1,w-2,h-2);
  ctx.fillStyle='#fffdf5';ctx.fillRect(x+2,y+1,w-4,h-2);ctx.fillRect(x+1,y+2,w-2,h-4);ctx.fillStyle='#e7dfd0';ctx.fillRect(x+2,y+h-3,w-4,2);
  const tx=clamp(rnd(c.x)-3,x+4,x+w-10);for(let r=0;r<4;r++){const ww=6-2*r;ctx.fillStyle=ink;ctx.fillRect(tx+r-1,y+h-1+r,ww+2,1);if(ww>0){ctx.fillStyle=r?'#fffdf5':'#e7dfd0';ctx.fillRect(tx+r,y+h-1+r,ww,1);}}
  c.order.forEach((o,i)=>{const ic=itemCanvas(o.id,0,'all');if(o.got)ctx.globalAlpha=0.28;ctx.drawImage(ic,x+2+i*20,y+2);ctx.globalAlpha=1;if(o.got)ctx.drawImage(SPR.check,x+9+i*20,y+10);});
  const near=c.mood<2&&((c.mood===0&&c.wait>20.5)||(c.mood===1&&c.wait>38.5))&&Math.sin(gtime*14)>0;
  ctx.drawImage(SPR.dot[c.mood],x+w-6,y-5-(near?1:0));
  c.hit=[x-2,y-6,w+12,h+10];}
function drawCoins(s){const n=clamp(Math.ceil(s.coins/4),1,9),bx_=rnd(s.x)-((Math.min(n,5)*7)>>1),by=L.yC+18,bob=Math.sin(gtime*5+s.i)>0.6?1:0;
  if(s.coins>=30)ctx.drawImage(SPR.bill,rnd(s.x)-18,by-6);
  for(let i=0;i<n;i++){const col_=i%5,row=(i/5)|0;ctx.drawImage(SPR.coin,bx_+col_*7,by-row*4-(i===n-1?bob:0));}
  if(Math.sin(gtime*6+s.i*2)>0.8)ctx.drawImage(SPR.spark,bx_+((gtime*3|0)%3)*8,by-6);}
function render(){if(!scene)return;const yC=L.yC;
  ctx.setTransform(1,0,0,1,0,shakeT>0?rnd(Math.sin(gtime*70)*1.6):0);
  ctx.drawImage(scene.bg,0,0);
  const w=scene.win;ctx.save();ctx.beginPath();ctx.rect(w.x,w.y,w.w,w.h);ctx.clip();for(const c of cars){if(c.dir<0){ctx.save();ctx.translate(rnd(c.x)+c.im.width,w.road+13-c.im.height-5);ctx.scale(-1,1);ctx.drawImage(c.im,0,0);ctx.restore();}else ctx.drawImage(c.im,rnd(c.x),w.road+13-c.im.height);}ctx.restore();
  ctx.drawImage(scene.frame,w.x-scene.fo,w.y-scene.fo);
  for(const c of custs)renderCust(c);
  const order=custs.slice().sort((a,b)=>a.fy-b.fy);
  for(const c of order){drawSprite(c,c.cB);if(!c.side&&c.z<1)drawSprite(c,c.cF);}
  ctx.drawImage(counterCv,0,yC-1);
  for(const s of seats){if(s.puddle){const x=rnd(s.x+s.puddle.dx)-10,y=yC+24;ctx.fillStyle=s.puddle.c;ctx.fillRect(x+4,y,11,1);ctx.fillRect(x+1,y+1,18,1);ctx.fillRect(x,y+2,20,2);ctx.fillRect(x+2,y+4,15,1);ctx.fillRect(x+21,y+4,2,1);ctx.fillRect(x-3,y+1,2,1);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(x+4,y+1,4,1);ctx.fillStyle='rgba(58,42,51,.22)';ctx.fillRect(x+3,y+5,13,1);}
    for(const m of s.mess){ctx.fillStyle=m.c;ctx.fillRect(rnd(s.x)+m.dx,yC-1+m.dy,2,1+(m.dx&1));}}
  for(const s of seats){const c=s.cust;if(c&&c.z>=1)c.order.forEach((o,i)=>{if(!o.got)return;const ic=itemCanvas(o.id,Math.min(o.stage,4),o.held?'left':'all');if(ic)ctx.drawImage(ic,rnd(c.x+slotX(c,i))-12,yC+6);});}
  for(const c of order)if(!c.side&&c.z>=1&&!(c.drop>30))drawSprite(c,c.cF);
  for(const s of seats)if(s.coins)drawCoins(s);
  for(const c of custs)if(c.st==='wait'||(c.st==='approach'&&c.t>0.2))drawBubble(c);else c.hit=null;
  for(const p of parts){const a=1-p.t/p.life;ctx.globalAlpha=a<0.3?a/0.3:1;if(p.spr)ctx.drawImage(p.spr,rnd(p.x-p.spr.width/2),rnd(p.y-p.spr.height/2));else{ctx.fillStyle=p.c;ctx.fillRect(rnd(p.x),rnd(p.y),2,2);}}
  ctx.globalAlpha=1;
}
let lastT=0;
function frame(ts){const dt=Math.min(0.05,(ts-lastT)/1000||0.016);lastT=ts;
  if(started){updateCars(dt);if(!paused&&!needRotate())for(let i=0;i<speedMul;i++)update(dt);}else updateCars(dt);
  render();requestAnimationFrame(frame);}
function hitTest(ax,ay){
  for(const s of seats)if(s.coins&&Math.abs(ax-s.x)<34&&ay>L.yC+3)return{coins:s};
  let best=null;for(const c of custs){if(c.st!=='wait')continue;const inBody=Math.abs(ax-c.x)<32&&ay>c.bubY-4&&ay<L.yC+L.matH+10,inBub=c.hit&&ax>=c.hit[0]&&ax<=c.hit[0]+c.hit[2]&&ay>=c.hit[1]&&ay<=c.hit[1]+c.hit[3];
    if(inBody||inBub){if(!best||Math.abs(ax-c.x)<Math.abs(ax-best.x))best=c;}}
  return best?{cust:best}:null;}
function onPointer(e){if(!started||paused||view!=='cafe')return;const r=cv.getBoundingClientRect(),ax=(e.clientX-r.left)/P,ay=(e.clientY-r.top)/P,h=hitTest(ax,ay);
  if(!h)return;e.preventDefault();if(h.coins)collect(h.coins);else serve(h.cust);updateHint();}

function boot(){cv=$('cv');ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;buildSprites();buildCars();
  const had=load(),det=detectMode();let chosen=had?G.mode:det;
  document.body.dataset.mode=chosen;G.mode=chosen;AU.on=G.sound;
  // start screen
  const faces=$('faces');['bunny','frog','elephant','owl','turtle','panda','fox'].forEach((id,i)=>{const sp=SPMAP[id],B=new Buf(SW,SH),F=new Buf(SW,SH),c=document.createElement('canvas');c.width=64;c.height=84;c.className='pix';
    drawFront(sp,i%2?{scarf:ACC_COLORS[i%7]}:{bowtie:ACC_COLORS[i%7]},{eye:i%3===0?2:0,mouth:i%3===0?0.4:0},B,F);const t=bufCanvas(B),t2=bufCanvas(F),x=c.getContext('2d');x.drawImage(t,-16,-34);x.drawImage(t2,-16,-34);faces.appendChild(c);});
  const pickMode=m=>{chosen=m;G.mode=m;document.body.dataset.mode=m;$('mdesk').classList.toggle('sel',m==='desktop');$('mmob').classList.toggle('sel',m==='mobile');layout();};
  $('mdesk').onclick=()=>{auInit();SFX.click();pickMode('desktop');};$('mmob').onclick=()=>{auInit();SFX.click();pickMode('mobile');};
  $(det==='desktop'?'mdesk':'mmob').classList.add('det');
  $('detnote').textContent='It looks like you are on a '+(det==='desktop'?'computer':'phone or tablet')+'. Change it here if we guessed wrong.';
  $('go').textContent=had?'Continue my cafe':'Open the cafe!';
  $('go').onclick=()=>{if(G.mode==='mobile')goFull();auInit();SFX.buy();$('start').classList.add('hidden');started=true;paused=false;save();layout();renderTray();renderKitchen();setMoney();updateHint();};
  $('bkitchen').onclick=()=>setView(view==='kitchen'?'cafe':'kitchen');$('bshop').onclick=openShop;$('vac').onclick=openTrips;$('bset').onclick=openSettings;
  $('mclose').onclick=()=>{SFX.click();closeModal();};$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))closeModal();});
  $('usepc').onclick=e=>{e.stopPropagation();auInit();pickMode('desktop');save();};
  $('rotate').addEventListener('click',()=>{goFull();});
  for(const ev of['fullscreenchange','webkitfullscreenchange'])document.addEventListener(ev,()=>setTimeout(()=>{layout();renderTray();setMoney();},120));
  $('tripok').onclick=()=>{SFX.click();$('trip').classList.add('hidden');paused=false;};
  cv.addEventListener('pointerdown',onPointer);
  cv.addEventListener('pointermove',e=>{if(G.mode!=='desktop'||!started)return;const r=cv.getBoundingClientRect();cv.style.cursor=hitTest((e.clientX-r.left)/P,(e.clientY-r.top)/P)&&view==='cafe'?'pointer':'default';});
  window.addEventListener('resize',()=>{layout();renderTray();setMoney();});
  document.addEventListener('visibilitychange',()=>{lastT=performance.now();});
  pickMode(chosen);renderTray();setMoney();
  requestAnimationFrame(frame);
  window.__cafe={get sess(){return sessServed;},G,custs,seats,tray,get t(){return gtime;},openShop,openTrips,openSettings,closeModal,get L(){return L;},get view(){return view;},get paused(){return paused;},set speed(v){speedMul=v;},serve,collect,addTray,setView,buy,takeTrip,update,hitTest,save};
}
window.addEventListener('DOMContentLoaded',boot);

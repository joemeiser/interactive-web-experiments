<body>
<div id="wrap"><canvas id="screen" width="1280" height="720"></canvas></div>
<div id="hint">WASD / Arrows to move &middot; Left mouse to fire &middot; P pause &middot; M mute &middot; ESC to title</div>
<script>
/* =============================================================================
   Laser Miner / "Deep Dive" - direct JavaScript port of main.py
   Same constants, same physics numbers, same AI, same UI layout.
   No pygbag, no WASM, no CDN: one canvas + Web Audio.
   ========================================================================== */
(function (global) {
  'use strict';

  // ==========================================================================
  // CONFIGURATION  (values copied verbatim from main.py)
  // ==========================================================================
  var MAX_ENEMIES = 10;
  var ENEMY_BASE_SPEED = 80.0;
  var ENEMY_SPAWN_INTERVAL = 5;
  var ENEMY_SPAWN_VARIANCE = 2.5;
  var BOMBER_MAX_LIFETIME = 45.0;

  var FR_TRIGGER_TIME = 60.0;

  var TRAP_RADIUS = 64.0;
  var SEEK_TRIGGER_TIME = 2.0;
  var SUPER_JUMP_TRIGGER_TIME = 10.0;

  var ORE_DIAMOND_BASE = 0.005;
  var ORE_DIAMOND_DEPTH_BONUS = 0.04;
  var ORE_GOLD_BASE = 0.03;
  var ORE_GOLD_DEPTH_BONUS = 0.08;

  var LOOT_DROP_RANGE_TILES = 2;
  var LOOT_LIFETIME = 6.0;
  var LOOT_FLASH_START = 3.0;
  var SUPER_LASER_DURATION = 5.0;
  var SUPER_LASER_MULTIPLIER = 3.0;

  var WORLD_WIDTH = 60;
  var WORLD_HEIGHT = 150;
  var TILE_SIZE = 32;
  var VIEW_W_TILES = 32;   // 32x18 tiles = 1024x576 = 16:9, no pillarboxing
  var VIEW_H_TILES = 18;

  var VOL_MUSIC = 0.35;
  var VOL_MAX = 1.0;

  var PLAYER_SPEED = 230.0;
  var GRAVITY = 1700.0;
  var JUMP_FORCE = 620.0;

  // Frame-time safety. A stalled tab hands back a huge delta; unclamped, one
  // 1.5s frame applies 2550 px/s of gravity in a single step and launches
  // everything through the map.
  var MAX_DT = 1.0 / 20.0;
  var TERMINAL_VELOCITY = 1500.0;
  var MAX_SUBSTEP = TILE_SIZE * 0.4;

  var MAX_OXYGEN = 100.0;
  var OXYGEN_DRAIN_RATE = 2.0;
  var OXYGEN_REFILL_RATE = 60.0;

  var LASER_MAX_ENERGY = 100.0;
  var LASER_DRAIN_RATE = 15;
  var LASER_RECHARGE_RATE = 35.0;
  var LASER_RECHARGE_DELAY = 0.5;

  var MINE_REACH = 6;
  var MINING_SPEED = 0.25;
  var LASER_DPS = 100.0;

  var SURFACE_Y_LEVEL = 10;

  var COLOR_BG = 'rgb(15,10,25)';
  var COLOR_SKY = 'rgb(100,150,250)';
  var COLOR_CAVE = 'rgb(40,60,100)';
  var COLOR_PLAYER = 'rgb(255,100,100)';
  var COLOR_LASER = 'rgb(255,50,50)';
  var COLOR_SUPER_LASER = 'rgb(255,180,0)';
  var COLOR_ENERGY = 'rgb(0,255,255)';
  var COLOR_MYSTERY = 'rgb(25,20,30)';

  var COLOR_LEECH = [150, 50, 200];
  var COLOR_BOMBER = [255, 100, 0];
  var COLOR_THIEF = [50, 200, 50];

  var BLOCK_DATA = {
    1: { color: 'rgb(100,80,50)', rgb: [100, 80, 50], val: 0 },
    2: { color: 'rgb(95,95,95)', rgb: [95, 95, 95], val: 1 },
    3: { color: 'rgb(40,40,40)', rgb: [40, 40, 40], val: 10 },
    4: { color: 'rgb(255,215,0)', rgb: [255, 215, 0], val: 50 },
    5: { color: 'rgb(0,255,255)', rgb: [0, 255, 255], val: 200 },
    99: { color: 'rgb(20,0,20)', rgb: [20, 0, 20], val: 0 }
  };

  var GAME_WIDTH = VIEW_W_TILES * TILE_SIZE;   // 768
  var GAME_HEIGHT = VIEW_H_TILES * TILE_SIZE;  // 576

  var BLOCK_EMPTY = 0;
  var BLOCK_BEDROCK = 99;
  var ENEMY_TYPE_LEECH = 0;
  var ENEMY_TYPE_BOMBER = 1;
  var ENEMY_TYPE_THIEF = 2;

  var WEB_W = 1280, WEB_H = 720;

  var scale_w = WEB_W / GAME_WIDTH;
  var scale_h = WEB_H / GAME_HEIGHT;
  var render_scale = Math.min(scale_w, scale_h);
  var output_w = Math.floor(GAME_WIDTH * render_scale);
  var output_h = Math.floor(GAME_HEIGHT * render_scale);
  var render_offset_x = Math.floor((WEB_W - output_w) / 2);
  var render_offset_y = Math.floor((WEB_H - output_h) / 2);

  // ==========================================================================
  // RANDOM (swappable so tests can seed it)
  // ==========================================================================
  var RNG = Math.random;
  function rnd() { return RNG(); }
  function uniform(a, b) { return a + (b - a) * rnd(); }
  function choice(arr) { return arr[Math.floor(rnd() * arr.length) % arr.length]; }
  function randint(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }

  // ==========================================================================
  // RECT  (pygame.Rect semantics: integer coords, right = x + w)
  // ==========================================================================
  function Rect(x, y, w, h) {
    this.x = Math.floor(x); this.y = Math.floor(y);
    this.w = Math.floor(w); this.h = Math.floor(h);
  }
  Object.defineProperties(Rect.prototype, {
    left: { get: function () { return this.x; }, set: function (v) { this.x = Math.floor(v); } },
    right: { get: function () { return this.x + this.w; }, set: function (v) { this.x = Math.floor(v) - this.w; } },
    top: { get: function () { return this.y; }, set: function (v) { this.y = Math.floor(v); } },
    bottom: { get: function () { return this.y + this.h; }, set: function (v) { this.y = Math.floor(v) - this.h; } },
    centerx: { get: function () { return this.x + Math.floor(this.w / 2); } },
    centery: { get: function () { return this.y + Math.floor(this.h / 2); } }
  });
  Rect.prototype.colliderect = function (o) {
    return this.x < o.x + o.w && o.x < this.x + this.w &&
           this.y < o.y + o.h && o.y < this.y + this.h;
  };
  Rect.prototype.collidepoint = function (px, py) {
    return px >= this.x && px < this.x + this.w && py >= this.y && py < this.y + this.h;
  };
  // Liang-Barsky: does segment (x1,y1)-(x2,y2) touch this rect?
  Rect.prototype.clipline = function (x1, y1, x2, y2) {
    var t0 = 0, t1 = 1, dx = x2 - x1, dy = y2 - y1;
    var p = [-dx, dx, -dy, dy];
    var q = [x1 - this.x, this.x + this.w - x1, y1 - this.y, this.y + this.h - y1];
    for (var i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; }
      else {
        var r = q[i] / p[i];
        if (p[i] < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
        else { if (r < t0) return false; if (r < t1) t1 = r; }
      }
    }
    return true;
  };

  // ==========================================================================
  // STATE
  // ==========================================================================
  var player_width = Math.floor(TILE_SIZE * 0.65);   // 20
  var player_height = Math.floor(TILE_SIZE * 1.8);   // 57

  var grid = [];
  var active_enemies = [];
  var particles = [];
  var active_drops = [];

  var spawn_timer = 2.0;
  var screen_shake_amount = 0.0;
  var damage_flash_timer = 0.0;
  var player_dead = false;
  var death_timer = 0.0;
  var player_visible = true;
  var laser_energy = LASER_MAX_ENERGY;
  var laser_cooldown = 0.0;
  var time_since_combat = 0.0;
  var super_laser_timer = 0.0;

  var player_x = 0, player_y = 0, player_vx = 0, player_vy = 0;
  var cam_x = 0, cam_y = 0;
  var current_oxygen = MAX_OXYGEN;
  var score = 0;
  var game_over = false;
  var paused = false;
  var mine_timer = 0.0;
  var last_mine_target = null;
  var laser_end_point = null;
  var target_block = null;
  var jump_buffer = 0;
  var game_state = 'TITLE';
  var swallow_click = false;
  var dragging_slider = false;
  var elapsed_ms = 0;   // stands in for pygame.time.get_ticks()

  // ==========================================================================
  // WORLD
  // ==========================================================================
  function generate_world() {
    for (var x = 0; x < WORLD_WIDTH; x++) {
      var col = grid[x];
      for (var y = 0; y < WORLD_HEIGHT; y++) {
        if (y < SURFACE_Y_LEVEL) { col[y] = BLOCK_EMPTY; continue; }
        if (y === WORLD_HEIGHT - 1) { col[y] = BLOCK_BEDROCK; continue; }
        var depth_pct = (y - SURFACE_Y_LEVEL) / (WORLD_HEIGHT - SURFACE_Y_LEVEL);
        var rand_val = rnd();
        var diamond_chance = ORE_DIAMOND_BASE + depth_pct * ORE_DIAMOND_DEPTH_BONUS;
        var gold_chance = ORE_GOLD_BASE + depth_pct * ORE_GOLD_DEPTH_BONUS;
        // Cumulative thresholds. The Python compared against a flat 0.08 for
        // coal, which sinks below diamond+gold at depth, so coal stopped
        // generating entirely in the bottom half of the map.
        var t_diamond = diamond_chance;
        var t_gold = t_diamond + gold_chance;
        var t_coal = t_gold + 0.08 + depth_pct * 0.05;
        var t_stone = t_coal + 0.30 + depth_pct * 0.20;
        if (rand_val < t_diamond) col[y] = 5;
        else if (rand_val < t_gold) col[y] = 4;
        else if (rand_val < t_coal) col[y] = 3;
        else if (rand_val < t_stone) col[y] = 2;
        else col[y] = 1;
      }
    }
    var cx = Math.floor(WORLD_WIDTH / 2);
    for (var sx = cx - 2; sx <= cx + 2; sx++) {
      for (var sy = SURFACE_Y_LEVEL - 2; sy <= SURFACE_Y_LEVEL + 4; sy++) {
        if (sx >= 0 && sx < WORLD_WIDTH && sy >= 0 && sy < WORLD_HEIGHT) grid[sx][sy] = BLOCK_EMPTY;
      }
    }
  }

  function allocGrid() {
    grid = new Array(WORLD_WIDTH);
    for (var x = 0; x < WORLD_WIDTH; x++) grid[x] = new Int8Array(WORLD_HEIGHT);
  }

  function in_bounds_tile(tx, ty) {
    return tx >= 0 && tx < WORLD_WIDTH && ty >= 0 && ty < WORLD_HEIGHT;
  }
  function tile_at_pixel(px, py) {
    return [Math.floor(px / TILE_SIZE), Math.floor(py / TILE_SIZE)];
  }

  function get_collision_rects(rect) {
    var hits = [];
    var left = Math.floor(rect.left / TILE_SIZE);
    var right = Math.floor((rect.right - 1) / TILE_SIZE);
    var top = Math.floor(rect.top / TILE_SIZE);
    var bottom = Math.floor((rect.bottom - 1) / TILE_SIZE);
    for (var tx = left; tx <= right; tx++) {
      if (tx < 0 || tx >= WORLD_WIDTH) continue;
      var col = grid[tx];
      for (var ty = top; ty <= bottom; ty++) {
        if (ty < 0 || ty >= WORLD_HEIGHT) continue;
        if (col[ty] !== BLOCK_EMPTY) {
          hits.push(new Rect(tx * TILE_SIZE, ty * TILE_SIZE, TILE_SIZE, TILE_SIZE));
        }
      }
    }
    return hits;
  }

  // Sub-stepped so nothing can tunnel through a tile in a single frame, and
  // resolution only snaps to tiles that lie ahead of the direction of travel.
  function move_entity_x(rect, exact_x, vx, dt) {
    var dist = vx * dt;
    if (dist === 0) { rect.x = Math.floor(exact_x); return exact_x; }
    var limit = WORLD_WIDTH * TILE_SIZE - rect.w;
    var steps = Math.floor(Math.abs(dist) / MAX_SUBSTEP) + 1;
    var step = dist / steps;
    for (var i = 0; i < steps; i++) {
      var prev = exact_x;
      exact_x += step;
      // Outside the grid there are no tiles, so nothing stops an entity that
      // leaves the map. Treat the world edge as solid.
      if (exact_x < 0) { exact_x = 0; rect.x = 0; break; }
      if (exact_x > limit) { exact_x = limit; rect.x = Math.floor(limit); break; }
      rect.x = Math.floor(exact_x);
      var cols = get_collision_rects(rect);
      if (cols.length) {
        var edge = null, j;
        if (step > 0) {
          for (j = 0; j < cols.length; j++) {
            if (cols[j].left >= rect.left && (edge === null || cols[j].left < edge)) edge = cols[j].left;
          }
          if (edge !== null) rect.right = edge; else rect.x = Math.floor(prev);
        } else {
          for (j = 0; j < cols.length; j++) {
            if (cols[j].right <= rect.right && (edge === null || cols[j].right > edge)) edge = cols[j].right;
          }
          if (edge !== null) rect.left = edge; else rect.x = Math.floor(prev);
        }
        exact_x = rect.x;
        break;
      }
    }
    return exact_x;
  }

  function move_entity_y(rect, exact_y, vy, dt) {
    vy = Math.max(-TERMINAL_VELOCITY, Math.min(TERMINAL_VELOCITY, vy));
    var grounded = false;
    var dist = vy * dt;
    if (dist === 0) { rect.y = Math.floor(exact_y); return [exact_y, vy, grounded]; }
    var steps = Math.floor(Math.abs(dist) / MAX_SUBSTEP) + 1;
    var step = dist / steps;
    for (var i = 0; i < steps; i++) {
      var prev = exact_y;
      exact_y += step;
      rect.y = Math.floor(exact_y);
      var cols = get_collision_rects(rect);
      if (cols.length) {
        var edge = null, j;
        if (step > 0) {
          for (j = 0; j < cols.length; j++) {
            if (cols[j].top >= rect.top && (edge === null || cols[j].top < edge)) edge = cols[j].top;
          }
          if (edge !== null) rect.bottom = edge; else rect.y = Math.floor(prev);
          grounded = true;
        } else {
          for (j = 0; j < cols.length; j++) {
            if (cols[j].bottom <= rect.bottom && (edge === null || cols[j].bottom > edge)) edge = cols[j].bottom;
          }
          if (edge !== null) rect.top = edge; else rect.y = Math.floor(prev);
        }
        exact_y = rect.y;
        vy = 0;
        break;
      }
    }
    return [exact_y, vy, grounded];
  }

  function is_exposed_block(tx, ty) {
    if (!in_bounds_tile(tx, ty)) return false;
    if (ty - 1 < 0) return true;
    if (grid[tx][ty - 1] === BLOCK_EMPTY) return true;
    if (ty + 1 < WORLD_HEIGHT && grid[tx][ty + 1] === BLOCK_EMPTY) return true;
    if (tx - 1 >= 0 && grid[tx - 1][ty] === BLOCK_EMPTY) return true;
    if (tx + 1 < WORLD_WIDTH && grid[tx + 1][ty] === BLOCK_EMPTY) return true;
    return false;
  }

  function trigger_damage_feedback(amt) {
    time_since_combat = 0.0;
    if (!player_dead) {
      Audio_.play('die_thief');
      screen_shake_amount = Math.min(20.0, screen_shake_amount + amt);
      damage_flash_timer = 0.2;
    }
  }

  // ==========================================================================
  // PARTICLES & EXPLOSIONS
  // ==========================================================================
  var MAX_PARTICLES = 400;
  function spawn_particles(x, y, count, rgb, speed_scale) {
    speed_scale = speed_scale === undefined ? 1.0 : speed_scale;
    for (var i = 0; i < count; i++) {
      if (particles.length >= MAX_PARTICLES) break;  // hard cap: browsers are not forgiving
      var angle = uniform(0, Math.PI * 2);
      var speed = uniform(50, 150) * speed_scale;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: uniform(0.5, 1.2), color: 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')',
        size: randint(2, 5)
      });
    }
  }

  function update_particles(dt) {
    var keep = [];
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt; p.vy += 300 * dt;
      if (p.life > 0) keep.push(p);
    }
    particles = keep;
  }

  function explode(ex, ey, is_player) {
    Audio_.play('die_bomber');
    screen_shake_amount += is_player ? 25.0 : 15.0;
    var t = tile_at_pixel(ex, ey), ctx_ = t[0], cty = t[1];
    var radius = is_player ? 4 : 3;
    for (var x = ctx_ - radius; x <= ctx_ + radius; x++) {
      for (var y = cty - radius; y <= cty + radius; y++) {
        if (in_bounds_tile(x, y) && grid[x][y] !== BLOCK_BEDROCK) {
          if (grid[x][y] !== BLOCK_EMPTY && rnd() < 0.3) {
            spawn_particles(x * TILE_SIZE, y * TILE_SIZE, 2, BLOCK_DATA[grid[x][y]].rgb);
          }
          grid[x][y] = BLOCK_EMPTY;
        }
      }
    }
    spawn_particles(ex, ey, is_player ? 30 : 15, is_player ? [255, 100, 100] : COLOR_BOMBER,
                    is_player ? 2.0 : 1.0);
  }

  // ==========================================================================
  // DROPS
  // ==========================================================================
  function spawn_drop(x, y, d_type, rgb) {
    active_drops.push({ x: x, y: y, type: d_type, rgb: rgb, life: LOOT_LIFETIME });
  }

  function update_drops(dt) {
    var keep = [];
    var pr = new Rect(player_x, player_y, player_width, player_height);
    for (var i = 0; i < active_drops.length; i++) {
      var d = active_drops[i];
      d.life -= dt;
      var drop_rect = new Rect(d.x - 12, d.y - 12, 24, 24);
      if (pr.colliderect(drop_rect)) {
        Audio_.play('powerup');
        if (d.type === ENEMY_TYPE_THIEF) score += 500;
        else if (d.type === ENEMY_TYPE_LEECH) current_oxygen = MAX_OXYGEN;
        else if (d.type === ENEMY_TYPE_BOMBER) super_laser_timer = SUPER_LASER_DURATION;
        spawn_particles(d.x, d.y, 10, d.rgb);
      } else if (d.life > 0) keep.push(d);
    }
    active_drops = keep;
  }

  // ==========================================================================
  // ENEMIES
  // ==========================================================================
  function spawn_enemy() {
    var side = choice(['LEFT', 'RIGHT']);
    var spawn_x = side === 'LEFT' ? 10 : (WORLD_WIDTH * TILE_SIZE) - 50;
    var spawn_y = (SURFACE_Y_LEVEL - 3) * TILE_SIZE;
    var e_type = choice([ENEMY_TYPE_LEECH, ENEMY_TYPE_BOMBER, ENEMY_TYPE_THIEF]);
    var w, h;
    if (e_type === ENEMY_TYPE_LEECH) { w = 24; h = 16; }
    else if (e_type === ENEMY_TYPE_BOMBER) { w = 30; h = 30; }
    else { w = 16; h = 48; }
    active_enemies.push({
      rect: new Rect(spawn_x, spawn_y, w, h),
      exact_x: spawn_x, exact_y: spawn_y,
      vx: 0.0, vy: 0.0, type: e_type,
      hp: e_type === ENEMY_TYPE_BOMBER ? 40 : 25,
      grounded: false, flash_timer: 0.0, lifetime: 0.0,
      mode: 'CHASE', trap_origin_x: spawn_x, trap_timer: 0.0,
      seek_timer: 0.0, seek_dir: 0, super_jump_active: false
    });
  }

  function enemyColor(type) {
    return type === ENEMY_TYPE_LEECH ? COLOR_LEECH
         : type === ENEMY_TYPE_BOMBER ? COLOR_BOMBER : COLOR_THIEF;
  }

  function update_enemies(dt) {
    var p_rect = new Rect(player_x, player_y, player_width, player_height);
    var survivors = [];
    var pcx = player_x + player_width / 2, pcy = player_y + player_height / 2;

    for (var i = 0; i < active_enemies.length; i++) {
      var e = active_enemies[i];
      e.lifetime += dt;
      if (e.type === ENEMY_TYPE_BOMBER && e.lifetime > BOMBER_MAX_LIFETIME) {
        explode(e.rect.centerx, e.rect.centery, false);
        Audio_.play('die_bomber');
        continue;
      }

      var speed = ENEMY_BASE_SPEED * (e.type === ENEMY_TYPE_LEECH ? 1.5
                                    : e.type === ENEMY_TYPE_BOMBER ? 0.6 : 1.0);
      var dist = Math.abs(e.rect.centerx - e.trap_origin_x);
      if (dist < TRAP_RADIUS + 32) e.trap_timer += dt;
      else { e.trap_timer = 0.0; e.trap_origin_x = e.rect.centerx; e.super_jump_active = false; }

      if (e.trap_timer > SUPER_JUMP_TRIGGER_TIME && !e.super_jump_active) {
        e.super_jump_active = true;
        spawn_particles(e.rect.centerx, e.rect.centery, 15, [255, 50, 50]);
      }

      var player_is_below = p_rect.top > e.rect.bottom + 10;
      if (!e.super_jump_active && e.mode !== 'SEEK') {
        if (e.trap_timer > SEEK_TRIGGER_TIME && player_is_below) {
          e.mode = 'SEEK';
          e.seek_timer = 8.0;
          e.seek_dir = choice([-1, 1]);
          e.vy = -200;
        }
      }

      var dx;
      if (!player_dead) {
        if (e.super_jump_active) {
          dx = p_rect.centerx - e.rect.centerx;
          e.vx = dx > 0 ? speed * 1.3 : -speed * 1.3;
          if (Math.abs(dx) < 10) e.vx = choice([-speed, speed]);
        } else if (e.mode === 'SEEK') {
          e.vx = e.seek_dir * (speed * 1.2);
          e.seek_timer -= dt;
          if (e.vy > 300 || e.seek_timer <= 0) e.mode = 'CHASE';
        } else {
          dx = p_rect.centerx - e.rect.centerx;
          if (Math.abs(dx) < 8) e.vx = 0;
          else if (dx > 0) e.vx = speed;
          else e.vx = -speed;
        }
      } else e.vx = 0;

      var look_x = e.vx > 0 ? e.rect.right + 4 : e.rect.left - 4;
      var wall_ahead = get_collision_rects(new Rect(look_x, e.rect.top, 2, e.rect.h - 2)).length > 0;

      if (e.grounded) {
        var do_jump = false, final_jump = -550.0;
        if (e.super_jump_active) { do_jump = true; final_jump = -950.0; }
        else if ((e.mode === 'CHASE' && e.vx !== 0 && wall_ahead) || (e.mode === 'SEEK' && wall_ahead)) {
          do_jump = true;
        }
        if (do_jump) { e.vy = final_jump; e.grounded = false; }
      }

      e.vy += GRAVITY * dt;
      e.exact_x = move_entity_x(e.rect, e.exact_x, e.vx, dt);
      var r = move_entity_y(e.rect, e.exact_y, e.vy, dt);
      e.exact_y = r[0]; e.vy = r[1]; e.grounded = r[2];

      // Outside the grid there are no tiles to collide with, so an enemy that
      // walked off the world edge fell forever and drifted back under the map.
      e.exact_x = Math.max(0, Math.min(e.exact_x, WORLD_WIDTH * TILE_SIZE - e.rect.w));
      e.rect.x = Math.floor(e.exact_x);
      if (e.exact_y > WORLD_HEIGHT * TILE_SIZE) continue;

      var kamikaze = false;
      if (!player_dead && p_rect.colliderect(e.rect)) {
        kamikaze = true;
        trigger_damage_feedback(10.0);
        if (e.type === ENEMY_TYPE_LEECH) current_oxygen -= 15;
        else if (e.type === ENEMY_TYPE_THIEF) score = Math.max(0, score - 200);
        else if (e.type === ENEMY_TYPE_BOMBER) { explode(e.rect.centerx, e.rect.centery, false); current_oxygen -= 20; }
      }

      var killed = e.hp <= 0;

      if (kamikaze) {
        // enemy silently disappears, no loot
      } else if (killed) {
        Audio_.play(e.type === ENEMY_TYPE_LEECH ? 'die_leech'
                  : e.type === ENEMY_TYPE_BOMBER ? 'die_bomber' : 'die_thief');
        var p_col = enemyColor(e.type);
        spawn_particles(e.rect.centerx, e.rect.centery, 8, p_col);
        var dist_sq = Math.pow(pcx - e.rect.centerx, 2) + Math.pow(pcy - e.rect.centery, 2);
        if (dist_sq < Math.pow(LOOT_DROP_RANGE_TILES * TILE_SIZE, 2)) {
          spawn_drop(e.rect.centerx, e.rect.centery, e.type, p_col);
        }
      }

      if (e.flash_timer > 0) e.flash_timer -= dt;
      if (!kamikaze && !killed) survivors.push(e);
    }
    active_enemies = survivors;
  }

  // ==========================================================================
  // CAMERA
  // ==========================================================================
  function update_camera(target_x, target_y) {
    var dz_w = Math.floor(GAME_WIDTH * 0.2), dz_h = Math.floor(GAME_HEIGHT * 0.3);
    var dzl = cam_x + dz_w, dzt = cam_y + dz_h;
    var dzr = dzl + (GAME_WIDTH - 2 * dz_w), dzb = dzt + (GAME_HEIGHT - 2 * dz_h);
    if (target_x < dzl) cam_x -= (dzl - target_x);
    if (target_x > dzr) cam_x += (target_x - dzr);
    if (target_y < dzt) cam_y -= (dzt - target_y);
    if (target_y > dzb) cam_y += (target_y - dzb);
    cam_x = Math.max(0, Math.min(cam_x, WORLD_WIDTH * TILE_SIZE - GAME_WIDTH));
    cam_y = Math.max(0, Math.min(cam_y, WORLD_HEIGHT * TILE_SIZE - GAME_HEIGHT));
  }

  // ==========================================================================
  // AUDIO  (Web Audio port of generate_procedural_sound / generate_ambient_music)
  // ==========================================================================
  var Audio_ = {
    ctx: null, buffers: {}, ready: false, musicSrc: null, musicGain: null,
    laserSrc: null, laserGain: null, sfxGain: null, musicPaused: false,
    volume: VOL_MUSIC,

    init: function () {
      if (this.ready) return;
      var AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return;                       // node / unsupported: stay silent
      try { this.ctx = new AC(); } catch (err) { return; }
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = this.volume;
      this.musicGain.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.9;
      this.sfxGain.connect(this.ctx.destination);
      this.laserGain = this.ctx.createGain();
      this.laserGain.gain.value = 0.0;
      this.laserGain.connect(this.ctx.destination);
      this.buildAll();
      this.ready = true;
    },

    buffer: function (samples) {
      var buf = this.ctx.createBuffer(1, samples.length, 44100);
      buf.copyToChannel ? buf.copyToChannel(samples, 0) : buf.getChannelData(0).set(samples);
      return buf;
    },

    buildAll: function () {
      var sr = 44100, i, t, p, n, s, freq, val, amp;

      // 0.5s at 44.1k is exactly 90 cycles of the 180Hz hum and 15 of the 30Hz
      // tremolo, so the waveform already loops cleanly. The random sparks are
      // the only thing that can land on the seam, so keep them off the tail.
      n = Math.floor(sr * 0.5); s = new Float32Array(n);
      for (i = 0; i < n; i++) {
        t = i / sr;
        var hum = Math.sin(2 * Math.PI * 180 * t);
        amp = (Math.sin(2 * Math.PI * 30 * t) + 1) / 2;
        val = hum * (0.5 + 0.5 * amp);
        if (i > 400 && i < n - 1200 && Math.random() < 0.01) val += 0.8;
        s[i] = Math.max(-1, Math.min(1, val)) * 0.2;
      }
      this.buffers.laser = this.buffer(s);

      // jump: rising saw + noise burst
      n = Math.floor(sr * 0.2); s = new Float32Array(n);
      for (i = 0; i < n; i++) {
        t = i / sr; p = i / n;
        freq = 150 + 300 * p;
        var tone = 2 * (t * freq - Math.floor(t * freq + 0.5));
        var noise = p < 0.2 ? (Math.random() * 2 - 1) * (1 - p * 5) : 0;
        val = tone * 0.7 + noise * 0.5;
        var env = p < 0.1 ? p / 0.1 : 1 - (p - 0.1) / 0.9;
        s[i] = val * 0.25 * env;
      }
      this.buffers.jump = this.buffer(s);

      // die_leech: wet descending squeal
      n = Math.floor(sr * 0.3); s = new Float32Array(n);
      for (i = 0; i < n; i++) {
        t = i / sr; p = i / n;
        freq = 800 - 700 * Math.sqrt(p);
        val = Math.sin(2 * Math.PI * freq * t) * (0.8 + 0.2 * Math.sin(2 * Math.PI * 50 * t));
        s[i] = val * 0.4 * (1 - p);
      }
      this.buffers.die_leech = this.buffer(s);

      // die_bomber: filtered noise + square thud
      n = Math.floor(sr * 0.5); s = new Float32Array(n);
      var last = 0;
      for (i = 0; i < n; i++) {
        t = i / sr; p = i / n;
        freq = 120 - 80 * p;
        var sq = Math.sin(2 * Math.PI * freq * t) > 0 ? 1 : -1;
        var mix = sq * 0.3 + (Math.random() * 2 - 1) * 0.7;
        mix = (mix + last) / 2; last = mix;
        s[i] = mix * 0.5 * (1 - p * p);
      }
      this.buffers.die_bomber = this.buffer(s);

      // die_thief: warbling triangle
      n = Math.floor(sr * 0.25); s = new Float32Array(n);
      for (i = 0; i < n; i++) {
        t = i / sr; p = i / n;
        freq = 400 + Math.sin(2 * Math.PI * 40 * t) * 50;
        var period = 1 / freq, pt = t % period;
        val = 4 * Math.abs(pt / period - 0.5) - 1;
        s[i] = val * 0.4 * (1 - p);
      }
      this.buffers.die_thief = this.buffer(s);

      // mine_dirt: low-passed noise thud
      n = Math.floor(sr * 0.1); s = new Float32Array(n); last = 0;
      for (i = 0; i < n; i++) {
        val = ((Math.random() * 2 - 1) + last * 3) / 4; last = val;
        s[i] = val * 0.5 * (1 - i / n);
      }
      this.buffers.mine_dirt = this.buffer(s);

      // mine_stone: noise + click
      n = Math.floor(sr * 0.1); s = new Float32Array(n);
      for (i = 0; i < n; i++) {
        var click = Math.sin(2 * Math.PI * 2000 * (i / sr)) * 0.3;
        s[i] = ((Math.random() * 2 - 1) * 0.7 + click) * 0.4 * (1 - i / n);
      }
      this.buffers.mine_stone = this.buffer(s);

      // mine_gem: bell ting
      n = Math.floor(sr * 0.3); s = new Float32Array(n);
      for (i = 0; i < n; i++) {
        t = i / sr; p = i / n;
        var ting = Math.sin(2 * Math.PI * 1100 * t) * (1 - p);
        var nz = (Math.random() * 2 - 1) * Math.max(0, 1 - p * 4);
        s[i] = (ting * 0.6 + nz * 0.4) * 0.4;
      }
      this.buffers.mine_gem = this.buffer(s);

      // gold: two-tone chime
      n = Math.floor(sr * 0.5); s = new Float32Array(n);
      for (i = 0; i < n; i++) {
        t = i / sr; p = i / n;
        var tone2 = (Math.sin(2 * Math.PI * 440 * t) + Math.sin(2 * Math.PI * 660 * t)) * 0.5;
        var nz2 = (Math.random() * 2 - 1) * Math.max(0, 1 - p * 5);
        s[i] = Math.max(-1, Math.min(1, (tone2 * 0.6 + nz2 * 0.4) * (1 - p))) * 0.2;
      }
      this.buffers.gold = this.buffer(s);

      // powerup: rising sweep
      n = Math.floor(sr * 0.6); s = new Float32Array(n);
      for (i = 0; i < n; i++) {
        t = i / sr; p = i / n;
        s[i] = Math.sin(2 * Math.PI * (440 + p * 880) * t) * 0.5 * (1 - p);
      }
      this.buffers.powerup = this.buffer(s);

      // ambient music: identical to make_sounds_01.py -- bpm 100, one beat per
      // note (0.6s), plain sine, same envelope. Full loop is 9.6s.
      // (An earlier pass here used beat_len*2, which ran the sequence at half
      // speed against the wav the game actually shipped with.)
      var seq = [130.81, 196.00, 261.63, 196.00, 155.56, 233.08, 196.00, 155.56,
                 207.65, 155.56, 261.63, 155.56, 196.00, 146.83, 123.47, 196.00];
      var beat_len = 60 / 100, dur = beat_len, per = Math.floor(sr * dur);
      var music = new Float32Array(per * seq.length);
      for (var m = 0; m < seq.length; m++) {
        var note = seq[m];
        for (i = 0; i < per; i++) {
          t = i / sr;
          var env = t < 0.1 ? t / 0.1 : (t > dur - 0.5 ? (dur - t) / 0.5 : 1.0);
          music[m * per + i] = Math.sin(2 * Math.PI * note * t) * env;
        }
      }
      this.buffers.music = this.buffer(music);
    },

    resume: function () { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

    play: function (name) {
      if (!this.ready || !this.buffers[name]) return;
      try {
        var src = this.ctx.createBufferSource();
        src.buffer = this.buffers[name];
        src.connect(this.sfxGain);
        src.start(0);
      } catch (err) { /* never let audio break the frame */ }
    },

    startMusic: function () {
      if (!this.ready || this.musicSrc) return;
      try {
        this.musicSrc = this.ctx.createBufferSource();
        this.musicSrc.buffer = this.buffers.music;
        this.musicSrc.loop = true;
        this.musicSrc.connect(this.musicGain);
        this.musicSrc.start(0);
        this.musicPaused = false;
      } catch (err) { this.musicSrc = null; }
    },
    setMusicPaused: function (on) {
      if (!this.ready) return;
      this.musicPaused = on;
      this.musicGain.gain.value = on ? 0 : this.volume;
    },
    toggleMusic: function () { this.setMusicPaused(!this.musicPaused); },
    setVolume: function (v) {
      this.volume = v;
      if (this.ready && !this.musicPaused) this.musicGain.gain.value = v;
    },

    setLaser: function (on) {
      if (!this.ready) return;
      try {
        if (on && !this.laserSrc) {
          this.laserSrc = this.ctx.createBufferSource();
          this.laserSrc.buffer = this.buffers.laser;
          this.laserSrc.loop = true;
          this.laserSrc.connect(this.laserGain);
          this.laserSrc.start(0);
          this.laserGain.gain.setTargetAtTime(0.55, this.ctx.currentTime, 0.01);
        } else if (!on && this.laserSrc) {
          var src = this.laserSrc;
          this.laserSrc = null;
          this.laserGain.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.02);
          setTimeout(function () { try { src.stop(); } catch (e) {} }, 150);
        }
      } catch (err) { this.laserSrc = null; }
    }
  };

  // ==========================================================================
  // RESET
  // ==========================================================================
  function reset_game() {
    if (!grid.length) allocGrid();
    generate_world();
    player_x = Math.floor(WORLD_WIDTH / 2) * TILE_SIZE;
    player_y = (SURFACE_Y_LEVEL - 2) * TILE_SIZE;
    player_vx = 0; player_vy = 0;
    score = 0;
    current_oxygen = MAX_OXYGEN;
    laser_energy = LASER_MAX_ENERGY;
    game_over = false;
    active_enemies = [];
    particles = [];
    active_drops = [];
    player_dead = false;
    player_visible = true;
    time_since_combat = 0.0;
    super_laser_timer = 0.0;
    // everything below leaked between runs in the Python build
    paused = false;
    spawn_timer = 2.0;
    screen_shake_amount = 0.0;
    damage_flash_timer = 0.0;
    death_timer = 0.0;
    mine_timer = 0.0;
    last_mine_target = null;
    laser_cooldown = 0.0;
    laser_end_point = null;
    target_block = null;
    jump_buffer = 0;
    Audio_.setLaser(false);
    cam_x = Math.max(0, Math.min(player_x + player_width / 2 - GAME_WIDTH / 2, WORLD_WIDTH * TILE_SIZE - GAME_WIDTH));
    cam_y = Math.max(0, Math.min(player_y + player_height / 2 - GAME_HEIGHT / 2, WORLD_HEIGHT * TILE_SIZE - GAME_HEIGHT));
  }

  // ==========================================================================
  // INPUT
  // ==========================================================================
  var input = {
    keys: {},                       // keyed by KeyboardEvent.code
    mouseDown: false,
    mouseX: WEB_W / 2, mouseY: WEB_H / 2,
    events: []                      // queued discrete events
  };
  function keyHeld() {
    for (var i = 0; i < arguments.length; i++) if (input.keys[arguments[i]]) return true;
    return false;
  }

  var play_btn = new Rect(WEB_W / 2 - 120, WEB_H / 2 - 40, 240, 60);
  var inst_btn = new Rect(WEB_W / 2 - 120, WEB_H / 2 + 40, 240, 60);
  var slider_w = 200, slider_h = 10;
  var slider_x = WEB_W - slider_w - 50, slider_y = WEB_H - 50;

  var instructions_text = [
    'Welcome! In Laser Miner, your goal is to drill deep into the procedurally',
    'generated world to collect valuable ores like Gold and Diamonds while',
    'fighting off hostile creatures. Keep a close eye on your oxygen gauge,',
    "because you must return to the surface or find drops to refill it, or it's game over!",
    '',
    'For the best experience:',
    '> Play on a desktop or laptop computer. The game will not run correctly on a tablet or phone.',
    '> Use a Mouse: We highly recommend using an external mouse rather than a laptop trackpad.',
    '  The mining laser requires precise aiming that is difficult to achieve otherwise.',
    '> Use WASD Controls: While arrow keys work, using WASD allows you to move and jump agilely',
    '  with your left hand while aiming and shooting freely with your right.',
    '',
    'Controls:  WASD / Arrows to move  -  Left mouse to fire  -  P pause  -  M mute  -  ESC to title',
    '',
    '(Click anywhere to return to Title Screen)'
  ];

  function handleEvents() {
    while (input.events.length) {
      var ev = input.events.shift();
      if (ev.type === 'mousedown') {
        Audio_.init(); Audio_.resume();
        if (game_state === 'TITLE') {
          if (play_btn.collidepoint(ev.x, ev.y)) {
            reset_game();
            game_state = 'PLAYING';
            swallow_click = true;
            Audio_.startMusic();
            Audio_.setMusicPaused(false);
          } else if (inst_btn.collidepoint(ev.x, ev.y)) {
            game_state = 'INSTRUCTIONS';
            swallow_click = true;
          }
          var s_rect = new Rect(slider_x - 10, slider_y - 20, slider_w + 20, slider_h + 40);
          if (s_rect.collidepoint(ev.x, ev.y)) {
            dragging_slider = true;
            applySlider(ev.x);
          }
        } else if (game_state === 'INSTRUCTIONS') {
          game_state = 'TITLE';
          swallow_click = true;
        }
      } else if (ev.type === 'mouseup') {
        dragging_slider = false;
      } else if (ev.type === 'mousemove') {
        if (dragging_slider) applySlider(ev.x);
      } else if (ev.type === 'keydown') {
        if (game_state === 'PLAYING') {
          if (ev.code === 'Escape') {
            game_state = 'TITLE';
            Audio_.setLaser(false);
            Audio_.setMusicPaused(true);
            swallow_click = true;
          }
          if (ev.code === 'KeyP' && !game_over && !player_dead) {
            paused = !paused;
            Audio_.setLaser(false);
            Audio_.setMusicPaused(paused);
          }
          if (ev.code === 'KeyM') Audio_.toggleMusic();
          if (game_over && ev.code === 'KeyR') {
            game_state = 'TITLE';
            Audio_.setMusicPaused(true);
          }
        } else if (game_state === 'INSTRUCTIONS') {
          if (ev.code === 'Escape') game_state = 'TITLE';
        } else if (game_state === 'TITLE') {
          if (ev.code === 'Enter' || ev.code === 'Space') {
            reset_game();
            game_state = 'PLAYING';
            swallow_click = true;
            Audio_.startMusic();
            Audio_.setMusicPaused(false);
          }
        }
      }
    }
  }

  function applySlider(mx) {
    var pct = (mx - slider_x) / slider_w;
    pct = Math.max(0, Math.min(1, pct));
    Audio_.setVolume(pct * VOL_MAX);
  }

  // ==========================================================================
  // UPDATE
  // ==========================================================================
  function update_playing(dt) {
    if (paused) return;

    if (!game_over) {
      time_since_combat += dt;
      if (super_laser_timer > 0) super_laser_timer -= dt;

      update_particles(dt);
      update_enemies(dt);
      update_drops(dt);

      spawn_timer -= dt;
      if (spawn_timer <= 0) {
        var force_recycle = (time_since_combat > FR_TRIGGER_TIME && active_enemies.length >= MAX_ENEMIES);
        if (force_recycle) { active_enemies.shift(); spawn_enemy(); }
        else if (active_enemies.length < MAX_ENEMIES) spawn_enemy();
        spawn_timer = Math.max(0.5, ENEMY_SPAWN_INTERVAL + uniform(-ENEMY_SPAWN_VARIANCE, ENEMY_SPAWN_VARIANCE));
      }

      if (!player_dead) {
        var dx = keyHeld('ArrowLeft', 'KeyA') ? -1 : keyHeld('ArrowRight', 'KeyD') ? 1 : 0;
        if (keyHeld('Space', 'KeyW', 'ArrowUp')) jump_buffer = 5;

        player_vx = dx * PLAYER_SPEED;
        player_vy += GRAVITY * dt;

        var pr = new Rect(player_x, player_y, player_width, player_height);
        player_x = move_entity_x(pr, player_x, player_vx, dt);
        var res = move_entity_y(pr, player_y, player_vy, dt);
        player_y = res[0]; player_vy = res[1];
        var grounded = res[2];

        // anti-embed guard: never let the resolver fling a stuck player
        if (get_collision_rects(pr).length) {
          for (var g = 0; g < TILE_SIZE * 2; g++) {
            pr.y -= 1;
            if (!get_collision_rects(pr).length) break;
          }
          player_y = pr.y;
          player_vy = 0;
        }

        if (jump_buffer > 0) {
          if (grounded) { player_vy = -JUMP_FORCE; Audio_.play('jump'); jump_buffer = 0; }
          else jump_buffer -= 1;
        }

        if (swallow_click && !input.mouseDown) swallow_click = false;
        laser_end_point = null;
        target_block = null;

        var pxc = player_x + player_width / 2, pcy2 = player_y + player_height / 2;

        if (input.mouseDown && !swallow_click) {
          if (laser_energy > 0) {
            laser_cooldown = LASER_RECHARGE_DELAY;
            laser_energy -= LASER_DRAIN_RATE * dt;
            Audio_.setLaser(true);

            var mx = (input.mouseX - render_offset_x) / render_scale;
            var my = (input.mouseY - render_offset_y) / render_scale;
            var wmx = mx + cam_x, wmy = my + cam_y;
            var ang = Math.atan2(wmy - pcy2, wmx - pxc);

            var hit_pos = null;
            var max_d = MINE_REACH * TILE_SIZE;
            var max_d_sq = max_d * max_d + 1;
            for (var d = 0; d < max_d; d += 8) {
              var cx = pxc + Math.cos(ang) * d, cy = pcy2 + Math.sin(ang) * d;
              var tp = tile_at_pixel(cx, cy), tx = tp[0], ty = tp[1];
              if (in_bounds_tile(tx, ty)) {
                var blk = grid[tx][ty];
                if (blk !== BLOCK_EMPTY) {
                  max_d_sq = d * d;
                  if (blk !== BLOCK_BEDROCK && is_exposed_block(tx, ty)) target_block = [tx, ty];
                  hit_pos = [cx, cy];
                  break;
                }
              }
            }
            if (hit_pos) laser_end_point = [hit_pos[0] - cam_x, hit_pos[1] - cam_y];
            else laser_end_point = [pxc + Math.cos(ang) * max_d - cam_x, pcy2 + Math.sin(ang) * max_d - cam_y];

            var lx = pxc + Math.cos(ang) * Math.sqrt(max_d_sq);
            var ly = pcy2 + Math.sin(ang) * Math.sqrt(max_d_sq);
            for (var ei = 0; ei < active_enemies.length; ei++) {
              var en = active_enemies[ei];
              if (en.rect.clipline(pxc, pcy2, lx, ly)) {
                time_since_combat = 0.0;
                en.hp -= LASER_DPS * dt * (super_laser_timer > 0 ? SUPER_LASER_MULTIPLIER : 1.0);
                en.flash_timer = 0.1;
                target_block = null;
              }
            }
          } else {
            Audio_.setLaser(false);
            if (rnd() < 0.05) Audio_.play('mine_dirt');
            target_block = null;
          }
        } else {
          Audio_.setLaser(false);
          if (laser_cooldown > 0) laser_cooldown -= dt;
          else if (laser_energy < LASER_MAX_ENERGY) laser_energy += LASER_RECHARGE_RATE * dt;
        }
        laser_energy = Math.max(0, Math.min(laser_energy, LASER_MAX_ENERGY));

        if (target_block && laser_energy > 0) {
          if (last_mine_target && target_block[0] === last_mine_target[0] && target_block[1] === last_mine_target[1]) {
            mine_timer += dt;
          } else mine_timer = 0;
          last_mine_target = target_block;

          var req_speed = MINING_SPEED * (super_laser_timer > 0 ? 0.5 : 1.0);
          if (mine_timer >= req_speed) {
            var bx = target_block[0], by = target_block[1];
            var b = grid[bx][by];
            if (b === 4) Audio_.play('gold');
            else if (b === 5) Audio_.play('mine_gem');
            else if (b === 1) Audio_.play('mine_dirt');
            else Audio_.play('mine_stone');
            score += BLOCK_DATA[b].val;
            grid[bx][by] = BLOCK_EMPTY;
            mine_timer = 0;
            last_mine_target = null;
            spawn_particles(bx * TILE_SIZE + 16, by * TILE_SIZE + 16, 5, BLOCK_DATA[b].rgb);
          }
        } else {
          mine_timer = 0;
          last_mine_target = null;
        }

        player_x = Math.max(0, Math.min(player_x, WORLD_WIDTH * TILE_SIZE - player_width));
        player_y = Math.max(0, Math.min(player_y, WORLD_HEIGHT * TILE_SIZE - player_height));

        if (player_y < SURFACE_Y_LEVEL * TILE_SIZE) current_oxygen += OXYGEN_REFILL_RATE * dt;
        else current_oxygen -= OXYGEN_DRAIN_RATE * dt;
        current_oxygen = Math.max(0, Math.min(current_oxygen, MAX_OXYGEN));

        if (current_oxygen <= 0) {
          player_dead = true;
          player_visible = false;
          Audio_.setLaser(false);
          explode(player_x + player_width / 2, player_y + player_height / 2, true);
          death_timer = 2.0;
        }
      } else {
        Audio_.setLaser(false);
        death_timer -= dt;
        if (death_timer <= 0) game_over = true;
      }
    }

    if (damage_flash_timer > 0) damage_flash_timer -= dt;
    if (screen_shake_amount > 0) {
      screen_shake_amount -= 60 * dt;
      if (screen_shake_amount < 0) screen_shake_amount = 0;
    }
    update_camera(player_x + player_width / 2, player_y + player_height / 2);
  }

  // ==========================================================================
  // RENDER
  // ==========================================================================
  var screenCtx = null, gameCtx = null, gameCanvas = null, titleImg = null;

  function rgbStr(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  function fillRect(ctx, color, x, y, w, h) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  }
  function strokeRect(ctx, color, x, y, w, h, lw) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.strokeRect(Math.floor(x) + lw / 2, Math.floor(y) + lw / 2,
                   Math.floor(w) - lw, Math.floor(h) - lw);
  }
  function text(ctx, str, x, y, color, font, align, baseline) {
    ctx.fillStyle = color;
    ctx.font = font;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = baseline || 'top';
    ctx.fillText(str, x, y);
  }

  var FONT = 'bold 20px Arial, Helvetica, sans-serif';
  var FONT_INST = 'bold 21px Arial, Helvetica, sans-serif';
  var FONT_OVER = 'bold 48px Arial, Helvetica, sans-serif';
  var FONT_PAUSE = 'bold 64px Arial, Helvetica, sans-serif';

  function draw_ui() {
    var ctx = gameCtx;
    var bar_w = 200;
    var pct = Math.max(0, current_oxygen / MAX_OXYGEN);
    var col = pct > 0.5 ? 'rgb(0,255,0)' : pct > 0.2 ? 'rgb(255,165,0)' : 'rgb(255,0,0)';
    strokeRect(ctx, 'rgb(255,255,255)', 20, 20, bar_w, 20, 2);
    fillRect(ctx, col, 22, 22, (bar_w - 4) * pct, 16);
    text(ctx, 'OXYGEN', 230, 20, 'rgb(255,255,255)', FONT);

    var e_pct = Math.max(0, laser_energy / LASER_MAX_ENERGY);
    var ecol = super_laser_timer > 0 ? COLOR_SUPER_LASER
             : laser_energy <= 0.01 ? 'rgb(100,100,100)'
             : laser_energy < 20 ? 'rgb(255,100,100)' : COLOR_ENERGY;
    strokeRect(ctx, 'rgb(255,255,255)', 20, 50, bar_w, 15, 2);
    fillRect(ctx, ecol, 22, 52, (bar_w - 4) * e_pct, 11);
    text(ctx, super_laser_timer > 0 ? 'LASER (MAX)' : 'LASER', 230, 48, ecol, FONT);

    text(ctx, 'SCORE: $' + Math.floor(score), GAME_WIDTH - 180, 20, 'rgb(255,215,0)', FONT);
    text(ctx, 'DEPTH: ' + Math.floor(player_y / TILE_SIZE) + 'm', GAME_WIDTH - 180, 45, 'rgb(200,200,200)', FONT);
    text(ctx, 'ENEMIES: ' + active_enemies.length, 20, GAME_HEIGHT - 30, 'rgb(150,150,150)', FONT);

    if (paused) {
      ctx.globalAlpha = 100 / 255;
      fillRect(ctx, 'rgb(0,0,0)', 0, 0, GAME_WIDTH, GAME_HEIGHT);
      ctx.globalAlpha = 1;
      text(ctx, 'PAUSED', GAME_WIDTH / 2, GAME_HEIGHT / 2, 'rgb(255,255,255)', FONT_PAUSE, 'center', 'middle');
      text(ctx, 'Press P to resume', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 60, 'rgb(200,200,200)', FONT, 'center', 'middle');
    }

    if (game_over) {
      ctx.globalAlpha = 200 / 255;
      fillRect(ctx, 'rgb(0,0,0)', 0, 0, GAME_WIDTH, GAME_HEIGHT);
      ctx.globalAlpha = 1;
      text(ctx, 'GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 40, 'rgb(255,50,50)', FONT_OVER, 'center', 'middle');
      text(ctx, 'FINAL SCORE: $' + Math.floor(score), GAME_WIDTH / 2, GAME_HEIGHT / 2 + 20, 'rgb(255,215,0)', FONT_OVER, 'center', 'middle');
      text(ctx, 'Press R to return to Title Screen', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 80, 'rgb(255,255,255)', FONT, 'center', 'middle');
    }

    if (damage_flash_timer > 0) {
      ctx.globalAlpha = Math.max(0, Math.min(1, (100 * (damage_flash_timer / 0.2)) / 255));
      fillRect(ctx, 'rgb(255,0,0)', 0, 0, GAME_WIDTH, GAME_HEIGHT);
      ctx.globalAlpha = 1;
    }
  }

  function draw_world(rcx, rcy) {
    var ctx = gameCtx;
    fillRect(ctx, COLOR_BG, 0, 0, GAME_WIDTH, GAME_HEIGHT);
    var stx = Math.floor(rcx / TILE_SIZE), sty = Math.floor(rcy / TILE_SIZE);
    var w_tiles = GAME_WIDTH / TILE_SIZE + 2, h_tiles = GAME_HEIGHT / TILE_SIZE + 2;
    for (var tx = stx; tx < stx + w_tiles; tx++) {
      for (var ty = sty; ty < sty + h_tiles; ty++) {
        if (!in_bounds_tile(tx, ty)) continue;
        var wx = tx * TILE_SIZE - rcx, wy = ty * TILE_SIZE - rcy;
        if (ty < SURFACE_Y_LEVEL) fillRect(ctx, COLOR_SKY, wx, wy, TILE_SIZE, TILE_SIZE);
        else if (grid[tx][ty] === BLOCK_EMPTY) fillRect(ctx, COLOR_CAVE, wx, wy, TILE_SIZE, TILE_SIZE);
        var blk = grid[tx][ty];
        if (blk !== BLOCK_EMPTY) {
          if (is_exposed_block(tx, ty)) {
            fillRect(ctx, BLOCK_DATA[blk].color, wx, wy, TILE_SIZE, TILE_SIZE);
            strokeRect(ctx, 'rgb(0,0,0)', wx, wy, TILE_SIZE, TILE_SIZE, 1);
          } else {
            fillRect(ctx, COLOR_MYSTERY, wx, wy, TILE_SIZE, TILE_SIZE);
          }
        }
      }
    }
  }

  function draw_enemies(rcx, rcy) {
    var ctx = gameCtx;
    for (var i = 0; i < active_enemies.length; i++) {
      var e = active_enemies[i], r = e.rect;
      var sx = r.x - rcx, sy = r.y - rcy;
      var base = enemyColor(e.type);
      if (e.super_jump_active && Math.floor(elapsed_ms / 100) % 2 === 0) {
        base = [Math.min(255, base[0] + 60), Math.min(255, base[1] + 60), Math.min(255, base[2] + 60)];
      }
      fillRect(ctx, e.flash_timer > 0 ? 'rgb(255,255,255)' : rgbStr(base), sx, sy, r.w, r.h);
      var detail = e.mode === 'SEEK' ? 'rgb(255,255,0)' : e.super_jump_active ? 'rgb(255,0,0)' : 'rgb(0,0,0)';
      if (e.type === ENEMY_TYPE_LEECH) {
        fillRect(ctx, detail, sx + 4, sy + 4, 4, 4);
        fillRect(ctx, detail, sx + r.w - 8, sy + 4, 4, 4);
      } else if (e.type === ENEMY_TYPE_BOMBER) {
        fillRect(ctx, detail, sx + r.w / 2 - 5, sy + r.h / 2 - 5, 10, 10);
      } else {
        fillRect(ctx, detail, sx, sy + 8, r.w, 10);
      }
    }
  }

  function draw_drops(rcx, rcy) {
    var ctx = gameCtx;
    for (var i = 0; i < active_drops.length; i++) {
      var d = active_drops[i];
      if (d.life < LOOT_FLASH_START && Math.floor(elapsed_ms / 150) % 2 === 0) continue;
      var sx = Math.floor(d.x - rcx), sy = Math.floor(d.y - rcy);
      var glow = 12 + Math.sin(elapsed_ms * 0.01) * 2;
      ctx.strokeStyle = rgbStr(d.rgb);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, Math.floor(glow), 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgb(255,255,255)';
      ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw_particles(rcx, rcy) {
    var ctx = gameCtx;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      fillRect(ctx, p.color, p.x - rcx, p.y - rcy, p.size, p.size);
    }
  }

  function render_playing() {
    var sx = uniform(-screen_shake_amount, screen_shake_amount);
    var sy = uniform(-screen_shake_amount, screen_shake_amount);
    var rcx = cam_x + sx, rcy = cam_y + sy;

    draw_world(rcx, rcy);
    draw_enemies(rcx, rcy);
    draw_drops(rcx, rcy);
    draw_particles(rcx, rcy);

    if (player_visible) {
      var ctx = gameCtx;
      var px = Math.floor(player_x - rcx), py = Math.floor(player_y - rcy);
      fillRect(ctx, COLOR_PLAYER, px, py, player_width, player_height);
      var ex = px + (player_vx > 0 ? 12 : 4);
      fillRect(ctx, 'rgb(255,255,255)', ex, py + 10, 6, 6);

      if (laser_end_point && laser_energy > 0) {
        var ax = laser_end_point[0] - sx, ay = laser_end_point[1] - sy;
        ctx.strokeStyle = super_laser_timer > 0 ? COLOR_SUPER_LASER : COLOR_LASER;
        ctx.lineWidth = super_laser_timer > 0 ? 5 : 2;
        ctx.beginPath();
        ctx.moveTo(px + player_width / 2, py + player_height / 2);
        ctx.lineTo(ax, ay);
        ctx.stroke();
        ctx.fillStyle = 'rgb(255,0,0)';
        ctx.beginPath(); ctx.arc(ax, ay, 4, 0, Math.PI * 2); ctx.fill();
        if (mine_timer > 0 && target_block) {
          var rad = 6 + (mine_timer / (MINING_SPEED * (super_laser_timer > 0 ? 0.5 : 1.0))) * 8;
          ctx.strokeStyle = 'rgb(255,255,255)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(ax, ay, Math.floor(rad), 0, Math.PI * 2); ctx.stroke();
        }
      }
    }

    draw_ui();

    fillRect(screenCtx, 'rgb(0,0,0)', 0, 0, WEB_W, WEB_H);
    screenCtx.drawImage(gameCanvas, render_offset_x, render_offset_y, output_w, output_h);
  }

  function draw_title_bg() {
    if (titleImg && titleImg.complete && titleImg.naturalWidth) {
      screenCtx.drawImage(titleImg, 0, 0, WEB_W, WEB_H);
    } else {
      fillRect(screenCtx, 'rgb(20,20,20)', 0, 0, WEB_W, WEB_H);
    }
  }

  function render_title() {
    draw_title_bg();
    fillRect(screenCtx, 'rgb(150,50,50)', play_btn.x, play_btn.y, play_btn.w, play_btn.h);
    strokeRect(screenCtx, 'rgb(255,255,255)', play_btn.x, play_btn.y, play_btn.w, play_btn.h, 4);
    text(screenCtx, 'PLAY GAME', play_btn.x + play_btn.w / 2, play_btn.y + play_btn.h / 2,
         'rgb(255,255,255)', FONT, 'center', 'middle');

    fillRect(screenCtx, 'rgb(50,100,150)', inst_btn.x, inst_btn.y, inst_btn.w, inst_btn.h);
    strokeRect(screenCtx, 'rgb(255,255,255)', inst_btn.x, inst_btn.y, inst_btn.w, inst_btn.h, 4);
    text(screenCtx, 'INSTRUCTIONS', inst_btn.x + inst_btn.w / 2, inst_btn.y + inst_btn.h / 2,
         'rgb(255,255,255)', FONT, 'center', 'middle');

    fillRect(screenCtx, 'rgb(80,80,80)', slider_x, slider_y, slider_w, slider_h);
    var knob_x = slider_x + (Audio_.volume / VOL_MAX) * slider_w;
    screenCtx.fillStyle = 'rgb(200,200,200)';
    screenCtx.beginPath(); screenCtx.arc(knob_x, slider_y + slider_h / 2, 12, 0, Math.PI * 2); screenCtx.fill();
    text(screenCtx, 'MUSIC VOLUME', slider_x + slider_w / 2, slider_y - 30, 'rgb(255,255,255)', FONT, 'center', 'top');
  }

  function render_instructions() {
    draw_title_bg();
    screenCtx.globalAlpha = 200 / 255;
    fillRect(screenCtx, 'rgb(0,0,0)', 0, 0, WEB_W, WEB_H);
    screenCtx.globalAlpha = 1;
    var line_spacing = 34;
    var start_y = WEB_H / 2 - (instructions_text.length * line_spacing) / 2;
    for (var i = 0; i < instructions_text.length; i++) {
      text(screenCtx, instructions_text[i], WEB_W / 2, start_y + i * line_spacing,
           'rgb(255,255,255)', FONT_INST, 'center', 'middle');
    }
  }

  // ==========================================================================
  // FRAME
  // ==========================================================================
  function step(rawDt) {
    var dt = Math.min(rawDt, MAX_DT);
    if (!(dt > 0)) dt = 0;
    elapsed_ms += dt * 1000;

    handleEvents();

    if (game_state === 'TITLE') render_title();
    else if (game_state === 'INSTRUCTIONS') render_instructions();
    else { update_playing(dt); render_playing(); }
  }

  // ==========================================================================
  // BOOT
  // ==========================================================================
  var running = false;
  function boot(opts) {
    opts = opts || {};
    var doc = global.document;
    var screenCanvas = doc.getElementById(opts.canvasId || 'screen');
    screenCanvas.width = WEB_W;
    screenCanvas.height = WEB_H;
    screenCtx = screenCanvas.getContext('2d');

    gameCanvas = doc.createElement('canvas');
    gameCanvas.width = GAME_WIDTH;
    gameCanvas.height = GAME_HEIGHT;
    gameCtx = gameCanvas.getContext('2d');
    if (screenCtx.imageSmoothingEnabled !== undefined) screenCtx.imageSmoothingEnabled = false;

    if (opts.titleImageSrc) {
      titleImg = new global.Image();
      titleImg.src = opts.titleImageSrc;
    }

    // Fill the window while holding 16:9. The backing store is sized to real
    // device pixels so UI text stays sharp on high-DPI displays; all drawing
    // code keeps working in 1280x720 logical space via the transform.
    function fit() {
      if (!screenCanvas.style) return;
      var availW = global.innerWidth || WEB_W;
      var availH = global.innerHeight || WEB_H;
      var s = Math.min(availW / WEB_W, availH / WEB_H);
      var cssW = Math.max(320, Math.round(WEB_W * s));
      var cssH = Math.max(180, Math.round(WEB_H * s));
      screenCanvas.style.width = cssW + 'px';
      screenCanvas.style.height = cssH + 'px';
      var dpr = Math.min(global.devicePixelRatio || 1, 2);
      screenCanvas.width = Math.round(cssW * dpr);
      screenCanvas.height = Math.round(cssH * dpr);
      screenCtx.setTransform(screenCanvas.width / WEB_W, 0, 0, screenCanvas.height / WEB_H, 0, 0);
      screenCtx.imageSmoothingEnabled = false;
    }
    fit();
    global.addEventListener('resize', fit);
    if (global.visualViewport && global.visualViewport.addEventListener) {
      global.visualViewport.addEventListener('resize', fit);
    }

    allocGrid();
    generate_world();
    reset_game();
    game_state = 'TITLE';

    function toCanvas(ev) {
      var r = screenCanvas.getBoundingClientRect();
      return {
        x: (ev.clientX - r.left) * (WEB_W / r.width),
        y: (ev.clientY - r.top) * (WEB_H / r.height)
      };
    }

    screenCanvas.addEventListener('mousedown', function (ev) {
      if (ev.button !== 0) return;
      var p = toCanvas(ev);
      input.mouseDown = true; input.mouseX = p.x; input.mouseY = p.y;
      input.events.push({ type: 'mousedown', x: p.x, y: p.y });
      ev.preventDefault();
    });
    global.addEventListener('mouseup', function (ev) {
      if (ev.button !== 0) return;
      input.mouseDown = false;
      input.events.push({ type: 'mouseup' });
    });
    screenCanvas.addEventListener('mousemove', function (ev) {
      var p = toCanvas(ev);
      input.mouseX = p.x; input.mouseY = p.y;
      input.events.push({ type: 'mousemove', x: p.x, y: p.y });
    });
    screenCanvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    // a mouse released outside the window used to leave the laser stuck on
    global.addEventListener('blur', function () {
      input.mouseDown = false;
      input.keys = {};
      Audio_.setLaser(false);
    });

    global.addEventListener('keydown', function (ev) {
      input.keys[ev.code] = true;
      input.events.push({ type: 'keydown', code: ev.code });
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(ev.code) >= 0) ev.preventDefault();
      Audio_.init(); Audio_.resume();
    });
    global.addEventListener('keyup', function (ev) { input.keys[ev.code] = false; });

    var last = null;
    running = true;
    function frame(ts) {
      if (!running) return;
      if (last === null) last = ts;
      var dt = (ts - last) / 1000;
      last = ts;
      step(dt);
      global.requestAnimationFrame(frame);
    }
    global.requestAnimationFrame(frame);
  }

  // ==========================================================================
  // EXPORTS  (the test harness drives these directly)
  // ==========================================================================
  var API = {
    boot: boot,
    step: step,
    input: input,
    setRandom: function (fn) { RNG = fn; },
    reset: reset_game,
    allocGrid: allocGrid,
    generate_world: generate_world,
    setRenderTargets: function (sc, gc, gcanvas) { screenCtx = sc; gameCtx = gc; gameCanvas = gcanvas; },
    audio: Audio_,
    Rect: Rect,
    get_collision_rects: get_collision_rects,
    move_entity_x: move_entity_x,
    move_entity_y: move_entity_y,
    constants: {
      WORLD_WIDTH: WORLD_WIDTH, WORLD_HEIGHT: WORLD_HEIGHT, TILE_SIZE: TILE_SIZE,
      GAME_WIDTH: GAME_WIDTH, GAME_HEIGHT: GAME_HEIGHT, WEB_W: WEB_W, WEB_H: WEB_H,
      SURFACE_Y_LEVEL: SURFACE_Y_LEVEL, MAX_OXYGEN: MAX_OXYGEN,
      LASER_MAX_ENERGY: LASER_MAX_ENERGY, TERMINAL_VELOCITY: TERMINAL_VELOCITY,
      MAX_ENEMIES: MAX_ENEMIES, MAX_DT: MAX_DT, player_width: player_width,
      player_height: player_height, render_scale: render_scale,
      render_offset_x: render_offset_x, render_offset_y: render_offset_y,
      play_btn: play_btn, inst_btn: inst_btn, MAX_PARTICLES: MAX_PARTICLES
    },
    state: function () {
      return {
        game_state: game_state, player_x: player_x, player_y: player_y,
        player_vx: player_vx, player_vy: player_vy, cam_x: cam_x, cam_y: cam_y,
        score: score, oxygen: current_oxygen, energy: laser_energy,
        enemies: active_enemies, particles: particles, drops: active_drops,
        grid: grid, paused: paused, game_over: game_over, player_dead: player_dead,
        super_laser_timer: super_laser_timer, spawn_timer: spawn_timer,
        mine_timer: mine_timer, target_block: target_block, elapsed_ms: elapsed_ms,
        swallow_click: swallow_click, death_timer: death_timer
      };
    },
    setState: function (patch) {
      if ('player_x' in patch) player_x = patch.player_x;
      if ('player_y' in patch) player_y = patch.player_y;
      if ('player_vy' in patch) player_vy = patch.player_vy;
      if ('oxygen' in patch) current_oxygen = patch.oxygen;
      if ('energy' in patch) laser_energy = patch.energy;
      if ('game_state' in patch) game_state = patch.game_state;
      if ('score' in patch) score = patch.score;
    }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  global.LaserMiner = API;
})(typeof window !== 'undefined' ? window : globalThis);

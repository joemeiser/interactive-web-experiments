        "A child could do this job. A child did. He was better.",
        "Don't make the customers mad tonight.",
        "You want off this rock, you'll earn it a plate at a time.",
        "And Bud — screw this up and you're fired, and you'll be stranded for good."];
      if (LINES.length !== 5 || LINES.some((l, i) => l !== expect[i])) note('cook: the five lines have drifted from intro_006');
      const missing = [...new Set(LINES.join('').toUpperCase().split('').filter(c => !(c in FONT)))];
      if (missing.length) note('cook: no glyph for ' + JSON.stringify(missing.join('')));
      /* ---- the utterance ----
         The report said his voice was almost unintelligible and that its rise and fall should follow the text.
         Claude cannot hear whether it does. What it CAN do is check that the schedule driving the voice is built
         out of the sentence rather than out of a timer, and these are the properties that are true of the one and
         false of the other.
         SYLL is hand-counted from the five lines. It is the check with teeth: any drift in the syllabifier moves a
         number here, and a schedule that went back to a character count over a constant could not match it. */
      const SYLL = [8, 13, 9, 13, 15];
      const strongDur = [], weakDur = [];
      for (let n = 0; n < SCRIPT.length; n++) {
        const L = SCRIPT[n], sch = L.sched;
        if (L.rows.some(r => r.length > BUBBLE_COLS)) note('cook: a wrapped row is wider than the bubble');
        const cps = L.chars / L.dur;
        if (cps < 8 || cps > 15) note(`cook: line ${n + 1} reveals at ${cps.toFixed(1)} cps, outside 8-15`);
        if (sch.length !== SYLL[n]) note(`cook: line ${n + 1} came out as ${sch.length} syllables, not the ${SYLL[n]} its words have`);
        if (L.fallbacks) note(`cook: line ${n + 1} has ${L.fallbacks} syllable(s) whose spelling no vowel rule matched`);

        // the pauses are the punctuation's, and there are exactly as many as there are marks
        const marks = (L.raw.match(/[.,;:!?\u2014]/g) || []).length;
        const held = sch.filter(sy => sy.gapAfter >= GAP_CLAUSE).length;
        if (held !== marks) note(`cook: line ${n + 1} pauses ${held} time(s) for ${marks} punctuation mark(s)`);
        if (L.phrases !== marks) note(`cook: line ${n + 1} was split into ${L.phrases} phrase(s) by ${marks} mark(s)`);

        // nothing out of order, nothing on top of anything else beyond the overlap OVER allows
        for (let i = 1; i < sch.length; i++) {
          if (sch[i].at < sch[i - 1].at + sch[i - 1].dur - 1e-6) note(`cook: line ${n + 1} syllable ${i + 1} starts before ${i} has finished`);
        }

        // the terminal contour: down at a full stop, up at a comma or a dash
        for (let i = 0; i < sch.length; i++) {
          const sy = sch[i];
          if (!sy.kind) { if (sy.tail !== null) note(`cook: line ${n + 1} syllable ${i + 1} has a terminal without a phrase ending`); continue; }
          if (sy.tail === null) { note(`cook: line ${n + 1} ends a phrase at syllable ${i + 1} with no terminal`); continue; }
          if (sy.kind === 'stop' && !(sy.tail < sy.pit * 0.95)) note(`cook: line ${n + 1} does not fall at its full stop (${sy.pit.toFixed(2)} to ${sy.tail.toFixed(2)})`);
          if (sy.kind !== 'stop' && !(sy.tail > sy.pit * 1.05)) note(`cook: line ${n + 1} does not lift at its ${sy.kind} (${sy.pit.toFixed(2)} to ${sy.tail.toFixed(2)})`);
        }

        // stress is the words': one strong syllable per content word, none in a function word
        const byWord = new Map();
        for (const sy of sch) { if (!byWord.has(sy.word + '#' + sy.at)) { /* keep every occurrence distinct */ } }
        let w = 0;
        while (w < sch.length) {
          let e = w;
          while (e + 1 < sch.length && sch[e + 1].syl > sch[e].syl && sch[e + 1].word === sch[w].word) e++;
          const parts = sch.slice(w, e + 1), weak = WEAK.has(parts[0].word);
          const strong = parts.filter(sy => sy.stress >= 0.99).length;
          if (weak && strong) note(`cook: the function word "${parts[0].word}" carries a strong syllable`);
          if (!weak && strong !== 1) note(`cook: "${parts[0].word}" has ${strong} strong syllables, expected 1`);
          for (const sy of parts) (sy.stress >= 0.99 ? strongDur : weakDur).push(sy.dur);
          w = e + 1;
        }

        /* THE REVEAL, sampled a frame at a time: it only ever moves forward, it starts at nothing, it finishes on
           the last character exactly as he finishes the line, and it does NOT move while he is not speaking. */
        let prev = -1, lastT = 0, moved = 0, still = 0;
        for (let t = 0; t <= L.dur + 1e-9; t += 1 / 60) {
          const r = revealAt(L, t);
          if (r < prev) note(`cook: line ${n + 1} un-reveals characters at ${t.toFixed(2)}s`);
          const speaking = sch.some(sy => t >= sy.at && t < sy.at + sy.dur);
          if (r > prev && prev >= 0) { moved++; if (!speaking) still++; }
          prev = r; lastT = t;
        }
        if (revealAt(L, 0) !== 0) note(`cook: line ${n + 1} starts with characters already on screen`);
        if (revealAt(L, L.dur) !== L.chars) note(`cook: line ${n + 1} does not finish its text as he finishes saying it`);
        if (still) note(`cook: line ${n + 1} reveals ${still} character(s) during a pause, when he is silent`);
        if (moved < 3) note(`cook: line ${n + 1} reveals its text in ${moved} step(s) — that is not tracking the voice`);
      }
      /* A METRONOME IS WHAT THIS REPLACED, so the contrast between a strong syllable and a weak one is itself a
         property worth asserting: flatten it and the drone comes back. */
      const mean = a => a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
      const ms = mean(strongDur), mw = mean(weakDur);
      if (!(ms > mw * 1.3)) note(`cook: a stressed syllable is ${ms.toFixed(3)}s against an unstressed ${mw.toFixed(3)}s — too flat to be speech`);
      // every vowel in the table should be reachable; a table half of which is never chosen is a table that is not
      // being driven by spelling
      const used = new Set(SCRIPT.flatMap(L => L.sched.map(sy => sy.v)));
      if (used.size < 8) note(`cook: only ${used.size} of ${VOWELS.length} vowels occur across the five lines`);
      const onsets = new Set(SCRIPT.flatMap(L => L.sched.map(sy => sy.on)));
      if (onsets.size < 4) note(`cook: only ${onsets.size} of the 5 consonant onset classes occur`);
      notes.push(`cook (note): ${SCRIPT.reduce((a, L) => a + L.sched.length, 0)} syllables off the words themselves, ` +
        `${used.size} vowels and ${onsets.size} onset classes in play, strong ${ms.toFixed(3)}s vs weak ${mw.toFixed(3)}s, ` +
        `lines ${SCRIPT.map(L => L.dur.toFixed(1)).join('/')}s at ${SCRIPT.map(L => (L.chars / L.dur).toFixed(1)).join('/')} cps, ` +
        `${SCRIPT.map(L => (L.sched.length / L.dur).toFixed(1)).join('/')} syllables a second`);
      const bw = Math.max(...SCRIPT.map(L => L.rows.reduce((m, r) => Math.max(m, r.length), 0))) * 6 + 14;
      const bh = Math.max(...SCRIPT.map(L => L.rows.length)) * 10 + 12;
      if (26 + bw > W || H - 26 - bh < 0) note(`cook: the bubble (${bw}x${bh}) does not fit the canvas`);

      // the loop: seamless, opaque, deterministic, and dimmer than the wall it sits in
      const f0 = snapHaze(0), f1200 = snapHaze(PERIOD), f0b = snapHaze(0), fmid = snapHaze(600);
      const seam = samePixels(f0, f1200), det = samePixels(f0, f0b);
      if (seam !== 0) note(`cook: the loop is not seamless — ${seam} bytes differ between frame 0 and frame ${PERIOD}`);
      if (det !== 0) note(`cook: the same tick renders differently twice — ${det} bytes differ`);
      const m0 = meanLuma(f0), mm = meanLuma(fmid);
      const FLAT_LUMA = 199.5;   // the mean luma of RC.passGlow #ffc34d, the flat square he replaced
      if (m0.minAlpha !== 255 || mm.minAlpha !== 255) note('cook: the hatch frame is not fully opaque');
      // He must read as being behind the hatch, which means darker than the floor he must not compete with. The floor
      // tiles run 54-70 mean luma, so 70 is the bar; the measured value goes in the notes either way, because
      // "distant enough" is finally the human's call at real speed.
      if (m0.luma > 70) note(`cook: the hatch frame is too bright to read as distant (mean luma ${m0.luma.toFixed(1)}; the floor is 54-70, the flat square he replaced was ${FLAT_LUMA})`);
      if (Math.abs(m0.luma - mm.luma) > 30) note(`cook: the loop flickers — mean luma ${m0.luma.toFixed(1)} vs ${mm.luma.toFixed(1)} half a period later`);
      if (samePixels(f0, fmid) === 0) note('cook: the loop is not animating — frame 0 and frame 600 are identical');

      /* ---- the silhouette treatment: the one the shift actually wears ---- */
      const s0 = snapSil(0, 0), s1200 = snapSil(PERIOD, 0), s0b = snapSil(0, 0), smid = snapSil(600, 0);
      const silSeam = samePixels(s0, s1200), silDet = samePixels(s0, s0b);
      if (silSeam !== 0) note(`cook: the silhouette loop is not seamless — ${silSeam} bytes differ between 0 and ${PERIOD}`);
      if (silDet !== 0) note(`cook: the silhouette renders differently twice — ${silDet} bytes differ`);
      const ms0 = meanLuma(s0), msm = meanLuma(smid);
      if (ms0.minAlpha !== 255 || msm.minAlpha !== 255) note('cook: the silhouette hatch frame is not fully opaque');
      if (ms0.luma > 70) note(`cook: the silhouette is too bright to sit behind the hatch (mean luma ${ms0.luma.toFixed(1)}; the floor is 54-70)`);
      if (samePixels(s0, smid) === 0) note('cook: the silhouette is not animating — frame 0 and frame 600 are identical');
      // He must be visibly there and visibly not a face: covering a decent part of the window, at one flat level, and
      // no brighter than the floor tiles he must never pull the eye off.
      const fm = figMetrics(0);
      if (fm.cover < 0.2 || fm.cover > 0.75) note(`cook: the silhouette covers ${(fm.cover * 100).toFixed(0)}% of the hatch, outside 20-75%`);
      if (fm.luma > 70) note(`cook: the silhouette's own pixels are luma ${fm.luma.toFixed(1)}, brighter than the floor's 54-70`);
      if (fm.luma < 26) note(`cook: the silhouette at luma ${fm.luma.toFixed(1)} will not read against the kitchen behind it`);
      if (fm.h > SIL_H + 2) note(`cook: the silhouette is ${fm.h} px tall in a ${SIL_H} px box — the 33% reduction is not being applied`);
      // The bob, sampled across one of its own cycles rather than half a loop period: every seamless oscillator here
      // takes a whole number of cycles per PERIOD, so a great many of them are back where they started at t = 600.
      const bobs = [];
      for (let t = 0; t < 180; t += 12) bobs.push(figMetrics(t).y0);
      if (new Set(bobs).size < 2) note(`cook: the silhouette does not bob — top edge is ${bobs[0]} at every tick sampled`);

      // The walk-offs: a pure function of (seed, tick), fully out of the window in both directions over a shift, and
      // never the same schedule twice running. Checked over four seeds and a whole ten-minute shift each.
      const SHIFT_TICKS = 36000;
      let outL = 0, outR = 0, still = 0, pure = true;
      const sig = [];
      for (const sd of [1, 42, 1234, 0xbeef]) {
        let l = 0, r = 0, s = 0, first = -1;
        for (let t = 0; t < SHIFT_TICKS; t += 2) {
          const dx = hatchShift(sd, t);
          if (dx <= -116) { l++; if (first < 0) first = t; } else if (dx >= 116) { r++; if (first < 0) first = t; } else if (dx === 0) s++;
          if (t < 4000 && hatchShift(sd, t) !== dx) pure = false;     // same argument, same answer
        }
        outL += l ? 1 : 0;
        outR += r ? 1 : 0;
        still += s;
        sig.push(`${sd}:L${l}R${r}@${first}`);
      }
      if (!pure) note('cook: hatchShift is not a pure function of (seed, tick)');
      if (outL === 0) note('cook: he never walks off to the left over four whole shifts');
      if (outR === 0) note('cook: he never walks off to the right over four whole shifts');
      // Two seeds, a whole shift each: if the schedules match tick for tick, the seed is not reaching the hash.
      let same = 0, tried = 0;
      for (let t = 0; t < SHIFT_TICKS; t += 4) { tried++; if (hatchShift(7, t) === hatchShift(8, t)) same++; }
      if (same === tried) note('cook: the walk-off schedule does not depend on the seed — seeds 7 and 8 are identical over a whole shift');

      // the scene, driven end to end with no key presses at all
      const saved = Object.assign({}, SC);
      const NONE = Object.create(null);
      const seen = [];
      auditing = true;
      begin(0);
      let ended = -1;
      for (let t = 1; t <= SCENE_TICKS + 120; t++) {
        const before = SC.line;
        if (update(NONE, t)) { ended = t; break; }
        if (SC.phase === 'talk' && SC.line !== before) seen.push(SC.line);
      }
      if (ended !== SCENE_TICKS) note(`cook: the scene ran ${ended} ticks, expected ${SCENE_TICKS}`);
      if (seen.join() !== '1,2,3,4') note('cook: the lines did not run 1..5 in order (' + seen.join() + ')');
      // ESC drops it immediately, from any phase
      begin(0);
      for (let t = 1; t <= PUSH_TICKS + 200; t++) update(NONE, t);
      if (!update({ pause: true }, 999)) note('cook: ESC did not end the scene');
      Object.assign(SC, saved);
      auditing = false;

      // The RATIO is what was asked for and what is checked; the absolute numbers belong to the level table and
      // would otherwise pin the voice to whatever it happened to be before the game was levelled.
      /* ---- the level curve ----
         Asked for as: start at one level, fall steadily through the SECOND bubble, be at the lower level by the
         end of it and stay there. Every clause of that is a check.
         Sampled rather than reasoned about, because the thing that decides his level at any instant is the ramp
         scheduled on the bus, and sampling levelAt is sampling the same function that schedules it. */
      /* WHICH bubble he falls on, asserted outright. Everything below is written relative to FADE_LINE, so moving
         FADE_LINE moves the checks with it and they all still pass — which makes them useless for the one thing
         that was actually specified: the fall happens across the SECOND bubble. */
      if (FADE_LINE !== 1) note(`cook: he falls across bubble ${FADE_LINE + 1}, and it was asked for on bubble 2`);
      const LV = [];
      for (let n = 0; n < SCRIPT.length; n++) for (let k = 0; k <= 20; k++) LV.push({ n, u: k / 20, v: levelAt(n, k / 20) });
      for (let i = 1; i < LV.length; i++) if (LV[i].v > LV[i - 1].v + 1e-9) note(`cook: his level rises again at line ${LV[i].n + 1}`);
      if (Math.abs(levelAt(0, 0) - VOICE_START) > 1e-9 || Math.abs(levelAt(0, 1) - VOICE_START) > 1e-9) note('cook: the first bubble does not hold the starting level');
      if (Math.abs(levelAt(FADE_LINE, 0) - VOICE_START) > 1e-9) note('cook: the fall does not begin at the starting level');
      if (Math.abs(levelAt(FADE_LINE, 1) - VOICE_END) > 1e-9) note(`cook: he is not at the lower level by the end of bubble ${FADE_LINE + 1}`);
      for (let n = FADE_LINE + 1; n < SCRIPT.length; n++) {
        if (Math.abs(levelAt(n, 0) - VOICE_END) > 1e-9 || Math.abs(levelAt(n, 1) - VOICE_END) > 1e-9) note(`cook: bubble ${n + 1} does not hold the lower level`);
      }
      // the fall is GRADUAL, which means it is spread across that bubble rather than jumping at one end of it
      const mid = levelAt(FADE_LINE, 0.5), want = (VOICE_START + VOICE_END) / 2;
      if (VOICE_START !== VOICE_END && Math.abs(mid - want) > 1e-6) note(`cook: half way through bubble ${FADE_LINE + 1} he is at ${mid.toFixed(4)}, not the ${want.toFixed(4)} a steady fall would give`);
      if (!(VOICE_START >= VOICE_END)) note('cook: the starting level is below the ending level');
      if (!(VOICE_BASE * VOICE_START <= 1.6)) note(`cook: the starting level drives the shaper at ${(VOICE_BASE * VOICE_START).toFixed(2)}, hard enough to clip most of the line`);

      notes.push(`cook (note): scene ${(SCENE_TICKS / 60).toFixed(1)}s = push ${(PUSH_TICKS / 60).toFixed(1)} + talk ${(TALK_TICKS / 60).toFixed(1)} + pull ${(PULL_TICKS / 60).toFixed(1)}; ` +
        `lines ${SCRIPT.map(L => (L.ticks / 60).toFixed(1)).join('/')}s at ${SCRIPT.map(L => (L.chars / L.dur).toFixed(1)).join('/')} cps; voice level ${VOICE_START.toFixed(3)} falling across bubble ${FADE_LINE + 1} to ${VOICE_END.toFixed(3)}, a drop of ${(20 * Math.log10(VOICE_END / VOICE_START)).toFixed(1)} dB, on a base of ${VOICE_BASE}`);
      notes.push(`cook (note): hatch loop 116x52 at ${APERTURE.x},${APERTURE.y}, seam ${seam} bytes, ${CACHE_SLOTS} cached frames; ` +
        `close-up treatment mean luma ${m0.luma.toFixed(1)} / ${mm.luma.toFixed(1)} against the flat square's ${FLAT_LUMA} — ${(FLAT_LUMA / Math.max(1, m0.luma)).toFixed(1)}x darker than what it replaced`);
      notes.push(`cook (note): silhouette ${SIL_W}x${SIL_H} at ${SIL_X},${SIL_Y} (${(SIL_SCALE * 100).toFixed(0)}% of the aperture, so 33% smaller), seam ${silSeam} bytes, ` +
        `frame luma ${ms0.luma.toFixed(1)} and his own pixels ${fm.luma.toFixed(1)} over ${(fm.cover * 100).toFixed(0)}% of the window against the floor's 54-70, bob top edge ${bobs.join('/')}; ` +
        `walk-offs over a ten-minute shift sampled every 2 ticks — ${sig.join(' ')} (L/R = ticks fully out each way, @ = first), ` +
        `${(still / (4 * SHIFT_TICKS / 2) * 100).toFixed(0)}% of it at his station; cross-fade from the close-up takes ${PASS_FADE_SEC} s`);
    } catch (e) {
      auditing = false;
      note('cook: audit threw — ' + String(e && e.message || e));
    }
    return { ok: problems.length === 0, problems: problems.concat(notes) };
  }

  /* ---- offline voice measurement, for __test.renderSound ---- */
  // All FIVE lines now, not two. The harness renders every name soundNames() reports, so cookVoice1..5 is the whole
  // gain schedule measured rather than the first step of it inferred: 1 at full, 2-5 at half, as peak and RMS.
  const VOICE_NAMES = ['cookVoice1', 'cookVoice2', 'cookVoice3', 'cookVoice4', 'cookVoice5'];
  function renderVoice(name) {
    const n = Math.max(0, VOICE_NAMES.indexOf(name)), L = SCRIPT[n], sr = 44100;
    const secs = L.dur * (1 + OVER * 2) + 0.2;
    const oc = new OfflineAudioContext(1, Math.ceil(sr * secs), sr);
    scheduleLine(oc, oc.destination, 0.01, n);   // the same call speak() makes, on an offline context, so what a
    // measurement reports is the level the scene plays, by construction rather than by two copies agreeing.
    return oc.startRendering().then(buf => ({
      sampleRate: sr, samples: Array.from(buf.getChannelData(0)),
      meta: { line: n + 1, base: VOICE_BASE, level: [+levelAt(n, 0).toFixed(4), +levelAt(n, 1).toFixed(4)],
        syllables: L.sched.length, sec: +L.dur.toFixed(3) },
    }));
  }

  /* What the hatch actually costs, the two halves separately: one full cook render composed into a 116x52 frame
     (what a cache miss pays) against one blit of a cached frame (what every other frame pays). Timed here rather than
     around render(), because a whole-frame measurement in a headless browser is dominated by everything else the page
     does between frames. A __test hook with no UI and no effect unless called, like the rest of them. */
  function bench(n) {
    n = Math.max(1, Math.min(300, n | 0));
    const c = mkCanvas(116, 52), cx = c.getContext('2d');
    // A cache miss now builds two layers rather than one picture, so both are timed together: that pair is what one
    // slot of the shift's treatment costs. The close-up compose is timed separately because it is only ever paid for
    // during the cross-fade.
    let t = performance.now();
    for (let i = 0; i < n; i++) { composeBack(i * 4); composeFig(i * 4); }
    const composeMs = (performance.now() - t) / n;
    t = performance.now();
    for (let i = 0; i < n; i++) composeHaze(i * 4);                   // cache bypassed: a full cook render each time
    const closeMs = (performance.now() - t) / n;
    // Warm the slots, then time the blit with a seed in play, so the clip-and-offset path an excursion takes is in
    // the number rather than only the straight two-blit case.
    for (let i = 0; i < n; i++) passLoop(cx, 0, 0, i * CACHE_STEP, 1, 4242);
    t = performance.now();
    for (let i = 0; i < n; i++) passLoop(cx, 0, 0, i * CACHE_STEP, 1, 4242);
    const blitMs = (performance.now() - t) / n;
    return { n, composeMs: +composeMs.toFixed(3), closeUpMs: +closeMs.toFixed(3), blitMs: +blitMs.toFixed(4),
      cacheStep: CACHE_STEP, cacheSlots: CACHE_SLOTS };
  }

  return {
    passLoop,
    scene: { name: 'cook', begin, update, draw },
    // For an audit that drives the conversation on a private simulation: take the scene's state and put it back, so
    // a test run leaves the shipped state machine exactly where it found it rather than parked on its last beat.
    saveState: () => Object.assign({}, SC),
    loadState: st => Object.assign(SC, st),
    composeSil: (t, dx) => snapSil(t, dx),
    composeClose: t => snapHaze(t),
    audit,
    bench,
    voiceNames: VOICE_NAMES,
    isVoice: name => VOICE_NAMES.indexOf(name) >= 0,
    renderVoice,
    hatchShift,
    figMetrics,
    /* THE UTTERANCE, AS DATA. Every syllable with the word it belongs to, the vowel it took, the consonant class it
       opens with, when it is said, how long for, how loud, what pitch, and which character of the drawn text it
       finishes on. Claude cannot hear this; it can read it, and so can a harness. Everything the report asked for
       is checkable here: that the syllables are the words' syllables, that the pauses are the punctuation's, that
       the pitch falls at a full stop and lifts at a comma, and that the reveal never runs ahead of the voice. */
    script: () => SCRIPT.map((L, n) => ({
      line: n + 1, raw: L.raw, rows: L.rows.slice(), sec: +L.dur.toFixed(3), ticks: L.ticks, chars: L.chars,
      phrases: L.phrases, fallbacks: L.fallbacks, cps: +(L.chars / L.dur).toFixed(1),
      sylPerSec: +(L.sched.length / L.dur).toFixed(2),
      sched: L.sched.map(sy => ({
        word: sy.word, syl: sy.syl, ofWord: sy.ofWord, v: sy.v, vowel: VOWEL_NAMES[sy.v], on: sy.on,
        at: +sy.at.toFixed(3), dur: +sy.dur.toFixed(3), gap: +sy.gapAfter.toFixed(3), kind: sy.kind,
        stress: +sy.stress.toFixed(2), pit: +sy.pit.toFixed(3),
        head: sy.head === null ? null : +sy.head.toFixed(3), tail: sy.tail === null ? null : +sy.tail.toFixed(3),
        shut: sy.shut, upto: sy.upto,
      })),
    })),
    revealCurve: (n, fps) => {
      const L = SCRIPT[n | 0], step = 1 / (fps || 60), out = [];
      for (let t = 0; t <= L.dur + 1e-9; t += step) out.push([+t.toFixed(3), revealAt(L, t)]);
      return out;
    },
    info: () => ({
      lines: LINES.slice(), sceneTicks: SCENE_TICKS, pushTicks: PUSH_TICKS, pullTicks: PULL_TICKS, talkTicks: TALK_TICKS,
      sylStrong: SYL_STRONG, sylMid: SYL_MID, sylWeak: SYL_WEAK, lineHold: LINE_HOLD,
      voiceBase: VOICE_BASE, voiceStart: VOICE_START, voiceEnd: VOICE_END, fadeLine: FADE_LINE + 1,
      phase: SC.phase, line: SC.line, lt: SC.lt,
      loopPeriod: PERIOD, cacheStep: CACHE_STEP, cacheSlots: CACHE_SLOTS, cacheBuilt, closeUpBuilt, hatError: HAT_ERR,
      // the silhouette the hatch wears: its size against the aperture, its one colour, and how his excursions are timed
      sil: { scale: SIL_SCALE, w: SIL_W, h: SIL_H, x: SIL_X, y: SIL_Y, grey: SIL_GREY,
        seg: SEG, leaveP: LEAVE_P, outTicks: OUT_TICKS, stayMin: STAY_MIN, stayMax: STAY_MAX, outPx: OUT_PX },
    }),
  };
})();

/* ==== RENDER ==== */
const W = 640, H = 360;

  }

  const sub = tv.rehear ? 'IT COSTS YOU TIME, AND COSTS THEM PATIENCE.' : 'TICKETS HAVE NO TABLE NUMBERS. REMEMBER WHO WANTS WHAT.';
  drawText(head, 320, 308, '#141414', 2, 'center');
  drawText(sub, 320, 330, '#242424', 1, 'center');
  // The skip, told to the player on the one screen it exists on, and only while there is something to skip. The word
  // is NEXT rather than SKIP because on a two-seat table the first press moves to the second customer rather than
  // leaving, and DONE on the last one so the press that ends the screen is not labelled as going somewhere.
  if (tv.phase === 'think' || tv.phase === 'bubble') {

/* ==== MOBILE CONTROLS =========================================================================================
   Everything MOBILE draws over the floor and everything it does with a finger. It is a layer on top of the game,
   not a change to it: the thumbstick states a set of arrow keycodes (Input.stickSet), the action pad presses and
   releases Space through Input.keyDown / Input.keyUp, and the ORDER station's boxes tap 'cell0'..'cell9'. Every
   one of those already existed as a route into the simulation before this file had a touchscreen in it, which is
   the point — moveBud, every bot, every determinism hash and every invariant check see a keyboard.

   WHY A FLOATING STICK. A stick drawn in a fixed spot has to be found before it can be used, and on a phone held
   in two hands the thumb lands where the thumb lands. This one appears wherever the first touch in the left half
   goes and steers from there, so it is never in the wrong place. A faint resting ring sits in the usual spot when
   nothing is held, because a control nobody can see is a control nobody tries.

   WHY ONE ACTION PAD AND NOT A ROW OF BUTTONS. SPACE is already context-sensitive everywhere in this game — take
   an order, enter it, collect from the pass, serve, bin it, swing the tray — and the floor already draws a prompt
   naming which of those is about to happen. So the pad needs no label of its own and there is nothing to aim at:
   findTarget picks by proximity, so a touchscreen never needs a tap-to-target.

   THE HALVES. The stick owns the left half, the pad the right. Nothing else on the floor is touchable, so a
   mis-stab does nothing rather than something wrong. At the ORDER station the halves do not apply at all: the
   ten boxes are the whole screen and each is tapped where it is drawn. */
const TOUCH = {
  stickR: 42, knobR: 18, dead: 9,     // ring, knob, and the slack before any direction is held
  padR: 40,
  // Up off the bottom wall rather than into the corner: the DOOR label sits at y 348 and the lose line runs
  // along y 349, and a pad on top of either would be an overlay obscuring the room it is meant to let you move
  // around. Still under a right thumb on a phone held in two hands.
  padX: W - 54, padY: H - 82,
  homeX: 84, homeY: H - 82,           // where the resting ring sits when no thumb is down
};
// Eight compass points, east first, going clockwise because canvas y grows downward. moveBud normalises a
// diagonal, so eight directions here is eight directions in the game.
const OCT_CODES = [
  ['ArrowRight'], ['ArrowRight', 'ArrowDown'], ['ArrowDown'], ['ArrowLeft', 'ArrowDown'],
  ['ArrowLeft'], ['ArrowLeft', 'ArrowUp'], ['ArrowUp'], ['ArrowRight', 'ArrowUp'],
];
const Touch = {
  stick: null,   // { id, ox, oy, x, y } — the pointer steering Bud, and where it went down
  pad: null,     // the pointer id holding the action pad down
  flash: 0,      // ticks of highlight left on the pad, so a tap is visibly a tap

  // What is live right now. Three separate questions because the three answers differ: the stick is for walking,
  // the pad is for acting (including skipping a finisher, which is the one thing that happens while frozen), and
  // the station replaces both with its own grid.
  on() { return touchUI() && sim && !sim.paused; },
  /* THE STICK IS LIVE WHENEVER THE PLAYER IS DRIVING BUD — which is not the same question as "is the mode
     'floor'", and gating it on the mode was a bug: the opening runs in mode 'intro' and ends by telling the
     player to WALK TO THE COOK, so on a phone it asked for something it had just made impossible.
     An intro scene is asked directly whether it has handed Bud over. A scene that does not answer is assumed
     not to have (a test placeholder, say), because a stick drawn over a cutscene is a smaller fault than one
     missing from a walk. */
  stickOn() {
    if (!this.on() || sim.fin) return false;
    if (sim.mode === 'floor') return true;
    if (sim.mode === 'intro') return !!(Intro.scene && Intro.scene.hasBud && Intro.scene.hasBud());
    return false;
  },
  padOn() { return this.on() && (sim.mode === 'floor' || sim.mode === 'tableView' || sim.mode === 'intro'); },
  cellsOn() { return this.on() && sim.mode === 'station'; },

  clear() {
    this.stick = null;
    if (this.pad !== null) { this.pad = null; Input.keyUp('Space', null); }
    Input.stickRelease();
  },
  // Called once a frame, not from the pointer handler: heldCodes only catches up when drainInput runs, so
  // reconciling on a move event would send a press for every pixel the thumb travels.
  sync() {
    if (!this.stickOn() || !this.stick) { if (Input.stickHeld.size) Input.stickRelease(); return; }
    const s = this.stick, dx = s.x - s.ox, dy = s.y - s.oy;
    if (Math.hypot(dx, dy) < TOUCH.dead) { Input.stickSet([]); return; }
    const oct = ((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8;
    Input.stickSet(OCT_CODES[oct]);
  },

  // ---- pointer routing ----
  inPad(p) { return Math.hypot(p.x - TOUCH.padX, p.y - TOUCH.padY) <= TOUCH.padR + 8; },
  // Which ORDER station box a point is in, or -1. The boxes are where drawStation draws them: 66 px squares at
  // x 164 + col * 74, y 100 + row * 76, and the hit box is the drawn box with 4 px of forgiveness on every side.
  cellAt(p) {
    for (let row = 0; row < 2; row++) {
      const y = 100 + row * 76;
      for (let col = 0; col < 5; col++) {
        const x = 164 + col * 74;
        if (p.x >= x - 4 && p.x <= x + 70 && p.y >= y - 4 && p.y <= y + 70) return row * 5 + col;
      }
    }
    return -1;
  },
  down(id, p) {
    if (this.cellsOn()) {
      const c = this.cellAt(p);
      if (c >= 0) { Input.tap('cell' + c); this.flash = 8; return true; }
      return false;
    }
    if (this.padOn() && this.inPad(p) && this.pad === null) {
      this.pad = id;
      this.flash = 8;
      Input.keyDown('Space', null);   // keyDown proper: this IS a press, so it skips a finisher like any key
      return true;
    }
    if (this.stickOn() && p.x < W * 0.5 && this.stick === null) {
      this.stick = { id, ox: p.x, oy: p.y, x: p.x, y: p.y };
      return true;
    }
    return false;
  },
  move(id, p) {
    if (!this.stick || this.stick.id !== id) return false;
    // Hold the knob inside the ring and pull the origin along behind a thumb that has slid a long way, so a long
    // drag keeps steering instead of pinning at full tilt and losing the angle.
    const dx = p.x - this.stick.ox, dy = p.y - this.stick.oy, m = Math.hypot(dx, dy);
    if (m > TOUCH.stickR) {
      this.stick.ox += dx * (1 - TOUCH.stickR / m);
      this.stick.oy += dy * (1 - TOUCH.stickR / m);
    }
    this.stick.x = p.x;
    this.stick.y = p.y;
    return true;
  },
  up(id) {
    if (this.stick && this.stick.id === id) { this.stick = null; Input.stickRelease(); return true; }
    if (this.pad === id) { this.pad = null; Input.keyUp('Space', null); return true; }
    return false;
  },

  // ---- drawing ----
  // No text anywhere in here, deliberately. The floor already names what SPACE is about to do, in the prompt over
  // Bud's head, and a second label under the thumb would say the same thing twice in the corner of the eye.
  ring(cx, cy, r, colour, width) {
    g.save();
    g.strokeStyle = colour;
    g.lineWidth = width;
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.stroke();
    g.restore();
  },
  disc(cx, cy, r, colour) {
    g.save();
    g.fillStyle = colour;
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.fill();
    g.restore();
  },
  draw() {
    if (this.flash > 0) this.flash--;
    if (this.cellsOn()) {
      // The station needs no overlay: its ten boxes ARE the buttons, drawn at 66 px by drawStation, and the
      // cursor outline it already draws marks the last one tapped. Anything more would be clutter on a screen
      // that is entirely control already.
      return;
    }
    if (this.stickOn()) {
      const live = !!this.stick;
      const cx = live ? this.stick.ox : TOUCH.homeX, cy = live ? this.stick.oy : TOUCH.homeY;
      this.ring(cx, cy, TOUCH.stickR, live ? 'rgba(255,143,60,0.42)' : 'rgba(200,183,166,0.16)', 2);
      let kx = cx, ky = cy;
      if (live) {
        const dx = this.stick.x - cx, dy = this.stick.y - cy, m = Math.hypot(dx, dy);
        const k = m > TOUCH.stickR ? TOUCH.stickR / m : 1;
        kx = cx + dx * k; ky = cy + dy * k;
      }
      this.disc(kx, ky, TOUCH.knobR, live ? 'rgba(255,143,60,0.34)' : 'rgba(200,183,166,0.12)');
      this.ring(kx, ky, TOUCH.knobR, live ? 'rgba(255,176,112,0.75)' : 'rgba(200,183,166,0.22)', 2);
    }
    if (this.padOn()) {
      const live = this.pad !== null || this.flash > 0;
      this.disc(TOUCH.padX, TOUCH.padY, TOUCH.padR, live ? 'rgba(255,143,60,0.38)' : 'rgba(200,183,166,0.13)');
      this.ring(TOUCH.padX, TOUCH.padY, TOUCH.padR, live ? 'rgba(255,176,112,0.85)' : 'rgba(200,183,166,0.28)', 2);
      // A tray glyph rather than a word: a slab with a lip, which is the thing in Bud's hands and the thing the
      // pad swings. Three rectangles, so it stays crisp at every integer scale.
      const c = live ? 'rgba(20,16,14,0.85)' : 'rgba(200,183,166,0.45)';
      rect(TOUCH.padX - 13, TOUCH.padY - 4, 26, 6, c);
      rect(TOUCH.padX - 15, TOUCH.padY + 2, 30, 3, c);
      rect(TOUCH.padX - 3, TOUCH.padY - 10, 6, 5, c);
    }
  },
};

/* ==== TITLE AND INSTRUCTIONS (title_screen\title_005, integrated) ==== */

// The letterforms are strokes, not rectangles: each glyph is a spine of points in a 10 x 14 unit box, stroked with a
// broad pen under a non-uniform scale so the nib is a wide ellipse, then the whole mask is thresholded so no edge is
// left grey. Heavy, rounded, diner signage. The spines are title_005's, unchanged.
const SPINES = {
  S: [[[8.8, 1.6], [5.6, 0.6], [2.2, 1.4], [1.4, 3.4], [3.0, 5.4], [7.0, 6.6], [8.6, 8.8], [7.8, 11.6], [4.6, 13.2], [1.4, 12.4]]],
  P: [[[2, 0.8], [2, 13.4]], [[2, 0.8], [6.6, 1.0], [8.6, 2.6], [8.6, 5.2], [6.6, 6.8], [2, 7.0]]],
  A: [[[1.2, 13.4], [5, 0.8], [8.8, 13.4]], [[2.6, 9.2], [7.4, 9.2]]],
  C: [[[8.6, 2.4], [6.2, 0.8], [3.2, 1.2], [1.4, 3.6], [1.2, 7.0], [1.4, 10.4], [3.2, 12.8], [6.2, 13.2], [8.6, 11.6]]],
  E: [[[2, 0.9], [2, 13.1]], [[2, 0.9], [8.6, 0.9]], [[2, 7.0], [7.4, 7.0]], [[2, 13.1], [8.6, 13.1]]],
  B: [[[2, 0.8], [2, 13.2]],
      [[2, 0.8], [6.2, 1.0], [8.0, 2.4], [8.0, 5.2], [6.2, 6.7], [2, 6.9]],
      [[2, 6.9], [6.6, 7.1], [8.6, 8.6], [8.6, 11.6], [6.6, 13.1], [2, 13.2]]],
  U: [[[1.4, 0.8], [1.4, 8.8], [2.6, 12.0], [5, 13.2], [7.4, 12.0], [8.6, 8.8], [8.6, 0.8]]],
  D: [[[2, 0.8], [2, 13.2]], [[2, 0.8], [6.0, 1.0], [8.4, 3.2], [8.6, 7.0], [8.4, 10.8], [6.0, 13.0], [2, 13.2]]],
};
const GLYPH_W = 10, GLYPH_ADV = 11, PEN = 3.1;
const wordW = (word, xu) => (GLYPH_ADV * (word.length - 1) + GLYPH_W) * xu;
function strokeWord(x, word, x0, y0, xu, yu) {
  x.save();
  x.translate(x0, y0);
  x.scale(xu, yu);
  x.lineWidth = PEN;
  x.lineCap = 'round';
  x.lineJoin = 'round';
  x.strokeStyle = '#fff';
  for (let i = 0; i < word.length; i++) {
    const ox = i * GLYPH_ADV;
    for (const pts of SPINES[word[i]]) {
      x.beginPath();
      x.moveTo(ox + pts[0][0], pts[0][1]);
      for (let k = 1; k < pts.length; k++) x.lineTo(ox + pts[k][0], pts[k][1]);
      x.stroke();
    }
  }
  x.restore();
}
const TITLE_WORDS = [{ word: 'SPACE', xu: 10.5, yu: 6.2, y: 20 }, { word: 'BUD', xu: 17.5, yu: 8.2, y: 132 }];
const TAGLINE = 'A HUMAN WAITER. AN ALIEN DINER. A TICKET HOME TO EARN.';
/* THE CALL TO ACTION. On a phone there is no space bar, so in MOBILE this is not a sentence about a key — it is
   a button, drawn as one and backed by a transparent DOM button exactly as INSTRUCTIONS is. It has to be: a tap
   anywhere on the canvas deliberately does NOT start a shift (a stray touch must not begin ten minutes of play),
   so without this the title screen is a dead end on the one device the MOBILE setting exists for. */
const CALL_KEY = 'PRESS SPACE TO START YOUR SHIFT';
const CALL_TAP = 'TAP HERE TO START YOUR SHIFT';
const CALL_TEXT = () => (touchUI() ? CALL_TAP : CALL_KEY);
// Boxed around the longer of the two strings at scale 2 with 10 px of air, so the frame does not move when the
// control scheme changes and the two layouts cannot disagree about where the button is.
const START_BTN = { x: Math.round(W / 2 - (textW(CALL_TAP, 2) + 20) / 2), y: 278,
                    w: textW(CALL_TAP, 2) + 20, h: 26 };
/* The bottom row: INSTRUCTIONS on the left, the difficulty selector on the right, at the same height and the same
   width, so they read as a matched pair of controls rather than a button and an afterthought. Their outer edges are
   the outer edges of PRESS SPACE TO START YOUR SHIFT above them — that line is 30 characters at scale 2, x 141 to
   x 499 — so the three rows below the letterforms share one column width. The gap between them, x 289 to x 351, is
   centred on the canvas and is wide enough that neither can be mistaken for part of the other. */
const HELP_BTN = { x: 141, y: 308, w: 110, h: 22, label: 'INSTRUCTIONS' };
// Three segments inside one frame, 41 px each. A segment is a real button: DIFF_SEG gives the boxes, and #btnD0..2
// are positioned from them at boot, so the drawn control and the hit areas cannot drift apart. 41 is not arbitrary:
// MEDIUM is 35 px of glyph and the audit demands 3 px of air either side of the widest label in a segment.
const DIFF_BTN = { x: 266, y: 308, w: 123, h: 22, label: 'DIFFICULTY' };
const DIFF_SEG = LEVELS.map((L, i) => ({ x: DIFF_BTN.x + i * 41, y: DIFF_BTN.y, w: 41, h: DIFF_BTN.h, name: L.name }));
/* The device selector, built the same way and sharing the row: same y, same height, same frame, same palette, two
   segments of 47 (DESKTOP is 41 px of glyph). The three controls span x 141 to x 499 — the outer edges of PRESS
   SPACE TO START YOUR SHIFT above them — so the rows below the letterforms all share one column width. */
const DEV_BTN = { x: 405, y: 308, w: 94, h: 22, label: 'CONTROLS' };
const DEV_SEG = DEVICES.map((D, i) => ({ x: DEV_BTN.x + i * 47, y: DEV_BTN.y, w: 47, h: DEV_BTN.h, name: D.name }));
const HELP_WIPE = 16;  // ticks for the popup to wipe across
let helpHot = false;   // the INSTRUCTIONS button is lit: pointer over, or keyboard focus on, #btnHelp. Drawing only.
let diffHot = -1;      // which difficulty segment the pointer is over, or -1. Drawing only.
let devHot = -1;       // which device segment the pointer is over, or -1. Drawing only.
let startHot = false;  // MOBILE's START button is lit. Drawing only.

// Trim a baked sprite to its ink, then give it a 1px hard rim, so bodies standing in each other still separate.
function trimToInk(src) {
  const d = src.getContext('2d').getImageData(0, 0, src.width, src.height).data;
  let x0 = src.width, y0 = src.height, x1 = -1, y1 = -1;
  for (let y = 0; y < src.height; y++) for (let x = 0; x < src.width; x++) {
    if (d[(y * src.width + x) * 4 + 3]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return mkCanvas(1, 1);
  const c = mkCanvas(x1 - x0 + 1, y1 - y0 + 1);
  c.getContext('2d').drawImage(src, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  return c;
}
function rimmed(src, colour) {
  const c = mkCanvas(src.width + 2, src.height + 2), x = c.getContext('2d');
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) x.drawImage(src, 1 + dx, 1 + dy);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = colour;
  x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'source-over';
  x.drawImage(src, 1, 1);
  return c;
}

// The letterform mask, its two rings, and the jumble packed inside it. Built once, on the first frame of the title, so
// a bot that boots with skipTitle never pays for it. Every sprite comes from Art, so the motif is the game's own art
// and not a second copy of it; the packing runs on a seeded makeRng, so the jumble is the same on every load.
const TitleArt = {
  built: false, ringOut: null, ringIn: null, fill: null, bodies: 0, icons: 0, box: null,
  build() {
    if (this.built) return this;
    this.built = true;
    const mask = mkCanvas(W, H), mg = mask.getContext('2d');
    for (const t of TITLE_WORDS) strokeWord(mg, t.word, Math.round((W - wordW(t.word, t.xu)) / 2), t.y, t.xu, t.yu);
    const img = mg.getImageData(0, 0, W, H), d = img.data, A = new Uint8Array(W * H);
    for (let p = 0; p < W * H; p++) {
      const on = d[p * 4 + 3] >= 128;                       // a soft mask would make a soft motif
      d[p * 4] = d[p * 4 + 1] = d[p * 4 + 2] = 255;
      d[p * 4 + 3] = on ? 255 : 0;
      A[p] = on ? 1 : 0;
    }
    mg.putImageData(img, 0, 0);
    const inMask = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? 0 : A[y * W + x]);
    let bx0 = W, by0 = H, bx1 = -1, by1 = -1;               // the real extent, so packing does not walk the whole canvas
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (A[y * W + x]) {
      if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
      if (y < by0) by0 = y; if (y > by1) by1 = y;
    }
    this.box = { x0: bx0, y0: by0, x1: bx1, y1: by1 };
    const ring = (r, colour) => {
      const c = mkCanvas(W, H), x = c.getContext('2d');
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r) x.drawImage(mask, dx, dy);
      x.globalCompositeOperation = 'destination-out';
      x.drawImage(mask, 0, 0);
      x.globalCompositeOperation = 'source-in';
      x.fillStyle = colour;
      x.fillRect(0, 0, W, H);
      return c;
    };
    this.ringOut = ring(4, '#04060b');
    this.ringIn = ring(2, '#ff8f3c');
    // Pass A: whole bodies on a jittered grid, back to front by y so the overlaps read. Pass B: glasses and plates
    // wedged into the gaps the bodies left, found with an occupancy map rather than by guessing. Not a tiling.
    const BODIES = [], ICONS = [];
    for (let id = 1; id <= CFG.species; id++) BODIES.push(rimmed(trimToInk(Art.species[id]), '#05070a'));
    for (const c of Art.drinks.concat(Art.plates)) ICONS.push(rimmed(trimToInk(c), '#05070a'));
    const rng = makeRng(90210), fill = mkCanvas(W, H), fg = fill.getContext('2d');
    fg.imageSmoothingEnabled = false;
    fg.fillStyle = '#0c0f15';
    fg.fillRect(0, 0, W, H);
    const occ = new Uint8Array(W * H);
    const markOcc = (x, y, w, h) => {   // integers only: a fractional index would silently never hit the array
      const xa = Math.max(0, Math.round(x)), xb = Math.min(W, Math.round(x + w));
      const ya = Math.max(0, Math.round(y)), yb = Math.min(H, Math.round(y + h));
      for (let yy = ya; yy < yb; yy++) for (let xx = xa; xx < xb; xx++) occ[yy * W + xx] = 1;
    };
    const occAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? 1 : occ[y * W + x]);
    const queue = [];
    for (let cy = by0 - 6; cy <= by1 + 6; cy += 26) {
      for (let cx = bx0 - 6; cx <= bx1 + 6; cx += 19) {
        const jx = Math.round(cx + (rng.next() - 0.5) * 11), jy = Math.round(cy + (rng.next() - 0.5) * 13);
        if (!inMask(jx, jy) && !inMask(jx, jy - 8) && !inMask(jx, jy + 8)) continue;
        queue.push({ x: jx, y: jy, id: rng.int(BODIES.length) });
      }
    }
    queue.sort((a, b) => a.y - b.y);
    for (const it of queue) {
      const s = BODIES[it.id], dx = Math.round(it.x - s.width / 2), dy = Math.round(it.y - s.height / 2);
      fg.drawImage(s, dx, dy);
      markOcc(dx + 1, dy + 1, s.width - 2, s.height - 2);
      this.bodies++;
    }
    for (let gy = by0; gy <= by1; gy += 13) {
      for (let gx = bx0; gx <= bx1; gx += 15) {
        const px = Math.round(gx + (rng.next() - 0.5) * 9), py = Math.round(gy + (rng.next() - 0.5) * 9);
        if (!inMask(px, py)) continue;
        const free = !occAt(px, py) && !occAt(px - 5, py) && !occAt(px + 5, py);
        if (!free && rng.next() > 0.22) continue;           // a few ride on top anyway
        const ic = ICONS[rng.int(ICONS.length)];
        fg.drawImage(ic, Math.round(px - ic.width / 2), Math.round(py - ic.height / 2));
        markOcc(px - ic.width / 2, py - ic.height / 2, ic.width, ic.height);
        this.icons++;
      }
    }
    fg.globalCompositeOperation = 'destination-in';
    fg.drawImage(mask, 0, 0);
    fg.globalCompositeOperation = 'source-over';
    this.fill = fill;
    return this;
  },
};

function drawTitle() {
  const T = TitleArt.build();
  rect(0, 0, W, H, '#04060b');
  rect(0, 96, W, 42, '#080c12');   // a bare hint of the diner behind: two banquette bands, very dark
  rect(0, 196, W, 42, '#080c12');
  g.drawImage(T.ringOut, 0, 0);
  g.drawImage(T.ringIn, 0, 0);
  g.drawImage(T.fill, 0, 0);
  drawText(TAGLINE, W / 2, 268, '#96a6b6', 1, 'center');
  if (touchUI()) {
    // The same frame and palette as the two controls below it, one size up, because it is the primary action.
    rect(START_BTN.x, START_BTN.y, START_BTN.w, START_BTN.h, startHot ? '#2a1a12' : '#14100e');
    frame1(START_BTN.x, START_BTN.y, START_BTN.w, START_BTN.h, startHot ? '#ffb070' : '#ff8f3c');
  }
  drawText(CALL_TEXT(), W / 2, 284, (sim.tick % 64) < 46 ? '#ffffff' : '#9fb0c0', 2, 'center');
  const B = HELP_BTN, edge = helpHot ? '#ff8f3c' : '#5a4636';
  rect(B.x, B.y, B.w, B.h, helpHot ? '#2a1a12' : '#14100e');
  frame1(B.x, B.y, B.w, B.h, edge);
  drawText(B.label, B.x + B.w / 2, B.y + 8, helpHot ? '#ffffff' : '#c8b7a6', 1, 'center');
  drawDifficulty();
  drawDevice();
}
// A 1px frame, the shape the INSTRUCTIONS button has always been drawn as. outline() draws 2px and is the epilogue's.
function frame1(x, y, w, h, colour) {
  rect(x, y, w, 1, colour);
  rect(x, y + h - 1, w, 1, colour);
  rect(x, y, 1, h, colour);
  rect(x + w - 1, y, 1, h, colour);
}
/* The difficulty selector: the same box, the same frame, the same palette as the button beside it, divided into
   three. The SELECTED segment is a solid block of the title's orange with near-black text — inverted, not merely
   tinted, because "which one is on" has to survive being glanced at for a quarter of a second on a screen whose
   top two thirds are a wall of coloured aliens. The other two are the button's own dark fill. */
function drawDifficulty() {
  const D = DIFF_BTN;
  rect(D.x, D.y, D.w, D.h, '#14100e');
  for (let i = 0; i < DIFF_SEG.length; i++) {
    const S = DIFF_SEG[i], on = i === diffIdx, hot = i === diffHot;
    if (on) rect(S.x, S.y, S.w, S.h, hot ? '#ffb070' : '#ff8f3c');
    else if (hot) rect(S.x, S.y, S.w, S.h, '#2a1a12');
    drawText(S.name, S.x + S.w / 2, S.y + 8, on ? '#14100e' : hot ? '#ffffff' : '#7d6a5a', 1, 'center');
    // A hairline between two unselected segments. Next to the selected block there is none: the block's own edge is
    // already the strongest division on the control, and a dark line through it would notch the orange.
    if (i && i !== diffIdx && i - 1 !== diffIdx) rect(S.x, S.y, 1, S.h, '#3a2e26');
  }
  frame1(D.x, D.y, D.w, D.h, diffHot >= 0 ? '#ff8f3c' : '#5a4636');
  drawText(D.label, D.x + D.w / 2, D.y + D.h + 4, '#5d6b7a', 1, 'center');
}
/* The device selector, drawn as the difficulty selector's twin so the bottom row reads as one set of controls.
   Below both of them, spanning the canvas, THE RECOMMENDATION — always drawn, on both settings, because a
   touchscreen has no hover and the device that most needs to be told which scheme suits it is the one device a
   tooltip could never reach. It says what the machine looks like, not what is selected: if the player has
   overruled it, the caption still reports what was detected, and the selected block says what they chose. */
function drawDevice() {
  const D = DEV_BTN;
  rect(D.x, D.y, D.w, D.h, '#14100e');
  for (let i = 0; i < DEV_SEG.length; i++) {
    const S = DEV_SEG[i], on = i === devIdx, hot = i === devHot;
    if (on) rect(S.x, S.y, S.w, S.h, hot ? '#ffb070' : '#ff8f3c');
    else if (hot) rect(S.x, S.y, S.w, S.h, '#2a1a12');
    drawText(S.name, S.x + S.w / 2, S.y + 8, on ? '#14100e' : hot ? '#ffffff' : '#7d6a5a', 1, 'center');
    if (i && i !== devIdx && i - 1 !== devIdx) rect(S.x, S.y, 1, S.h, '#3a2e26');
  }
  frame1(D.x, D.y, D.w, D.h, devHot >= 0 ? '#ff8f3c' : '#5a4636');
  drawText(D.label, D.x + D.w / 2, D.y + D.h + 4, '#5d6b7a', 1, 'center');
  // Right-aligned to the outer edge of the row rather than centred on the canvas, so it sits under the control it
  // is about instead of under the one beside it.
  drawText(DEV_CAPTION(), D.x + D.w, D.y + D.h + 15, '#6d7f90', 1, 'right');
}

/* The instructions: a floor plan of the diner and the round Bud walks, taught as a route with numbered pins rather
   than as a list of steps. Nothing on this screen is a typed-in copy of a number the game owns — the room comes from
   LAYOUT, the fares from CFG.tiers with TIER_NAMES and TIER_COLORS, the length of the shift from CFG.shiftSec. Those
   were all hardcoded in title_005, which flagged that they would drift; this is that warning acted on.
   Nothing here mentions fighting. That is deliberate and is the human's call: the first attack should be a surprise. */
const MAP = { s: 0.7, ox: 16, oy: 26 };
const mapX = gx => Math.round(MAP.ox + (gx - LAYOUT.floor.x0) * MAP.s);
const mapY = gy => Math.round(MAP.oy + (gy - LAYOUT.floor.y0) * MAP.s);
const mapL = n => Math.round(n * MAP.s);
function dashPath(pts, colour) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], dx = b[0] - a[0], dy = b[1] - a[1];
    const n = Math.max(1, Math.round(Math.hypot(dx, dy) / 6));
    for (let k = 0; k < n; k++) rect(a[0] + dx * k / n - 1, a[1] + dy * k / n - 1, 2, 2, colour);
  }
}
function pin(x, y, n, colour) {
  rect(x - 7, y - 7, 14, 14, '#05070a');
  rect(x - 6, y - 6, 12, 12, colour);
  drawText(String(n), x - 2, y - 3, '#05070a', 1);
}
function chip(x, y, w, h, fill, edge) {
  rect(x, y, w, h, edge);
  rect(x + 1, y + 1, w - 2, h - 2, fill);
}
// A species' head, cropped off the top of its own floor sprite at the anger stage asked for, with its own steam or
// smoke over it. Art.stage[id][s] is the sprite the shift actually draws at that stage, so the face changes here for
// the same reason it changes on the floor, rather than the plume being the only difference between the three rungs.
function drawSpeciesHead(id, cx, top, rows, stage) {
  const r0 = Art.topRow[id] || 0, left = Math.round(cx - 12);
  g.drawImage(Art.stage[id][stage] || Art.species[id], 0, r0, 24, rows, left, top, 24, rows);
  if (stage) drawPlumes(id, stage, left, top - r0, sim.tick);
}
function drawMap() {
  const F = LAYOUT.floor, x0 = mapX(F.x0), y0 = mapY(F.y0), x1 = mapX(F.x1), y1 = mapY(F.y1);
  rect(x0, y0, x1 - x0, y1 - y0, '#12171d');
  for (let gx = F.x0; gx <= F.x1; gx += 40) rect(mapX(gx), y0, 1, y1 - y0, '#1b222a');
  for (let gy = F.y0; gy <= F.y1; gy += 40) rect(x0, mapY(gy), x1 - x0, 1, '#1b222a');
  rect(x0, y0, x1 - x0, 1, '#2e3a46');
  rect(x0, y1 - 1, x1 - x0, 1, '#2e3a46');
  rect(x0, y0, 1, y1 - y0, '#2e3a46');
  rect(x1 - 1, y0, 1, y1 - y0, '#2e3a46');
  for (const t of LAYOUT.tables) {
    rect(mapX(t.cx - 28), mapY(t.cy - 22), mapL(56), mapL(44), '#3a4a3c');
    rect(mapX(t.cx - 26), mapY(t.cy - 12), mapL(52), mapL(24), '#7a6448');
    rect(mapX(t.cx - 26), mapY(t.cy - 12), mapL(52), 2, '#9a8460');
    for (const s of t.seats) rect(mapX(s.x - 8), mapY(s.y - 5), mapL(16), mapL(10), '#4a5460');
  }
  const S = LAYOUT.station, P = LAYOUT.pass, B = LAYOUT.bin, D = LAYOUT.doorInside;
  rect(mapX(S.zone.x0), mapY(S.zone.y0), mapL(S.zone.x1 - S.zone.x0), mapL(S.zone.y1 - S.zone.y0), '#1c3a30');
  rect(mapX(S.zone.x0), mapY(S.zone.y1 - 4), mapL(S.zone.x1 - S.zone.x0), 2, '#3f8f6f');
  drawText('ORDER', mapX(S.zone.x0 + 4), mapY(S.zone.y0 + 8), '#8fe0c0', 1);
  rect(mapX(P.zone.x0), mapY(P.zone.y0), mapL(P.zone.x1 - P.zone.x0), mapL(P.zone.y1 - P.zone.y0), '#1a222c');
  rect(mapX(P.zone.x0), mapY(P.zone.y1 - 4), mapL(P.zone.x1 - P.zone.x0), 2, '#8d9aa8');
  drawText('PASS', mapX(P.zone.x0 + 50), mapY(P.zone.y0 + 8), '#c8d4e0', 1);
  rect(mapX(B.x - 9), mapY(B.y - 22), mapL(18), mapL(24), '#4a5562');
  drawText('BIN', mapX(B.x - 11), mapY(B.y + 6), '#7d8b99', 1);
  rect(mapX(D.x - 17), mapY(D.y - 15), mapL(40), mapL(26), '#3a2a18');
  drawText('DOOR', mapX(D.x - 19), mapY(D.y - 33), '#c8a870', 1);
  const t0 = LAYOUT.tables[0];
  dashPath([[mapX(t0.cx), mapY(t0.cy + 24)], [mapX(120), mapY(150)], [mapX(S.x), mapY(120)], [mapX(S.x), mapY(S.y + 6)],
    [mapX(P.x), mapY(P.y + 6)], [mapX(P.x), mapY(130)], [mapX(230), mapY(180)], [mapX(170), mapY(198)]], '#ffd45c');
  drawBudRigged(mapX(230), mapY(180) + 2, rigPose('down', true), 'down', []);
  pin(mapX(t0.cx), mapY(t0.cy + 28), 1, '#ffd45c');
  // 2 and 3 hang off the front edge of their counters, not the middle of them: centred, they sat on top of the ORDER
  // and PASS labels and ate half of each word.
  pin(mapX(S.x), mapY(S.zone.y1 - 2), 2, '#8fe0c0');
  pin(mapX(P.x), mapY(P.zone.y1 - 2), 3, '#c8d4e0');
  pin(mapX(t0.seats[1].x - 4), mapY(t0.cy + 24), 4, '#ff8f3c');
  pin(mapX(t0.cx - 12), mapY(t0.cy + 4), 5, '#4fbf6a');
}
const LEGEND = [

];

// Kethren for the patience band: it attacks in a shift, so the tell is honest, and its plume is the default column

// The instructions are a popup over the title: they wipe in from the left over HELP_WIPE ticks, on the simulation
// clock so the animation is deterministic, and close on the tick a key is pressed.
function drawTitleScreen() {
  const opened = sim.ui.help ? sim.ui.help.openedTick : sim.tick;
  const cut = sim.mode === 'help' ? Math.round(W * clamp((sim.tick - opened) / HELP_WIPE, 0, 1)) : 0;
  if (cut < W) drawTitle(); // once the wipe is across, the title is wholly covered: do not draw underneath it
  if (sim.mode !== 'help') return;
  g.save();
  g.beginPath();
  g.rect(0, 0, cut, H);
  g.clip();
  drawInstructions();
  g.restore();
  if (cut > 0 && cut < W) rect(cut - 2, 0, 2, H, '#ff8f3c');
}

/* ==== STORY PRESENTATION: three switchable treatments ==== */
function wrapLines(lines, max) {
  const out = [];

      // One tick has already gone by: endTalked() sets passFadeTick during the tick whose update returned true, and
      // stepSim increments sim.tick at the end of it. So the first frame the floor draws is one tick into the fade.
      if (passMix() > 0.02) note(`opening: the dissolve starts at mix ${passMix().toFixed(3)}, not at the close-up`);
      for (let i = 0; i <= fadeN + 6; i++) { mixes.push(passMix()); stepSim(); }
      const back = mixes.filter((m, i) => i && m < mixes[i - 1]).length;
      if (back) note(`opening: the dissolve goes backwards on ${back} ticks`);
      if (mixes[fadeN] !== 1) note(`opening: the dissolve is at ${mixes[fadeN]} after ${PASS_FADE_SEC} s, not finished`);
      if (mixes[Math.floor(fadeN / 2)] > 0.9) note('opening: the dissolve is a cut, not a fade — halfway through it is already there');
      const fadeNote = `0 -> ${mixes[Math.floor(fadeN / 4)].toFixed(2)} -> ${mixes[Math.floor(fadeN / 2)].toFixed(2)} -> ${mixes[Math.floor(3 * fadeN / 4)].toFixed(2)} -> 1 over ${PASS_FADE_SEC} s`;
      const total = (walkTicks + cardRuns[0] + cardRuns[1] + steerTicks + cookTicks) / 60;

      // ESC, from the middle of the cards: straight to the floor, with the tray and a running clock
      Intro.played = false;
      reset(77, false);
      Input.tap('act'); stepSim();
      for (let i = 0; i < 260 && S.phase === 'walk'; i++) stepSim();
      for (let i = 0; i < 90; i++) stepSim();
      const escPhase = S.phase;
      Input.tap('pause'); stepSim(); stepSim();
      if (sim.mode !== 'floor' || sim.shift.startTick === null || sim.bud.noTray) {
        note(`opening: ESC during ${escPhase} left mode ${sim.mode}, clock ${sim.shift.startTick}, noTray ${sim.bud.noTray}`);
      }
      if (sim.passFadeTick !== null) note('opening: an escaped opening still asks the hatch to dissolve');

      // a restart does not replay it
      reset(78, false);
      Input.tap('act'); stepSim(); stepSim();
      if (sim.mode !== 'floor') note(`opening: a restart played it again (mode ${sim.mode})`);

      notes.push(`opening (note): card 1 ${(cardRuns[0] / 60).toFixed(1)}s = settle ${(settleTicks(BEATS[CARDS[0]]) / 60).toFixed(1)} + ` +
        `${wordsIn(BEATS[CARDS[0]])} words at ${CARD_WPM} wpm + ${CARD_PAD_SEC}s; card 2 ${(cardRuns[1] / 60).toFixed(1)}s = ` +
        `settle ${(settleTicks(BEATS[CARDS[1]]) / 60).toFixed(1)} + ${wordsIn(BEATS[CARDS[1]])} words + ${CARD_PAD_SEC}s`);
      notes.push(`opening (note): walk-in ${(walkTicks / 60).toFixed(1)}s from the door to ${endAt.x},${endAt.y}; prompt held 60 s with no input and did not expire; ` +
        `pass reached in ${(steerTicks / 60).toFixed(1)}s; conversation ${(cookTicks / 60).toFixed(1)}s; ${total.toFixed(1)}s of opening, none of it shift time (clock null until tick ${promptTick}+); ` +
        `then the hatch dissolves ${fadeNote}`);
    } catch (e) {
      note('opening: audit threw — ' + String(e && e.message || e));
    }
    // put the real world back exactly as it was found
    AUDITING = false;
    sim = realSim;
    Object.assign(S, realS);
    Cook.loadState(realSC);
    Intro.played = realPlayed;
    Intro.scene = realScene;
    Input.heldCodes.clear();
    for (const c of held) Input.heldCodes.add(c);
    Input.queue.length = 0;
    rebuildBodies();
    UI.onMode(sim.mode);
    return { ok: problems.length === 0, problems: problems.concat(notes) };
  }

  /* hasBud: TRUE exactly when update() runs moveBud, which is from the end of the walk-in until the cook's
     close-up begins. It reads the same S.phase the update reads, so the two cannot drift.
     This exists because MOBILE needs it. The opening ENDS by telling the player to walk to the cook, and a
     control scheme that gates the thumbstick on sim.mode alone leaves them reading that instruction with no way
     to obey it. Mode is 'intro' for the whole opening; only the phase knows who is driving. */
  const hasBud = () => S.phase === 'cards' || S.phase === 'prompt';
  const scene = { name: 'opening', begin, update, draw, hasBud };
  return {
    scene, audit, onFloor, hasBud,
    // For the review sheet: a settled card or the prompt, drawn in its real strip at an arbitrary y.
    sheetCard: (i, y) => drawCard(CARDS[i], cardTicks(CARDS[i]) - CARD_OUT_TICKS - 1, y),
    sheetPrompt: y => drawPrompt(600, y),
    cardKeys: CARDS.slice(), promptText: PROMPT_TEXT, stripH: STRIP_H,
    info: () => ({ phase: S.phase, phaseTick: S.pt, card: S.card, talked: S.talked, noTray: !!(sim && sim.bud.noTray),
      cardTicks: CARDS.map(cardTicks), cardSec: CARDS.map(k => +(cardTicks(k) / 60).toFixed(2)),
      cards: CARDS.map(k => BEATS[k].slice()), prompt: PROMPT_TEXT, wpm: CARD_WPM,
      passMix: +passMix().toFixed(3), passFadeSec: PASS_FADE_SEC, hatchShift: Cook.hatchShift(sim ? sim.seed : 0, sim ? sim.tick : 0) }),
  };
})();

// Test-only review sheets (never reached in play). 'floor' and 'faces': combat art for a batch of species.
// 'fight': each species in its fight poses (walking, wind-up half and nearly done, attack out, recovery, stunned),
// facing right with its reach marked under it, plus Bud's swing poses along the bottom.
const SHEET_POSES = [['APPROACH', 'approach', 0], ['WIND-UP 50%', 'windup', 0.5], ['WIND-UP 90%', 'windup', 0.9], ['ATTACK', 'active', 1],
  ['RECOVERY', 'recovery', 0.15], ['STUNNED', 'stun', 0]];
function drawSheet(S) {
  rect(0, 0, W, H, '#1a1a22');

      for (let s = 0; s <= 3; s++) g.drawImage(Art.faceStage[id][s], 50 + s * 150, y + 4, 64, 64);

    }
    for (let s = 0; s <= 3; s++) {
      g.save(); g.translate(44 + s * 52, y + 70 - 72); g.scale(2, 2);
      g.drawImage(Art.stage[id][s], 0, 1);

    }

    rect(12 - CFG.bodyW / 2, 36 - CFG.bodyH, CFG.bodyW, 1, 'rgba(255,80,80,0.6)');
    g.restore();

    for (let k = 0; k < 5; k++) {
      const fx = 312 + k * 52;
      rect(fx, y + 12, 48, 48, '#22222c');
      if (!frames) { if (k === 0) drawText('GENERIC', fx + 2, y + 30, '#777', 1); continue; }
      const fr = frames[Math.min(k, 3)], mirror = k === 4;

      else { g.save(); g.translate(fx + 48, 0); g.scale(-1, 1); g.drawImage(A.lunge.img, A.lunge.dx, y + 12 + A.lunge.dy); g.restore(); }
    }
    g.drawImage(Art.faceStage[id][3], 574, y + 4, 64, 64);
  });
}
function drawFightSheet(ids, t) {

}
/* 'bud': the opening review sheet, and the one frame of it the harness photographs (bot_020's plan step is still
   called "review sheet: Bud and the tray", which is now only the bottom third of it).

   It exists because the pinned bot's screenshot points do not land anywhere near the two text cards — its intro
   steps were written for an opening that started with the conversation — and the cards are the thing that most
   needs looking at. Everything here is drawn by the shipped code at its shipped size: the strips come out of
   Opening's own drawCard/drawPrompt, the hatch frames out of Cook's own compose, and the poses out of rigPose. It
   is a photograph of the game's own drawing, not a mock-up of it.

   What game_015's version of this sheet carried — the three pose rows at four facings each, the three blend strips
   and the 2x row — is covered by assertions in the keys run rather than by eye: every facing, the empty-to-loaded

function render() {
  g.imageSmoothingEnabled = false;
  if (Loop.sheet) { drawSheet(Loop.sheet); return; }
  if (sim.mode === 'title' || sim.mode === 'help') drawTitleScreen();
  else if (sim.mode === 'intro') Intro.draw();
  // A finisher owns the frame: the room, pushed in on and letterboxed, with the scene over it and no HUD. The world
  // under it is the real diner — drawFloorScene, which skips Bud and the attacker because the scene draws both.
  else if (sim.fin) drawFinisher(drawFloorScene);
  else {
    if (sim.mode === 'tableView') drawTableView(); else drawFloorScene();
    if (sim.mode === 'station') drawStation();
    if (sim.lab) drawLabHUD(); else drawHUD();
    if (sim.mode === 'shiftEnd' && sim.ending) Story.drawEnding();
  }
  if (sim.paused) {
    rect(0, 0, W, H, sim.mode === 'tableView' ? '#07090c' : 'rgba(0,0,0,0.6)');
    drawText('PAUSED', 320, 120, '#fff', 6, 'center');
    drawText(touchUI() ? 'TAP RESUME TO CARRY ON' : 'P OR ESC TO RESUME', 320, 176, '#aaa', 1, 'center');
    drawText(sim.lab ? (touchUI() ? 'RESTART: RESTART THIS FIGHT' : 'R: RESTART THIS FIGHT')
      : (touchUI() ? 'RESTART: ABANDON THIS SHIFT AND START OVER' : 'R OR RESTART: ABANDON THIS SHIFT AND START OVER'),
      320, 192, '#ff9070', 1, 'center');
  }
  // The mobile overlay, after the world and the HUD and after the pause veil, so a thumbstick is never drawn
  // under a dimmed screen. It draws nothing at all in DESKTOP, and nothing while paused, on the title, on the
  // instructions or on the epilogue, where the DOM buttons are the controls.
  Touch.draw();
  if (Loop.caption) { rect(0, 0, W, 16, 'rgba(0,0,0,0.85)'); drawText(Loop.caption, 320, 4, '#ffe060', 1, 'center'); }
  // During the opening the same button drops the opening rather than pausing it, so it says what it does.
  const label = sim.mode === 'intro' ? 'SKIP' : sim.paused ? 'RESUME' : 'PAUSE';
  if (btnPause.textContent !== label) btnPause.textContent = label;
  const showRestart = sim.mode === 'shiftEnd' || sim.paused;
  if (btnRestart.hidden === showRestart) btnRestart.hidden = !showRestart;
  UI.soundLabel();
  UI.musicSlider();
  // A finisher is a cutscene: the HUD is not drawn, so the three DOM controls that float over the canvas must go
  // with it. Without this they sit on top of the letterbox — the slider dead centre, which is the one place on the
  // screen it must never be. They come back on the epilogue, which is when there is something to press again.
  UI.cutscene(!!sim.fin);
  Music.sync(); // the only place the music transport is driven, so it cannot run while a test steps the clock
}

function fit() {
  const iw = window.innerWidth, ih = window.innerHeight;
  let s = Math.min(iw / W, ih / H);
  if (s >= 2) s = Math.floor(s);
  const w = W * s, h = H * s;
  wrap.style.left = Math.floor((iw - w) / 2) + 'px';
  wrap.style.top = Math.floor((ih - h) / 2) + 'px';
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
  uiBox.style.fontSize = (9 * s).toFixed(2) + 'px';
  uiBox.classList.toggle('touch', touchUI());
  /* THE ROTATE PROMPT. The canvas is a fixed 16:9, so a portrait phone would draw the whole game into a band
     across the middle with Bud about nine pixels tall. Rather than let that look like a broken game, MOBILE
     covers a portrait viewport and says what to do. DESKTOP never sees it: someone who has overruled the
     detection has said they are not on a phone, and a narrow desktop window is their business.
     A shift running when the prompt goes up is PAUSED, exactly as it is when the window loses focus — the
     ten-minute clock must not run while the player cannot see the floor. */
  const portrait = touchUI() && ih > iw;
  if (rotateBox.hidden === portrait) rotateBox.hidden = !portrait;
  if (portrait && sim) {
    Touch.clear();
    const playing = sim.mode === 'floor' || sim.mode === 'tableView' || sim.mode === 'station';
    if (playing && !sim.paused) setPaused(true);
  }
}

/* ==== MAIN LOOP ==== */
const Loop = { timeScale: 1, manual: false, acc: 0, last: null, dropped: 0, sheet: null, caption: null };
function frame(now) {
  if (Loop.last === null) Loop.last = now;
  const dt = Math.min(now - Loop.last, 250);
  Loop.last = now;
  if (!Loop.manual && Loop.timeScale > 0) {
    Loop.acc += dt * Loop.timeScale * (sim.lab ? sim.lab.speed : 1); // the lab's T key slows the fight down to look at it
    let n = Math.floor(Loop.acc / (1000 / 60));
    Loop.acc -= n * (1000 / 60);
    if (n > 600) { Loop.dropped += n - 600; n = 600; }
    for (let i = 0; i < n; i++) stepSim();
  }
  // Once a frame, never from a pointer handler: heldCodes only catches up when drainInput runs, so reconciling on
  // a move event would send a press for every pixel the thumb travels.
  Touch.sync();
  render();
  requestAnimationFrame(frame);
}

/* ==== THE DIFFICULTY AUDIT ======================================================================================
   The claim this build makes is narrow and absolute — THREE LEVELS THAT DIFFER ONLY IN HOW OFTEN THE DOOR OPENS —
   and a claim like that is worth a mechanical proof rather than a paragraph. This is that proof. It runs on a
   PRIVATE simulation, the way Opening.audit does: the module's `sim` is swapped out, shifts are played through the
   real stepSim(), and the real one is put back, with AUDITING suppressing every event and every sound meanwhile.

   It is rolled into __test.artAudit(), which the harness already turns into a verdict, because tools\ was locked
   for this run and a new bot could not be written. See comments_and_questions.md.

   What it establishes:
     1. the two title controls sit at the same height, do not touch, and nothing on the title overlaps or clips;
     2. `.pace` is read in exactly one place in the whole simulation, and that place is the spawner's interval;
     3. every other number a shift is paced by is identical with each level selected;
     4. an idle shift at medium and hard takes more customers than at easy, and the SOLO PHASE IS TICK-IDENTICAL
        on all three from the same seed — the part that must not scale, proved not to have scaled;
     5. the same seed on the same level twice gives the same shift;
     6. the choice survives a restart, and cannot be changed once the doors are open;
     7. LEFT / RIGHT and the three segment taps all move the selection, clamp at the ends, and leave SPACE alone;
     8. all thirty epilogues — three levels x died/survived x five tiers — name their level, and still fit the
        departures board and the card they are drawn on. */
const Difficulty = {
  audit() {
    const problems = [], note = s => problems.push(s), notes = [];
    const realSim = sim, realIdx = diffIdx, realPlayed = Intro.played;
    const held = Array.from(Input.heldCodes);
    try {
      AUDITING = true;
      Intro.played = true;   // the audit is about the title and the shift; the opening has its own audit

      // ---- 1. the bottom row of the title, from the boxes the renderer actually draws ----
      const Hb = HELP_BTN, Db = DIFF_BTN;
      if (Hb.y !== Db.y || Hb.h !== Db.h) note(`difficulty: the selector is y ${Db.y} h ${Db.h}, INSTRUCTIONS is y ${Hb.y} h ${Hb.h} — not the same height`);
      if (Hb.x + Hb.w > Db.x) note(`difficulty: INSTRUCTIONS (x ${Hb.x}-${Hb.x + Hb.w}) is not clear to the left of the selector (x ${Db.x})`);
      const Vb = DEV_BTN;
      if (Db.x + Db.w > Vb.x) note(`difficulty: the selector (x ${Db.x}-${Db.x + Db.w}) is not clear to the left of ${Vb.label} (x ${Vb.x})`);
      if (Vb.y !== Db.y || Vb.h !== Db.h) note(`difficulty: ${Vb.label} is y ${Vb.y} h ${Vb.h}, the selector is y ${Db.y} h ${Db.h} — not the same height`);
      if (Hb.x < 2 || Vb.x + Vb.w > W - 2) note(`difficulty: the bottom row runs from ${Hb.x} to ${Vb.x + Vb.w} on a ${W} px canvas`);
      if (Db.y + Db.h + 4 + 7 > H) note(`difficulty: the ${Db.label} caption ends at y ${Db.y + Db.h + 11}, past the ${H} px canvas`);
      let segX = Db.x;
      for (const S of DIFF_SEG) {
        if (S.x !== segX || S.y !== Db.y || S.h !== Db.h) note(`difficulty: segment ${S.name} is ${S.x},${S.y} ${S.w}x${S.h}, expected to start at ${segX},${Db.y}`);
        if (textW(S.name, 1) + 6 > S.w) note(`difficulty: ${S.name} is ${textW(S.name, 1)} px in a ${S.w} px segment`);
        const bad = [...new Set([...S.name + Db.label].filter(c => !(c in FONT)))];
        if (bad.length) note(`difficulty: no glyph for ${JSON.stringify(bad.join(''))}`);
        segX += S.w;
      }
      if (segX !== Db.x + Db.w) note(`difficulty: the segments cover ${segX - Db.x} px of a ${Db.w} px frame`);

      // Every string the title draws, with each level selected in turn: the same seven, none out of bounds, none
      // on top of another. This is the check that "nothing crowds or clips" rather than a claim that it does not.
      reset(4243, false);
      if (sim.mode !== 'title') note(`difficulty: a fresh game booted to ${sim.mode}, not the title`);
      const want = [TAGLINE, CALL_TEXT(), HELP_BTN.label, ...LEVELS.map(L => L.name), DIFF_BTN.label,
        ...DEVICES.map(D => D.name), DEV_BTN.label, DEV_CAPTION()];
      for (let i = 0; i < LEVELS.length; i++) {
        diffIdx = i;
        sim.difficulty = i;
        TEXT_LOG = [];
        render();
        const b = TEXT_LOG;
        TEXT_LOG = null;
        const strs = b.map(x => x.s);
        const missing = want.filter(w => !strs.includes(w));
        if (b.length !== want.length || missing.length) note(`difficulty: the title on ${LEVELS[i].name} draws ${b.length} strings (${strs.join(' / ')})${missing.length ? ', missing ' + missing.join(', ') : ''}`);
        const outs = b.filter(x => x.x < 0 || x.y < 0 || x.x + x.w > W || x.y + x.h > H);
        if (outs.length) note(`difficulty: on ${LEVELS[i].name}, ${outs.map(x => x.s).join(', ')} falls off the canvas`);
        for (let p = 0; p < b.length; p++) for (let q = p + 1; q < b.length; q++) {
          const A = b[p], B = b[q];
          if (A.x < B.x + B.w && A.x + A.w > B.x && A.y < B.y + B.h && A.y + A.h > B.y) note(`difficulty: on ${LEVELS[i].name}, "${A.s}" overlaps "${B.s}"`);
        }
      }

      // ---- 2. `.pace` is read once, and only by the spawner ----
      const src = Array.prototype.map.call(document.scripts, s => s.textContent).join('\n').split('\n');
      const a0 = src.findIndex(l => /==== SIM BEGIN ====/.test(l)), a1 = src.findIndex(l => /==== SIM END ====/.test(l));
      const code = src.slice(a0, a1).filter(l => !/^\s*(\/\/|\*|\/\*)/.test(l));
      const reads = code.filter(l => /\.pace\b/.test(l));
      if (reads.length !== 1) note(`difficulty: the simulation reads .pace on ${reads.length} lines, not 1 — ${reads.map(l => l.trim().slice(0, 60)).join(' ; ')}`);
      else if (!/const paceNow =/.test(reads[0])) note(`difficulty: the one .pace read is not paceNow() — ${reads[0].trim().slice(0, 80)}`);
      const caps = code.filter(l => /\.queueMax\b/.test(l));
      if (caps.length !== 1) note(`difficulty: the simulation reads .queueMax on ${caps.length} lines, not 1 — ${caps.map(l => l.trim().slice(0, 60)).join(' ; ')}`);
      else if (!/const queueCap =/.test(caps[0])) note(`difficulty: the one .queueMax read is not queueCap() — ${caps[0].trim().slice(0, 80)}`);
      // What pace scales is the list of paceNow()'s call sites, and it is exactly three constants: the first arrival,
      // the solo gap (twice) and the spawn interval (twice — the ordinary spawn and the one that joins the line).
      const uses = code.filter(l => /paceNow\(\)/.test(l) && !/const paceNow =/.test(l));
      const WANT = ['firstArrivalSec', 'soloGapSec', 'soloGapSec', 'spawnCurve', 'spawnCurve'];
      const got = uses.map(l => WANT.find(w => l.includes(w)) || l.trim().slice(0, 50)).sort();
      if (got.join('|') !== WANT.slice().sort().join('|')) note(`difficulty: paceNow() is called from [${got.join(', ')}], not [${WANT.slice().sort().join(', ')}]`);

      // ---- 3. nothing else a shift is paced by moves with the level ----
      const SAMPLE = [0, 30, 60, 120, 180, 240, 300, 420, 540, 600];
      const shape = () => JSON.stringify([CFG.sectionOpenSec, CFG.soloPhaseSec, CFG.soloGapSec, CFG.tableFreeDelaySec, CFG.cookSec,
        CFG.eatSec, CFG.shiftSec, CFG.tiers, CFG.health, CFG.anger, CFG.spawnJitter, CFG.firstArrivalSec,
        SAMPLE.map(t => curve(t, CFG.pairCurve)), SAMPLE.map(t => curve(t, CFG.greetCurve)), SAMPLE.map(t => curve(t, CFG.foodCurve)),
        SAMPLE.map(t => curve(t, CFG.spawnCurve)), CFG.fighterPatience]);
      diffIdx = 0;
      const shape0 = shape();
      for (let i = 1; i < LEVELS.length; i++) { diffIdx = i; if (shape() !== shape0) note(`difficulty: selecting ${LEVELS[i].name} moved something other than the spawn interval`); }
      for (let i = 0; i < LEVELS.length; i++) {
        const s = curve(300, CFG.spawnCurve) / LEVELS[i].pace;
        if (i === 0 && s !== curve(300, CFG.spawnCurve)) note('difficulty: easy is not the unscaled interval');
        if (Math.abs(s * LEVELS[i].pace - curve(300, CFG.spawnCurve)) > 1e-9) note(`difficulty: ${LEVELS[i].name} does not divide the interval by ${LEVELS[i].pace}`);
      }

      // ---- 4/5. driven: the first RUN_SEC of a shift on each level, from the same seeds, twice ----
      // Bud stands where the shift drops him and does nothing; he is topped back up to full health every tick so
      // that a death cannot truncate one level's run and not another's. Nothing else about the shift is touched.
      // This is a COMPARISON, not a playthrough: what a level does to a real shift's served / tips / deaths is
      // measured by the bot's batches and written down in README.md. What is being established here is that the
      // solo phase is untouched and the door opens faster afterwards.
      const RUN_SEC = 210;
      const idle = (i, seed) => {
        diffIdx = i;
        reset(seed, true);
        sim.difficulty = i;
        const at = [];
        let last = 0;
        for (let k = 0, n = TICKS(RUN_SEC) * 3; k < n && sim.mode !== 'shiftEnd'; k++) {
          sim.bud.health = CFG.health;
          sim.bud.dead = false;
          stepSim();
          if (sim.stats.spawned !== last) { at.push(sim.tick - sim.shift.startTick); last = sim.stats.spawned; }
          if (sim.shift.startTick !== null && sim.tick - sim.shift.startTick >= TICKS(RUN_SEC)) break;
        }
        return { spawned: sim.stats.spawned, at, sec: (sim.tick - sim.shift.startTick) / 60, hash: fnv(JSON.stringify(snapshot())) };
      };
      const SEEDS = [7, 31, 4242], runs = [], totals = [];
      for (let i = 0; i < LEVELS.length; i++) {
        let spawned = 0;
        for (const seed of SEEDS) {
          const r = idle(i, seed), again = idle(i, seed);
          if (r.hash !== again.hash) note(`difficulty: ${LEVELS[i].name} seed ${seed} is not deterministic (${r.hash} vs ${again.hash})`);
          if (Math.abs(r.sec - RUN_SEC) > 0.5) note(`difficulty: ${LEVELS[i].name} seed ${seed} ran ${r.sec.toFixed(1)} shift-seconds, not ${RUN_SEC}`);
          spawned += r.spawned;
          runs.push({ i, seed, at: r.at });
        }
        totals.push(spawned);
      }
      if (!(totals[1] > totals[0]) || !(totals[2] > totals[1])) {
        note(`difficulty: arrivals do not rise with the level — easy ${totals[0]}, medium ${totals[1]}, hard ${totals[2]} over ${RUN_SEC}s x ${SEEDS.length} seeds`);
      }
      // The ratios here are NOT the pace. Nobody is serving in an idle run, so every table fills and stays full and
      // arrivals saturate on free tables long before they saturate on the interval — medium and hard both run into
      // the same ceiling. What this proves is direction and the solo phase; the pace itself is the one division
      // checked above, and what it does to a played shift is in README.md's batches.
      notes.push(`difficulty (note): ${RUN_SEC}s idle and unserved, seeds ${SEEDS.join('/')} — arrivals easy ${totals[0]}, medium ${totals[1]}, hard ${totals[2]} ` +
        `(table-limited, not the pace: with no one serving, every table is full by the ceiling)`);
      // game_017 asserted the solo phase was tick-identical on all three levels. game_018 deliberately reverses that:
      // the gap between solo parties scales, so the first 75 seconds must now take MORE customers as the level rises.
      // The solo RULE is what must not move — still one party at a time, so arrivals in the phase are still gap-limited.
      const soloT = TICKS(CFG.soloPhaseSec);
      const soloN = LEVELS.map((L, i) => SEEDS.reduce((a, seed) => a + runs.find(r => r.i === i && r.seed === seed).at.filter(t => t < soloT).length, 0));
      if (!(soloN[1] > soloN[0]) || !(soloN[2] > soloN[1])) {
        note(`difficulty: the solo phase did not speed up with the level — easy ${soloN[0]}, medium ${soloN[1]}, hard ${soloN[2]} arrivals in the first ${CFG.soloPhaseSec}s over ${SEEDS.length} seeds`);
      }
      notes.push(`difficulty (note): first ${CFG.soloPhaseSec}s (solo phase), ${SEEDS.length} seeds — arrivals easy ${soloN[0]}, medium ${soloN[1]}, hard ${soloN[2]}`);

      // ---- 6. persistence, and the door being shut once the shift starts ----
      diffIdx = 0;
      reset(9, false);
      if (!setDifficulty(2) || diffIdx !== 2 || sim.difficulty !== 2) note(`difficulty: picking HARD on the title left index ${diffIdx}, shift ${sim.difficulty}`);
      reset(10, false);
      if (diffIdx !== 2 || sim.difficulty !== 2) note(`difficulty: the choice did not survive a restart to the title (index ${diffIdx}, shift ${sim.difficulty})`);
      reset(11, true);
      if (sim.difficulty !== 2) note(`difficulty: a shift started without the title did not inherit the choice (${sim.difficulty})`);
      if (setDifficulty(0) || sim.difficulty !== 2) note('difficulty: it can be changed after the doors open');

      // ---- 7. the keys and the three segment taps ----
      diffIdx = 0;
      reset(13, false);
      Input.queue.length = 0;
      Input.heldCodes.clear();
      const tap = a => { Input.tap(a); stepSim(); };
      const key = c => { Input.keyDown(c, null); stepSim(); Input.keyUp(c, null); stepSim(); };

  if (p.tableId !== null && p.customerIds.every(id => !byId(id).seat)) {
    sim.tables[p.tableId].partyId = null;
    p.tableId = null;
    if (sim.spawner.blocked) {
      sim.spawner.blocked = false;
      sim.spawner.nextTick = Math.max(sim.spawner.nextTick, sim.tick + TICKS(CFG.tableFreeDelaySec));
    }
  }
}
function startLeaving(c) {
  const from = { x: c.x, y: c.y };
  if (c.pendingTip > 0 && c.seat) {
    const tb = sim.tables[c.seat.tableId];
    tb.money += c.pendingTip;
    sim.stats.piles++;
    emit('moneyLeft', { customerId: c.id, tableId: tb.id, amount: c.pendingTip, tableTotal: tb.money });
    c.pendingTip = 0;
  }
  c.state = 'leaving';
  if (c.seat) vacate(c);
  c.path = navPath(from, LAYOUT.doorInside).concat([{ x: LAYOUT.door.x, y: LAYOUT.door.y }]);
}
function removeCustomer(c, silent) {
  sim.customers.splice(sim.customers.indexOf(c), 1);
  const p = partyOf(c);
  p.customerIds = p.customerIds.filter(id => id !== c.id);
  if (!silent) emit('customerLeft', { customerId: c.id });
  if (!p.customerIds.length) {
    if (p.tableId !== null) { sim.tables[p.tableId].partyId = null; p.tableId = null; }
    sim.parties.splice(sim.parties.indexOf(p), 1);
    if (shiftSeconds() < CFG.soloPhaseSec) sim.spawner.nextTick = Math.max(sim.spawner.nextTick, sim.tick + TICKS(CFG.soloGapSec / paceNow()));
  }
}
function updateCustomers() {
  const gone = [];
  for (const c of sim.customers.slice()) {
    if (sim.mode === 'shiftEnd') break;
    if (c.state === 'entering' || c.state === 'leaving') {
      if (c.path.length) walk(c);
      if (!c.path.length) {
        if (c.state === 'leaving') gone.push(c);
        else if (!c.arrived) {
          c.arrived = true;
          const p = partyOf(c);
          if (p.customerIds.every(id => byId(id).arrived)) seatParty(p);
        }
      }
    } else if (c.state === 'waitingOrder' || c.state === 'waitingFood') {
      c.patienceTicks = Math.max(0, c.patienceTicks - 1);
      const f = c.patienceTicks / c.patienceMaxTicks, A = CFG.anger;
      const lvl = f <= A[2] ? 3 : f <= A[1] ? 2 : f <= A[0] ? 1 : 0;
      if (lvl > c.angerLevel) { c.angerLevel = lvl; emit('angerLevel', { customerId: c.id, level: lvl }); }
      if (c.patienceTicks === 0) {
        if (SHIFT_FIGHTERS[c.speciesId]) startCharge(c);
        else {
          sim.stats.walkedOut++;
          emit('walkedOut', { customerId: c.id });
          playSound('walkout');
          beatOnce('walkout');
          startLeaving(c);
        }
      }
    } else if (c.state === 'queued') {
      // Waiting in the line is the whole of it: they walk to their slot and stand. No patience tick, so no anger, no
      // steam, no walk-out and no charge — those all hang off waitingOrder / waitingFood, which they are not in.
      if (c.path.length) walk(c);
    } else if (c.state === 'eating' && sim.tick >= c.eatUntil) {
      startLeaving(c);
    } else if (c.state === 'charging') {

    }
  }
  for (const c of gone) removeCustomer(c);
}

// ---- combat ----
// A fight is two bodies on the floor, both moving. Nothing is scripted and there is no exchange count.
//   Bud: SPACE starts a swing: swingStartup ticks, swingActive ticks in which the tray's box is live, swingRecovery ticks
//   (slow, and SPACE is ignored). Getting hit cancels the swing.
//   The alien: approach -> windup -> active (its attack box is live; it lunges) [-> gap -> active ...] -> recovery ->
//   cooldown -> approach. A hit on it at any point stuns it (the attack is cancelled) or, at 0 hp, knocks it out.
//   A hit is a box overlap in an active tick, one per swing and one per attack pulse. A landed hit freezes the whole
//   simulation (hit-stop), shoves the one hit (knockback over knockTicks) and stuns it. Bud is then invulnerable a while.
// Patience ran out and this species fights: it gets up and comes for Bud wherever he is.
function startCharge(c) {
  c.fromTable = c.seat.tableId;

  c.state = 'charging';
  c.path = [];
  c.repathTick = sim.tick;
  sim.stats.charges++;
  emit('charged', { customerId: c.id, speciesId: c.speciesId, tableId: c.fromTable });
  playSound('voice', { speciesId: c.speciesId, seed: voiceSeed(c), customerId: c.id, roar: true });
}
function chase(c) {
  const b = sim.bud, d = Math.hypot(b.x - c.x, b.y - c.y);
  const busy = sim.fight !== null || sim.mode !== 'floor' || b.dead;
  // it squares up only once it is out of its banquette (a fight started from inside furniture snaps it about);
  // otherwise it waits its turn at that distance
  if (d <= CFG.engageDist && !feetHit(c.x, c.y, OBSTACLES)) { if (!busy) startFight(c); return; }
  if (sim.tick >= c.repathTick || !c.path.length) { c.path = navPath(c, b); c.repathTick = sim.tick + 20; }
  if (c.path.length) walk(c, CFG.chargeSpeed);
}
function startFight(c) {

  c.state = 'fighting';
  c.path = [];
  c.kb = null;

  // each one's overlap check would hold the other in place for the whole fight.
  for (let i = 0; i < 4 && tooClose(b.x, b.y, c.x, c.y); i++) {
    const s = c.x < b.x ? -1 : c.x > b.x ? 1 : (i & 1 ? 1 : -1), gap = CFG.bodyHalfW + CFG.budHalfW + 1 - Math.abs(c.x - b.x);
    if (i < 2) slide(i === 0 ? c : b, (i === 0 ? s : -s) * gap, 0);
    else slide(i === 2 ? c : b, 0, (c.y <= b.y ? -1 : 1) * (i === 2 ? 1 : -1) * (FEET.h + 3 - Math.abs(c.y - b.y)));
  }
  Object.assign(b, { raise: CFG.raiseTicks, swing: null, stun: 0, kb: null, raiseFrom: b.facing, raiseTick: sim.tick + 1 }); // +1: the frame drawn after this tick
  sim.fight = { customerId: c.id, speciesId: c.speciesId, tableId: c.fromTable, startTick: sim.tick, hp, maxHp: hp,
    st: 'approach', left: 0, stTick: sim.tick, dir: c.x < b.x ? 1 : -1, pulse: 0, connected: false, rush: false, hits: 0, landed: 0,
    attacks: 0, whiffs: 0, hitTick: -9999, lastHit: null, route: [], routeUntil: -1 };
  sim.stats.fights++;
  emit('fightStart', { customerId: c.id, speciesId: c.speciesId, tableId: c.fromTable, hp });
  if (!sim.lab) beatOnce('fight');
}
// The tray's box against the alien's body; the alien's attack box (one side, or both) against Bud's body.
function trayConnects(b, c) {
  const x0 = Math.min(b.x, b.x + b.dir * CFG.budReach), x1 = Math.max(b.x, b.x + b.dir * CFG.budReach);
  return c.x + CFG.bodyHalfW > x0 && c.x - CFG.bodyHalfW < x1 && Math.abs(c.y - b.y) <= CFG.hitBandY;
}
function attackConnects(c, dir, S, b) {

    if (b.x + CFG.budHalfW > Math.min(a, e) && b.x - CFG.budHalfW < Math.max(a, e) && Math.abs(c.y - b.y) <= CFG.hitBandY) return true;

}
// Bodies do not pass through each other: closer than this in both axes is refused.
const tooClose = (ax, ay, bx, by) => Math.abs(ax - bx) < CFG.bodyHalfW + CFG.budHalfW && Math.abs(ay - by) < FEET.h + 2;
// Knockback: the total shove, front-loaded over knockTicks (n, n-1, ... 1 parts of n(n+1)/2).
function knock(e, dx) { e.kb = { dx, left: CFG.knockTicks }; }
function knockStep(e) {

}
function setSt(F, st, left) { F.st = st; F.left = left; F.stTick = sim.tick; }
function updateFight(P) {
  const F = sim.fight, c = byId(F.customerId), b = sim.bud, S = FIGHTERS[F.speciesId];
  // ---- Bud ----
  if (b.raise > 0) b.raise--;
  if (b.invuln > 0) b.invuln--;
  if (Math.abs(c.x - b.x) >= 2) b.dir = c.x > b.x ? 1 : -1;
  knockStep(b);
  if (b.stun > 0) { b.stun--; b.vx = b.vy = 0; }
  else {
    const x0 = b.x, y0 = b.y;
    moveBud(b.swing ? CFG.recoveryMove : 1);
    if (F.st !== 'ko' && tooClose(b.x, b.y, c.x, c.y)) { b.x = x0; b.y = y0; b.vx = b.vy = 0; }
  }
  if (b.swing) {
    const sw = b.swing;
    if (--sw.left <= 0) {

      else if (sw.phase === 'active') {
        sw.phase = 'recovery'; sw.left = CFG.swingRecovery;
        if (!sw.hit) { sim.stats.whiffs++; emit('budWhiff', { customerId: c.id }); }
      } else b.swing = null;
    }
    if (b.swing && sw.phase === 'active' && !sw.hit && F.st !== 'ko' && trayConnects(b, c)) {
      sw.hit = true;
      alienHit(F, c, b);
      if (!sim.fight) return;
    }
  } else if (P.act && b.stun === 0 && b.raise === 0) {
    b.swing = { phase: 'startup', left: CFG.swingStartup, hit: false };
    b.swingTick = sim.tick;
    sim.stats.swings++;

  knockStep(c);

  if (F.st === 'stun') {

    if (!fresh && --F.left <= 0) { F.dir = dx >= 0 ? 1 : -1; F.rush = true; setSt(F, 'approach', 0); }

  }
  if (F.st === 'approach' || F.st === 'cooldown') {

    F.dir = dx >= 0 ? 1 : -1;
  }
  if (F.st === 'approach') {

    if (adx <= commit && ady <= CFG.hitBandY && !b.dead) { F.rush = false; windup(F, c); }
    else alienMove(F, c, b.x - F.dir * Math.max(CFG.bodyHalfW + CFG.budHalfW + 1, commit - 3), b.y, S.speed * (F.rush ? 2 : 1));
  } else if (F.st === 'windup') {

  } else if (F.st === 'active') {

    }
    if (!F.connected && b.invuln === 0 && !b.dead && attackConnects(c, F.dir, S, b)) {
      F.connected = true;

    }
    if (--F.left <= 0) {
      if (!F.connected) { F.whiffs++; sim.stats.alienWhiffs++; emit('alienWhiff', { customerId: c.id, pulse: F.pulse }); }
      F.pulse++;

    if (--F.left <= 0) { setSt(F, 'active', S.active); F.connected = false; }
  } else if (F.st === 'recovery') {
    if (--F.left <= 0) setSt(F, 'cooldown', CFG.cooldownMin + sim.rng.int(CFG.cooldownMax - CFG.cooldownMin + 1));
  } else if (F.st === 'cooldown') {
    alienMove(F, c, c.x - F.dir * 24, b.y, S.speed * 0.35);
    if (--F.left <= 0) setSt(F, 'approach', 0);
  }
}
function windup(F, c) {
  setSt(F, 'windup', FIGHTERS[F.speciesId].windup);
  F.pulse = 0;
  F.attacks++;
  sim.stats.alienAttacks++;
  emit('alienWindup', { customerId: c.id, speciesId: F.speciesId, dir: F.dir });
  playSound('tell', { speciesId: F.speciesId });
}
// How far Bud gets from a standstill in n ticks at full input (his real acceleration and top speed).
function escapePx(n) {
  const acc = CFG.budSpeed / (CFG.accelSec * 60);

  for (let i = 0; i < n; i++) { v = Math.min(CFG.budSpeed, v + acc); d += v / 60; }
  return d;
}

const COMMIT = Object.freeze(Object.fromEntries(Object.entries(FIGHTERS).map(([id, S]) => [id,
  Math.round(Math.max(CFG.bodyHalfW + CFG.budReach + 2, CFG.bodyHalfW + S.reach + S.lunge / S.hits + CFG.budHalfW - Math.max(3, escapePx(S.windup + S.active - CFG.dodgeMargin))))])));

function alienMove(F, c, tx, ty, speed) {
  const b = sim.bud, step = speed / 60, x0 = c.x, y0 = c.y;
  let gx = tx, gy = ty;
  if (sim.tick < F.routeUntil && F.route.length) {
    if (Math.hypot(F.route[0].x - c.x, F.route[0].y - c.y) <= step) F.route.shift();
    if (F.route.length) { gx = F.route[0].x; gy = F.route[0].y; }
  }
  const dx = gx - c.x, dy = gy - c.y, d = Math.hypot(dx, dy);
  if (d < 0.5) return;
  const k = Math.min(step, d) / d, hit = slide(c, dx * k, dy * k);
  if (tooClose(b.x, b.y, c.x, c.y)) { c.x = x0; c.y = y0; }
  if ((hit.x || hit.y) && sim.tick >= F.routeUntil) { F.route = navPath(c, { x: tx, y: ty }); F.routeUntil = sim.tick + 45; }
}
// The tray lands: one hp and the thump always. At 0 hp it goes down. Mid-attack (wind-up, active, between pulses) it
// takes the blow and keeps coming; otherwise it is shoved and stunned.
function alienHit(F, c, b) {

  F.hitTick = sim.tick;
  F.lastHit = 'alien';
  sim.stats.alienHits++;
  sim.hitStop = CFG.hitStopHit;
  emit('alienHit', { customerId: c.id, speciesId: c.speciesId, hp: F.hp, alienSt: F.st, armoured: committed && F.hp > 0 });
  playSound('thump');
  if (F.hp <= 0) { knock(c, b.dir * CFG.knockAlien); setSt(F, 'ko', CFG.koTicks); }
  else if (!committed) { knock(c, b.dir * CFG.knockAlien); setSt(F, 'stun', CFG.stunAlien); }

// Its attack lands: health, knockback, stun, invulnerability, the swing cancelled, and the tray's load spills back to the kitchen.
function budHit(F, c, b, S) {

  b.stun = CFG.stunBud;

  playSound('thumpHurt');

}

    const t = ticketOf(id);
    if (kind === 'spill') {

      t.readyTick = sim.tick + TICKS(CFG.cookSec);

    } else {

    side: -F.dir, tick: sim.tick };
  sim.bodies.push(body);
  if (!spot) sim.stats.nonBlockingBodies++;

  sim.fight = null;
  endFightForBud();
  sim.stats.knockedOut++;

  playSound('ko');

  for (const o of sim.customers) {

    else if (o.state === 'leaving' && o.path.length) o.path = navPath(o, LAYOUT.doorInside).concat([{ x: LAYOUT.door.x, y: LAYOUT.door.y }]);

  emit('stormedOff', { customerId: c.id, speciesId: c.speciesId, tableId: F.tableId, hits: F.hits });
  playSound('walkout');
  c.state = 'leaving';
  c.path = navPath(c, LAYOUT.doorInside).concat([{ x: LAYOUT.door.x, y: LAYOUT.door.y }]);
}

// ---- the combat lab: the fight code above, one fight after another, no shift ----
// Everything a lab fight does goes through startCharge, chase, startFight, updateFight and knockOut exactly as in a
// shift. The lab stages the charge, clears the floor between fights, fights every species (a shift has six attackers),
// never gives up a fight, and replaces Bud's death with a "down" that the next fight (or H) heals.
const LAB_BUD = { x: 320, y: 222 };
const LAB_TALLY = ['fights', 'kos', 'downs', 'swings', 'hits', 'whiffs', 'attacks', 'taken', 'escaped'];
function enterLab(speciesId, seed) {
  reset(seed, true);
  sim.shift.startTick = sim.tick;
  sim.shift.endTick = null;
  for (const s of sim.sections) s.open = true; // the whole room lit: no closed sections to read past
  sim.lab = { speciesId: clamp(speciesId | 0, 1, CFG.species), cycle: false, speed: 1, side: 1, fightNo: 0, nextTick: sim.tick,
    downs: 0, boxes: false, last: null, result: null, mark: null, tally: {} };
  emit('labEnter', { speciesId: sim.lab.speciesId });
  UI.onMode(sim.mode);
}
function labBegin() {
  const L = sim.lab, b = sim.bud;
  if (L.mark) labTally();
  sim.fight = null;
  sim.hitStop = 0;
  for (const c of sim.customers.slice()) removeCustomer(c, true);
  if (sim.bodies.length) { sim.bodies.length = 0; rebuildBodies(); }
  Object.assign(b, { x: LAB_BUD.x, y: LAB_BUD.y, vx: 0, vy: 0, swingTick: -9999, hurtTick: -9999, dead: false, swing: null, stun: 0, invuln: 0, kb: null, raise: 0,
    loaded: false, loadTick: -9999, lowerTick: -9999 });
  b.tray.length = 0;
  if (b.health <= 0) b.health = CFG.health;
  L.side = -L.side;
  L.fightNo++;
  L.nextTick = null;
  L.last = null;
  L.result = null;
  const s = sim.stats;
  L.mark = { speciesId: L.speciesId, knockedOut: s.knockedOut, downs: L.downs, swings: s.swings, hits: s.alienHits, whiffs: s.whiffs,
    attacks: s.alienAttacks, taken: s.budHits, escaped: s.alienWhiffs };
  const p = spawnParty(L.speciesId, false, sim.tables[1]), c = byId(p.customerIds[0]);
  c.arrived = true;
  c.path = [];
  seatParty(p);
  c.x = b.x + L.side * (CFG.engageDist - 4);
  c.y = b.y;
  emit('labFight', { fightNo: L.fightNo, speciesId: L.speciesId, side: L.side });
  startCharge(c);
}
function labDown(c) {
  sim.fight = null;

  sim.bud.dead = true;
  sim.lab.downs++;
  emit('labDown', { speciesId: c.speciesId });
  removeCustomer(c, true);
}
function labTally() {
  const L = sim.lab, m = L.mark, s = sim.stats;
  if (!m) return;
  const t = L.tally[m.speciesId] || (L.tally[m.speciesId] = Object.fromEntries(LAB_TALLY.map(k => [k, 0])));
  t.fights++;
  t.kos += s.knockedOut - m.knockedOut;
  t.downs += L.downs - m.downs;
  t.swings += s.swings - m.swings;
  t.hits += s.alienHits - m.hits;
  t.whiffs += s.whiffs - m.whiffs;
  t.attacks += s.alienAttacks - m.attacks;
  t.taken += s.budHits - m.taken;
  t.escaped += s.alienWhiffs - m.escaped;
  L.mark = null;
}
function updateLab(P) {
  const L = sim.lab;
  if (P.slow) { L.speed = L.speed === 1 ? 0.5 : L.speed === 0.5 ? 0.25 : 1; emit('labSpeed', { speed: L.speed }); }
  if (P.cycle) { L.cycle = !L.cycle; emit('labCycle', { cycle: L.cycle }); }
  if (P.boxes) { L.boxes = !L.boxes; emit('labBoxes', { boxes: L.boxes }); }
  if (P.heal) { sim.bud.health = CFG.health; sim.bud.dead = false; emit('labHeal', {}); }
  if (P.prev || P.next) { L.speciesId = (L.speciesId - 1 + (P.next ? 1 : CFG.species - 1)) % CFG.species + 1; labBegin(); return; }
  if (P.restart) { labBegin(); return; }
  if (sim.fight) {
    const F = sim.fight;
    if (F.lastHit) L.last = { who: F.lastHit, tick: F.lastHit === 'alien' ? F.hitTick : sim.bud.hurtTick, hp: F.hp, health: sim.bud.health };
    return;
  }
  if (L.nextTick === null) {
    L.result = sim.bud.dead ? 'down' : 'ko';
    labTally();
    L.nextTick = sim.tick + TICKS(CFG.labGapSec);
    return;
  }
  if (sim.tick >= L.nextTick) {
    if (L.cycle && L.fightNo > 0) L.speciesId = L.speciesId % CFG.species + 1;
    labBegin();
  }
}

// Attacking species come through the door CFG.fighterWeight times as often as the others.
function pickSpecies() {
  const w = id => (SHIFT_FIGHTERS[id] ? CFG.fighterWeight : 1);
  let total = 0;
  for (let id = 1; id <= CFG.species; id++) total += w(id);
  let r = sim.rng.int(total);
  for (let id = 1; id <= CFG.species; id++) { r -= w(id); if (r < 0) return id; }
  return CFG.species;
}
// ---- the waiting line ----
// Everyone in the line stands one slot behind the last, and when the head is seated the rest shuffle up one.
function restack() {
  let i = 0;
  for (const pid of sim.queue) {
    const p = sim.parties.find(x => x.id === pid);
    if (!p) continue;
    for (const id of p.customerIds) {
      const c = byId(id), pt = queueSlotPt(i++);

// A table came free and somebody is waiting: the front of the line walks over and sits. FIRST IN, FIRST SEATED.

// On EASY sim.queue is always empty — nothing queues, so this returns before drawing from the RNG.
function updateQueue() {
  if (!sim.queue.length) return;
  const free = sim.tables.filter(t => t.partyId === null && sim.sections[LAYOUT.tables[t.id].section].open);
  if (!free.length) return;
  const p = sim.parties.find(x => x.id === sim.queue[0]);
  if (!p) { sim.queue.shift(); return; }
  const table = free[sim.rng.int(free.length)];
  const seatIdx = p.customerIds.length === 2 ? [0, 1] : [sim.rng.int(2)];
  sim.queue.shift();
  table.partyId = p.id;
  p.tableId = table.id;
  p.customerIds.forEach((id, k) => {
    const c = byId(id);
    c.seat = { tableId: table.id, index: seatIdx[k] };
    c.state = 'entering';   // the ordinary walk-to-seat path from here: arrival triggers seatParty(), patience starts there
    c.arrived = false;
    c.path = navPath(c, LAYOUT.tables[table.id].seats[seatIdx[k]]);
  });
  sim.spawner.blocked = false;
  emit('queueSeated', { partyId: p.id, tableId: table.id, waitedTicks: sim.tick - p.queuedTick, left: queuedCount() });

/* THE FOOD IS UP, SO THE DOOR OPENS.

   The solo phase lets ONE party into the diner at a time, and the next one is not even allowed through the door
   until the last has finished eating and left. From the player's side that is a long wait staring at an empty
   room after their first customer is served, which is the worst possible first minute for a game about being
   rushed off your feet.

   So the phase now has a second way forward: the moment Bud lifts a tray off the pass, the next party is released
   and walks in. By the time he has carried that food across the room and put it down, the next creature is nearly
   at its seat and there is no dead air at all. Nothing is ever waiting for him when he turns round; something is
   always arriving.

   WHY IT IS THE PASS AND NOT THE SERVE. The walk from the pass to the table is the gap being filled. Releasing on
   the serve would put the next arrival AFTER that walk and leave exactly the pause this removes.

   IT IS THE SAME ON EVERY DIFFICULTY, by construction: the trigger is an ACTION, not an interval, so there is no
   pace to divide by and no level on which the release is early or late. What difficulty still scales is the
   timer, which is untouched and remains the only way a party arrives if the player is doing nothing. A level that
   already pushes them out faster simply reaches its own interval before the release matters.

   AT MOST ONE AHEAD. `released` counts releases against the current occupancy so the solo phase can hold two
   parties — the one being served and the one walking in — and never three. That keeps the opening minutes the
   gentle thing they were written to be while removing the emptiness.

   AN IDLE PLAYER GETS NOTHING. No tray is ever lifted, no release ever fires, and the phase behaves exactly as it
   did. The reward for working is that the work keeps coming. */
const SOLO_MAX_PARTIES = 2;
function releaseNext() {
  if (shiftSeconds() >= CFG.soloPhaseSec) return;        // past the solo phase the ordinary curve is already in charge
  const S = sim.spawner;
  if (sim.parties.length + S.released >= SOLO_MAX_PARTIES) return;
  S.released++;
  // ASSIGNED, not min()'d against the standing timer. By the time a tray is lifted that timer is long overdue —
  // it was set when the party spawned and has been held back by the one-at-a-time gate ever since — so a min()
  // would pick the overdue value and put the next creature through the door on the same frame as the clink.
  S.nextTick = sim.tick + TICKS(CFG.soloReleaseSec);
  emit('soloRelease', { parties: sim.parties.length, at: +shiftSeconds().toFixed(2) });
}
function updateSpawner() {
  const S = sim.spawner, st = shiftSeconds();
  if (sim.tick < S.nextTick) return;
  const solo = st < CFG.soloPhaseSec;
  // One party at a time, UNLESS a release is owed. `released` is spent here rather than at the pass, so a release
  // that arrives while the room is full is still honoured the moment there is room for it.
  if (solo && sim.parties.length >= (S.released ? SOLO_MAX_PARTIES : 1)) return;
  const free = sim.tables.filter(t => t.partyId === null && sim.sections[LAYOUT.tables[t.id].section].open);
  if (!free.length) {
    // THE ROOM IS FULL. Nobody is turned away while there is room along the wall. queueCap() is 0 on EASY, so EASY
    // falls into the same `blocked` branch game_016 had, having drawn nothing from the RNG — that is what makes easy
    // bit-identical by construction. Beyond the cap the old spawn block is unchanged.
    const room = queueCap() - queuedCount();
    if (room < 1) { S.blocked = true; return; }
    const pair = room >= 2 && sim.rng.next() < curve(st, CFG.pairCurve);
    spawnParty(pickSpecies(), pair, null);
    S.blocked = false;
    S.nextTick = sim.tick + TICKS(curve(st, CFG.spawnCurve) / paceNow() * (1 - CFG.spawnJitter + 2 * CFG.spawnJitter * sim.rng.next()));
    return;
  }
  const pairP = solo ? 0 : curve(st, CFG.pairCurve);
  const pair = sim.rng.next() < pairP;
  const table = free[sim.rng.int(free.length)];
  spawnParty(pickSpecies(), pair, table);
  if (solo && S.released) S.released--;
  // THE ONE LINE DIFFICULTY TOUCHES. The interval the curve yields is divided by the level's pace: 1 on easy (and
  // x / 1 is exactly x, so easy is game_016 tick for tick), 2 on medium, 3 on hard. The jitter is a fraction of the
  // scaled interval, so it stays +/-20% of whatever the pace made it, and the same two RNG draws happen either way.
  // game_018: the solo GAP scales too (and so does the first arrival). The solo RULE does not — it is still one
  // party at a time for the first 75 seconds on every level. What changes is only how long the room stands empty
  // between them, which is what made the first 75 seconds of a hard shift identical to an easy one in game_017.
  if (solo) S.nextTick = sim.tick + TICKS(CFG.soloGapSec / paceNow());
  else S.nextTick = sim.tick + TICKS(curve(st, CFG.spawnCurve) / paceNow() * (1 - CFG.spawnJitter + 2 * CFG.spawnJitter * sim.rng.next()));
}

// Everything is synthesised from oscillators, filters and seeded noise. Nothing here reads or writes the simulation,
// and there is no unseeded randomness: a voice varies through makeRng(seed), so the same customer always sounds the same.
// Every function takes (ctx, dest, t, arg) and works on an AudioContext or an OfflineAudioContext.
const AU = {
  // gain envelope: silence -> peak in `a` seconds -> silence at t + len (exponential both ways)
  env(ctx, dest, t, len, peak, a) {
    const n = ctx.createGain();
    n.gain.setValueAtTime(0.0001, t);
    n.gain.exponentialRampToValueAtTime(peak, t + a);
    n.gain.exponentialRampToValueAtTime(0.0001, t + len);
    n.connect(dest);
    return n;
  },
  // oscillator through an envelope, optionally gliding to f2 by the end of the note
  osc(ctx, dest, type, f, t, len, peak, a, f2) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + len);
    o.connect(AU.env(ctx, dest, t, len, peak, a));
    o.start(t);
    o.stop(t + len + 0.02);
    return o;
  },
  filter(ctx, dest, type, freq, q) {
    const b = ctx.createBiquadFilter();
    b.type = type;
    b.frequency.value = freq;
    if (q) b.Q.value = q;
    b.connect(dest);
    return b;
  },
  // A filter whose cutoff sweeps from f0 to f1 over the note — used for whooshes and electrical sweeps.
  // From combat\finish_003.html's AU; the finisher voices below are the only callers.
  sweep(ctx, dest, type, f0, f1, t, len, q) {
    const b = ctx.createBiquadFilter();
    b.type = type;
    if (q) b.Q.value = q;
    b.frequency.setValueAtTime(f0, t);
    b.frequency.exponentialRampToValueAtTime(f1, t + len);
    b.connect(dest);
    return b;
  },
  // white noise from a seeded generator, through an envelope
  noise(ctx, dest, t, len, peak, a, seed) {
    const sr = ctx.sampleRate, N = Math.ceil(sr * (len + 0.02)), buf = ctx.createBuffer(1, N, sr), d = buf.getChannelData(0), r = makeRng(seed);
    for (let i = 0; i < N; i++) d[i] = r.next() * 2 - 1;
    const s = ctx.createBufferSource();
    s.buffer = buf;
    s.connect(AU.env(ctx, dest, t, len, peak, a));
    s.start(t);
    return s;
  },
  // a low-frequency oscillator added onto an AudioParam
  lfo(ctx, param, rate, depth, t, len, type) {
    const o = ctx.createOscillator(), k = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = rate;
    k.gain.value = depth;
    o.connect(k).connect(param);
    o.start(t);
    o.stop(t + len);
    return k;
  },
};

  const BPM = 132, SPB = 60/BPM, BEATS = 4, BAR = SPB*BEATS;    // 1.81818 s per bar
  const TONIC = 69;                                             // A4
  const AEOL = [0,2,3,5,7,8,10];                                // A natural minor
  const mtof = m => 440*Math.pow(2,(m-69)/12);
  const sdeg = i => TONIC + 12*Math.floor(i/7) + AEOL[((i%7)+7)%7];
  const fold = (m,lo,hi) => { while (m >= hi) m -= 12; while (m < lo) m += 12; return m; };
  // semitones above the tonic -> the nearest scale degree, so the bass can walk in degrees from a chromatic root
  const semi2deg = s => {
    const p = ((s % 12) + 12) % 12;
    let best = 0, bd = 99;
    for (let i=0;i<7;i++){ const d = Math.abs(AEOL[i] - p); if (d < bd){ bd = d; best = i; } }
    return best + 7*Math.floor(s/12);
  };

  /* ---------- ten chords, as semitones above the tonic. Chromatic where bossa wants it. ---------- */
  const CH = [
    { n:'Am9',    t:[0,3,7,14]  },   // A  C  E  B
    { n:'Dm7',    t:[5,8,12,15] },   // D  F  A  C
    { n:'G13',    t:[10,14,17,21]},  // G  B  D  E
    { n:'Cmaj7',  t:[3,7,10,14] },   // C  E  G  B
    { n:'Fmaj7',  t:[8,12,15,19] },  // F  A  C  E
    { n:'Bm7b5',  t:[2,5,8,12]  },   // B  D  F  A
    { n:'E7b9',   t:[7,11,14,17] },  // E  G# B  D
    { n:'Am7',    t:[0,3,7,10]  },   // A  C  E  G
    { n:'Dm9',    t:[5,8,12,19] },   // D  F  A  E
    { n:'E7sus',  t:[7,12,14,17] },  // E  A  B  D
  ];

  /* ---------- the cycles ---------- */
  const COMP  = [ [0,1.5,2.5,3], [0.5,1.5,3], [0,1.5,3.5], [0.5,2,3.5], [0,2.5], [1.5,2.5,3.5], [0,1,2.5,3.5] ];  // 7 guitar patterns
  const CLAVE = [ [1.5,3], [0.5,2] ];        // the two halves of a 3-2 bossa clave, one per bar
  const BASSF = [ [[0,0],[2.5,4]], [[0,0],[3,7]], [[0,0],[1.5,4],[3,2]] ];   // 3 bass figures: [beat, scale-degree offset]
  const REG   = [ 0, 2, -2, 4, -4 ];         // 5 whistle registers, changing every 8 bars
  const DEN   = [ 1, 0.5, 0 ];               // 3 whistle densities, changing every 4 bars
  const TEX   = [                            // 4 textures, changing every 9 bars
    { name:'the groove',      gtr:1, bass:1, rim:1, shk:1, mel:0, col:'#e0836a' },
    { name:'whistle',         gtr:1, bass:1, rim:1, shk:1, mel:1, col:'#e8b55c' },
    { name:'guitar and bass', gtr:1, bass:1, rim:0, shk:0, mel:0, col:'#7f9fc0' },
    { name:'no bass',         gtr:1, bass:0, rim:1, shk:1, mel:1, col:'#a88fd0' },
  ];
  const MEL = (() => {                       // 11 whistle phrases
    const out = [];
    for (let i=0;i<11;i++){
      const slots = [0,0.5,1,1.5,2,2.5,3,3.5], picked = [];
      const count = 1 + Math.floor(R0()*4);
      for (let k=0;k<count;k++) picked.push(slots.splice(Math.floor(R0()*slots.length),1)[0]);
      picked.sort((a,b)=>a-b);
      let o = Math.floor(R0()*6) - 2;
      const notes = picked.map((b,k) => {
        if (k>0) o += [-3,-2,-1,-1,1,1,2,4][Math.floor(R0()*8)];
        o = Math.max(-4, Math.min(6, o));
        return { b, o, d:0 };
      });
      notes.forEach((nt,k) => { nt.d = (k+1<notes.length ? notes[k+1].b : 4) - nt.b; });
      out.push({ base: 10 + Math.floor(R0()*3), notes });
    }
    return out;
  })();

  const CYCLES = [
    { label:'chord + voicing variant',  bars:20 },
    { label:'guitar comp pattern',      bars:7  },
    { label:'clave half',               bars:4  },
    { label:'bass figure',              bars:3  },
    { label:'whistle phrase',           bars:11 },
    { label:'whistle density (every 4)',bars:12 },
    { label:'whistle register (every 8)',bars:40 },
    { label:'texture (every 9)',        bars:36 },
  ];
  const gcd = (a,b) => b ? gcd(b,a%b) : a;
  const PERIOD = CYCLES.reduce((a,c) => a/gcd(a,c.bars)*c.bars, 1);   // 27720 bars

  /* ---------- the generator ---------- */
  function chordOf(n){
    const base = CH[n % 10], vary = Math.floor(n/10) % 2;
    // the second pass over the progression revoices it: rotate, and lift the new top note an octave.
    // `root` stays the real chord root, so revoicing moves the guitar without dragging the bass with it.
    const t = vary ? base.t.slice(1).concat([base.t[0] + 12]) : base.t.slice();
    return { n:base.n, t, root:base.t[0], vary };
  }
  function snapToChord(midi, ch){
    let best = midi, bd = 99;
    for (const s of ch.t) for (let oct=-36; oct<=48; oct+=12){
      const c = TONIC + s + oct, dd = Math.abs(c - midi);
      if (dd < bd){ bd = dd; best = c; }
    }
    return best;
  }
  function barEvents(n){
    const ch  = chordOf(n);
    const cmp = COMP[n % 7];
    const clv = CLAVE[Math.floor(n/2) % 2];
    const bf  = BASSF[n % 3];
    const mel = MEL[n % 11];
    const reg = REG[Math.floor(n/8) % 5];
    const den = DEN[Math.floor(n/4) % 3];
    const tex = TEX[Math.floor(n/9) % 4];
    const ev = [];

    if (tex.gtr){                                     // four voices, strummed with an 11 ms spread
      cmp.forEach((b,k) => {
        const v = (k === 0 ? 0.21 : 0.155) * (1 - 0.05*k);
        ch.t.forEach((s,j) => ev.push({ i:'gtr', t:b*SPB + j*0.011, f:mtof(fold(TONIC+s, 57, 76)), len:0.95 - j*0.08, v:v*(1 - 0.11*j) }));
      });
    }
    if (tex.bass){
      const rootDeg = semi2deg(ch.root);
      bf.forEach(([b,off],k) => {
        // folded into 36-47, i.e. 65-123 Hz: under the 129 Hz centre of the combat thumps rather than on top of it
        ev.push({ i:'bass', t:b*SPB, f:mtof(fold(sdeg(rootDeg + off), 36, 48)), len:k ? SPB*1.0 : SPB*1.6, v:k ? 0.32 : 0.46 });
      });
    }
    if (tex.rim) clv.forEach((b,k) => ev.push({ i:'rim', t:b*SPB, f:0, len:0.05, v:k ? 0.10 : 0.125 }));
    if (tex.shk && n % 4 !== 3){                      // the shaker takes every fourth bar off, so it never nags
      // the noise read offset cycles on 12, a divisor of the period, so the piece still repeats exactly
      for (let e=0;e<8;e++) ev.push({ i:'shk', t:e*0.5*SPB, f:((n % 12)*0.11 + e*0.093) % 1.5, len:0.035, v:e % 2 ? 0.020 : 0.032 });
    }
    if (tex.mel && den > 0){
      const keep = Math.round(mel.notes.length * den) || 1;
      mel.notes.slice(0, keep).forEach(nt => {
        let m = sdeg(mel.base + reg + nt.o) ;
        if (nt.b === 0 || nt.b === 2) m = snapToChord(m, ch);
        ev.push({ i:'mel', t:nt.b*SPB, f:mtof(fold(m, 79, 95)), len:Math.min(nt.d*SPB*1.25, 1.5), v:0.26 });
      });
    }
    return ev;
  }
  function barKey(n){
    return barEvents(n).map(e => e.i[0] + Math.round(e.t*1000) + ',' + Math.round(e.f) + ',' + Math.round(e.v*1000) + ',' + Math.round(e.len*1000)).join('|');
  }

  /* ---------- synthesis ---------- */
  // ONE LINE CHANGED: master.connect(dest) rather than master.connect(ctx.destination), so the game passes
  // Sound.master and the music sits under the master gain and the SOUND toggle like every other sound.
  function makeChain(ctx, dest, level){
    const master = ctx.createGain(); master.gain.value = level;
    const lp  = ctx.createBiquadFilter(); lp.type='lowpass';  lp.frequency.value=8500; lp.Q.value=0.5;
    const dip = ctx.createBiquadFilter(); dip.type='peaking'; dip.frequency.value=950; dip.Q.value=1.0; dip.gain.value=-5;
    const hp  = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=55;
    hp.connect(dip); dip.connect(lp); lp.connect(master); master.connect(dest);
    return { input:hp, master };
  }
  function noiseBuf(ctx){
    if (ctx.__nb) return ctx.__nb;
    const N = Math.floor(ctx.sampleRate*2), b = ctx.createBuffer(1,N,ctx.sampleRate), d = b.getChannelData(0), r = mulberry32(0xB0553);
    for (let i=0;i<N;i++) d[i] = r()*2-1;
    ctx.__nb = b; return b;
  }
  function env(ctx,dest,t,atk,len,peak){
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak,2e-4), t+atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t+len);
    g.connect(dest); return g;
  }
  function tone(ctx,dest,type,f,t,atk,len,peak){
    const o = ctx.createOscillator(); o.type=type; o.frequency.value=f;
    const g = env(ctx,dest,t,atk,len,peak);
    o.connect(g); o.start(t); o.stop(t+len+0.03); return g;
  }
  function burst(ctx,dest,t,len,peak,offset){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf(ctx);
    s.connect(env(ctx,dest,t,0.003,len,peak)); s.start(t, offset); s.stop(t+len+0.02);
  }
  const INSTR = {
    gtr(ctx,dest,t,f,len,v){                        // nylon string: triangle body, sine fundamental, a pick scrape on top
      tone(ctx,dest,'triangle',f,t,0.004,len,v*0.75);
      tone(ctx,dest,'sine',f,t,0.006,len*1.25,v*0.55);
      tone(ctx,dest,'sine',f*3.01,t,0.003,len*0.12,v*0.10);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3000; bp.Q.value=1.4; bp.connect(dest);
      burst(ctx,bp,t,0.018,v*0.22,(f % 1.4));
    },
    bass(ctx,dest,t,f,len,v){
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300; lp.Q.value=0.7; lp.connect(dest);
      tone(ctx,lp,'sine',f,t,0.012,len,v);
      tone(ctx,lp,'triangle',f,t,0.012,len*0.35,v*0.3);
    },
    rim(ctx,dest,t,f,len,v){                        // rim click: a woody ping plus a short crack
      tone(ctx,dest,'sine',420,t,0.001,0.045,v*0.8);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=2.0; bp.connect(dest);
      burst(ctx,bp,t,len,v,0.77);
    },
    shk(ctx,dest,t,f,len,v){                        // f is a read offset into the noise buffer
      const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6200; hp.connect(dest);
      burst(ctx,hp,t,len,v,f);
    },
    mel(ctx,dest,t,f,len,v){                        // whistle: sine, a little vibrato, a breath of noise around it
      const g = tone(ctx,dest,'sine',f,t,0.035,len,v);
      const lo = ctx.createOscillator(); lo.frequency.value = 5.1;
      const la = ctx.createGain(); la.gain.value = f*0.006;
      lo.connect(la); lo.start(t); lo.stop(t+len+0.03);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f*1.02; bp.Q.value=9; bp.connect(dest);
      burst(ctx,bp,t,Math.min(len,0.5),v*0.18,(f % 1.2));
      return g;
    },
  };
  function scheduleBar(ctx,dest,n,t0){ for (const e of barEvents(n)) INSTR[e.i](ctx,dest,t0+e.t,e.f,e.len,e.v); }

  /* ---------- the game's transport ----------
     One state object, driven by sync() from render(). It never touches sim, never reads the clock, and never
     schedules while a test is stepping by hand. Bars are scheduled 0.7 s ahead, as the review page does. */
  const M = { chain: null, bar: 0, nextT: 0, t0: 0, startedAt: null, gapMax: 0, bars: 0, starts: 0, stops: 0, duck: 0,
    // What this costs per frame, measured rather than argued about. sync() is the only thing the music adds to
    // render(); everything else it does happens on the audio thread. syncMs is the total, syncN the call count.
    syncMs: 0, syncN: 0, syncMax: 0, syncMaxSteady: 0, syncOver2: 0, syncOver16: 0, bufMs: null, qMax: 0,
    q: [] };   // events queued but not yet handed to WebAudio; see pump()
  const gain = () => PREF.musicVol * MUSIC_GAIN * (M.duck ? 0 : 1);
  function start() {
    const c = Sound.ctx;
    if (!c || c.state !== 'running' || M.chain) return false;
    M.chain = makeChain(c, Sound.master, gain());
    // The shaker, the pick scrape and the rim crack all read out of one 2-second noise buffer, and music_003 builds
    // it lazily on the first burst(). Two seconds at 44.1 kHz is 88,200 samples of mulberry32, which lands as a
    // one-off ~16 ms spike on whatever frame the first note is scheduled. Built here instead, and timed, so that
    // spike is a number with a name on it rather than an unexplained dropped frame in the middle of a shift.
    const tb = performance.now();
    noiseBuf(c);
    M.bufMs = +(performance.now() - tb).toFixed(3);
    M.bar = 0; M.bars = 0; M.gapMax = Infinity; M.q.length = 0; M.qMax = 0;
    M.nextT = c.currentTime + 0.12;
    M.t0 = M.nextT;
    M.startedAt = c.currentTime;
    M.starts++;
    pump();
    return true;
  }
  function stop() {
    if (!M.chain) return false;
    const c = Sound.ctx, old = M.chain;
    try { old.master.gain.setTargetAtTime(0, c.currentTime, 0.04); } catch (e) { /* context gone */ }
    setTimeout(() => { try { old.master.disconnect(); } catch (e) { /* already detached */ } }, 500);
    M.chain = null;
    M.startedAt = null;
    M.q.length = 0;
    M.stops++;
    return true;
  }
  // A bar is about twenty-three events and each one builds three or four WebAudio nodes. Scheduling a whole bar in
  // one go costs 7-9 ms, which on a 16.67 ms budget is a visible hitch every 1.8 seconds — measured, not guessed.
  // music_003's page never noticed because its transport ran on a setInterval with nothing else to be late for.
  // Here the events are queued and drained a few per frame instead. Nothing about WHAT is scheduled changes: every
  // event still carries its own absolute start time, and there is 0.7-2.4 s of lead to spend, against the ~70 ms
  // this takes to drain. If the head of the queue ever gets close to being due, the rest goes at once.
  // Time-boxed rather than counted: one guitar event builds a dozen WebAudio nodes and one shaker event builds
  // three, so "six events" costs whatever the bar happens to be made of, and it is a different number on a
  // different machine. A millisecond of budget is a millisecond anywhere.
  const BUDGET_MS = 1.0, DUE_SOON = 0.2;
  function pump() {
    const c = Sound.ctx;
    if (!c || !M.chain) return;
    // How far ahead the schedule actually was when this ran. If a frame ever arrives so late that nextT has already
    // passed, the music has a hole in it; gapMax going negative is how a test sees that rather than hearing it.
    if (M.bars) M.gapMax = Math.min(M.gapMax, M.nextT - c.currentTime);
    if (!M.q.length) {
      while (M.nextT < c.currentTime + 0.7) {
        for (const e of barEvents(M.bar)) M.q.push([e, M.nextT + e.t]);
        M.bar++; M.bars++; M.nextT += BAR;
      }
    }
    const t0 = performance.now();
    while (M.q.length) {
      const [e, at] = M.q[0];
      // over budget, and this one is not due yet: leave it for the next frame
      if (performance.now() - t0 > BUDGET_MS && at - c.currentTime > DUE_SOON) break;
      M.q.shift();
      INSTR[e.i](c, M.chain.input, at, e.f, e.len, e.v);
    }
    if (M.q.length > M.qMax) M.qMax = M.q.length;
  }
  // Called once per rendered frame. The music is on exactly while a shift is on the floor: not on the title, not on
  // the instructions, not during the opening scene (the shift clock has not started), not in the combat lab, not
  // during a finisher, and not once the epilogue is up.
  function wanted() {
    if (Loop.manual || !sim) return false;
    if (!Sound.ctx || Sound.ctx.state !== 'running') return false;
    if (sim.lab || sim.fin || sim.ending || sim.shift.ended) return false;
    if (sim.shift.startTick === null) return false;
    return sim.mode === 'floor' || sim.mode === 'tableView' || sim.mode === 'station';
  }
  function sync() {
    const t0 = performance.now();
    const want = wanted();
    let started = false;
    if (want && !M.chain) started = start();
    else if (!want && M.chain) stop();
    else if (want) pump();
    const dt = performance.now() - t0;
    M.syncMs += dt; M.syncN++;
    if (dt > M.syncMax) M.syncMax = dt;
    // the steady-state worst: every frame except the one that built the chain and the noise buffer
    if (!started && dt > M.syncMaxSteady) M.syncMaxSteady = dt;
    // A max over thousands of frames is a measure of the worst thing that happened on the machine, not of this
    // code: a garbage collection inside the timed region lands here whatever caused it. The counts are the honest
    // shape of the cost — how many frames it actually made expensive, and how many it made late.
    if (dt > 2) M.syncOver2++;
    if (dt > 16.67) M.syncOver16++;
  }
  function resetCost() { M.syncMs = 0; M.syncN = 0; M.syncMax = 0; M.syncMaxSteady = 0; M.syncOver2 = 0; M.syncOver16 = 0; }
  function setLevel(v) {
    PREF.musicVol = clamp(Number(v) || 0, 0, 1);
    if (M.chain && Sound.ctx) M.chain.master.gain.setTargetAtTime(gain(), Sound.ctx.currentTime, 0.03);
    return PREF.musicVol;
  }
  // Used only by __test.liveAnalyse, so a spectrum read of one effect is not a read of the effect plus the bass line.
  function setDuck(on) {
    M.duck = on ? 1 : 0;
    if (M.chain && Sound.ctx) M.chain.master.gain.setTargetAtTime(gain(), Sound.ctx.currentTime, 0.01);
    return M.duck;
  }
  return {
    sync, start, stop, setLevel, setDuck, resetCost, barEvents, barKey, scheduleBar, makeChain, INSTR,
    BAR, BPM, PERIOD, CYCLES, TEX,
    playing: () => !!M.chain,
    state: () => ({ playing: !!M.chain, bar: M.bar, bars: M.bars, starts: M.starts, stops: M.stops,
      level: PREF.musicVol, gain: gain(), ducked: !!M.duck, leadSec: M.chain && Sound.ctx ? +(M.nextT - Sound.ctx.currentTime).toFixed(3) : null,
      minLeadSec: M.bars && M.gapMax !== Infinity ? +M.gapMax.toFixed(3) : null,
      elapsedSec: M.startedAt !== null && Sound.ctx ? +(Sound.ctx.currentTime - M.t0).toFixed(2) : null,
      syncCalls: M.syncN, syncAvgMs: M.syncN ? +(M.syncMs / M.syncN).toFixed(4) : null, syncMaxMs: +M.syncMax.toFixed(4),
      syncMaxSteadyMs: +M.syncMaxSteady.toFixed(4), syncOver2ms: M.syncOver2, syncOver16ms: M.syncOver16,
      noiseBufMs: M.bufMs, queued: M.q.length, queuedMax: M.qMax }),
  };
})();

/* ==== UI (DOM buttons) ==== */
const wrap = document.getElementById('wrap');
const uiBox = document.getElementById('ui');
const btnPause = document.getElementById('btnPause');
const btnRestart = document.getElementById('btnRestart');
const btnSound = document.getElementById('btnSound');
const btnHelp = document.getElementById('btnHelp');
const diffBtns = [0, 1, 2].map(i => document.getElementById('btnD' + i));
const devBtns = [0, 1].map(i => document.getElementById('btnV' + i));
const btnStart = document.getElementById('btnStart');
const rotateBox = document.getElementById('rotate');
const musicBox = document.getElementById('music');
const volMusic = document.getElementById('volMusic');
const UI = {
  onMode(mode) {
    // MOBILE also gets it during the opening, where it reads SKIP: P and ESC drop the opening on a keyboard and
    // a touchscreen has neither, so without this a phone has to sit through fifty seconds it has already seen.
    btnPause.hidden = !(mode === 'floor' || mode === 'tableView' || mode === 'station' || (mode === 'intro' && touchUI()));
    // The slider is on screen exactly when the music can be: never on the title, the instructions, the opening
    // scene, the epilogue or in the combat lab, where it would be a control for nothing.
    musicBox.hidden = !(sim && !sim.lab && (mode === 'floor' || mode === 'tableView' || mode === 'station'));
    btnRestart.hidden = !(mode === 'shiftEnd' || (sim && sim.paused));
    btnSound.classList.toggle('ending', mode === 'shiftEnd'); // out of the departures board's corner
    btnSound.classList.toggle('lab', !!(sim && sim.lab)); // out of the lab's readout
    btnSound.classList.toggle('title', mode === 'title'); // out of the S of SPACE
    btnSound.classList.toggle('help', mode === 'help');   // out of the key row
    btnHelp.hidden = mode !== 'title';
    // The difficulty segments live and die with the INSTRUCTIONS button: the level is chosen before the doors open
    // and nowhere else, so there is no control for it once a shift is running.
    for (const b of diffBtns) b.hidden = mode !== 'title';
    for (const b of devBtns) b.hidden = mode !== 'title';
    // MOBILE only: DESKTOP starts on SPACE, as it always has, and a button there would be a second way to do a
    // thing that already has one.
    btnStart.hidden = !(mode === 'title' && touchUI());
    // MOBILE's overlay belongs to the floor. Anywhere else — the title, the instructions, the epilogue, a pause —
    // the DOM buttons are the controls, so drop whatever a thumb was holding rather than leaving it live under a
    // screen that no longer reads it.
    if (mode !== 'floor' && mode !== 'tableView' && mode !== 'station' && mode !== 'intro') Touch.clear();
  },
  soundLabel() {
    const label = PREF.muted ? 'SOUND OFF' : 'SOUND ON';
    if (btnSound.textContent !== label) btnSound.textContent = label;
    btnSound.classList.toggle('off', PREF.muted);
  },
  // The control follows PREF, never the other way round, so a restart redraws it at the level the human left it.
  musicSlider() {
    const want = String(Math.round(PREF.musicVol * 100));
    if (volMusic.value !== want) volMusic.value = want;
  },
  // Everything that floats over the canvas, off for the duration of a cutscene and back afterwards. onMode() owns
  // these the rest of the time, and it runs on the mode change that follows a finisher, so nothing stays hidden.
  // Guarded per element rather than on a "was I hidden" flag: reset() calls onMode(), which un-hides them, and a
  // restart can happen from inside a finisher. A single latch goes stale there and the controls stay on screen.
  cutscene(on) {
    if (on) {
      if (!btnPause.hidden) btnPause.hidden = true;
      if (!btnSound.hidden) btnSound.hidden = true;
      if (!musicBox.hidden) musicBox.hidden = true;
    } else if (this.wasCutscene) {
      btnSound.hidden = false;

    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) / Q));
    const s = Math.max(Q, Math.round(th / Q) * Q);
    for (let i = 0; i <= n; i++) {
      const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
      cg.fillRect(Math.round((x - s / 2) / Q) * Q, Math.round((y - s / 2) / Q) * Q, s, s);
    }
  }
  // Five eyes that do not agree. Each has its own cycle count and its own idea of where the interesting thing is, so
  // they are never all on Bud at once, and at least one always has a lid half down.
  const EYES = [
    { x: 320, y: 150, r: 34, cyc: 6, cyc2: 11, bcyc: 5, ph: 0.00, lid: 0.00, stalk: null },
    { x: 205, y: 118, r: 22, cyc: 13, cyc2: 7, bcyc: 12, ph: 0.31, lid: 0.45, stalk: [232, 178] },
    { x: 452, y: 96, r: 18, cyc: 9, cyc2: 17, bcyc: 8, ph: 0.62, lid: 0.10, stalk: [418, 168] },
    { x: 386, y: 212, r: 10, cyc: 21, cyc2: 4, bcyc: 19, ph: 0.17, lid: 0.00, stalk: null },
    { x: 410, y: 228, r: 8, cyc: 16, cyc2: 25, bcyc: 23, ph: 0.83, lid: 0.00, stalk: null },
  ];
  function drawEye(e, t) {
    const gx = Math.cos(TAU * (phase(t, e.cyc) + e.ph)) * e.r * 0.34;
    const gy = Math.sin(TAU * (phase(t, e.cyc2) + e.ph)) * e.r * 0.22;
    const blink = saw(t + Math.round(e.ph * 400), e.bcyc) < 0.035;
    if (e.stalk) {
      qbar(e.stalk[0], e.stalk[1], e.x, e.y + e.r * 0.4, Math.max(6, e.r * 0.5), CK.shade);
      qbar(e.stalk[0], e.stalk[1], e.x, e.y + e.r * 0.4, Math.max(4, e.r * 0.3), CK.base);
    }
    qell(e.x, e.y, e.r, e.r * 0.92, CK.deep);
    if (blink) {
      qell(e.x, e.y, e.r - Q, e.r * 0.9 - Q, CK.base);
      qbar(e.x - e.r, e.y, e.x + e.r, e.y, Q * 2, CK.shade);
      return;
    }
    qell(e.x, e.y, e.r - Q, e.r * 0.9 - Q, CK.eyeWhite);
    for (let i = 0; i < 4; i++) {                                   // the sclera of something that has not slept
      const a = hsh(e.x, i) * TAU, l = e.r * (0.45 + hsh(i, e.y) * 0.5);
      qbar(e.x + Math.cos(a) * e.r * 0.3, e.y + Math.sin(a) * e.r * 0.25, e.x + Math.cos(a) * l, e.y + Math.sin(a) * l * 0.8, Q, CK.eyeVein);
    }
    qell(e.x + gx, e.y + gy, e.r * 0.5, e.r * 0.5, CK.eyeIris);
    qell(e.x + gx, e.y + gy, e.r * 0.22, e.r * 0.22, CK.eyePupil);
    qr(e.x + gx - e.r * 0.34, e.y + gy - e.r * 0.34, e.r * 0.2, e.r * 0.18, CK.slick);
    if (e.lid > 0) qell(e.x, e.y - e.r * (1 - e.lid), e.r, e.r * 0.9, CK.base);   // permanently unimpressed
  }
  // A wide horizontal slot low on the mass. open is 0..1 and comes straight off the voice's syllable schedule, so the
  // jaw and the wah are literally the same number.
  function drawMouth(open, t) {
    const cx = 322, cy = 268, half = 116;
    const gap = Math.round((3 + open * 46) / Q) * Q;
    qell(cx, cy, half, 16 + gap * 0.5, CK.shade);
    qell(cx, cy, half - 6, Math.max(Q, gap * 0.5), CK.gum);
    if (gap > 10) {
      qell(cx, cy + gap * 0.22, half - 18, gap * 0.26, CK.tongue);
      for (let i = 0; i < 7; i++) {                                 // teeth at irregular intervals
        const tx = cx - half + 22 + i * 30 + (hsh(i, 3) - 0.5) * 8;
        qr(tx, cy - gap * 0.5, 8, 6 + hsh(i, 9) * 8, CK.tooth);
        qr(tx, cy + gap * 0.5 - (5 + hsh(i, 11) * 6), 8, 5 + hsh(i, 11) * 6, CK.tooth);
      }
    }
    qbar(cx - half, cy - 18, cx + half, cy - 18, Q * 2, CK.lit);    // the upper lip catches the pass light
    const dy = saw(t, 6);                                           // a bead that hangs and never quite falls
    qr(cx + half - 14, cy + 12 + dy * 26, 6, 8 + dy * 6, CK.grease);
  }
  // Four arms, four jobs, none of them getting his attention. Two hands stay in frame doing things food should not
  // have had done to it; two leave the frame entirely, still working.
  function drawArms(t, back) {
    const sw = osc(t, 63) * 16, sw2 = oscc(t, 92) * 12, sw3 = osc(t, 41) * 9;
    const limb = (x0, y0, x1, y1, x2, y2, th) => {
      qbar(x0, y0, x1, y1, th + Q * 2, CK.shade); qbar(x1, y1, x2, y2, th, CK.shade);
      qbar(x0, y0, x1, y1, th - Q, CK.base); qbar(x1, y1, x2, y2, th - Q * 2, CK.base);
      qbar(x0, y0 - th * 0.3, x1, y1 - th * 0.3, Q * 2, CK.lit);
    };
    if (back) {
      limb(500, 250, 596, 200 + sw3, 660, 168 + sw3, 26);           // off the right edge, holding something still arguing
      limb(150, 300, 70, 330 + sw2 * 0.4, 8, 356, 24);              // off the bottom left, wiping on the apron
      return;
    }
    const sx = 96 + sw;                                             // the spatula, scraping a grill never once scraped clean
    limb(196, 258, 118, 236, sx, 214 + sw * 0.3, 28);
    qbar(sx - 6, 212 + sw * 0.3, sx - 52, 206 + sw * 0.3, 8, CK.metal);
    qr(sx - 74, 196 + sw * 0.3, 26, 16, CK.metalHi);
    const lp = saw(t, 4);                                           // the ladle: stir, lift, taste, and back in the pot
    const lift = lp > 0.45 && lp < 0.78 ? Math.sin((lp - 0.45) / 0.33 * Math.PI) : 0;
    const lx = 520 + oscc(t, 109) * 14 - lift * 90, ly = 330 - lift * 120;
    limb(474, 300, 512, 322, lx, ly, 26);
    qbar(lx, ly, lx + 10, ly + 34, 8, CK.metal);
    qell(lx + 12, ly + 44, 18, 12, CK.metalHi);
    qell(lx + 12, ly + 40, 14, 8, '#6a5a2c');
  }
  // The kitchen behind him: dark, hot, and on fire in one corner he never looks at. Drawn first, so he occludes it.
  function drawKitchen(t) {
    cg.fillStyle = CK.kitchen; cg.fillRect(0, 0, 640, 360);
    for (let i = 0; i < 90; i++) {
      const x = Math.floor(hsh(i, 1) * 40) * 16, y = Math.floor(hsh(i, 2) * 23) * 16;
      qr(x, y, 16, 16, hsh(i, 3) > 0.7 ? CK.kitchenLit : CK.kitchen);
    }
    for (let i = 0; i < 14; i++) {                                  // grease running down the wall
      const x = 20 + i * 44 + hsh(i, 7) * 10, h = 40 + hsh(i, 8) * 160;
      qr(x, 0, 4, h, 'rgba(120,104,50,0.45)');
      qr(x - 2, h - 6, 8, 10, 'rgba(150,130,64,0.5)');
    }
    const fk = Math.floor(saw(t, 50) * 24);                         // the burner he is ignoring
    qr(556, 60, 76, 18, '#2a2622');
    for (let i = 0; i < 9; i++) {
      const fx = 560 + i * 8, fh = 20 + osc(t, 64) * 10 * Math.cos(i) + hsh(i, fk) * 22;
      qr(fx, 60 - fh, 8, fh, i % 3 ? CK.fire : CK.ember);
    }
    qr(548, 0, 96, 46, 'rgba(23,19,25,' + (0.5 + saw(t, 50) * 0.2).toFixed(3) + ')');
    qr(0, 26, 200, 6, CK.metal);                                    // the ticket rail: orders he has not started
    for (let i = 0; i < 6; i++) qr(14 + i * 30, 26, 22, 26 + hsh(i, 5) * 10, i === 2 ? '#c8bc9a' : '#e4dcc0');
  }
  // Steam: cheap, warm, and always between the player and the cook.
  function drawSteam(t, alpha) {
    for (let i = 0; i < 26; i++) {
      const seed = i * 13, cyc = 3 + (i % 6);
      const life = (saw(t, cyc) + hsh(seed, 2)) % 1;
      const x = 40 + hsh(seed, 3) * 560 + Math.sin(life * 6 + i) * 26;
      const y = 360 - life * 380;
      const r = (6 + hsh(seed, 4) * 16) * (0.4 + life);
      cg.fillStyle = 'rgba(207,216,208,' + (alpha * (1 - life) * 0.5).toFixed(3) + ')';
      cg.fillRect(Math.round(x - r), Math.round(y - r * 0.6), Math.round(r * 2), Math.round(r * 1.2));
    }
  }
  /* One full render into COOK. mouthOpen 0..1 drives the jaw. Pure in (t, mouthOpen, layer).

     layer is 'full' (the default, and exactly what this function did before: kitchen, creature, steam, tints — the
     close-up the conversation uses), 'kitchen' (the room without him) or 'figure' (him alone on transparent, then
     flattened to one flat grey). The two halves exist for the hatch: the silhouette treatment has to slide him
     sideways out of the window without taking the kitchen with him, so the two cannot be one picture. 'full' runs
     the identical sequence of calls it always did. */
  /* The silhouette's one colour, and the reason it is this one. The first value tried, #43434c, measured at luma 61.5
     against a kitchen of about 49 — he was LIGHTER than the room behind him, which is not a silhouette, it is a
     ghost, and it made the hatch the brightest thing in the upper band. This is a neutral dark grey that sits under
     the kitchen rather than over it, so he reads as a shape blocking the light, and a long way under the 54-70 the
     floor tiles run at. audit() measures both numbers and fails if he climbs back above the floor. */
  const SIL_GREY = '#2e2d33';
  function renderCook(t, mouthOpen, layer) {
    layer = layer || 'full';
    if (!HAT) {                                                     // data that did not validate is never drawn
      cg.fillStyle = '#200c0c'; cg.fillRect(0, 0, 640, 360);
      return;
    }
    if (layer === 'figure') cg.clearRect(0, 0, 640, 360); else drawKitchen(t);
    if (layer === 'kitchen') { drawSteam(t, 1); kitchenTints(); return; }
    drawArms(t, true);
    const bob = osc(t, 32) * 4, lean = oscc(t, 23) * 6;
    cg.save();
    cg.translate(Math.round(lean / Q) * Q, Math.round(bob / Q) * Q);
    qell(320, 420, 330, 150, CK.shade);                             // shoulders: a slab wider than the screen
    qell(320, 416, 322, 142, CK.base);
    qell(320, 470, 280, 120, CK.apron);                             // an apron stained by a career
    qr(120, 330, 400, 12, CK.apronShade);
    qell(240, 356, 34, 18, CK.stainB);
    qell(392, 344, 26, 14, CK.stainA);
    qell(310, 352, 18, 10, CK.stainC);
    qell(320, 180, 188, 148, CK.shade);                             // the head mass
    qell(320, 176, 180, 140, CK.base);
    qell(300, 132, 150, 92, CK.lit);
    qell(292, 104, 104, 54, CK.hi);
    qell(252, 92, 42, 18, CK.wet);                                  // slick: he is never dry
    qr(236, 84, 30, 6, CK.slick);
    qell(420, 140, 26, 12, CK.wet);
    for (let i = 0; i < 44; i++) {                                  // pores and warts, stable frame to frame
      const a = hsh(i, 21) * TAU, d = Math.sqrt(hsh(i, 22)) * 160;
      qr(320 + Math.cos(a) * d, 176 + Math.sin(a) * d * 0.78, 4 + hsh(i, 23) * 6, 4 + hsh(i, 24) * 4, hsh(i, 25) > 0.55 ? CK.shade : CK.deep);
    }
    for (const e of EYES) drawEye(e, t);
    drawMouth(mouthOpen, t);
    const cw = (osc(t, 171) * 0.5 + 0.5) * 10;                      // a second mouth on the jaw, chewing, never mentioned
    qell(500, 288, 30, 16 + cw, CK.shade);
    qell(500, 288, 24, Math.max(Q, cw), CK.gum);
    blitGrid(cg, HAT, 260, -6, 4, HAT_PAL);                         // the hat, absurdly, still on top, and still clipped
    cg.restore();
    drawArms(t, false);
    for (let i = 0; i < 5; i++) {                                   // five gnats, orbiting, permanent
      const a = TAU * phase(t, 80 - i * 9) + i * 1.3;
      qr(320 + Math.cos(a) * (150 + i * 18), 120 + Math.sin(a * 1.6) * (52 + i * 9), 4, 4, '#14110e');
    }
    if (layer === 'figure') {
      // Flatten him: every pixel that is his becomes one grey, and everything he is not stays transparent. No eyes,
      // no hat stain, no wet highlight — a shape that bobs and stirs, and nothing for the eye to read.
      cg.globalCompositeOperation = 'source-in';
      cg.fillStyle = SIL_GREY;
      cg.fillRect(0, 0, 640, 360);
      cg.globalCompositeOperation = 'source-over';
      return;
    }
    drawSteam(t, 1);
    kitchenTints();
  }
  function kitchenTints() {
    cg.fillStyle = 'rgba(255,195,77,0.10)'; cg.fillRect(0, 0, 640, 200);   // sodium spill from the diner side
    cg.fillStyle = 'rgba(10,8,14,0.34)'; cg.fillRect(0, 300, 640, 60);
  }

  /* ---- the hatch loop ----
     While he is working rather than talking the jaw still moves, because he is complaining to nobody in particular. */
  const idleMouth = t => Math.max(0, osc(t, 52) * 0.5 + osc(t, 164) * 0.2) * 0.35;
  /* How far back he sits. intro_006 shipped 0.34 dim and 0.16 sodium, which measured a mean luma of 92 in the hatch —
     brighter than every floor tile in the room and the most salient thing on the screen after the HUD. He was reading
     as a pale panel, not as a kitchen behind glass. Raising the dim and dropping the sodium takes him under the floor
     (tiles are 54-70) and well under the flat yellow square he replaced (199.5), which is what "further back" means
     here. The dither is the last 15%: every other row darkened, so there is visibly something between him and the
     player. Both numbers are shared with the scene's haze match, or the push-in opens with a pop. */
  const HAZE_DIM = 0.46, HAZE_SODIUM = 0.08, HAZE_DITHER = 0.22;
  // Compose the 116x52 hazed frame for loop time t into HAZE.
  function composeHaze(t) {
    renderCook(t, idleMouth(t));
    hz.imageSmoothingEnabled = true;
    hz.globalAlpha = 1;
    hz.fillStyle = CK.kitchen; hz.fillRect(0, 0, 116, 52);          // opaque base, so no soft alpha at the edges
    hz.drawImage(COOK, SRC_HATCH.x, SRC_HATCH.y, SRC_HATCH.w, SRC_HATCH.h, 0, 0, 116, 52);
    hz.globalAlpha = 0.35;                                          // one more step of blur
    hz.drawImage(HAZE, -1, 0); hz.drawImage(HAZE, 1, 0); hz.drawImage(HAZE, 0, -1);
    hz.globalAlpha = 1;
    hz.fillStyle = 'rgba(34,30,38,' + HAZE_DIM + ')'; hz.fillRect(0, 0, 116, 52);        // toward wallUpper
    hz.fillStyle = 'rgba(255,195,77,' + HAZE_SODIUM + ')'; hz.fillRect(0, 0, 116, 52);   // sodium on the glass
    hz.fillStyle = 'rgba(255,220,150,0.07)'; hz.fillRect(0, 0, 116, 10);                 // the hatch lip catching light
    hz.fillStyle = 'rgba(12,10,16,' + HAZE_DITHER + ')';                                 // the dither: a screen, not a window
    for (let y = 0; y < 52; y += 2) hz.fillRect(0, y, 116, 1);
  }
  /* ---- the silhouette treatment ----
     What the hatch wears for the whole shift, and from the very first frame of the opening. Two differences from the
     close-up composition above, and they are the only two:

       1. He is drawn at SIL_SCALE of the aperture rather than filling it, bottom-anchored and centred, so there is
          kitchen above and beside him. That is the "further away" the size change is for.
       2. He is one flat grey (renderCook's 'figure' layer), not a lit creature. No eyes, no highlights, nothing that
          reads as a face at 116x52 next to a customer silhouette that the player has to identify at a glance.

     Kept as TWO cached layers rather than one picture, because he has to be able to walk out of the window without
     the kitchen walking with him. Both layers are still a pure function of tick % PERIOD, so the cache still holds. */
  const SIL_SCALE = 0.67;                                            // 33% smaller than the close-up treatment
  const SIL_W = Math.round(116 * SIL_SCALE), SIL_H = Math.round(52 * SIL_SCALE);
  const SIL_X = Math.round((116 - SIL_W) / 2), SIL_Y = 52 - SIL_H;   // bottom-anchored: he stands on the hatch sill
  /* The bob, and why it is here rather than in the creature. renderCook already bobs him — osc(t, 32) * 4 on a 640 px
     buffer — but 4 px of a 640 px buffer mapped into a 78 px figure is 0.49 px, which rounds to nothing. At hatch
     scale he was perfectly still. This is the same motion expressed in the units the hatch is actually drawn in:
     0-2 px, upward only so his feet never leave the bottom of the aperture, on a seven-cycle oscillator — one rise
     and settle every 2.9 s. Integer cycles per PERIOD, so the cached loop is still seamless. */
  const silBob = t => Math.round((osc(t, 7) * 0.5 + 0.5) * 2);
  const BACK = mkCanvas(116, 52), bk = BACK.getContext('2d');
  const FIG = mkCanvas(116, 52), fk = FIG.getContext('2d');
  // The kitchen alone, hazed exactly as composeHaze hazes the whole picture — same blur, dim, sodium, lip and dither,
  // so the two treatments sit at the same distance and the cross-fade between them is a dissolve, not a move.
  function composeBack(t) {
    renderCook(t, 0, 'kitchen');
    bk.imageSmoothingEnabled = true;
    bk.globalAlpha = 1;
    bk.fillStyle = CK.kitchen; bk.fillRect(0, 0, 116, 52);
    bk.drawImage(COOK, SRC_HATCH.x, SRC_HATCH.y, SRC_HATCH.w, SRC_HATCH.h, 0, 0, 116, 52);
    bk.globalAlpha = 0.35;
    bk.drawImage(BACK, -1, 0); bk.drawImage(BACK, 1, 0); bk.drawImage(BACK, 0, -1);
    bk.globalAlpha = 1;
    bk.fillStyle = 'rgba(34,30,38,' + HAZE_DIM + ')'; bk.fillRect(0, 0, 116, 52);
    bk.fillStyle = 'rgba(255,195,77,' + HAZE_SODIUM + ')'; bk.fillRect(0, 0, 116, 52);
    bk.fillStyle = 'rgba(255,220,150,0.07)'; bk.fillRect(0, 0, 116, 10);
    bk.fillStyle = 'rgba(12,10,16,' + HAZE_DITHER + ')';

  // Him alone, on transparent, scaled down and dithered on the same rows as the background. source-atop rather than a
  // plain fill, so the dither darkens his pixels and leaves the space around him transparent — otherwise sliding him
  // sideways would drag a 116x52 box of dark stripes across the kitchen.
  function composeFig(t) {
    renderCook(t, idleMouth(t), 'figure');
    fk.globalCompositeOperation = 'source-over';
    fk.clearRect(0, 0, 116, 52);
    fk.imageSmoothingEnabled = true;
    fk.globalAlpha = 1;
    fk.drawImage(COOK, SRC_HATCH.x, SRC_HATCH.y, SRC_HATCH.w, SRC_HATCH.h, SIL_X, SIL_Y - silBob(t), SIL_W, SIL_H);
    fk.globalCompositeOperation = 'source-atop';
    fk.fillStyle = 'rgba(12,10,16,' + HAZE_DITHER + ')';

    fk.globalCompositeOperation = 'source-over';
  }
  // 1200 / 4 = 300 slots. 4 divides the period, so the cached loop is still seamless; at 1/5 scale his motion is small
  // enough that 15 Hz reads as continuous. Built on demand: the first twenty seconds of a shift pay for the cook, the
  // rest of it pays for one blit.
  //
  // Three caches now, and only two of them are ever filled in a normal shift. `cache` is the close-up treatment, and
  // it is only ever asked for during the two seconds of cross-fade that follow the conversation — thirty slots, once
  // a page load. `backCache` and `figCache` are the silhouette, and they are what the shift runs on.
  const CACHE_STEP = 4, CACHE_SLOTS = PERIOD / CACHE_STEP;
  const cache = new Array(CACHE_SLOTS).fill(null);
  const backCache = new Array(CACHE_SLOTS).fill(null);
  const figCache = new Array(CACHE_SLOTS).fill(null);
  let cacheBuilt = 0, closeUpBuilt = 0;
  const slotOf = tick => Math.floor((((tick % PERIOD) + PERIOD) % PERIOD) / CACHE_STEP);
  function cached(store, slot, compose, src, alpha) {
    let c = store[slot];
    if (c) return c;
    compose(slot * CACHE_STEP);
    c = mkCanvas(116, 52);
    const x = c.getContext('2d');
    if (alpha) x.clearRect(0, 0, 116, 52);
    x.drawImage(src, 0, 0);
    store[slot] = c;
    return c;
  }
  // cacheBuilt counts the slots the SHIFT has paid for, which since game_016 means the silhouette pair rather than
  // the close-up. closeUpBuilt counts the other one, which only the cross-fade ever asks for.
  function hazeFrame(tick) { const s = slotOf(tick); if (!cache[s]) closeUpBuilt++; return cached(cache, s, composeHaze, HAZE, false); }
  function backFrame(tick) { const s = slotOf(tick); if (!backCache[s]) cacheBuilt++; return cached(backCache, s, composeBack, BACK, false); }
  function figFrame(tick) { return cached(figCache, slotOf(tick), composeFig, FIG, true); }

  /* ---- he steps away from the pass ----
     Occasionally he walks fully out of the window, sometimes to the right and sometimes to the left, and comes back.
     A pure function of (seed, tick): the shift is cut into windows of SEG ticks, each window is asked (by a hash of
     the seed and the window number) whether it has an excursion in it at all, and if it does, when it starts, which
     way he goes and how long he stays away. Nothing is stored and no RNG is consumed, so the render can call it at
     any time in any order and a seeded repeat draws the same hatch. Because the segments are only sometimes used and
     the offsets inside them move, there is no beat to it — it does not read as a loop.

     Returns px to slide the figure by. Anything past +/-116 is fully out of the aperture. */
  const SEG = 1080, LEAVE_P = 0.62, OUT_TICKS = 34, STAY_MIN = 80, STAY_MAX = 300, OUT_PX = 132;
  function hatchShift(seed, tick) {
    if (tick < 0) return 0;
    // hsh() multiplies its arguments by nine-digit constants, so a full 32-bit seed would run past 2^53 and lose the
    // low bits that make one seed differ from the next. Folded to 16 bits first: still 65,536 distinct schedules, and
    // every product stays exact.
    const s = (seed >>> 0) & 0xffff, seg = Math.floor(tick / SEG);
    if (hsh(s + 0x1a3, seg) > LEAVE_P) return 0;                     // this window: he stays put
    const stay = STAY_MIN + Math.floor(hsh(s + 0x2b7, seg) * (STAY_MAX - STAY_MIN));
    const total = OUT_TICKS * 2 + stay;
    const start = Math.floor(hsh(s + 0x3c9, seg) * Math.max(1, SEG - total - 30));
    const k = tick - seg * SEG - start;
    if (k < 0 || k >= total) return 0;
    const dir = hsh(s + 0x4d1, seg) < 0.5 ? -1 : 1;                  // out to the left, or out to the right
    const u = k < OUT_TICKS ? k / OUT_TICKS
      : k < OUT_TICKS + stay ? 1
        : 1 - (k - OUT_TICKS - stay) / OUT_TICKS;
    return dir * Math.round(easeInOut(u) * OUT_PX);                   // OUT_PX > 116: fully out, with margin
  }

  /* ---- what the pass window draws ----

  const LINES = [

  /* ---- the scene ----

     ESC takes the whole scene away; any other key finishes the line being said and a second press moves on. That is

  }

  function drawBubble(L, shown, tick) {
    const rows = L.rows;
    const cols = rows.reduce((m, r) => Math.max(m, r.length), 0);
    const bw = cols * 6 + 14, bh = rows.length * 10 + 12;
    const bx = 26, by = H - 26 - bh;

      const take = Math.max(0, Math.min(rows[r].length, left));
      if (take > 0) drawText(rows[r].slice(0, take), bx + 7, by + 7 + r * 10, '#16161e', 1);
      left -= rows[r].length;

      let acc = 0, r = 0;

    const sw = lerp(SRC_HATCH.w, SRC_CLOSE.w, k), sh = lerp(SRC_HATCH.h, SRC_CLOSE.h, k);

    rect(0, H - 30, W, 30, 'rgba(6,5,9,0.30)');

    if (SC.phase === 'talk') {

      if (tick % 150 < 80) drawText('ANY KEY: FINISH LINE    ESC: SKIP', 320, H - 12, 'rgba(160,160,176,0.5)', 1, 'center');
    }

  /* ---- the audit ----

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bud</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden; }
  #wrap { position: absolute; }
  #cv { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges;
        /* Without these a thumbstick drag scrolls the page, a double tap zooms it, and a long press raises the
           selection callout over the action pad. None of them costs the mouse anything. */
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; }
  /* MOBILE enlarges the four DOM controls that float over the canvas. In DESKTOP #ui's em is 9 x the canvas scale,
     which is right for a mouse and much too small for a thumb; a phone in landscape runs at scale 1, where PAUSE
     would be about 40 x 20 CSS px. These rules need two ids to beat the per-button sizes set above. */
  #ui.touch { font-size: 13px; }
  #ui.touch button { padding: 0.55em 1em; border-width: 0.12em; }
  #ui.touch #btnSound { font-size: 1em; padding: 0.45em 0.8em; }
  #ui.touch #btnRestart { font-size: 1.5em; }
  #ui.touch #music { width: 16%; }
  #ui.touch #music input { height: 2.2em; }
  #ui { font-size: 10px; }
  #ui button { position: absolute; z-index: 2; font: bold 1em monospace; color: #f4f0e0; background: #2a2632;
               border: 0.15em solid #8a8070; padding: 0.2em 0.6em; cursor: pointer; }
  #btnPause { top: 0.5em; right: 0.5em; }
  #btnRestart { left: 50%; top: 78%; transform: translateX(-50%); font-size: 1.3em; }
  #ui #btnSound { top: 3.1em; left: 0.5em; font-size: 0.8em; padding: 0.15em 0.3em; }
  #ui #btnSound.off { color: #ff9070; border-color: #8a4a3a; }
  #ui #btnSound.ending { top: 86.5%; }
  #ui #btnSound.lab { top: auto; bottom: 0.5em; left: auto; right: 0.5em; }
  #ui #btnSound.title { top: auto; bottom: 0.5em; } /* clear of the S of SPACE, which starts at y 20 */
  #ui #btnSound.help { top: auto; bottom: 0.5em; left: auto; right: 0.5em; } /* clear of the key row along the bottom */
  /* The INSTRUCTIONS button is drawn on the canvas as part of the title composition. This one is transparent and sits
     exactly on top of it, so it is a real button — clickable, focusable, reachable by keyboard and by a test harness —
     without putting a second typeface on the title screen. Its box is set from HELP_BTN at boot, never typed here, so
     the drawn button and the hit area cannot drift apart. */
  /* The three difficulty segments are the same idea: transparent buttons sitting exactly on the segments the title
     draws, boxed from DIFF_SEG at boot. They are tabindex="-1" — the keyboard reaches the control with LEFT and
     RIGHT instead, and a focusable button under the player's thumb is how SPACE stops meaning START. */
  #ui #btnHelp, #ui .diffseg { padding: 0; border: 0; background: none; color: transparent; font-size: 1px; }
  #ui.touch #btnHelp, #ui.touch .diffseg { padding: 0; font-size: 1px; }
  /* The music slider, in the top-left column directly under the SOUND button, which is the other audio control and
     the one place in the top band that is actually empty. THE MIDDLE OF THE TOP BAND IS NOT EMPTY: the HUD leaves a
     gap between the health meter (ends at x 246) and the TRAY label (starts at x 404), but the ROOM fills it — the
     pass window frame is at x 244-368, y 10-68, with the cook working inside it. A slider there sits on his face.
     What is free is x 2-48, y 36-70: right of nothing, left of the ORDER station (starts at x 50), below the SOUND
     button (ends at y 35), above the wall band (starts at y 70). Position is a percentage of the canvas box; the
     control's own size is in em against #ui's font-size, which is 9 x the canvas scale, so it scales with the game. */
  #ui #music { position: absolute; z-index: 2; left: 0.31%; top: 13.05%; width: 7.19%; }
  /* font: inherit matters. A form control does not inherit the page's font in Chromium — it gets 13.333px Arial
     from the UA stylesheet — so an em inside it would not be #ui's em, and the control would not scale with the
     canvas. Width is a percentage of the canvas box: 22.5% of 640 is 144 px, x 252 to x 396, which is the gap
     between the health meter (ends at 246) and the TRAY label (starts at 404). */
  #ui #music input { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 1.15em;
                     font: inherit; margin: 0; padding: 0; background: none; cursor: pointer; }
  #ui #music input:focus { outline: none; }
  #ui #music input::-webkit-slider-runnable-track { height: 0.45em; background: #17161d; border: 0.11em solid #4a4653; }
  /* The thumb is the SOUND button's own border colour, so the two audio controls read as one pair rather than as a
     button and a stray line. Loud enough to find, quiet enough not to compete with the health meter beside it. */
  #ui #music input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 0.55em; height: 1.05em;
                     margin-top: -0.35em; background: #8a8070; border: 0; }
  #ui #music input::-moz-range-track { height: 0.45em; background: #17161d; border: 0.11em solid #4a4653; }
  #ui #music input::-moz-range-thumb { width: 0.55em; height: 1.05em; border-radius: 0; background: #8a8070; border: 0; }
  /* THE ROTATE PROMPT. The canvas is 640x360, a fixed 16:9. Held upright a phone is about 390x750, so the game
     would draw into a 390x219 band with two thirds of the screen black and Bud nine pixels tall. Rather than let
     someone conclude the game is broken, MOBILE mode covers a portrait viewport with this and says what to do.
     It is a DOM overlay rather than a canvas screen because it has to cover the letterbox as well as the canvas. */
  #rotate { position: fixed; inset: 0; z-index: 9; background: #07090c; color: #c8b7a6;
            font: bold 4.2vw/1.6 monospace; text-align: center; letter-spacing: 0.08em;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6vh; }
  #rotate b { color: #ff8f3c; font-size: 1.35em; letter-spacing: 0.1em; }
  #rotate small { font-size: 0.72em; color: #5d6b7a; letter-spacing: 0.06em; }
  /* The phone that turns. Two nested boxes and a corner mark, rotating a quarter turn and back, so the instruction
     is a picture as well as a sentence. No image file: this is CSS on two empty divs. */
  #rotate .ph { width: 17vw; height: 30vw; border: 0.9vw solid #8a8070; border-radius: 1.6vw; position: relative;
                animation: turn 2.6s ease-in-out infinite; }
  #rotate .ph i { position: absolute; left: 50%; bottom: 1.2vw; width: 5vw; height: 0.7vw; margin-left: -2.5vw;
                  background: #8a8070; border-radius: 0.4vw; }
  @keyframes turn { 0%,28% { transform: rotate(0deg); } 58%,100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .ph { animation: none; transform: rotate(-90deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="640" height="360"></canvas>
  <div id="ui">
    <button id="btnSound">SOUND ON</button>
    <button id="btnPause" hidden>PAUSE</button>
    <button id="btnRestart" hidden>RESTART</button>
    <button id="btnHelp" hidden>INSTRUCTIONS</button>
    <button id="btnD0" class="diffseg" tabindex="-1" hidden>EASY</button>
    <button id="btnD1" class="diffseg" tabindex="-1" hidden>MEDIUM</button>
    <button id="btnD2" class="diffseg" tabindex="-1" hidden>HARD</button>
    <button id="btnV0" class="diffseg" tabindex="-1" hidden>MOBILE</button>
    <button id="btnV1" class="diffseg" tabindex="-1" hidden>DESKTOP</button>
    <button id="btnStart" class="diffseg" tabindex="-1" hidden>START YOUR SHIFT</button>
    <div id="music" hidden><input id="volMusic" type="range" min="0" max="100" step="5" value="100" tabindex="-1" title="Music volume" aria-label="Music volume"></div>
  </div>
</div>
<div id="rotate" hidden>
  <div class="ph"><i></i></div>
  <div>TURN YOUR DEVICE<br><b>SIDEWAYS</b></div>
  <small>OR SWITCH TO DESKTOP CONTROLS ON THE TITLE</small>
</div>
<script>
'use strict';
// game_017 — game_016 with DIFFICULTY LEVELS. One change, and it is one line of simulation.
//   - THREE LEVELS, chosen on the title screen before a shift starts: EASY (the default, and exactly the game
//     game_016 shipped), MEDIUM (customers arrive at 2x the pace) and HARD (3x). The ONLY thing a level changes is
//     the interval updateSpawner waits between parties: it divides what CFG.spawnCurve yields by the level's
//     `pace`. Nothing else in the file reads `pace`, and the difficulty audit proves that mechanically by counting
//     the reads inside the SIM markers. Easy is `pace: 1` and x / 1 is bit-identical to x, so an easy shift is
//     game_016's shift, tick for tick, from the same seed.
//   - WHAT DELIBERATELY DOES NOT SCALE: the section-opening schedule, the solo phase, the pair percentages,
//     patience, the cook delay, health, every combat number and the ten-minute cap. Those are the SHAPE of a
//     shift; compressing them would make a different game rather than a busier one. THE FARES DO NOT MOVE EITHER
//     — more customers means more tips, so a good player reaches first class faster on hard, which is what makes
//     hard worth choosing at all. At 3x, arrivals outrun what one waiter can serve: heavy walkouts, many more
//     fights, and many more deaths. That is the intent, not a tuning error.
//   - THE TITLE SCREEN. INSTRUCTIONS moved to the left and the selector sits at the same height on the right, the
//     same width, their outer edges flush with the PRESS SPACE line above them. The selected level is a solid
//     block of the title's orange with near-black text — inverted rather than tinted, so it survives a glance.
//     LEFT/RIGHT (or A/D) move it; the three transparent segment buttons pick one outright. Neither path touches
//     SPACE, and the segments are tabindex="-1" and blurred on click, so SPACE afterwards still starts the shift.
//   - PERSISTENCE. `diffIdx` is module state that reset() does not touch, so the choice survives every restart in
//     the session; reset() copies it into sim.difficulty, so a shift carries its own level and a snapshot fully
//     determines it. The epilogue opens its money sentence with the level — ON HARD, HE COLLECTED $302.
//
// game_016 — game_015 with the new opening (Bud walks in, two split-flap cards, a prompt that does not time out,
// and the cook conversation reached by walking to the pass) and the pass-window cook as a dark grey silhouette who
// steps out of the window now and then. Nothing about the shift changed. See README.md.
//
// game_015 — game_014 with the finishers, the music and a music slider. Three changes; nothing else on the floor moved.
//   - THE FINISHERS. combat\finish_003.html's drop-in block is pasted in whole, between FINISHERS - THE DROP-IN BLOCK
//     and END OF DROP-IN, and is the lab's code rather than a second implementation of it. When a blow takes Bud to
//     zero, budHit() no longer calls killBud() on the same tick: it calls startFinisher(), which owns Bud and the
//     attacker for 190-240 ticks of scripted scene and then calls the same killBud() with the same cause object, so
//     the species the scene acted out is the species the epilogue names. Twenty authored scenes, one per species,
//     plus FIN_GENERIC for any species that has none. Any key skips, and a skip jumps to the last tick of the final
//     beat rather than cancelling, so a skipped finisher leaves exactly the state a watched one does.
//     THE SIMULATION CLOCK IS FROZEN for the whole finisher, exactly as hit-stop freezes it, and those ticks are
//     counted into stats.frozenTicks (and separately into stats.finisherTicks). So a death costs the player none of
//     their shift, and the ten-minute cap can never fire in the middle of one and steal the death from the killer.
//   - THE MUSIC. music\music_003 "Bossa for an Empty Room" is folded in as the Music closure: the generator verbatim,
//     the page's review UI and its own transport dropped. It plays only while the shift is on the floor, runs on
//     Sound.ctx behind the same first-gesture unlock as everything else, and is routed through Sound.master so the
//     SOUND toggle silences it with the rest. It stops the moment a finisher starts, and on the epilogue and restart.
//   - THE MUSIC SLIDER. A small range control in the empty span of the HUD between the health meter and the tray,
//     on screen only while the music can play. Music only: it multiplies Music's own gain and touches nothing else.
//     PREF.musicVol survives restart. It takes no keyboard focus, so SPACE after using it still swings the tray.
//
// game_014 — game_013 with the cook. Two changes, both his; nothing else on the floor was touched.
//   - THE OPENING SCENE. intro\intro_006 is folded in as the scene the Intro hook was built for, so the sequence is
//     title -> instructions (optional) -> the cook shouts at Bud -> the shift. The camera pushes in through the pass
//     hatch, he says his five lines, the camera pulls back out, and only then does the ten-minute clock start. The
//     stand-in room intro_006 carried is gone: the scene recedes over the game's own floor, and the hatch it pushes
//     into is the same aperture the pass loop is already running in, so the push-in starts on the frame it left.
//     His voice is at full gain for the FIRST bubble and 50% for the other four. It plays once per page load: a
//     restart goes straight to the floor, no scene and no voice. ESC drops the whole scene; any other key finishes
//     the line being said.
//   - THE PASS WINDOW. It was a flat yellow square. It is now him, working, for every frame of the shift, hazy and
//     dimmed so he sits behind the hatch instead of on the dining floor. He is silent during the shift.
//   - Both come off ONE renderer (Cook.renderCook), so the creature in the hatch and the creature in the close-up are
//     the same creature at two distances rather than two drawings that can drift apart.
// game_013 — game_012 with the title and instructions screens from title_screen\title_005 integrated, and the hook the
// opening cook scene from intro\ drops into. The combat lab is this same file opened from combat\ (or with #lab).
//   - The title is two stroked words, SPACE over BUD, filled with a packed jumble of whole aliens with glasses and
//     plates wedged into the gaps; under them the tagline, the call to start, and an INSTRUCTIONS button. Nothing
//     else on it — no version, no requirement labels, no credits.
//   - Every sprite on it comes from Art and every number on the instructions from CFG and LAYOUT, so neither screen
//     can drift from the game it introduces. title_005 carried its own copy of art\ and its own typed-in fares; both
//     are gone.
//   - The instructions open over the title as a popup that wipes in from the left; any key closes them.
//   - The sequence is title -> instructions (optional) -> the opening cook scene -> the shift. No scene is integrated
//     yet, so Intro.scene is null and SPACE goes from the title straight to the floor. See Intro.
//   - Everything below this point is game_012 unchanged.
//   - The tray has three poses, drawn from one rig (budRig): EMPTY, tucked upright under his arm; LOADED, flat in both
//     hands in front of him with the food on it; COMBAT, both arms straight up holding it overhead. The pose changes
//     are animated: empty <-> loaded when the load changes (b.loadTick), up into combat from whichever pose he was in
//     (b.raise), and back down after a fight (b.lowerTick). Nothing conjures the tray or takes it away.
//   - Bud moves freely in a fight with the floor controls and always faces the alien. SPACE brings the tray down:
//     startup, active, then a long recovery in which he is slow and cannot swing again.
//   - The alien moves too, and attacks in four states: wind-up (its body telegraphs), active (the attack box is live,
//     and many species lunge), recovery (open to a counter) and cooldown. Reach, lunge, speed and timing are per species.
//   - Hits are boxes: the tray's box against the alien's body, the alien's attack box against Bud's. Distance decides.
//   - Every landed hit: a heavy thump, hit-stop (the whole simulation freezes a few ticks), knockback and stun.
//   - The alien's health is a segmented bar over its head. No timing panel, reach arc, prompts or window cue.

const VERSION = 'game_023';

/* ==== CONFIG ==== */
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'act', KeyP: 'pause', Escape: 'pause', KeyR: 'restart', KeyN: 'style', KeyM: 'mute', KeyI: 'help',
  KeyC: 'cycle', KeyH: 'heal', KeyT: 'slow', BracketLeft: 'prev', BracketRight: 'next', KeyB: 'boxes', // combat lab only
};
const CFG = Object.freeze({
  shiftSec: 600,
  /* THE DOORS OPEN THE MOMENT THE COOK STOPS TALKING. Both of these used to be a wait, and together they were
     seven seconds of empty diner straight after the one scene that tells you to get to work: three before the
     clock even started and four more before anyone came in. Nothing was drawn in either of them — the "shift is
     starting" cards they were written for moved into the opening, which now plays them while Bud walks in from
     the door, so what was left was dead air with nothing in it.
     Zero on both, so the first creature is coming through the door on the frame the close-up cuts away.
     firstArrivalSec keeps its division by the level's pace below: 0 over any pace is 0, so it is the same on
     every difficulty by construction, and the division stays because it is the contract that says this constant
     is one of the things a level is allowed to scale if it ever stops being zero. */
  introSec: 0, firstArrivalSec: 0,
  soloPhaseSec: 75, soloGapSec: 5, tableFreeDelaySec: 2,
  // The beat between Bud lifting a tray off the pass and the next creature coming through the door. Not zero: a
  // customer appearing on the same frame as the clink reads as a thing the game did TO you rather than a thing
  // that happened next. Under a second, so by the time the food is on the table they are nearly seated.
  soloReleaseSec: 0.6,
  // THE WAITING LINE, along the bottom wall. Slot 0 is nearest the door and the line runs left from it. y 326 is
  // below every table bay (they end at y 304) and below every seat stand (y 284), and the whole strip from x 20 to
  // x 620 is clear of fixtures, so the line is out of the play path: Bud never has business below y ~300.
  queueX: 556, queueY: 326, queueGap: 24,
  sectionOpenSec: Object.freeze([0, 120, 300]),
  spawnCurve: Object.freeze([[120, 26], [300, 18], [420, 14], [600, 14]]),
  pairCurve: Object.freeze([[180, 0], [300, 0.15], [420, 0.30], [600, 0.34]]),
  greetCurve: Object.freeze([[120, 35], [420, 18]]),
  foodCurve: Object.freeze([[120, 50], [420, 32]]),
  spawnJitter: 0.2,
  anger: Object.freeze([0.5, 0.25, 0.10]),
  cookSec: 10, eatSec: 8, cutSec: 0.4, leadInSec: 0.8, bubbleSec: 2.0,
  rehearWaitSec: 3.0, rehearPatienceCost: 0.25,
  tableViewMaxSec: 6.4,
  bannerSec: 2.0, brightenSec: 0.5, collectWarnSec: 60, lastMinuteSec: 60,
  budSpeed: 144, accelSec: 0.07, decelSec: 0.05, customerSpeed: 80, stepPx: 22,
  trayCapacity: 2, passCapacity: 4, reach: 16, drinks: 4, plates: 4, species: 20,
  tipBase: 5, tipSpeed: 15,
  // Fare thresholds on COLLECTED tips: steerage, economy, business, first class. game_012: first class 240 -> 220. Fights
  // in the shift cost time and knocked-out customers never tip; 220 puts the human-skill bot back at game_011's shares.
  tiers: Object.freeze([30, 100, 170, 220]),
  // Story beats crawl at this speed in the ticker style; every style holds a beat for the same time.
  beatPxPerSec: 92,
  // Combat. Health is a whole-shift budget: ten steps, never restored.
  //   engageDist: a charger this close (centre to centre) starts the fight. raiseTicks: the tray going up (no swing yet).
  //   Bud's swing: swingStartup, swingActive (the tray's box is live), swingRecovery (moves at recoveryMove of his speed,
  //   no swing). The tray's box runs from Bud's centre budReach px toward the alien, hitBandY px up and down the floor.
  //   Bodies are bodyHalfW (alien) and budHalfW (Bud) px each side of centre for hit tests.
  //   hitStopHit / hitStopHurt: the simulation freezes when Bud lands a hit / is hit. knock*: shove distance, eased
  //   over knockTicks. stunAlien cancels its attack; stunBud, then invulnBud ticks of invulnerability.
  //   koTicks: the knocked-out alien falls this long before the body drops. fightGiveUpSec: in a shift (not the lab),
  //   a fight this long ends with the alien storming off.
  health: 10, chargeSpeed: 110, engageDist: 100, raiseTicks: 10,
  swingStartup: 5, swingActive: 4, swingRecovery: 30, recoveryMove: 0.4, budReach: 38, hitBandY: 12, bodyHalfW: 8, budHalfW: 7,
  hitStopHit: 5, hitStopHurt: 7, knockAlien: 14, knockBud: 26, knockTicks: 8, stunAlien: 10, stunBud: 12, invulnBud: 45,
  koTicks: 24, cooldownMin: 20, cooldownMax: 40, fightGiveUpSec: 40,
  //   dodgeMargin: where an alien starts its wind-up. It commits from the distance Bud can just get out of its reach
  //   (lunge included) if he starts moving dodgeMargin ticks into the wind-up from a standstill, but never from inside
  //   the tray's reach. React faster and he is clear; slower and he is caught. Hit during its wind-up or attack, an
  //   alien takes the damage but is not interrupted; hit any other time it is stunned, and it counterattacks the
  //   moment the stun ends.
  //   counterDmg: extra health a blow takes when it lands while Bud is in any part of a swing.
  dodgeMargin: 20, counterDmg: 1,
  bodyW: 20, bodyH: 8, bodyReachX: 96, bodyReachY: 64,
  // How often a shift has fights: attacking species arrive fighterWeight times as often, and their patience is the normal
  // patience times fighterPatience (by shift second): shortest early, so the first fights come in the first minutes.
  fighterWeight: 1, fighterPatience: Object.freeze([[0, 0.5], [240, 0.6], [600, 0.8]]),
  // The first attacking customer seated after hotheadAfterSec is a hothead: hotheadGreetSec to take its order and
  // hotheadFoodSec for the food. Few players make that, so the first fight of a shift comes in its first minutes.
  hotheadAfterSec: 30, hotheadGreetSec: 6, hotheadFoodSec: 16,
  // Combat lab: the pause between one fight's end and the next fight's charge.
  labGapSec: 1.2,
});
// How every species fights (the lab fights all twenty; in a shift only SHIFT_FIGHTERS attack, the rest walk out).
//   windup, active, recovery: ticks. hits: active pulses in one attack, gap ticks apart. reach: px from its body edge.
//   lunge: px it travels toward Bud during the active ticks. speed: px/s. hp: hits to knock it out. dmg: health per hit.
//   both: the attack reaches both sides. style: how the body animates the attack (authored frames win where they exist).
const F_ = (name, attack, windup, active, recovery, reach, lunge, speed, hp, style, extra) =>
  Object.freeze(Object.assign({ name, attack, windup, active, recovery, reach, lunge, speed, hp, style, dmg: 1, hits: 1, gap: 0, both: false }, extra || {}));
// Tuned in combat_002 against bot_015's reaction-time bots (the plan's numbers are in comments_and_questions.md): a
// wind-up is long only where the attack reaches far enough that getting out of it takes that long.
const FIGHTERS = Object.freeze({
  1: F_('Ossuk', 'tentacle whip', 30, 6, 30, 56, 0, 50, 3, 'limb'),
  2: F_('Ilm', 'long-arm swipe', 26, 5, 24, 48, 6, 70, 3, 'limb'),
  3: F_('Gurm', 'jaw lunge', 20, 4, 22, 22, 26, 138, 4, 'body'),
  4: F_('Drommet', 'slab shove', 34, 8, 40, 26, 44, 40, 5, 'body'),
  5: F_('Chundra', 'column topple', 30, 6, 36, 60, 0, 45, 3, 'topple'),
  6: F_('Vess', 'spin, both sides', 24, 10, 28, 50, 0, 60, 3, 'spin', { both: true }),
  7: F_('Kethren', 'strut skewer', 36, 3, 26, 60, 10, 60, 3, 'limb'),
  8: F_('Bollo', 'belly bump', 20, 6, 20, 20, 18, 55, 4, 'body'),
  9: F_('Chitterheap', 'nibble flurry', 16, 3, 16, 24, 12, 150, 3, 'flurry', { hits: 3, gap: 3 }),
  10: F_('Sop', 'floor surge', 30, 8, 40, 40, 20, 35, 3, 'surge'),
  11: F_('Facet', 'shard flick', 32, 4, 30, 64, 0, 40, 3, 'shard'),
  12: F_('Muff', 'pounce', 24, 5, 28, 20, 36, 146, 3, 'body'),
  13: F_('Vrill', 'coil spring', 28, 3, 30, 24, 40, 144, 3, 'body'),
  14: F_('Palliad', 'membrane wrap', 30, 10, 34, 56, 8, 45, 4, 'limb'),
  15: F_('Kalvert', 'armoured charge', 34, 6, 48, 36, 40, 40, 5, 'limb', { dmg: 2 }),
  16: F_('Nimb', 'hover drop', 26, 5, 36, 18, 30, 65, 3, 'drop'),
  17: F_('Haloch', 'huge limb, over-rotates', 34, 8, 50, 72, 0, 45, 4, 'limb'),
  18: F_('Peer', 'stalk jab', 18, 4, 22, 30, 8, 70, 3, 'limb', { hits: 2, gap: 6 }),
  19: F_('Tallow', 'crown topple', 34, 6, 56, 74, 0, 40, 3, 'topple'),
  20: F_('Bicker', 'two bites', 18, 4, 26, 28, 12, 144, 4, 'body', { hits: 2, gap: 10 }),
});
// Species that attack in a shift when their patience runs out. Everyone else walks out.
const SHIFT_FIGHTERS = Object.freeze({ 1: true, 3: true, 7: true, 15: true, 17: true, 20: true });

/* ==== THE DEVICE ==============================================================================================
   Two control schemes, chosen on the title screen before a shift starts, exactly as the difficulty level is.

     DESKTOP — the game as it has always been. Arrows or WASD move, SPACE acts. Nothing is drawn over the floor.
     MOBILE  — a floating thumbstick in the left half and one big action pad in the right, drawn on the canvas.

   WHICH ONE IT BOOTS ON. `(pointer: coarse)` is the honest question: it asks what the PRIMARY pointer is, and a
   phone or a tablet answers coarse where a mouse answers fine. maxTouchPoints is the fallback for engines that do
   not answer the media query. Neither is a verdict — a tablet with a keyboard and a trackpad still reports a
   touchscreen, and a touch-capable laptop reports one while its owner uses the mouse — which is exactly why the
   control is a toggle and not a detection. Detection picks the default and says so; the human overrules it.

   THE RECOMMENDATION IS A CAPTION, NOT A TOOLTIP. A touch device has no hover, so the one device that most needs
   to be told "mobile is recommended" is the only device that could never trigger a tooltip to say it. It is drawn
   under the control, always, on both settings.

   THE STICK WRITES ARROW KEYCODES. It does not set a velocity, or move Bud, or touch the simulation at all: it
   pushes ArrowLeft / ArrowRight / ArrowUp / ArrowDown into the same Input queue the keyboard writes into, and
   drainInput turns those into held actions exactly as it always has. So moveBud, every bot, every determinism
   hash and every invariant check see a keyboard, and MOBILE cannot fork the movement path away from the one all
   the measurement was taken on. That is the whole design rule for this feature.

   PERSISTENCE. `touchUI` is module state, like `diffIdx`: not PREF (the simulation must not read it) and not
   `sim` (reset() rebuilds that), so the choice survives every restart in the session. Nothing in the SIM section
   reads it — the audit proves that mechanically, the same way the difficulty audit proves it for `pace`. */
const DEVICES = Object.freeze([
  Object.freeze({ key: 'mobile', name: 'MOBILE' }),
  Object.freeze({ key: 'desktop', name: 'DESKTOP' }),
]);
function coarsePointer() {
  try {
    if (typeof matchMedia === 'function') {
      const q = matchMedia('(pointer: coarse)');
      if (q && typeof q.matches === 'boolean') return q.matches;
    }
  } catch (e) { /* a matchMedia that throws is a matchMedia that has not answered */ }
  return !!(navigator && navigator.maxTouchPoints > 0);
}
// Worked out once, at load. It is the RECOMMENDATION and the boot default; it is never consulted again, so
// plugging a mouse in mid-session cannot move a control the player has already set by hand.
const DEV_BOOT = coarsePointer() ? 0 : 1;
let devIdx = DEV_BOOT;
const touchUI = () => devIdx === 0;
const DEV_CAPTION = () => DEVICES[DEV_BOOT].name + ' RECOMMENDED FOR THIS DEVICE';
// What the floor's prompts call the act control. The prompt has always named the key; on a touchscreen there is
// no key, so it names the thing there is. Three characters, so no prompt box changes width enough to move.
const ACT_KEY = () => (touchUI() ? 'TAP' : 'SPACE');

/* ==== FULLSCREEN ==============================================================================================
   THE RULE THAT SHAPES ALL OF THIS: fullscreen cannot be requested on load. Every browser demands a trusted user
   gesture, and one that has not yet gone stale, so a page that simply asks for it as it boots is refused. The only
   honest way in is to attach it to a gesture the player was already making.

   That gesture is STARTING THE SHIFT, and nothing else. Not the title's other buttons — INSTRUCTIONS, the
   difficulty segments, the device segments are all things you press while deciding, and a screen that swallows the
   browser because you were reading the instructions is a screen that has taken something from you. START is the
   one press that means "I am playing now".

   IT IS REQUESTED FROM INSIDE THE EVENT HANDLER, not from the simulation. leaveTitle() runs on the next sim step,
   which is a different task from the keypress that caused it, and by then the user activation may be gone. So the
   keydown listener and the START button's click listener each ask for it directly, on the frame the press lands.

   DESKTOP BENEFITS AS MUCH AS MOBILE. The canvas scales in whole numbers above 2x, so at 1366x768 the browser
   chrome costs an entire step: 1280x720 windowed against 1920x1080 fullscreen on the same monitor. It is not a
   phone feature.

   FAILURE IS FINE AND IS NOT REPORTED TO THE PLAYER. iPhone Safari has no Fullscreen API on an element at all;
   an embedded frame may be denied by permissions policy; a browser may simply refuse. In every case the promise
   rejects, this catches it, and the game runs in the window exactly as it did before. There is no prompt, no
   warning, and no second attempt.

   LEAVING IS ESCAPE, and leaving PAUSES a running shift — the same rule the window already follows when it loses
   focus, for the same reason: the ten-minute clock must not run while the player is somewhere else. */
const Screen = {
  supported: !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen),
  tried: false, entered: false, lastError: null,
  is() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  // The whole page, not #wrap: wrap is absolutely positioned and sized by fit(), and fullscreening it would put
  // the letterbox outside the fullscreen element. documentElement keeps the black surround the game already has.
  request() {
    if (!this.supported || this.is()) return false;
    this.tried = true;
    const el = document.documentElement;
    try {
      const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(e => { this.lastError = String(e && e.name || e); });
    } catch (e) { this.lastError = String(e && e.name || e); return false; }
    // Landscape lock, MOBILE only and only once fullscreen is granted — the API refuses outside it. It makes the
    // rotate prompt rare rather than unnecessary: plenty of browsers, iOS among them, do not implement it.
    if (touchUI() && screen && screen.orientation && screen.orientation.lock) {
      try { const q = screen.orientation.lock('landscape'); if (q && q.catch) q.catch(() => {}); } catch (e) { /* not supported */ }
    }
    return true;
  },
  // Called on every fullscreenchange. Entering is silent; LEAVING pauses a shift in progress, because Escape out
  // of fullscreen means the player's attention has gone somewhere else and the clock should stop with it.
  onChange() {
    const now = this.is();
    const left = this.entered && !now;
    this.entered = now;
    fit();
    if (!left || !sim) return;
    if (touchUI() && screen && screen.orientation && screen.orientation.unlock) {
      try { screen.orientation.unlock(); } catch (e) { /* nothing held it */ }
    }
    Touch.clear();
    const playing = sim.mode === 'floor' || sim.mode === 'tableView' || sim.mode === 'station';
    if (playing && !sim.paused) setPaused(true);
  },
  info() { return { supported: this.supported, active: this.is(), tried: this.tried, lastError: this.lastError,
    element: this.is() ? (document.fullscreenElement || document.webkitFullscreenElement).tagName : null }; },
};

/* ==== DIFFICULTY ==============================================================================================
   Three levels, chosen on the title screen before a shift starts. THE ONLY THING A LEVEL CHANGES IS HOW OFTEN
   CUSTOMERS COME THROUGH THE DOOR: updateSpawner divides the interval CFG.spawnCurve yields by `pace`, and nothing
   else in this file reads `pace` at all.

   What deliberately does NOT scale, and why: CFG.sectionOpenSec, CFG.soloPhaseSec, CFG.soloGapSec, CFG.pairCurve,
   CFG.greetCurve / CFG.foodCurve (patience), CFG.cookSec, CFG.health, every combat number and CFG.shiftSec. Those
   are the SHAPE of a shift — when the room opens up, how long the tutorial phase lasts, how hard one table is to
   serve. Compressing them would make a different game rather than a busier one. Pressure is volume, and volume is
   the door. CFG.tiers does not scale either: more customers means more tips, so a good player reaches first class
   faster on hard, which is the trade for dying more often.

   easy is `pace: 1`, and x / 1 is bit-identical to x in IEEE754, so an easy shift is the same shift game_016 ran,
   tick for tick, from the same seed. The RNG is drawn the same number of times in the same order on all three, so
   the levels differ only in the arithmetic on one interval, never in the sequence of draws.

   PERSISTENCE. `diffIdx` is module state, NOT part of PREF (which the simulation is not allowed to read) and NOT
   part of `sim` (which reset() rebuilds). reset() copies it into sim.difficulty, so a shift carries its own level
   and a snapshot fully determines it, while the CHOICE survives every restart in the session. */
/* THE WAITING LINE (new in game_018). `queueMax` is how many customers may stand along the wall when every table is

   takes exactly the old blocked branch having drawn nothing, and easy is game_016 tick for tick by construction
   rather than by measurement. MEDIUM 6 and HARD 10 turn the six-table ceiling into a visible backlog. */

      if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
      const n = nr * cols + nc;
      if (seen[n] || blocked[n] || mask[n]) continue;
      seen[n] = 1;
      stack.push(n);
    }
  }
  const missing = LAYOUT.navTargets.filter(p => !seen[cellIndex(p)]).map(p => p.name);
  if (bud) {
    let ok = false;
    for (const [dx, dy] of [[0, 0], [-6, 0], [6, 0], [0, -3], [0, 3], [-8, -4], [8, -4], [-8, 4], [8, 4]]) if (seen[cellIndex({ x: bud.x + dx, y: bud.y + dy })]) ok = true;
    if (!ok) missing.push('bud');
  }
  return missing;
}
// Where a knocked-out body comes to rest: the nearest spot to where it fell that keeps the floor passable.
function placeBody(fx, fy) {
  const F = LAYOUT.floor, b = sim.bud, budBox = { x: b.x - FEET.w / 2, y: b.y - FEET.h / 2, w: FEET.w, h: FEET.h };
  const x0 = Math.round(fx), y0 = Math.round(fy), cands = [];
  for (let dy = -CFG.bodyReachY; dy <= CFG.bodyReachY; dy += 4) for (let dx = -CFG.bodyReachX; dx <= CFG.bodyReachX; dx += 4) cands.push([dx * dx + dy * dy, dy, dx]);
  cands.sort((p, q) => p[0] - q[0] || p[1] - q[1] || p[2] - q[2]);
  let tried = 0;
  for (const [, dy, dx] of cands) {
    const x = x0 + dx, y = y0 + dy, r = bodyRect({ x, y });
    if (r.x < F.x0 || r.x + r.w > F.x1 || r.y < F.y0 || r.y + r.h > F.y1) continue;
    if (OBSTACLES.some(o => rectsTouch(r, o, 0)) || rectsTouch(r, budBox, 3) || LAYOUT.keepClear.some(k => rectsTouch(r, k, 0))) continue;
    const mask = BODY_MASK.slice();
    stampBody(mask, r);
    tried++;
    if (unreachable(mask, b).length) continue;
    return { x, y, tried };
  }
  return null;
}

function navPath(from, to) {
  const { cell, cols, rows, blocked } = LAYOUT.nav, N = cols * rows;
  const cellOf = p => [clamp(Math.floor(p.x / cell), 0, cols - 1), clamp(Math.floor(p.y / cell), 0, rows - 1)];
  const [sc, sr] = cellOf(from), [gc, gr] = cellOf(to);
  const start = sr * cols + sc, goal = gr * cols + gc;
  const g = new Float64Array(N).fill(Infinity), came = new Int32Array(N).fill(-1);
  const inOpen = new Uint8Array(N), closed = new Uint8Array(N);
  const h = i => Math.abs(i % cols - gc) + Math.abs(((i / cols) | 0) - gr);
  g[start] = 0;
  const open = [start];
  inOpen[start] = 1;
  while (open.length) {
    let bi = 0;
    for (let k = 1; k < open.length; k++) {
      const a = open[k], b = open[bi], fa = g[a] + h(a), fb = g[b] + h(b);
      if (fa < fb || (fa === fb && a < b)) bi = k;
    }
    const cur = open[bi];
    open[bi] = open[open.length - 1];
    open.pop();
    inOpen[cur] = 0;
    closed[cur] = 1;
    if (cur === goal) {
      const pts = [{ x: to.x, y: to.y }];
      for (let c = came[cur]; c !== -1 && c !== start; c = came[c]) pts.unshift({ x: (c % cols + 0.5) * cell, y: (((c / cols) | 0) + 0.5) * cell });
      return pts;
    }
    const cc = cur % cols, cr = (cur / cols) | 0;
    for (const [dc, dr] of DIRS4) {
      const nc = cc + dc, nr = cr + dr;
      if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
      const n = nr * cols + nc;
      if (closed[n] || ((blocked[n] || BODY_MASK[n]) && n !== goal)) continue;
      const ng = g[cur] + 1;
      if (ng < g[n]) { g[n] = ng; came[n] = cur; if (!inOpen[n]) { inOpen[n] = 1; open.push(n); } }
    }
  }
  return [{ x: to.x, y: to.y }];
}

const Input = {
  queue: [],
  heldCodes: new Set(),
  // Every key is recorded as 'any', mapped or not, because the instructions screen closes on any of them. Only mapped
  // keys become actions, only mapped keys have their default prevented, and the return value is unchanged: true when
  // the key is one the game uses, which is what gates the audio unlock.
  keyDown(code, evt) {
    const known = !!KEYMAP[code];
    if (evt) {
      if (known) evt.preventDefault();
      if (evt.repeat) return known;
    }
    this.queue.push(['any', code]);
    if (known) this.queue.push(['down', code]);
    return known;
  },
  keyUp(code, evt) {
    if (!KEYMAP[code]) return false;
    if (evt) evt.preventDefault();
    this.queue.push(['up', code]);
    return true;
  },
  /* THE THUMBSTICK'S ROUTE IN. It states the set of directions it wants held and this reconciles that against
     what is actually held, pressing and releasing the difference. Stating a set rather than sending edges is what
     makes it safe: heldCodes is cleared from a dozen places in this file — on blur, on pause, on reset, and by
     every audit that saves and restores it — and a stick that tracked its own edges would go stale against any of
     them and leave Bud walking into a wall. Reconciling against heldCodes itself cannot go stale, because
     heldCodes is the thing it is reconciling against.

     It is keyDown WITHOUT the 'any' edge, and that omission is deliberate: 'any' is what closes the instructions
     and what skips a finisher, and a thumb drifting four pixels while a scene plays must not count as "the player
     pressed something". The ACTION PAD uses keyDown proper, because it IS the player pressing something. */
  stickSet(codes) {
    const want = new Set(codes);
    for (const c of Array.from(this.stickHeld)) {
      if (!want.has(c)) { this.stickHeld.delete(c); this.queue.push(['up', c]); }
    }
    for (const c of want) {
      if (!KEYMAP[c]) continue;
      // Re-press anything this thinks it is holding that heldCodes has since had cleared out from under it.
      // Held already and the game knows it: nothing to send. heldCodes only catches up when drainInput runs, so
      // a down still sitting in the queue counts as known too — otherwise two frames without a simulation step
      // would send the same press twice, and a duplicate down is a duplicate EDGE, which is a cursor that jumps
      // two squares at the ORDER station.
      if (this.stickHeld.has(c) && (this.heldCodes.has(c) || this.queue.some(q => q[0] === 'down' && q[1] === c))) continue;
      this.stickHeld.add(c);
      this.queue.push(['down', c]);
    }
  },
  stickHeld: new Set(),
  // Let go of every direction the stick is holding. On release, on blur, on pause, and on any mode change out of
  // play, so a lifted thumb can never leave Bud walking.
  stickRelease() { this.stickSet([]); },
  tap(action) { this.queue.push(['tap', action]); },
  blur() { this.queue.push(['blur', null]); },
  releaseAll() { for (const c of this.heldCodes) this.queue.push(['up', c]); },
};
// 'diff0'..'diff2' are tap-only: the three difficulty segments on the title screen, tapped by their transparent DOM
// buttons. They are in ACTIONS so clearEdges() clears them like every other edge — a tap action left outside this
// list would latch on for the rest of the session.
// 'dev0'/'dev1' are the two device segments on the title, tapped by their transparent DOM buttons, and 'cell0'..
// 'cell9' are the ten boxes of the ORDER station, tapped directly on a touchscreen (row * 5 + col). Both go
// through Input.tap into the same edge-triggered table the keyboard writes into, so a tap and a key are the same
// event to the simulation, and both are in ACTIONS so clearEdges() clears them — an edge left outside this list
// would latch on for the rest of the session.
const ACTIONS = ['up', 'down', 'left', 'right', 'act', 'pause', 'restart', 'style', 'mute', 'help', 'any', 'cycle', 'heal', 'slow', 'prev', 'next', 'boxes',
  'diff0', 'diff1', 'diff2', 'dev0', 'dev1',
  'cell0', 'cell1', 'cell2', 'cell3', 'cell4', 'cell5', 'cell6', 'cell7', 'cell8', 'cell9'];
const SUBS = [];
let sim = null;

function drainInput() {
  const I = sim.input;
  for (const [kind, x] of Input.queue) {
    if (kind === 'down') { Input.heldCodes.add(x); I.pressed[KEYMAP[x]] = true; }
    else if (kind === 'any') I.pressed.any = true; // mapped or not: what the instructions screen closes on
    else if (kind === 'up') Input.heldCodes.delete(x);
    else if (kind === 'tap') I.pressed[x] = true;
    else if (kind === 'blur') { I.blur = true; Input.heldCodes.clear(); }
  }
  Input.queue.length = 0;
  for (const a of ACTIONS) I.held[a] = false;
  for (const c of Input.heldCodes) I.held[KEYMAP[c]] = true;
}
function clearEdges() { for (const a of ACTIONS) sim.input.pressed[a] = false; }

/* Set only while an audit is driving a PRIVATE simulation of its own (Opening.audit swaps `sim` out, plays the
   opening through the real stepSim, and puts the real one back). While it is on, nothing that happens reaches a
   subscriber, an event log or the sound counters — a bot listening to the game must not hear a shift that never
   happened. Nothing else ever sets it, and it is false everywhere in normal play. */
let AUDITING = false;
function emit(type, data) {
  if (AUDITING) return;
  const e = Object.assign({ tick: sim.tick, type }, data);
  sim.events.push(e);
  if (sim.events.length > 500) sim.events.shift();
  sim.eventHash = fnv(JSON.stringify(e), sim.eventHash);
  for (const cb of SUBS) cb(e);
}
function setMode(to) {
  const from = sim.mode;
  if (from === to) return;
  sim.mode = to;
  emit('mode', { from, to });
  UI.onMode(to);
}
function setPaused(p) {
  sim.paused = p;
  if (p) Input.heldCodes.clear();
  emit(p ? 'paused' : 'resumed', {});
  UI.onMode(sim.mode); // the RESTART button shows while paused
}

const byId = id => sim.customers.find(c => c.id === id);
const partyOf = c => sim.parties.find(p => p.id === c.partyId);
const ticketOf = id => sim.tickets.find(t => t.id === id);
const seatOf = c => LAYOUT.tables[c.seat.tableId].seats[c.seat.index];
const standOf = c => seatOf(c).stand;
const shiftSeconds = () => (sim.tick - sim.shift.startTick) / 60;
const onTables = () => sim.tables.reduce((a, t) => a + t.money, 0);
const inHand = () => sim.customers.reduce((a, c) => a + c.pendingTip, 0);
const tierFor = tips => CFG.tiers.filter(x => tips >= x).length;
// THE ONE LINE IN THE SIMULATION THAT READS `.pace`, and the one that reads `.queueMax`. Everything a level touches
// goes through these two, so what difficulty does is the list of their call sites and nothing else. `paceNow()` is
// called from exactly four places: the first arrival, the two solo gaps, and the spawn interval.
const paceNow = () => levelOf(sim.difficulty).pace;
const queueCap = () => levelOf(sim.difficulty).queueMax;
// Slot 0 is nearest the door; the line runs left along the bottom wall.
const queueSlotPt = i => ({ x: CFG.queueX - i * CFG.queueGap, y: CFG.queueY });
const queuedCount = () => sim.customers.reduce((a, c) => a + (c.state === 'queued' ? 1 : 0), 0);

function beginShiftClock() {
  sim.shift.startTick = sim.tick + TICKS(CFG.introSec);
  sim.shift.endTick = sim.shift.startTick + TICKS(CFG.shiftSec);
  sim.spawner.nextTick = sim.shift.startTick + TICKS(CFG.firstArrivalSec / paceNow());
}

/* ---- title -> instructions (optional) -> the opening cook scene -> the shift ----
   The cook scene is authored in intro\ and no variation has been chosen yet, so Intro.scene is null and SPACE goes
   from the title straight to the floor. To drop a scene in, set Intro.scene to an object providing:

       name                   a short string, for the event log
       begin(tick)            called once, on the tick the scene starts
       update(pressed, tick)  called every tick; return true when the scene is over
       draw(tick)             called every frame while sim.mode is 'intro'

   `pressed` is the same edge-triggered action table the rest of the simulation reads, so a scene can use P.act to let
   SPACE advance or skip it and P.any to react to any key at all. A scene is simulation-side and must obey the same
   rules as everything else here: fixed timestep, sim.tick as the only clock, and no unseeded randomness.

   The ten-minute shift clock is deliberately NOT started until the scene ends, so the scene costs the player none of
   their shift. HANDOFF.md 3.2's setup tasks happen after it, inside the shift, and are untouched by this. */
const Intro = {
  scene: null,
  played: false, // once per page load, not per restart: a retry goes straight to the floor, as the scene's design asks
  ready() { return !!this.scene && !this.played; },
  begin() { this.played = true; this.scene.begin(sim.tick); emit('introStart', { scene: this.scene.name || 'intro' }); },
  update(P) { return !this.scene || !!this.scene.update(P, sim.tick); },
  draw() { if (this.scene) this.scene.draw(sim.tick); },
};
function startShift() { setMode('floor'); beginShiftClock(); }
function leaveTitle() {
  setMode(Intro.ready() ? 'intro' : 'floor');
  emit('titleDismissed', {});
  if (sim.mode === 'intro') Intro.begin(); else beginShiftClock();
}
function openHelp() { sim.ui.help = { openedTick: sim.tick }; setMode('help'); emit('helpOpened', {}); }
function closeHelp() { sim.ui.help = null; setMode('title'); emit('helpClosed', {}); }
/* Pick a difficulty. Clamped rather than wrapped: three rungs in a natural order read better as a row you slide
   along than as a carousel, and LEFT on EASY doing nothing is less surprising than it jumping to HARD. It writes
   BOTH the session-level choice and the waiting shift's copy of it, so the title screen, a shift started from here
   and a shift started after a restart all agree. Refused once a shift is under way: the level is chosen before the
   doors open, never during. */
function setDifficulty(i) {
  if (sim.mode !== 'title' && sim.mode !== 'help') return false;
  const n = clamp(i | 0, 0, LEVELS.length - 1);
  if (n === diffIdx) return false;
  diffIdx = n;
  sim.difficulty = n;
  // The payload names the level, not its pace: `.pace` is read in exactly ONE place in the simulation — the
  // spawner's interval — and the difficulty audit proves that by counting the reads between the SIM markers.
  // A second mention here, even in an event, would make that count a 2 and the proof worthless.
  emit('difficulty', { level: LEVELS[n].key, index: n });
  return true;
}
/* The device setter, guarded exactly as the difficulty setter is: chosen before the doors open or not at all.
   Nothing in the simulation reads `devIdx` — the control scheme is a way of PRODUCING input, not a thing the
   simulation knows about — so unlike setDifficulty this writes nothing into `sim` and the shift carries no copy
   of it. Switching to DESKTOP drops whatever the thumbstick was holding, so a scheme change cannot leave a
   phantom direction held down by a control that no longer exists. */
function setDevice(i) {
  if (sim.mode !== 'title' && sim.mode !== 'help') return false;
  const n = clamp(i | 0, 0, DEVICES.length - 1);
  if (n === devIdx) return false;
  devIdx = n;
  Input.stickRelease();
  Touch.clear();
  emit('device', { device: DEVICES[n].key, index: n });
  return true;
}

function reset(seed, skipTitle) {
  sim = {
    seed: seed >>> 0, rng: makeRng(seed >>> 0), tick: 0, mode: skipTitle ? 'floor' : 'title', paused: false,
    // The level this shift is being played on. The CHOICE lives in diffIdx, which reset() does not touch, so it
    // survives every restart in the session; the shift gets its own copy so a snapshot fully determines it.
    difficulty: diffIdx,
    shift: { startTick: null, endTick: null, started: false, ended: false, hothead: null },
    // noTray: he walks in empty-handed and picks the tray up when the cook is done with him. It is the opening's
    // flag and nothing else ever sets it — a restart skips the opening, so a retry starts with the tray in hand.
    bud: { x: LAYOUT.budStart.x, y: LAYOUT.budStart.y, vx: 0, vy: 0, facing: 'down', tray: [], dead: false, walked: 0, noTray: false,
           health: CFG.health, hurtTick: -9999, swingTick: -9999,
           // combat: dir (+1 faces right), the swing in progress, stun and invulnerability ticks, knockback, tray going up
           dir: 1, swing: null, stun: 0, invuln: 0, kb: null, raise: 0,
           // the tray's pose: loaded mirrors tray.length; loadTick is when it last changed, lowerTick when a fight ended
           loaded: false, loadTick: -9999, lowerTick: -9999, raiseFrom: 'down', raiseTick: -9999 },
    tips: 0, tier: 0, secured: false,
    stats: { spawned: 0, served: 0, misServed: 0, walkedOut: 0, ticketsEntered: 0, discarded: 0, reheard: 0,
             awarded: 0, collected: 0, piles: 0, lostTips: 0,
             charges: 0, fights: 0, knockedOut: 0, stormedOff: 0, budHits: 0, swings: 0, whiffs: 0, alienHits: 0,
             alienAttacks: 0, alienWhiffs: 0, frozenTicks: 0, finisherTicks: 0, finishers: 0, spilled: 0, lostOnSwing: 0, nonBlockingBodies: 0 },
    parties: [], customers: [], tickets: [], pass: [], kitchen: [],
    queue: [],   // party ids waiting along the wall, front first. Always empty on EASY.
    tables: LAYOUT.tables.map(t => ({ id: t.id, partyId: null, money: 0 })),
    sections: LAYOUT.sections.map(s => ({ id: s.id, open: s.openSec <= 0, openedTick: null })),
    ui: { tableView: null, station: null, banner: null, help: null },
    story: { beat: null, queue: [], once: {} },
    fight: null, bodies: [], lab: null, hitStop: 0,
    fin: null, // the finisher in progress, or null. Owned entirely by the drop-in block; see startFinisher.
    // The tick the camera left the cook's close-up, or null. While it is set, the pass window cross-fades from the
    // full-colour close-up treatment to the silhouette it wears for the rest of the shift. null everywhere else —
    // on a restart, in the lab, and after an ESC that skipped the conversation — so the hatch is simply the silhouette.
    passFadeTick: null,
    ending: null,
    spawner: { nextTick: 0, blocked: false, released: 0 },
    nextId: 1,
    input: { held: {}, pressed: {}, blur: false },
    events: [], eventHash: 0x811c9dc5,
  };
  rebuildBodies();
  Input.queue.length = 0;
  Input.heldCodes.clear();
  if (skipTitle) beginShiftClock();
  emit('restart', { seed: sim.seed });
  UI.onMode(sim.mode);
}
function nextSeed() { return (Math.imul(sim.seed ^ 0x5bd1e995, 0x27d4eb2d) + sim.tick) >>> 0; }

function stepSim() {
  drainInput();
  const I = sim.input, P = I.pressed;
  if (P.style) {
    PREF.style = STYLES[(STYLES.indexOf(PREF.style) + 1) % STYLES.length];
    emit('narrativeStyle', {});
    if (sim.ending) sim.ending.startTick = sim.tick; // replay the epilogue in the new style
  }
  if (P.mute) { PREF.muted = !PREF.muted; Sound.applyMute(); emit('muteToggled', {}); }
  // Hit-stop: the whole simulation holds still, the clock included. Presses wait for the first tick after it.
  if (sim.hitStop > 0 && sim.mode === 'floor' && !sim.paused) {
    sim.hitStop--;
    sim.stats.frozenTicks++;
    P.style = P.mute = false;
    return;
  }
  // A finisher owns the whole tick. The clock is frozen exactly as hit-stop freezes it, and for the same reason: the
  // scene is not shift time. Those ticks go into frozenTicks, so `tick == ticks stepped - frozenTicks` still holds,
  // and into finisherTicks as well so the two costs can be told apart. Any key skips, which jumps to the last tick of
  // the final beat rather than cancelling. Nothing else runs: no spawner, no patience, no fight, no shift clock, so
  // Bud cannot take another blow and the ten-minute cap cannot fire and take the death off the species that earned it.
  if (sim.fin && sim.mode === 'floor' && !sim.paused) {
    // The skip is armed at tick 30, which is the exact tick the ANY KEY: SKIP prompt appears, and for a reason the
    // lab could not see: the blow that kills Bud lands mid-fight, while the player is mashing SPACE, and hit-stop
    // holds that press for seven ticks without clearing it. Armed from tick 0, every finisher in a real shift would
    // be skipped by the keystroke that caused it, and nobody would ever see one. Before 30 the keys are read and
    // dropped; after it a fresh press skips, and a key merely held down does not (clearEdges runs every tick).
    if (P.any && sim.fin.tick >= FIN_SKIP_ARMED) skipFinisher();
    sim.stats.frozenTicks++;
    sim.stats.finisherTicks++;
    updateFinisher();
    clearEdges();
    return;
  }
  const playing = sim.mode === 'floor' || sim.mode === 'tableView' || sim.mode === 'station';
  if (I.blur) { I.blur = false; if (playing && !sim.paused) setPaused(true); }
  if (sim.paused) {
    if (P.restart && sim.lab) { setPaused(false); labBegin(); } // in the lab, R restarts the fight, paused or not
    else if (P.restart) { reset(nextSeed(), false); return; } // restart from any playing state: pause, then R
    else if (P.pause) setPaused(false);
    clearEdges();
    return;
  }
  if (playing && P.pause) { setPaused(true); clearEdges(); return; }

  if (sim.mode === 'title') {
    // The difficulty selector. LEFT/RIGHT (so also A/D) move the selection; the three transparent buttons over the
    // segments tap 'diff0'..'diff2' and pick one outright. Neither touches P.act, so SPACE still means START and
    // only ever means START — the one bug this control could introduce.
    if (P.left || P.right) setDifficulty(diffIdx + (P.right ? 1 : -1));
    else if (P.diff0) setDifficulty(0);
    else if (P.diff1) setDifficulty(1);
    else if (P.diff2) setDifficulty(2);
    // The device selector takes UP/DOWN (so also W/S), which is the axis the difficulty selector leaves free.
    // Two selectors cannot share LEFT/RIGHT without one of them being a mode the player has to know they are in,
    // and the point of the control is that it is obvious. Its two transparent segments tap it outright. Neither
    // path touches P.act, so SPACE on the title still means START and only ever means START.
    if (P.up || P.down) setDevice(P.up ? 0 : 1);
    else if (P.dev0) setDevice(0);
    else if (P.dev1) setDevice(1);
    if (P.help) openHelp();
    else if (P.act) leaveTitle();
  } else if (sim.mode === 'help') {
    // Any key, mapped or not. M and N are handled above and so still do their usual job on the way out; the SOUND
    // button taps 'mute' without setting 'any', so it toggles sound and leaves the instructions open.
    if (P.any) closeHelp();
  } else if (sim.mode === 'intro') {
    if (Intro.update(P)) { emit('introEnd', {}); startShift(); }
  } else if (sim.mode === 'shiftEnd') {
    if (P.restart) { reset(nextSeed(), false); return; }
  } else if (sim.mode === 'floor') {
    if (sim.lab) updateLab(P);
    if (sim.fight) updateFight(P); // one key, two meanings: in a fight, SPACE swings the tray
    else if (!sim.lab) { moveBud(1); if (P.act) interact(); }
    else if (!sim.bud.dead) moveBud(1);
  } else if (sim.mode === 'tableView') {
    updateTableView(P);
  } else if (sim.mode === 'station') {
    updateStation(P);
  }

  if (sim.shift.startTick !== null && sim.mode !== 'shiftEnd') {
    const t = sim.tick;
    if (sim.lab) updateCustomers(); // the lab has no shift clock, kitchen, spawner or story
    else {
      // The two opening cards used to be queued here, as ordinary beats, after the cook scene. They are the opening's
      // now: Opening draws them while Bud walks in, before the shift clock exists. Nothing else about beats changed.
      // >= with a latch, not ===. With introSec at 0 the clock starts ON the tick the conversation ends, and
      // whether that tick's equality test has already run depends on the order of two calls — an ordering the
      // event should not be balanced on. The latch fires it exactly once either way.
      if (!sim.shift.started && t >= sim.shift.startTick) { sim.shift.started = true; emit('shiftStart', {}); }
      if (t === sim.shift.endTick - TICKS(CFG.lastMinuteSec)) queueBeat('lastMinute');
      updateCustomers();
      if (sim.mode !== 'shiftEnd') {
        updateKitchen();
        if (t >= sim.shift.startTick) { updateSections(); updateQueue(); updateSpawner(); updateStory(); }
        if (t === sim.shift.endTick) endShift();
      }
    }
  }
  const b = sim.bud;
  if ((b.tray.length > 0) !== b.loaded) { b.loaded = b.tray.length > 0; b.loadTick = sim.tick; } // empty <-> loaded, for the pose
  clearEdges();
  sim.tick++;
}

function makeEnding(kind, cause) {
  sim.ui.tableView = null;
  sim.ui.station = null;
  sim.ui.banner = null;
  sim.story.beat = null;
  sim.story.queue.length = 0;
  sim.shift.ended = true;
  sim.stats.lostTips = onTables() + inHand();
  sim.ending = { kind, tier: sim.tier, tips: sim.tips, lost: sim.stats.lostTips, cause: cause || null, startTick: sim.tick };
  setMode('shiftEnd');
  playSound(kind === 'died' ? 'epDead' : sim.tier > 0 ? 'epBooked' : 'epStranded');
}
function endShift() {
  makeEnding('survived');
  emit('shiftEnd', { tips: sim.tips, lostTips: sim.stats.lostTips, tier: sim.tier });
}
// Health reaching zero calls this; __test.forceDeath() reaches it directly.
function killBud(cause) {
  if (sim.mode === 'shiftEnd' || sim.mode === 'title' || sim.shift.startTick === null) return false;
  sim.bud.dead = true;
  sim.bud.vx = sim.bud.vy = 0;
  makeEnding('died', cause);
  emit('budDied', { tips: sim.tips, lostTips: sim.stats.lostTips, tier: sim.tier, cause: sim.ending.cause });
  emit('shiftEnd', { tips: sim.tips, lostTips: sim.stats.lostTips, tier: sim.tier, died: true });
  return true;
}

// ---- progression and story ----
function updateTier() {
  const want = tierFor(sim.tips);
  while (sim.tier < want) {
    sim.tier++;
    emit('tierCrossed', { tier: sim.tier, name: TIER_NAMES[sim.tier], tips: sim.tips });
    queueBeat('tier' + sim.tier);
    if (sim.tier === 4) { sim.secured = true; emit('fareSecured', { tips: sim.tips }); }
    playSound('tier' + sim.tier);
  }
}
function queueBeat(key) { sim.story.queue.push(key); }
function beatOnce(key) { if (!sim.story.once[key]) { sim.story.once[key] = true; queueBeat(key); } }
// A beat lasts exactly as long as its ticker line takes to cross the screen at CFG.beatPxPerSec.
const beatText = key => BEATS[key].join('   *   ');
const beatTicks = key => TICKS((LAYOUT.w + beatText(key).length * 6) / CFG.beatPxPerSec);
function updateStory() {
  const S = sim.story;
  if (S.beat && sim.tick >= S.beat.endTick) S.beat = null;
  if (!S.beat && S.queue.length && !sim.ui.banner) {
    const key = S.queue.shift();
    S.beat = { key, startTick: sim.tick, endTick: sim.tick + beatTicks(key) };
    emit('storyBeat', { key });
  }
}

function updateSections() {
  if (sim.ui.banner && sim.tick >= sim.ui.banner.untilTick) sim.ui.banner = null;
  const st = shiftSeconds();
  for (const s of sim.sections) {
    if (s.open || st < LAYOUT.sections[s.id].openSec) continue;
    s.open = true;
    s.openedTick = sim.tick;
    sim.ui.banner = { text: 'SECTION ' + (s.id + 1) + ' OPEN', untilTick: sim.tick + TICKS(CFG.bannerSec) };
    emit('sectionOpened', { sectionId: s.id, tableIds: LAYOUT.sections[s.id].tables.slice() });
    playSound('sectionOpen');
  }
}

function approach(v, target, step) { return v < target ? Math.min(v + step, target) : Math.max(v - step, target); }
// Move anything with feet by (dx, dy): fixtures and blocking bodies stop it, the floor edge holds it. Returns what stopped it.
function slide(e, dx, dy) {
  const F = LAYOUT.floor, fw = FEET.w / 2, fh = FEET.h / 2;
  let ox = null, oy = null;
  // Snap back against whatever it ran into, and again if that edge is inside something else (bodies can lie side by
  // side); if nothing clears, it does not move on that axis.
  if (dx) {
    const x0 = e.x;
    e.x += dx;
    for (let k = 0, o; k < 6 && (o = feetHit(e.x, e.y, OBSTACLES)); k++) { ox = o; e.x = dx > 0 ? o.x - fw : o.x + o.w + fw; }
    if (ox && feetHit(e.x, e.y, OBSTACLES)) e.x = x0;
    e.x = clamp(e.x, F.x0 + fw, F.x1 - fw);
  }
  if (dy) {
    const y0 = e.y;
    e.y += dy;
    for (let k = 0, o; k < 6 && (o = feetHit(e.x, e.y, OBSTACLES)); k++) { oy = o; e.y = dy > 0 ? o.y - fh : o.y + o.h + fh; }
    if (oy && feetHit(e.x, e.y, OBSTACLES)) e.y = y0;
    e.y = clamp(e.y, F.y0 + fh, F.y1 - fh);
  }
  return { x: ox, y: oy };
}
// Bud walks. mul scales his top speed (1 on the floor and in a fight, CFG.recoveryMove while a swing recovers).
function moveBud(mul) {
  const b = sim.bud, H = sim.input.held;
  const ix = (H.right ? 1 : 0) - (H.left ? 1 : 0), iy = (H.down ? 1 : 0) - (H.up ? 1 : 0);
  const norm = ix && iy ? Math.SQRT1_2 : 1, top = CFG.budSpeed * mul;
  const tx = ix * norm * top, ty = iy * norm * top;
  const acc = CFG.budSpeed / (CFG.accelSec * 60), dec = CFG.budSpeed / (CFG.decelSec * 60);
  const x0 = b.x, y0 = b.y;
  b.vx = approach(b.vx, tx, tx ? acc : dec);
  b.vy = approach(b.vy, ty, ty ? acc : dec);
  if (ix) b.facing = ix > 0 ? 'right' : 'left'; else if (iy) b.facing = iy > 0 ? 'down' : 'up';
  const hit = slide(b, b.vx / 60, b.vy / 60);
  if (hit.x) b.vx = 0;
  if (hit.y) b.vy = 0;
  b.walked += Math.hypot(b.x - x0, b.y - y0);
  if (b.walked >= CFG.stepPx) { b.walked -= CFG.stepPx; playSound('step', null, true); } // footsteps: not logged as events
}

function findTarget() {
  const b = sim.bud, inZone = z => b.x >= z.x0 && b.x <= z.x1 && b.y >= z.y0 && b.y <= z.y1;
  for (const c of sim.customers) {
    if (c.state === 'waitingOrder' && c.seat && inZone(seatOf(c).zone)) return { kind: 'order', party: partyOf(c), point: standOf(c) };
  }
  if (b.tray.length) {
    for (const c of sim.customers) {
      if (c.state === 'waitingFood' && c.seat && inZone(seatOf(c).zone)) return { kind: 'serve', customer: c, point: standOf(c) };
    }
  }
  for (const tb of sim.tables) {
    if (tb.money > 0 && inZone(LAYOUT.tables[tb.id].zone)) return { kind: 'collect', table: tb, point: LAYOUT.tables[tb.id].collect };
  }
  for (const c of sim.customers) {
    if (c.state === 'waitingFood' && c.seat && inZone(seatOf(c).zone)) return { kind: 'rehear', customer: c, point: standOf(c) };
  }
  if (sim.pass.length && b.tray.length < CFG.trayCapacity && inZone(LAYOUT.pass.zone)) return { kind: 'pass', point: LAYOUT.pass };
  if (inZone(LAYOUT.station.zone)) return { kind: 'station', point: LAYOUT.station };
  if (b.tray.length && inZone(LAYOUT.bin.zone)) return { kind: 'bin', point: LAYOUT.bin };
  return null;
}

function interact() {
  const t = findTarget();
  if (!t) return;
  const b = sim.bud;
  if (t.kind === 'order') openTableView(t.party);
  else if (t.kind === 'serve') serve(t.customer);
  else if (t.kind === 'rehear') openRehear(t.customer);
  else if (t.kind === 'collect') {
    const amount = t.table.money;
    t.table.money = 0;
    sim.tips += amount;
    sim.stats.collected += amount;
    emit('moneyCollected', { tableId: t.table.id, amount, tips: sim.tips });
    playSound('collect');
    updateTier();
  } else if (t.kind === 'pass') {
    const id = sim.pass.shift();
    ticketOf(id).where = 'tray';
    b.tray.push(id);
    emit('ticketCollected', { ticketId: id });
    playSound('tray');
    releaseNext();
  } else if (t.kind === 'station') {
    b.vx = b.vy = 0;
    setMode('station');
    sim.ui.station = { row: 0, col: 0, drink: null };
    emit('stationOpen', {});
  } else if (t.kind === 'bin') {
    const id = b.tray.shift();
    ticketOf(id).where = 'bin';
    sim.stats.discarded++;
    emit('trayDiscard', { ticketId: id });
    playSound('bin');
  }
}

const seatedIds = p => p.customerIds.filter(id => byId(id).seat).sort((a, b) => byId(a).seat.index - byId(b).seat.index);
function openTableView(p) {
  const ids = p.customerIds.filter(id => byId(id).state === 'waitingOrder');
  for (const id of ids) byId(id).state = 'ordering';
  sim.bud.vx = sim.bud.vy = 0;
  setMode('tableView');
  sim.ui.tableView = { partyId: p.id, rehear: false, faceIds: seatedIds(p), customerIds: ids, phase: 'in', idx: -1, skipped: 0, untilTick: sim.tick + TICKS(CFG.cutSec) };
  emit('tableViewEnter', { partyId: p.id, rehear: false });
}
function openRehear(c) {
  const p = partyOf(c);
  c.patienceTicks = Math.max(0, c.patienceTicks - Math.round(c.patienceMaxTicks * CFG.rehearPatienceCost));
  sim.stats.reheard++;
  sim.bud.vx = sim.bud.vy = 0;
  setMode('tableView');
  sim.ui.tableView = { partyId: p.id, rehear: true, faceIds: seatedIds(p), customerIds: [c.id], phase: 'in', idx: -1, skipped: 0, untilTick: sim.tick + TICKS(CFG.cutSec) };
  emit('tableViewEnter', { partyId: p.id, rehear: true, customerId: c.id });
}
// A customer's voice seed depends only on who they are, so asking again replays the same utterance.
const voiceSeed = c => Math.imul(c.id ^ 0x5f3759df, 0x9e3779b1) >>> 0;
/* THE SKIP. One press of the act key — SPACE, or the lower-right pad on MOBILE — collapses whatever this screen is
   currently waiting on, so a player who has already read the order does not sit through the rest of its timer. It
   does that by bringing the phase's deadline forward to now, which means the state machine below runs its NEXT
   transition on this very tick and nothing else about the sequence changes: every customer still passes through
   their own `bubble` phase, which is where an order is generated and where `orderShown` is emitted, so skipping
   cannot leave a customer without an order or the simulation without an event.
   What a press does depends on where it lands, and all three are the same "stop waiting":
     in      - cut straight in instead of finishing the fade
     think   - drop the lead-in and show the order now
     bubble  - done reading: move to the next customer of the party, or leave if that was the last
   The `out` fade is deliberately NOT skippable. It is 0.4 s, it is the cut back to the floor, and collapsing it
   replaces a transition with a pop for no time worth having.
   P.act is an edge — clearEdges() runs at the end of every tick — so a held key advances one phase, not all of
   them, and the press that OPENED this screen was consumed on the floor tick before it. */
function updateTableView(P) {
  const tv = sim.ui.tableView;
  if (tv.rehear && tv.phase !== 'out') {
    const c = byId(tv.customerIds[0]);
    if (!c || c.state !== 'waitingFood') { tv.phase = 'out'; tv.untilTick = sim.tick + TICKS(CFG.cutSec); return; }
  }
  if (P && P.act && tv.phase !== 'out') {
    tv.untilTick = sim.tick;
    tv.skipped++;
    emit('tableViewSkip', { partyId: tv.partyId, phase: tv.phase, idx: tv.idx });
  }
  if (sim.tick < tv.untilTick) return;
  if (tv.phase === 'in' || (tv.phase === 'bubble' && tv.idx + 1 < tv.customerIds.length)) {
    tv.phase = 'think';
    tv.idx++;
    tv.untilTick = sim.tick + TICKS(tv.rehear ? CFG.rehearWaitSec : CFG.leadInSec);
    const vc = byId(tv.customerIds[tv.idx]);
    if (vc) playSound('voice', { speciesId: vc.speciesId, seed: voiceSeed(vc), customerId: vc.id });
  } else if (tv.phase === 'think') {
    tv.phase = 'bubble';
    tv.untilTick = sim.tick + TICKS(CFG.bubbleSec);
    const c = byId(tv.customerIds[tv.idx]);
    if (tv.rehear) {
      emit('orderReheard', { partyId: tv.partyId, customerId: c.id, drink: c.order.drink, plate: c.order.plate });
    } else {
      c.order = { drink: sim.rng.int(CFG.drinks), plate: sim.rng.int(CFG.plates) };
      c.orderedAtTick = sim.tick;
      emit('orderShown', { partyId: tv.partyId, customerId: c.id, drink: c.order.drink, plate: c.order.plate });
    }
  } else if (tv.phase === 'bubble') {
    tv.phase = 'out';
    tv.untilTick = sim.tick + TICKS(CFG.cutSec);
  } else {
    if (!tv.rehear) {
      const food = TICKS(curve(shiftSeconds(), CFG.foodCurve));
      for (const id of tv.customerIds) {
        const c = byId(id);
        c.state = 'waitingFood';
        c.patienceTicks = c.patienceMaxTicks = patienceFor(c, food, true);
        c.angerLevel = 0;
      }
    }
    sim.ui.tableView = null;
    setMode('floor');
    emit('tableViewExit', { partyId: tv.partyId, rehear: tv.rehear });
  }
}

function updateStation(P) {
  const u = sim.ui.station;
  /* A DIRECT TAP on a box, which is what MOBILE sends instead of walking the cursor there with the arrows. Ten
     boxes in a 2 x 5 grid is the one screen in the game where emulating arrow presses would be absurd, and the
     boxes are 66 canvas px, far larger than any thumb needs. It moves the cursor to the tapped box and then falls
     through into the ordinary act path below, so a tap and a walked-to-and-confirmed press take the SAME route
     through this function: the same drink latch, the same ticket, the same event. */
  let tapped = -1;
  for (let i = 0; i < 10 && tapped < 0; i++) if (P['cell' + i]) tapped = i;
  if (tapped >= 0) {
    u.row = (tapped / 5) | 0;
    u.col = tapped % 5;
    P.act = true;
  } else {
    if (P.left) u.col = Math.max(0, u.col - 1);
    if (P.right) u.col = Math.min(4, u.col + 1);
    if (P.up) u.row = 0;
    if (P.down) u.row = 1;
  }
  if (!P.act) return;
  if (u.col === 4) { sim.ui.station = null; setMode('floor'); emit('stationCancel', {}); return; }
  if (u.row === 0) { u.drink = u.col; u.row = 1; return; }
  if (u.drink === null) return;
  const t = { id: sim.nextId++, drink: u.drink, plate: u.col, enteredTick: sim.tick, readyTick: sim.tick + TICKS(CFG.cookSec), where: 'kitchen' };
  sim.tickets.push(t);
  sim.kitchen.push(t.id);
  sim.stats.ticketsEntered++;
  sim.ui.station = null;
  setMode('floor');
  emit('ticketEntered', { ticketId: t.id, drink: t.drink, plate: t.plate });
  playSound('ticket');
}
function updateKitchen() {
  while (sim.kitchen.length && sim.pass.length < CFG.passCapacity) {
    const t = ticketOf(sim.kitchen[0]);
    if (sim.tick < t.readyTick) break;
    sim.kitchen.shift();
    t.where = 'pass';
    sim.pass.push(t.id);
    emit('ticketReady', { ticketId: t.id });
    playSound('bell');
  }
}
function serve(c) {
  const tray = sim.bud.tray;
  let i = tray.findIndex(id => { const t = ticketOf(id); return t.drink === c.order.drink && t.plate === c.order.plate; });
  const correct = i >= 0;
  if (!correct) i = 0;
  const t = ticketOf(tray.splice(i, 1)[0]);
  t.where = 'served';
  const tip = correct ? CFG.tipBase + Math.round(CFG.tipSpeed * c.patienceTicks / c.patienceMaxTicks) : 0;
  c.pendingTip = tip;
  sim.stats.awarded += tip;
  if (correct) sim.stats.served++; else sim.stats.misServed++;
  c.state = 'eating';
  c.servedAtTick = sim.tick;
  c.eatUntil = sim.tick + TICKS(CFG.eatSec);
  emit('served', { customerId: c.id, ticketId: t.id, drink: t.drink, plate: t.plate, correct, tip });
  if (correct) playSound('serve');
  else { playSound('wrong'); beatOnce('wrong'); }
}
// Every sound is logged as an event except footsteps (quiet), which would flood the event log.
function playSound(name, arg, quiet) {
  if (AUDITING) return;                              // an audit's private simulation makes no sound and moves no counter
  if (!quiet) emit('sound', Object.assign({ name }, arg || {}));
  Sound.play(name, arg);
}

// species2: test hooks only (a gallery with two different species at one table). Normal play passes one species.
// `table` null means the room is full and this party joins the waiting line instead: no table, no seats, no patience
// and no anger until a table frees and seatParty() runs. Seat indices are drawn then, not now.
function spawnParty(speciesId, pair, table, species2) {
  const queued = !table;
  const p = { id: sim.nextId++, tableId: queued ? null : table.id, customerIds: [], queuedTick: queued ? sim.tick : null };
  if (!queued) table.partyId = p.id;
  sim.parties.push(p);
  const slot0 = queued ? queuedCount() : 0;
  const seatIdx = queued ? (pair ? [0, 1] : [0]) : (pair ? [0, 1] : [sim.rng.int(2)]);
  seatIdx.forEach((index, k) => {
    const seatPt = queued ? queueSlotPt(slot0 + k) : LAYOUT.tables[table.id].seats[index];
    const c = {
      id: sim.nextId++, speciesId: k === 1 && species2 ? species2 : speciesId, partyId: p.id,
      seat: queued ? null : { tableId: table.id, index },
      x: LAYOUT.door.x - k * 12, y: LAYOUT.door.y, state: queued ? 'queued' : 'entering', arrived: false, order: null,
      patienceTicks: 0, patienceMaxTicks: 1, angerLevel: 0, orderedAtTick: null, servedAtTick: null, eatUntil: null,
      pendingTip: 0, fromTable: null, repathTick: 0, kb: null,
      // The line runs along an empty strip of floor, so it needs no nav search: in through the door, then along the wall.
      path: queued ? [{ x: LAYOUT.doorInside.x, y: LAYOUT.doorInside.y }, seatPt]
                   : [{ x: LAYOUT.doorInside.x, y: LAYOUT.doorInside.y }].concat(navPath(LAYOUT.doorInside, seatPt)),
    };
    sim.customers.push(c);
    p.customerIds.push(c.id);
  });
  sim.stats.spawned += seatIdx.length;
  if (queued) sim.queue.push(p.id);
  // The queued form carries an extra field, so the event a non-queued spawn emits is byte-identical to game_016's.
  emit('partySpawned', queued ? { partyId: p.id, tableId: null, speciesId, customerIds: p.customerIds.slice(), queued: true }
                              : { partyId: p.id, tableId: table.id, speciesId, customerIds: p.customerIds.slice() });
  return p;
}
// Attacking species run out of patience sooner (CFG.fighterPatience), so a shift has fights in it; the shift's hothead sooner still.
const patienceFor = (c, ticks, food) => {
  if (c.id === sim.shift.hothead) return TICKS(food ? CFG.hotheadFoodSec : CFG.hotheadGreetSec);
  return SHIFT_FIGHTERS[c.speciesId] ? Math.max(1, Math.round(ticks * curve(shiftSeconds(), CFG.fighterPatience))) : ticks;
};
function seatParty(p) {
  const greet = TICKS(curve(shiftSeconds(), CFG.greetCurve));
  for (const id of p.customerIds) {
    const c = byId(id), seat = LAYOUT.tables[c.seat.tableId].seats[c.seat.index];
    c.x = seat.x; c.y = seat.y;
    c.state = 'waitingOrder';
    if (SHIFT_FIGHTERS[c.speciesId] && sim.shift.hothead === null && !sim.lab && shiftSeconds() >= CFG.hotheadAfterSec) {
      sim.shift.hothead = c.id;
      emit('hothead', { customerId: c.id, speciesId: c.speciesId });
    }
    c.patienceTicks = c.patienceMaxTicks = patienceFor(c, greet, false);
    c.angerLevel = 0;
    emit('customerSeated', { customerId: c.id });
  }
}
function walk(c, speed) {
  const tgt = c.path[0], dx = tgt.x - c.x, dy = tgt.y - c.y, d = Math.hypot(dx, dy), step = (speed || CFG.customerSpeed) / 60;
  if (d <= step) { c.x = tgt.x; c.y = tgt.y; c.path.shift(); }
  else { c.x += dx / d * step; c.y += dy / d * step; }
}
// A customer gets up from its seat. When nobody of the party is still seated, the table is free for the next party.
function vacate(c) {

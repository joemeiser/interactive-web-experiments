      tap('right'); if (diffIdx !== 1) note(`difficulty: RIGHT at the title left the selection on ${LEVELS[diffIdx].name}`);
      tap('right'); tap('right'); if (diffIdx !== 2) note(`difficulty: RIGHT past HARD wrapped to ${LEVELS[diffIdx].name}`);
      tap('left'); tap('left'); tap('left'); if (diffIdx !== 0) note(`difficulty: LEFT past EASY wrapped to ${LEVELS[diffIdx].name}`);
      tap('diff2'); if (diffIdx !== 2) note('difficulty: the HARD segment does not select HARD');
      tap('diff1'); if (diffIdx !== 1) note('difficulty: the MEDIUM segment does not select MEDIUM');
      tap('diff0'); if (diffIdx !== 0) note('difficulty: the EASY segment does not select EASY');
      key('ArrowRight'); if (diffIdx !== 1) note('difficulty: the real ArrowRight key does not move the selection');
      key('KeyD'); if (diffIdx !== 2) note('difficulty: D does not move the selection');
      if (sim.mode !== 'title') note(`difficulty: choosing a level left the title (mode ${sim.mode})`);
      if (sim.shift.startTick !== null) note('difficulty: choosing a level started the shift clock');
      tap('act');
      if (sim.mode !== 'floor') note(`difficulty: SPACE after using the selector went to ${sim.mode}, not into the shift`);
      if (sim.difficulty !== 2) note(`difficulty: the shift SPACE started is on ${LEVELS[sim.difficulty].name}, not the level that was selected`);
      Input.heldCodes.clear();
      Input.queue.length = 0;

      // ---- 7b. the three segment buttons, as DOM: where they are, and that they let go of the keyboard ----
      // A synthetic click runs the REAL listener — the blur, the Sound.unlock, the Input.tap, all of it. What it
      // cannot prove is that a hardware pointer lands where the box says; that is what the `sizes` run proves for
      // INSTRUCTIONS, and it could not be done for these three from a bot that could not be edited. So the box is
      // measured against the drawn segment here instead, at whatever viewport the page is open at.
      diffIdx = 0;
      reset(14, false);
      const cbox = el => {
        const b = el.getBoundingClientRect(), c = cv.getBoundingClientRect();
        return { x: (b.left - c.left) / c.width * W, y: (b.top - c.top) / c.height * H, w: b.width / c.width * W, h: b.height / c.height * H };
      };
      for (let i = 0; i < diffBtns.length; i++) {
        const btn = diffBtns[i], S = DIFF_SEG[i];
        if (btn.hidden) note(`difficulty: the ${S.name} button is hidden on the title`);
        if (btn.tabIndex !== -1) note(`difficulty: the ${S.name} button is reachable by TAB (tabIndex ${btn.tabIndex}) — SPACE could land on it instead of the shift`);
        const b = cbox(btn), slop = Math.max(Math.abs(b.x - S.x), Math.abs(b.y - S.y), Math.abs(b.w - S.w), Math.abs(b.h - S.h));
        if (slop > 1.5) note(`difficulty: the ${S.name} hit area is ${b.x.toFixed(1)},${b.y.toFixed(1)} ${b.w.toFixed(1)}x${b.h.toFixed(1)} against a drawn ${S.x},${S.y} ${S.w}x${S.h} (${slop.toFixed(2)} px out)`);
      }
      for (let i = diffBtns.length - 1; i >= 0; i--) {
        diffBtns[i].click();
        stepSim();
        if (diffIdx !== i) note(`difficulty: clicking ${DIFF_SEG[i].name} selected ${LEVELS[diffIdx].name}`);
        if (document.activeElement === diffBtns[i]) note(`difficulty: the ${DIFF_SEG[i].name} button kept focus after a click — SPACE would press it again`);
      }
      if (sim.mode !== 'title') note(`difficulty: clicking a segment left the title (mode ${sim.mode})`);
      Input.tap('act');
      stepSim();
      if (sim.mode !== 'floor') note(`difficulty: SPACE after clicking a segment went to ${sim.mode}, not into the shift`);

      // ---- 7c. the choice survives the restart a player actually uses: R on the end screen ----
      diffIdx = 0;
      reset(15, false);
      setDifficulty(2);
      Input.tap('act');
      stepSim();
      if (sim.mode !== 'floor' || sim.difficulty !== 2) note(`difficulty: starting a shift from HARD gave mode ${sim.mode} on ${LEVELS[sim.difficulty].name}`);
      killBud({ speciesId: 3, tableId: 1 });
      if (sim.mode !== 'shiftEnd') note(`difficulty: the ending did not come up (mode ${sim.mode})`);
      else if (Story.epilogue().difficulty !== 'hard') note(`difficulty: the ending reports ${Story.epilogue().difficulty}, not the level it was played on`);
      Input.tap('restart');
      stepSim();
      stepSim();
      if (sim.mode !== 'title') note(`difficulty: R at the ending went to ${sim.mode}, not the title`);
      if (diffIdx !== 2 || sim.difficulty !== 2) note(`difficulty: R at the ending put the level back to ${LEVELS[diffIdx].name}`);
      Input.tap('act');
      stepSim();
      if (sim.difficulty !== 2) note(`difficulty: the shift after a restart is on ${LEVELS[sim.difficulty].name}`);

      // ---- 8. all thirty epilogues ----
      for (let i = 0; i < LEVELS.length; i++) {
        diffIdx = i;
        reset(20 + i, true);
        sim.difficulty = i;
        for (const kind of ['survived', 'died']) for (let tier = 0; tier <= 4; tier++) {
          const tips = tier ? CFG.tiers[tier - 1] + 41 : 11;
          sim.tier = tier;
          sim.tips = tips;
          sim.ending = { kind, tier, tips, lost: 34, cause: kind === 'died' ? { speciesId: 17, tableId: 4 } : null, startTick: sim.tick };
          const E = Story.epilogue(), lead = `ON ${LEVELS[i].name},`, where = `${kind} tier ${tier} on ${LEVELS[i].name}`;
          if (E.close.indexOf(lead) !== 0) note(`difficulty: the ${where} epilogue opens "${E.close.slice(0, 30)}", not with the level`);
          if (E.difficulty !== LEVELS[i].key) note(`difficulty: the ${where} epilogue reports ${E.difficulty}`);
          // the departures board: rows at 91 + i*gap, 13 px each, inside a board that ends at y 238
          const rows = wrapLines([E.title, ...E.lines, E.close, E.left].filter(Boolean), 72);
          const gap = rows.length > 9 ? 13 : 15, bottom = 91 + (rows.length - 1) * gap + 13;
          if (bottom > 238) note(`difficulty: the ${where} board is ${rows.length} rows and runs to y ${bottom}, past 238`);
          for (const l of rows) {
            if (44 + l.length * 8 > 628) note(`difficulty: the ${where} board row "${l.slice(0, 20)}..." is ${l.length * 8} px wide`);
            const bad = [...new Set([...l].filter(c => !(c in FONT)))];
            if (bad.length) note(`difficulty: the ${where} epilogue has no glyph for ${JSON.stringify(bad.join(''))}`);
          }
          // the card: body at 84 + i*15, close under it, left under that, and the stats line waiting at y 250
          const body = wrapLines(E.lines, 90), cl = wrapLines([E.close], 90), lf = E.left ? wrapLines([E.left], 90) : [];
          const lastY = (lf.length ? 108 + body.length * 15 + cl.length * 12 + (lf.length - 1) * 12
            : 96 + body.length * 15 + (cl.length - 1) * 12) + 7;
          if (lastY > 245) note(`difficulty: the ${where} card runs to y ${lastY}, into the stats line at 250`);
        }
      }
    } catch (e) {
      note('difficulty: audit threw — ' + String(e && e.message || e));
    }
    // put the real world back exactly as it was found
    TEXT_LOG = null;
    AUDITING = false;
    sim = realSim;
    diffIdx = realIdx;
    Intro.played = realPlayed;
    Input.heldCodes.clear();
    for (const c of held) Input.heldCodes.add(c);
    Input.queue.length = 0;
    rebuildBodies();
    UI.onMode(sim.mode);
    return { ok: problems.length === 0, problems: problems.concat(notes) };
  },
};

/* ==== THE WAITING-LINE AUDIT ====================================================================================
   Same method as Difficulty.audit(): a PRIVATE simulation, driven through the real stepSim(), with AUDITING on so
   nothing reaches a subscriber or a sound counter, and the real `sim` put back afterwards. Bud stands where the
   shift drops him and does nothing, and is topped back up to full health every tick so a death cannot truncate one
   level's run and not another's. Tables still free themselves, because unserved customers run out of patience and
   leave — so this is a busy room, not a frozen one.

   What it measures, and nothing else: arrivals in the first 90 seconds per level, the line's length over a shift
   per level, that nobody in the line ever angers / walks out / attacks, that the line never blocks Bud, and that
   the nav invariant still holds with a full line standing on the floor. */
const Queue = {
  SEEDS: [7, 31, 4242],
  run(i, seed) {
    diffIdx = i;
    reset(seed, true);
    sim.difficulty = i;
    const r = { at90: 0, arrivals: 0, maxQ: 0, sumQ: 0, samples: 0, seated: 0, angered: 0, escaped: 0, obstacleDrift: 0, navMiss: 0 };
    const was = {};
    const end = TICKS(CFG.shiftSec);
    for (let k = 0; k < end * 2 && sim.mode !== 'shiftEnd'; k++) {
      sim.bud.health = CFG.health;
      sim.bud.dead = false;
      stepSim();
      if (sim.shift.startTick === null) continue;
      const t = sim.tick - sim.shift.startTick;
      if (t < 0) continue;
      if (t <= TICKS(90)) r.at90 = sim.stats.spawned;
      const q = queuedCount();
      r.maxQ = Math.max(r.maxQ, q);
      r.sumQ += q;
      r.samples++;
      // Nobody in the line may anger, and nobody may leave it except by being seated.
      for (const c of sim.customers) {
        if (c.state === 'queued' && (c.angerLevel !== 0 || c.patienceTicks !== 0)) r.angered++;
        if (was[c.id] === 'queued' && c.state !== 'queued' && c.state !== 'entering') r.escaped++;
        was[c.id] = c.state;
      }
      // The line is people, not furniture: OBSTACLES is fixtures plus blocking bodies and never anything else.
      if (OBSTACLES.length !== LAYOUT.obstacles.length + sim.bodies.filter(b => b.blocks).length) r.obstacleDrift++;
      if (t % 30 === 0 && unreachable(BODY_MASK, sim.bud).length) r.navMiss++;
      if (t >= end) break;
    }
    r.arrivals = sim.stats.spawned;
    r.meanQ = r.samples ? +(r.sumQ / r.samples).toFixed(2) : 0;
    return r;
  },
  // Hold RIGHT and walk Bud the length of a standing line, from behind its back to past its head. Customers have
  // never been obstacles, so this should be an unobstructed walk; if the line blocked him he would stall.
  walkThrough() {
    const cap = queueCap(), y = CFG.queueY;
    const x0 = queueSlotPt(cap - 1).x - 30, x1 = queueSlotPt(0).x + 20;
    // Isolate the thing under test: a fight or an open table view would stop him for reasons that have nothing to
    // do with the line. Everything else about the floor — the line included — is left exactly as the shift left it.
    sim.fight = null;
    sim.ui.tableView = null;
    sim.ui.station = null;
    setMode('floor');
    sim.bud.x = x0; sim.bud.y = y; sim.bud.vx = 0; sim.bud.vy = 0; sim.bud.kb = null; sim.bud.stun = 0; sim.bud.swing = null;
    Input.keyDown('ArrowRight', null);
    let ticks = 0;
    for (; ticks < 900 && sim.bud.x < x1 && sim.mode === 'floor'; ticks++) stepSim();
    Input.keyUp('ArrowRight', null);
    stepSim();
    return { from: +x0.toFixed(1), to: +x1.toFixed(1), reached: +sim.bud.x.toFixed(1), ticks, crossed: sim.bud.x >= x1, passed: queuedCount() };
  },
  audit() {
    const problems = [], note = s => problems.push(s), notes = [];
    const realSim = sim, realIdx = diffIdx, realPlayed = Intro.played;
    const held = Array.from(Input.heldCodes);
    const report = { levels: [], walk: null };
    try {
      AUDITING = true;
      Intro.played = true;
      for (let i = 0; i < LEVELS.length; i++) {
        const rs = this.SEEDS.map(s => this.run(i, s));
        const sum = f => rs.reduce((a, x) => a + f(x), 0);
        const row = {
          level: LEVELS[i].name, cap: LEVELS[i].queueMax, pace: LEVELS[i].pace,
          first90: +(sum(x => x.at90) / rs.length).toFixed(1), first90Each: rs.map(x => x.at90),
          arrivals: +(sum(x => x.arrivals) / rs.length).toFixed(1), arrivalsEach: rs.map(x => x.arrivals),
          maxQueue: Math.max(...rs.map(x => x.maxQ)), meanQueue: +(sum(x => x.meanQ) / rs.length).toFixed(2),
          angered: sum(x => x.angered), escaped: sum(x => x.escaped),
          obstacleDrift: sum(x => x.obstacleDrift), navMiss: sum(x => x.navMiss),
        };
        report.levels.push(row);
        if (row.angered) note(`queue: ${row.angered} ticks on ${row.level} with a customer angry while standing in the line`);
        if (row.escaped) note(`queue: ${row.escaped} customers left the line on ${row.level} by something other than being seated`);
        if (row.obstacleDrift) note(`queue: OBSTACLES grew beyond fixtures + blocking bodies on ${row.level} (${row.obstacleDrift} ticks) — the line is blocking the floor`);
        if (row.navMiss) note(`queue: ${row.navMiss} samples on ${row.level} where a nav target or Bud was unreachable`);
        if (LEVELS[i].queueMax === 0 && row.maxQueue !== 0) note(`queue: ${row.level} has cap 0 but the line reached ${row.maxQueue}`);
        if (row.maxQueue > LEVELS[i].queueMax) note(`queue: ${row.level} exceeded its cap — ${row.maxQueue} standing against a cap of ${LEVELS[i].queueMax}`);
      }
      const L = report.levels;
      if (!(L[1].first90 > L[0].first90) || !(L[2].first90 > L[1].first90)) {
        note(`queue: arrivals in the first 90s do not rise with the level — ${L.map(x => `${x.level} ${x.first90}`).join(', ')}`);
      }
      if (!(L[1].arrivals > L[0].arrivals) || !(L[2].arrivals > L[1].arrivals)) {
        note(`queue: arrivals over a shift do not rise with the level — ${L.map(x => `${x.level} ${x.arrivals}`).join(', ')}`);
      }
      // Bud through a standing line, on HARD, at the moment it is longest.
      const pk = this.peak(2, 4242);
      diffIdx = 2;
      reset(4242, true);
      sim.difficulty = 2;
      for (let k = 0; k < TICKS(CFG.shiftSec) && sim.tick < pk.atTick; k++) { sim.bud.health = CFG.health; sim.bud.dead = false; stepSim(); }
      report.walk = Object.assign({ standing: queuedCount(), peak: pk.best, cap: queueCap() }, this.walkThrough());
      if (report.walk.standing < 2) note(`queue: HARD's line never reached 2 in a shift (peak ${report.walk.standing})`);
      if (!report.walk.crossed) note(`queue: Bud could not walk the length of the line — from x ${report.walk.from} he reached ${report.walk.reached} of ${report.walk.to} in ${report.walk.ticks} ticks`);
      notes.push(`queue (note): first 90s arrivals — ${L.map(x => `${x.level} ${x.first90}`).join(', ')}; over a shift — ${L.map(x => `${x.level} ${x.arrivals}`).join(', ')} (${this.SEEDS.length} seeds, idle and unserved)`);
      notes.push(`queue (note): line length — ${L.map(x => `${x.level} max ${x.maxQueue} mean ${x.meanQueue} (cap ${x.cap})`).join(', ')}`);
      notes.push(`queue (note): in the line, ${L.reduce((a, x) => a + x.angered, 0)} angry ticks, ${L.reduce((a, x) => a + x.escaped, 0)} left by any route but a seat, ${L.reduce((a, x) => a + x.obstacleDrift, 0)} ticks of obstacle drift, ${L.reduce((a, x) => a + x.navMiss, 0)} nav misses`);
      notes.push(`queue (note): Bud walked x ${report.walk.from} -> ${report.walk.reached} (target ${report.walk.to}) past ${report.walk.standing} standing customers in ${report.walk.ticks} ticks`);
    } catch (e) {
      note('queue: audit threw — ' + String(e && e.message || e));
    }
    AUDITING = false;
    sim = realSim;
    diffIdx = realIdx;
    Intro.played = realPlayed;
    Input.heldCodes.clear();
    for (const c of held) Input.heldCodes.add(c);
    Input.queue.length = 0;
    rebuildBodies();
    UI.onMode(sim.mode);
    return { ok: problems.length === 0, problems: problems.concat(notes), report };
  },
  // The tick at which the line is at its longest in a shift on this level and seed, and how long it gets. The cap is
  // a ceiling, not a target: HARD's 10 is not reached in practice, so "a full line" means the line at its peak.
  // Deterministic, so the run that finds the peak and the run that stops at it see the same shift.
  peak(level, seed) {
    diffIdx = level;
    reset(seed >>> 0, true);
    sim.difficulty = level;
    let best = 0, atTick = 0;
    for (let k = 0; k < TICKS(CFG.shiftSec) && sim.mode !== 'shiftEnd'; k++) {
      sim.bud.health = CFG.health;
      sim.bud.dead = false;
      stepSim();
      const q = queuedCount();
      if (q > best) { best = q; atTick = sim.tick; }
    }
    return { best, atTick };
  },
  // Put the REAL game on a level and play it to the moment its line is longest, for a screenshot. Not an audit:
  // this one is meant to be looked at.
  stage(level, seed) {
    const realIdx = diffIdx;
    let pk;
    try { AUDITING = true; pk = this.peak(level, seed >>> 0); } finally { AUDITING = false; diffIdx = realIdx; }
    reset(seed >>> 0, false);
    setDifficulty(level);
    reset(seed >>> 0, true);
    for (let k = 0; k < TICKS(CFG.shiftSec) && sim.tick < pk.atTick; k++) {
      sim.bud.health = CFG.health;
      sim.bud.dead = false;
      stepSim();
    }
    render();
    return { level: LEVELS[sim.difficulty].name, standing: queuedCount(), peak: pk.best, cap: queueCap(),
             seconds: +(shiftSeconds()).toFixed(1), tables: sim.tables.filter(t => t.partyId !== null).length,
             slots: sim.customers.filter(c => c.state === 'queued').map(c => [Math.round(c.x), Math.round(c.y)]) };
  },
};

/* ==== THE DEVICE AUDIT ==========================================================================================
   MOBILE adds a control scheme. This proves it adds nothing else.

   The claim that matters is the negative one: DESKTOP still plays the game game_018 shipped, tick for tick. That
   is not asserted here, it is DERIVED — the simulation never reads which scheme is selected, so it cannot branch
   on it, so a shift played in MOBILE and the same seed played in DESKTOP are the same shift. Check 1 proves the
   premise by reading the source between the SIM markers; check 2 proves the conclusion by running it.

   The rest is the control itself: that the bottom row of the title holds three boxes that do not touch, that the
   recommendation is drawn on both settings rather than waiting for a hover a touchscreen can never give it, that
   the thumbstick sends exactly the arrow codes the keyboard would, that letting go stops Bud, that the ORDER
   station's ten boxes are where the fingers land, and that none of it can reach the game from DESKTOP. */
const Device = {
  audit() {
    const problems = [], note = s => problems.push(s), notes = [];
    const realSim = sim, realDev = devIdx, realIdx = diffIdx, realPlayed = Intro.played;
    const held = Array.from(Input.heldCodes);
    try {
      AUDITING = true;
      Intro.played = true;

      // ---- 1. the simulation cannot see the control scheme ----
      const src = Array.prototype.map.call(document.scripts, s => s.textContent).join('\n').split('\n');
      const a0 = src.findIndex(l => /==== SIM BEGIN ====/.test(l)), a1 = src.findIndex(l => /==== SIM END ====/.test(l));
      if (a0 < 0 || a1 <= a0) note('device: could not find the SIM markers');
      else {
        // Strip comments by tracking /* */ across lines rather than by guessing from the first character: the
        // block above this very function contains the sentence "Nothing in the simulation reads devIdx", and a
        // line-shaped guess reads that prose as code and fails on its own documentation.
        const body = src.slice(a0 + 1, a1), code = [];
        let inBlock = false;
        for (const raw of body) {
          let l = raw, out = '';
          while (l.length) {
            if (inBlock) {
              const e = l.indexOf('*/');
              if (e < 0) { l = ''; break; }
              inBlock = false; l = l.slice(e + 2);
            } else {
              const b = l.indexOf('/*'), c = l.indexOf('//');
              if (c >= 0 && (b < 0 || c < b)) { out += l.slice(0, c); l = ''; break; }
              if (b < 0) { out += l; l = ''; break; }
              out += l.slice(0, b); inBlock = true; l = l.slice(b + 2);
            }
          }
          if (out.trim()) code.push(out);
        }
        // setDevice is the SETTER and lives here beside setDifficulty, so `devIdx` appearing on its own lines is
        // expected. What must not exist anywhere in here is a READ that changes what the game does: touchUI(),
        // DEV_SEG, TOUCH or the Touch object steering a branch.
        const reads = code.filter(l => /\btouchUI\s*\(|\bDEV_SEG\b|\bTOUCH\b|\bACT_KEY\s*\(/.test(l));
        if (reads.length) note(`device: the simulation reads the control scheme on ${reads.length} line(s): ${reads.map(l => l.trim()).join(' | ')}`);
        const setterFrom = code.findIndex(l => /function setDevice\s*\(/.test(l));
        const outside = code.filter((l, i) => /\bdevIdx\b/.test(l) && (setterFrom < 0 || i < setterFrom || i > setterFrom + 12));
        if (outside.length) note(`device: devIdx is touched outside setDevice: ${outside.map(l => l.trim()).join(' | ')}`);
        const touchCalls = code.filter(l => /\bTouch\s*\./.test(l) && !/Touch\.clear\(\)/.test(l));
        if (touchCalls.length) note(`device: the simulation calls into the touch layer: ${touchCalls.map(l => l.trim()).join(' | ')}`);
        notes.push(`sim section: ${code.length} lines of code, 0 reads of the control scheme`);
      }

      // ---- 2. and therefore a shift is the same shift on either scheme ----
      for (const seed of [7, 4242]) {
        const play = dev => {
          devIdx = dev;
          diffIdx = 0;
          reset(seed, true);
          for (let k = 0; k < 2400; k++) stepSim();
          return { hash: sim.eventHash >>> 0, tick: sim.tick, spawned: sim.stats.spawned, served: sim.stats.served,
            tips: sim.stats.collected, health: sim.bud.health };
        };
        const m = play(0), d = play(1);
        if (JSON.stringify(m) !== JSON.stringify(d)) note(`device: seed ${seed} diverges between MOBILE ${JSON.stringify(m)} and DESKTOP ${JSON.stringify(d)}`);
      }
      notes.push('two seeds, 40 sim-seconds each: MOBILE and DESKTOP hash identically');

      /* ---- 2b. fullscreen: asked for by a gesture, and never by the simulation ----
         The API refuses a request that is not attached to a trusted press, so the only thing worth asserting in
         code is WHERE the request lives. It must not be inside the SIM markers: the simulation steps on a later
         task than the keypress that caused it, so a request from in there would be refused every time, silently,
         and the feature would look like a browser problem rather than a bug. */
      if (a0 >= 0 && a1 > a0) {
        const simLines = src.slice(a0 + 1, a1).filter(l => /Screen\s*\.\s*request/.test(l));
        if (simLines.length) note(`device: fullscreen is requested from inside the simulation: ${simLines.map(l => l.trim()).join(' | ')}`);
      }
      const asks = src.filter(l => /Screen\.request\(\)/.test(l) && !/^\s*(\/\/|\*)/.test(l));
      if (asks.length !== 2) note(`device: fullscreen is requested from ${asks.length} places, expected 2 (the title key and the START button)`);
      for (const l of asks) if (!/isTrusted/.test(l) && !/e\.isTrusted/.test(src[src.indexOf(l) - 1] || '')) {
        if (!/isTrusted/.test(l)) note(`device: a fullscreen request is not gated on a trusted event: ${l.trim()}`);
      }
      // Nothing asks for it at load: that request would be refused, and a refusal on boot is a console error on
      // every page view for a feature nobody invoked.
      if (Screen.tried) note('device: fullscreen was requested before the player pressed anything');
      // Leaving fullscreen stops the clock, exactly as losing the window does.
      reset(4243, true);
      devIdx = 1;
      for (let k = 0; k < 120; k++) stepSim();
      if (sim.paused) note('device: the shift was already paused before the fullscreen test');
      Screen.entered = true;
      Screen.onChange();
      if (!sim.paused) note('device: leaving fullscreen mid-shift did not pause the game');
      // ...and does nothing rude anywhere else.
      reset(4243, false);
      Screen.entered = true;
      Screen.onChange();
      if (sim.mode !== 'title') note(`device: leaving fullscreen on the title moved the game to ${sim.mode}`);
      Screen.entered = false;

      // ---- 3. the bottom row of the title ----
      const Hb = HELP_BTN, Db = DIFF_BTN, Vb = DEV_BTN;
      if (Vb.y !== Db.y || Vb.h !== Db.h) note(`device: ${Vb.label} is y ${Vb.y} h ${Vb.h}, the selector is y ${Db.y} h ${Db.h}`);
      if (Db.x + Db.w > Vb.x) note(`device: ${Vb.label} (x ${Vb.x}) overlaps the difficulty selector (ends x ${Db.x + Db.w})`);
      if (Hb.x + Hb.w > Db.x) note(`device: INSTRUCTIONS (ends x ${Hb.x + Hb.w}) overlaps the difficulty selector (x ${Db.x})`);
      if (Vb.x + Vb.w > W - 2) note(`device: the bottom row ends at x ${Vb.x + Vb.w} on a ${W} px canvas`);
      let segX = Vb.x;
      for (const S of DEV_SEG) {
        if (S.x !== segX || S.y !== Vb.y || S.h !== Vb.h) note(`device: segment ${S.name} is ${S.x},${S.y} ${S.w}x${S.h}, expected to start at ${segX},${Vb.y}`);
        if (textW(S.name, 1) + 6 > S.w) note(`device: ${S.name} is ${textW(S.name, 1)} px in a ${S.w} px segment`);
        const bad = [...new Set([...S.name + Vb.label + DEV_CAPTION()].filter(c => !(c in FONT)))];
        if (bad.length) note(`device: no glyph for ${JSON.stringify(bad.join(''))}`);
        segX += S.w;
      }
      if (segX !== Vb.x + Vb.w) note(`device: the segments cover ${segX - Vb.x} px of a ${Vb.w} px frame`);
      const capBottom = Vb.y + Vb.h + 15 + 7, capLeft = Vb.x + Vb.w - textW(DEV_CAPTION(), 1);
      if (capBottom > H) note(`device: the recommendation ends at y ${capBottom}, past the ${H} px canvas`);
      if (capLeft < 2) note(`device: the recommendation starts at x ${capLeft}`);
      // MOBILE's START button: it exists, it is inside the canvas, it is clear of the row below it, and the text
      // it frames actually fits inside it.
      // The action pad against the two things drawn along the bottom wall it could cover: the DOOR label and the
      // lose line. Boxes, not eyeballs.
      const padBox = { x: TOUCH.padX - TOUCH.padR, y: TOUCH.padY - TOUCH.padR, w: TOUCH.padR * 2, h: TOUCH.padR * 2 };
      if (padBox.x + padBox.w > W || padBox.y + padBox.h > H || padBox.x < 0 || padBox.y < 0) note(`device: the action pad runs x ${padBox.x}-${padBox.x + padBox.w} y ${padBox.y}-${padBox.y + padBox.h} on a ${W}x${H} canvas`);
      for (const [name, bx, by, bw, bh] of [['the DOOR label', 585, 348, 24, 7], ['the lose line', 60, 349, W - 60, 7]]) {
        if (padBox.x < bx + bw && padBox.x + padBox.w > bx && padBox.y < by + bh && padBox.y + padBox.h > by) note(`device: the action pad covers ${name}`);
      }
      const homeBox = { x: TOUCH.homeX - TOUCH.stickR, y: TOUCH.homeY - TOUCH.stickR, w: TOUCH.stickR * 2, h: TOUCH.stickR * 2 };
      if (homeBox.x < 0 || homeBox.y < 0 || homeBox.x + homeBox.w > W || homeBox.y + homeBox.h > H) note(`device: the resting stick runs x ${homeBox.x}-${homeBox.x + homeBox.w} y ${homeBox.y}-${homeBox.y + homeBox.h}`);
      if (TOUCH.homeX + TOUCH.stickR > W * 0.5) note(`device: the resting stick at x ${TOUCH.homeX} + ${TOUCH.stickR} reaches past the left half it lives in`);
      const SB = START_BTN;
      if (SB.y + SB.h > Db.y) note(`device: the START button ends at y ${SB.y + SB.h}, on top of the control row at y ${Db.y}`);
      if (SB.x < 2 || SB.x + SB.w > W - 2) note(`device: the START button runs x ${SB.x}-${SB.x + SB.w} on a ${W} px canvas`);
      for (const t of [CALL_KEY, CALL_TAP]) {
        const bad = [...new Set([...t].filter(c => !(c in FONT)))];
        if (bad.length) note(`device: no glyph for ${JSON.stringify(bad.join(''))} in ${JSON.stringify(t)}`);
      }
      if (textW(CALL_TAP, 2) + 8 > SB.w) note(`device: ${JSON.stringify(CALL_TAP)} is ${textW(CALL_TAP, 2)} px in a ${SB.w} px button`);

      // The caption is drawn on BOTH settings — that is the whole point of it being a caption and not a tooltip —
      // and the three transparent hit areas sit exactly on the three drawn boxes.
      reset(4243, false);
      for (let i = 0; i < DEVICES.length; i++) {
        devIdx = i;
        TEXT_LOG = [];
        render();
        const b = TEXT_LOG;
        TEXT_LOG = null;
        const strs = b.map(x => x.s);
        if (!strs.includes(DEV_CAPTION())) note(`device: on ${DEVICES[i].name} the title does not draw the recommendation`);
        for (const D of DEVICES) if (!strs.includes(D.name)) note(`device: on ${DEVICES[i].name} the title does not draw the ${D.name} segment`);
        const outs = b.filter(x => x.x < 0 || x.y < 0 || x.x + x.w > W || x.y + x.h > H);
        if (outs.length) note(`device: on ${DEVICES[i].name}, ${outs.map(x => x.s).join(', ')} falls off the canvas`);
        for (let p = 0; p < b.length; p++) for (let q = p + 1; q < b.length; q++) {
          const A = b[p], B = b[q];
          if (A.x < B.x + B.w && A.x + A.w > B.x && A.y < B.y + B.h && A.y + A.h > B.y) note(`device: on ${DEVICES[i].name}, "${A.s}" overlaps "${B.s}"`);
        }
      }
      // Numerically, not as strings: a browser stores 85.55555555555556% back as 85.5556%, and a string compare
      // would call that a drift. A twentieth of a percent of 640 px is a third of a pixel.
      for (let i = 0; i < DEV_SEG.length; i++) {
        const S = DEV_SEG[i], st = devBtns[i].style;
        const want = [S.x / W * 100, S.y / H * 100, S.w / W * 100, S.h / H * 100];
        const got = [st.left, st.top, st.width, st.height].map(parseFloat);
        for (let k = 0; k < 4; k++) {
          if (!(Math.abs(got[k] - want[k]) < 0.05)) note(`device: the ${S.name} hit area is ${got.join(' ')}%, the drawn box is ${want.map(v => v.toFixed(4)).join(' ')}%`);
        }
      }

      {
        const st = btnStart.style;
        const want = [START_BTN.x / W * 100, START_BTN.y / H * 100, START_BTN.w / W * 100, START_BTN.h / H * 100];
        const got = [st.left, st.top, st.width, st.height].map(parseFloat);
        for (let k = 0; k < 4; k++) if (!(Math.abs(got[k] - want[k]) < 0.05)) note(`device: the START hit area is ${got.join(' ')}%, the drawn box is ${want.map(v => v.toFixed(4)).join(' ')}%`);
      }
      // MOBILE must be able to start a shift at all: the canvas deliberately ignores a stray tap, so without the
      // button the title is a dead end on the one device the setting exists for.
      reset(4243, false);
      devIdx = 0;
      UI.onMode('title');
      if (btnStart.hidden) note('device: MOBILE has no START button on the title');
      Input.tap('act'); drainInput(); stepSim();
      if (sim.mode === 'title') note('device: tapping START did not leave the title');
      reset(4243, false);
      devIdx = 1;
      UI.onMode('title');
      if (!btnStart.hidden) note('device: DESKTOP is shown a START button it does not need');

      // ---- 4. picking a scheme, by key and by segment ----
      reset(4243, false);
      devIdx = 1;
      const tap = a => { Input.tap(a); drainInput(); stepSim(); };
      tap('up');    if (devIdx !== 0) note('device: UP on the title does not select MOBILE');
      tap('down');  if (devIdx !== 1) note('device: DOWN on the title does not select DESKTOP');
      tap('dev0');  if (devIdx !== 0) note('device: the MOBILE segment does not select MOBILE');
      tap('dev1');  if (devIdx !== 1) note('device: the DESKTOP segment does not select DESKTOP');
      // The one bug this control could introduce: a selector that eats the key that starts the shift.
      const before = sim.mode;
      tap('up');
      if (sim.mode !== before) note(`device: picking a scheme left the title for ${sim.mode}`);
      if (diffIdx !== realIdx && false) note('unreachable');
      // ...and it cannot be changed once the doors are open.
      reset(4243, true);
      devIdx = 1;
      if (setDevice(0) || devIdx !== 1) note('device: the control scheme can be changed after the doors are open');

      // ---- 5. the thumbstick sends arrow keys, and letting go stops Bud ----
      reset(4243, true);
      devIdx = 0;
      Input.queue.length = 0;
      Input.stickRelease();
      const dirs = [
        [40, 0, ['ArrowRight']], [40, 40, ['ArrowRight', 'ArrowDown']], [0, 40, ['ArrowDown']],
        [-40, 40, ['ArrowLeft', 'ArrowDown']], [-40, 0, ['ArrowLeft']], [-40, -40, ['ArrowLeft', 'ArrowUp']],
        [0, -40, ['ArrowUp']], [40, -40, ['ArrowRight', 'ArrowUp']],
      ];
      for (const [dx, dy, want] of dirs) {
        Touch.stick = { id: 1, ox: 100, oy: 200, x: 100 + dx, y: 200 + dy };
        Touch.sync();
        drainInput();
        const got = Array.from(Input.heldCodes).sort();
        if (got.join() !== want.slice().sort().join()) note(`device: the stick at ${dx},${dy} holds ${got.join('+') || 'nothing'}, expected ${want.join('+')}`);
        const acts = ACTIONS.filter(a => sim.input.held[a]);
        const wantActs = want.map(c => KEYMAP[c]).sort();
        if (acts.slice().sort().join() !== wantActs.join()) note(`device: the stick at ${dx},${dy} produced actions ${acts.join('+')}, expected ${wantActs.join('+')}`);
      }
      // Inside the dead zone: nothing held at all, so a resting thumb does not creep.
      Touch.stick = { id: 1, ox: 100, oy: 200, x: 104, y: 202 };
      Touch.sync(); drainInput();
      if (Input.heldCodes.size) note(`device: a thumb 4 px from centre holds ${Array.from(Input.heldCodes).join('+')}`);
      // Let go: Bud stops, this frame.
      Touch.stick = { id: 1, ox: 100, oy: 200, x: 160, y: 200 };
      Touch.sync(); drainInput();
      Touch.up(1);
      drainInput();
      if (Input.heldCodes.size || Input.stickHeld.size) note(`device: letting go of the stick left ${Array.from(Input.heldCodes).join('+')} held`);
      // The same, through the route a real release takes when the window goes away mid-drag.
      Touch.stick = { id: 2, ox: 100, oy: 200, x: 160, y: 200 };
      Touch.sync(); drainInput();
      Touch.clear(); drainInput();
      if (Input.heldCodes.size || Input.stickHeld.size) note('device: clearing the touch layer left a direction held');
      // A stick press does NOT count as "any key": it must never skip a finisher or close the instructions.
      Input.queue.length = 0;
      Touch.stick = { id: 3, ox: 100, oy: 200, x: 160, y: 200 };
      Touch.sync();
      if (Input.queue.some(q => q[0] === 'any')) note('device: steering the stick counts as a keypress');
      Touch.clear();
      Input.queue.length = 0;
      drainInput();

      /* ---- 5b. THE STICK IS LIVE WHEREVER BUD IS THE PLAYER'S ----
         This is the check the first MOBILE build did not have, and the bug it would have caught: the thumbstick
         was gated on sim.mode === 'floor', and the OPENING runs in mode 'intro' and ends by telling the player to
         walk to the cook. On a phone that is an instruction the game has just made impossible to obey.

         It is deliberately EMPIRICAL rather than a list of modes known to be good. For every phase the opening
         passes through, it holds a direction and asks whether Bud actually moved, then asserts stickOn() agrees.
         A list would have to be kept in step with the game by hand; this cannot drift, because the thing it
         compares against is the game moving. */
      {
        const realScene = Intro.scene, realPlayedB = Intro.played;
        Intro.scene = Opening.scene;
        Intro.played = false;
        devIdx = 0;
        reset(4242, false);
        Input.queue.length = 0;
        Input.stickRelease();
        Input.tap('act'); drainInput(); stepSim();          // SPACE at the title -> the opening
        if (sim.mode !== 'intro') note(`device: SPACE at the title went to ${sim.mode}, not the opening`);
        const seen = {}, wrong = [];
        for (let k = 0; k < 4200 && sim.mode === 'intro'; k++) {
          const phase = Opening.info().phase;
          if (!seen[phase]) {
            // Hold right on the stick for a few ticks and see whether the game moves him.
            const x0 = sim.bud.x, claim = Touch.stickOn();
            Touch.stick = { id: 77, ox: 100, oy: 200, x: 160, y: 200 };
            Touch.sync(); drainInput();
            for (let j = 0; j < 8; j++) stepSim();
            const moved = Math.abs(sim.bud.x - x0) > 0.5;
            Touch.stick = null;
            Touch.sync(); drainInput();
            seen[phase] = { claim, moved };
            // The walk-in moves him on its own, so "moved" there is not evidence the stick did it. Only phases
            // where the game hands moveBud the input are judged, and Opening.hasBud() is what says which.
            const driven = Opening.hasBud();
            if (driven && !claim) wrong.push(`${phase}: the player drives Bud and the thumbstick is not live`);
            if (!driven && claim && phase !== 'walk') wrong.push(`${phase}: the thumbstick is live and the player does not drive Bud`);
            if (driven && !moved) wrong.push(`${phase}: the player drives Bud and a held stick did not move him`);
          }
          stepSim();
        }
        for (const w of wrong) note('device: ' + w);
        for (const want of ['walk', 'cards', 'prompt']) if (!(want in seen)) note(`device: the opening never reached its ${want} phase, so the stick was not checked there`);
        notes.push('opening phases and the stick — ' + Object.keys(seen).map(k => `${k}: live=${seen[k].claim} moved=${seen[k].moved}`).join(', '));
        // ...and a touchscreen can get out of the opening at all.
        reset(4242, false);
        Intro.played = false;
        Input.tap('act'); drainInput(); stepSim();
        devIdx = 0; UI.onMode(sim.mode);
        if (btnPause.hidden) note('device: MOBILE has no way out of the opening');
        devIdx = 1; UI.onMode(sim.mode);
        if (!btnPause.hidden) note('device: DESKTOP gained a button during the opening');
        devIdx = 0;
        Input.tap('pause'); drainInput(); stepSim();
        if (sim.mode === 'intro') note('device: SKIP did not leave the opening');
        Intro.scene = realScene;
        Intro.played = realPlayedB;
        Touch.clear();
      }

      // ---- 6. DESKTOP is inert ----
      devIdx = 1;
      Touch.clear();
      const inert = [
        ['the stick', () => Touch.down(9, { x: 60, y: 200 })],
        ['the action pad', () => Touch.down(9, { x: TOUCH.padX, y: TOUCH.padY })],
      ];
      for (const [what, f] of inert) if (f()) note(`device: ${what} accepted a touch in DESKTOP`);
      if (Touch.stickOn() || Touch.padOn() || Touch.cellsOn()) note('device: the touch layer is live in DESKTOP');
      TEXT_LOG = [];
      const beforeDraw = TEXT_LOG.length;
      Touch.draw();
      if (TEXT_LOG.length !== beforeDraw) note('device: the touch overlay drew text in DESKTOP');
      TEXT_LOG = null;

      // ---- 7. the ORDER station's ten boxes ----
      devIdx = 0;
      for (let row = 0; row < 2; row++) for (let col = 0; col < 5; col++) {
        const i = row * 5 + col, x = 164 + col * 74, y = 100 + row * 76;
        const centre = Touch.cellAt({ x: x + 33, y: y + 33 });
        if (centre !== i) note(`device: the centre of box ${i} maps to ${centre}`);
        for (const [px, py, label] of [[x + 2, y + 2, 'top-left'], [x + 63, y + 63, 'bottom-right']]) {
          if (Touch.cellAt({ x: px, y: py }) !== i) note(`device: the ${label} of box ${i} maps to ${Touch.cellAt({ x: px, y: py })}`);
        }
      }
      if (Touch.cellAt({ x: 320, y: 290 }) !== -1) note('device: a tap below the grid maps to a box');
      if (Touch.cellAt({ x: 120, y: 120 }) !== -1) note('device: a tap left of the grid maps to a box');
      // A tapped box enters exactly the ticket the arrows would have entered.
      reset(4243, true);
      devIdx = 0;
      sim.bud.x = LAYOUT.station.x; sim.bud.y = LAYOUT.station.y + 20;
      setMode('station');
      sim.ui.station = { row: 0, col: 0, drink: null };
      Input.tap('cell2'); drainInput(); stepSim();          // drink C
      const mid = sim.ui.station;
      if (!mid || mid.drink !== 2 || mid.row !== 1) note(`device: tapping drink C left ${JSON.stringify(mid)}`);
      const n0 = sim.tickets.length;
      Input.tap('cell8'); drainInput(); stepSim();          // plate 4
      const t = sim.tickets[sim.tickets.length - 1];
      if (sim.tickets.length !== n0 + 1 || !t || t.drink !== 2 || t.plate !== 3) note(`device: tapping C then plate 4 entered ${JSON.stringify(t)}`);
      if (sim.mode !== 'floor') note(`device: entering a ticket by tap left the game in ${sim.mode}`);
      // CANCEL is a box like any other.
      setMode('station');
      sim.ui.station = { row: 0, col: 0, drink: null };
      const n1 = sim.tickets.length;
      Input.tap('cell4'); drainInput(); stepSim();
      if (sim.mode !== 'floor' || sim.ui.station !== null) note('device: tapping CANCEL did not leave the station');
      if (sim.tickets.length !== n1) note('device: tapping CANCEL entered a ticket');

      // ---- 8. the halves, and what owns a press in each mode ----
      reset(4243, true);
      devIdx = 0;
      Touch.clear();
      const owns = (mode, pt) => { setMode(mode); Touch.clear(); const r = Touch.down(5, pt); Touch.clear(); return r; };
      if (!owns('floor', { x: 60, y: 200 })) note('device: the left half does not take the stick on the floor');
      if (!owns('floor', { x: TOUCH.padX, y: TOUCH.padY })) note('device: the action pad does not take a press on the floor');
      if (owns('floor', { x: 500, y: 120 })) note('device: a press on the right half away from the pad was claimed');
      if (owns('station', { x: 60, y: 340 })) note('device: the stick is live at the ORDER station');
      setMode('floor');
      Touch.clear();
    } catch (e) {
      note('device: the audit threw — ' + (e && e.message ? e.message : e));
    } finally {
      TEXT_LOG = null;
      AUDITING = false;
      devIdx = realDev;
      diffIdx = realIdx;
      sim = realSim;
      Intro.played = realPlayed;
      Input.queue.length = 0;
      Input.stickHeld.clear();
      Input.heldCodes.clear();
      for (const c of held) Input.heldCodes.add(c);
      Touch.stick = null;
      Touch.pad = null;
    }
    return { ok: problems.length === 0, problems, notes,
      boot: DEVICES[DEV_BOOT].key, caption: DEV_CAPTION(), selected: DEVICES[devIdx].key };
  },
};

/* ==== THE PACING AUDIT ==========================================================================================
   The solo phase used to let one party in at a time and hold the next at the door until the last had eaten and
   left, which put a long empty pause straight after the player's first success. Lifting a tray off the pass now
   releases the next party early. This measures that, on every difficulty, and proves the three things that could
   go wrong with it: that it does nothing when nobody is playing, that it cannot stack the room up, and that it is
   the same on every level because it is an action and not an interval.

   It measures the MECHANISM rather than a playthrough. A bot good enough to take an order, enter it, wait for the
   cook and carry the tray back takes well over a minute of simulated time to do it, and would spend most of that
   outside the solo phase this changes — so a playthrough would mostly be measuring the bot. Here the shift runs
   for real, through the real stepSim, and the tray-lift is delivered by calling the same releaseNext() that the
   pass calls. The link between the two is checked by reading the source. */
const Pacing = {
  audit() {
    const problems = [], note = s => problems.push(s), notes = [];
    const realSim = sim, realIdx = diffIdx, realPlayed = Intro.played;
    const held = Array.from(Input.heldCodes);
    try {
      AUDITING = true;
      Intro.played = true;

      // ---- 1. the release is wired to the pass, and to nothing else ----
      const src = Array.prototype.map.call(document.scripts, s => s.textContent).join('\n').split('\n');
      // Only the GAME's calls: this audit drives releaseNext() itself, and counting its own calls would make the
      // check report on the test rather than on the thing tested.
      const a0 = src.findIndex(l => /==== SIM BEGIN ====/.test(l)), a1 = src.findIndex(l => /==== SIM END ====/.test(l));
      const body = a0 >= 0 && a1 > a0 ? src.slice(a0 + 1, a1) : [];
      const calls = body.filter(l => /releaseNext\(\)/.test(l) && !/function releaseNext/.test(l) && !/^\s*(\/\/|\*)/.test(l));
      if (calls.length !== 1) note(`pacing: the simulation calls releaseNext() from ${calls.length} places, expected 1 (the pass)`);
      const i = a0 + 1 + body.findIndex(l => /releaseNext\(\);/.test(l) && !/function/.test(l));
      const near = src.slice(Math.max(0, i - 6), i).join(' ');
      if (!/ticketCollected/.test(near)) note('pacing: the release is not attached to lifting a tray off the pass');

      // ---- 2. what it does to the wait, per level ----
      // Two runs per level from the same seed: one where a tray is lifted at the moment the first party sits
      // down, and a control where it never is. The difference between them is the whole feature.
      const run = (lvl, seed, lift) => {
        diffIdx = lvl;
        reset(seed, true);
        sim.difficulty = lvl;
        let seated = null, before = 0, next = null, fired = false, peak = 0;
        for (let k = 0; k < TICKS(CFG.soloPhaseSec) + 1200; k++) {
          stepSim();
          peak = Math.max(peak, sim.parties.length);
          if (seated === null && sim.customers.some(c => c.state === 'waitingOrder')) {
            seated = sim.tick;
            before = sim.stats.spawned;
            if (lift) { releaseNext(); fired = true; }
          }
          if (seated !== null && next === null && sim.stats.spawned > before) { next = sim.tick; break; }
        }
        return { seated, next, fired, peak,
          waitSec: next === null ? null : +((next - seated) / 60).toFixed(2),
          soloSec: seated === null ? null : +((seated - sim.shift.startTick) / 60).toFixed(2) };
      };
      const SEEDS = [7, 4242, 90210];
      const table = [];
      for (let lvl = 0; lvl < LEVELS.length; lvl++) {
        const withLift = SEEDS.map(s => run(lvl, s, true));
        const control = SEEDS.map(s => run(lvl, s, false));
        const mean = rs => { const v = rs.filter(r => r.waitSec !== null).map(r => r.waitSec); return v.length ? +(v.reduce((a, b) => a + b, 0) / v.length).toFixed(2) : null; };
        const a = mean(withLift), b = mean(control);
        table.push({ lvl: LEVELS[lvl].name, lifted: a, control: b, peak: Math.max(...withLift.map(r => r.peak)) });
        if (a === null) note(`pacing: on ${LEVELS[lvl].name}, no party arrived after a tray was lifted`);
        else {
          if (a > 2.5) note(`pacing: on ${LEVELS[lvl].name} the next party takes ${a}s after the tray is lifted — the pause is still there`);
          // ...and not instant either: a creature appearing on the same frame as the clink reads as the game
          // reacting to you rather than the night going on around you.
          if (a < CFG.soloReleaseSec * 0.8) note(`pacing: on ${LEVELS[lvl].name} the next party arrives ${a}s after the lift, faster than the ${CFG.soloReleaseSec}s beat`);
          if (b !== null && !(a < b)) note(`pacing: on ${LEVELS[lvl].name} lifting the tray (${a}s) is no faster than not lifting it (${b}s)`);
        }
        // Two parties on the floor at once is the point. Three is the solo phase stopping being the solo phase.
        const pk = Math.max(...withLift.map(r => r.peak));
        if (pk > SOLO_MAX_PARTIES) note(`pacing: ${pk} parties were on the floor at once in the solo phase, cap is ${SOLO_MAX_PARTIES}`);
      }
      notes.push('pacing (note): seconds from the first customer sitting down to the next coming in — ' +
        table.map(r => `${r.lvl} ${r.lifted}s after a tray lift vs ${r.control}s without (peak ${r.peak} parties)`).join('; '));

      // The release is an ACTION, so it must land at the same moment on every level: no pace to divide by.
      const waits = table.map(r => r.lifted).filter(v => v !== null);
      if (waits.length === LEVELS.length && Math.max(...waits) - Math.min(...waits) > 0.35) {
        note(`pacing: the wait after a tray lift differs by level (${table.map(r => r.lvl + ' ' + r.lifted + 's').join(', ')}) — it should not, it is an action`);
      }

      // ---- 3. an idle player gets nothing ----
      for (let lvl = 0; lvl < LEVELS.length; lvl++) {
        diffIdx = lvl;
        reset(4242, true);
        sim.difficulty = lvl;
        let peak = 0;
        for (let k = 0; k < TICKS(CFG.soloPhaseSec); k++) { stepSim(); peak = Math.max(peak, sim.parties.length); }
        if (peak > 1) note(`pacing: an idle shift on ${LEVELS[lvl].name} reached ${peak} parties in the solo phase without anyone lifting a tray`);
      }
      notes.push('pacing (note): with nobody serving, the solo phase still holds one party at a time on all three levels');

      // ---- 4. it cannot stack ----
      diffIdx = 0;
      reset(4242, true);
      for (let k = 0; k < 600; k++) stepSim();
      for (let k = 0; k < 20; k++) releaseNext();              // twenty tray lifts in one tick
      let peak2 = 0;
      for (let k = 0; k < TICKS(CFG.soloPhaseSec); k++) { stepSim(); peak2 = Math.max(peak2, sim.parties.length); }
      if (peak2 > SOLO_MAX_PARTIES) note(`pacing: twenty releases in one tick put ${peak2} parties on the floor, cap is ${SOLO_MAX_PARTIES}`);
      notes.push(`pacing (note): twenty releases at once still capped the floor at ${peak2} ${peak2 === 1 ? 'party' : 'parties'}`);

      // ---- 5. and it stops at the end of the solo phase ----
      diffIdx = 0;
      reset(4242, true);
      while (shiftSeconds() < CFG.soloPhaseSec + 5) stepSim();
      const rel0 = sim.spawner.released;
      releaseNext();
      if (sim.spawner.released !== rel0) note('pacing: a tray lift after the solo phase still released a party');
    } catch (e) {
      note('pacing: the audit threw — ' + (e && e.message ? e.message : e));
    } finally {
      AUDITING = false;
      diffIdx = realIdx;
      sim = realSim;
      Intro.played = realPlayed;
      Input.queue.length = 0;
      Input.heldCodes.clear();
      for (const c of held) Input.heldCodes.add(c);
    }
    return { ok: problems.length === 0, problems: problems.concat(notes), notes };
  },
};

/* ==== TEST HOOKS ==== */
window.__test = {
  version: VERSION,
  runFor(simSeconds) { const n = Math.round(simSeconds * 60); this.step(n); return { ticks: n, tick: sim.tick }; },
  step(n) { Loop.manual = true; for (let i = 0; i < n; i++) stepSim(); return sim.tick; },
  setTimeScale(n) { const prev = Loop.timeScale; Loop.timeScale = Math.max(0, Number(n) || 0); Loop.manual = false; Loop.acc = 0; return prev; },
  restart(seed, opts) { reset(Number(seed) >>> 0, !!(opts && opts.skipTitle)); return sim.seed; },
  getState() { return snapshot(); },
  getLayout() { return JSON.parse(JSON.stringify(LAYOUT)); },
  getConfig() { return JSON.parse(JSON.stringify(Object.assign({}, CFG, { fighters: FIGHTERS, shiftFighters: SHIFT_FIGHTERS }))); },
  loopInfo() { return { timeScale: Loop.timeScale, manual: Loop.manual, droppedSteps: Loop.dropped }; },
  press(code) { return Input.keyDown(code, null); },
  release(code) { return Input.keyUp(code, null); },
  releaseAll() { Input.releaseAll(); },
  openAllSections() {
    for (const s of sim.sections) { if (!s.open) { s.open = true; s.openedTick = null; } }
    return sim.sections.map(s => s.open);
  },
  forceMoney(tableId, amount) {
    const t = sim.tables[tableId | 0];
    if (!t) return { ok: false, reason: 'no such table' };
    const a = Math.max(0, amount | 0);
    t.money += a;
    sim.stats.awarded += a;
    sim.stats.piles++;
    emit('moneyLeft', { customerId: null, tableId: t.id, amount: a, tableTotal: t.money, forced: true });
    return { ok: true, tableId: t.id, money: t.money };
  },
  // opts: { tableId, pair, species2, seated } — seated puts the party straight into its seats (review staging).
  forceSpawn(speciesId, opts) {
    opts = opts || {};
    if (sim.shift.startTick === null || sim.mode === 'shiftEnd') return { ok: false, reason: 'no shift running' };
    const openTable = t => sim.sections[LAYOUT.tables[t.id].section].open;
    const table = opts.tableId != null ? sim.tables[opts.tableId] : sim.tables.find(t => t.partyId === null && openTable(t));
    if (!table) return { ok: false, reason: 'no free table' };
    if (table.partyId !== null) return { ok: false, reason: 'table occupied' };
    if (!openTable(table)) return { ok: false, reason: 'table is in a closed section' };
    const sp = x => clamp(Number(x) | 0, 1, CFG.species);
    const p = spawnParty(sp(speciesId), !!opts.pair, table, opts.pair && opts.species2 ? sp(opts.species2) : 0);
    if (opts.seated) { for (const id of p.customerIds) { const c = byId(id); c.arrived = true; c.path = []; } seatParty(p); }
    return { ok: true, partyId: p.id, customerIds: p.customerIds.slice() };
  },
  forceAnger(tableId, level) {
    const t = sim.tables[tableId];
    if (!t || t.partyId === null) return { ok: false, reason: 'no party at table' };
    const frac = [1, CFG.anger[0], CFG.anger[1], CFG.anger[2], 0][clamp(level | 0, 0, 4)];
    let n = 0;
    for (const c of sim.customers) {
      if (c.partyId === t.partyId && (c.state === 'waitingOrder' || c.state === 'waitingFood')) {
        c.patienceTicks = Math.min(c.patienceTicks, level >= 4 ? 1 : Math.floor(c.patienceMaxTicks * frac));
        n++;
      }
    }
    return { ok: n > 0, affected: n };
  },
  // Run out a table's patience now; hp overrides the species' hits to knock out (review staging only).
  forceCharge(tableId, opts) {
    const t = sim.tables[tableId];
    if (!t || t.partyId === null) return { ok: false, reason: 'no party at table' };
    let n = 0;
    for (const c of sim.customers) if (c.partyId === t.partyId && (c.state === 'waitingOrder' || c.state === 'waitingFood')) {
      c.patienceTicks = 1;
      if (opts && opts.hp) c.hpOverride = opts.hp | 0;
      n++;
    }
    return { ok: n > 0, affected: n };
  },
  // Reach tier n through the real collect path: the missing amount is banked as collected tips.
  forceTier(n) {
    n = clamp(n | 0, 0, 4);
    if (sim.shift.startTick === null || sim.mode === 'shiftEnd') return { ok: false, reason: 'no shift running' };
    const need = n ? Math.max(0, CFG.tiers[n - 1] - sim.tips) : 0;
    if (need > 0) {
      sim.stats.awarded += need;
      sim.tips += need;
      sim.stats.collected += need;
      emit('moneyCollected', { tableId: null, amount: need, tips: sim.tips, forced: true });
      updateTier();
    }
    return { ok: sim.tier >= n, tier: sim.tier, tips: sim.tips };
  },
  forceDeath(cause) { return { ok: killBud(cause || null), mode: sim.mode }; },
  setHealth(n) { sim.bud.health = clamp(n | 0, 1, CFG.health); return sim.bud.health; },
  // Put Bud somewhere (staging): refused if his feet would overlap a fixture or a body.
  placeBud(x, y) {
    if (feetHit(x, y, OBSTACLES, LAYOUT.floor)) return { ok: false };
    Object.assign(sim.bud, { x, y, vx: 0, vy: 0 });
    return { ok: true };
  },
  // Knock a body down at a fall point through the real placement rule (stress tests and review staging).
  forceKO(speciesId, x, y) {
    const spot = placeBody(x, y);
    const body = { id: -(sim.bodies.length + 1), speciesId: clamp(speciesId | 0, 1, CFG.species), x: spot ? spot.x : Math.round(x), y: spot ? spot.y : Math.round(y),
      blocks: !!spot, side: 1, tick: sim.tick, forced: true };
    sim.bodies.push(body);
    if (!spot) sim.stats.nonBlockingBodies++;
    rebuildBodies();
    emit('knockedOut', { customerId: null, speciesId: body.speciesId, tableId: null, x: body.x, y: body.y, blocks: body.blocks, tried: spot ? spot.tried : 0, forced: true });
    return { ok: !!spot, x: body.x, y: body.y, tried: spot ? spot.tried : 0 };
  },
  navReport() { return { unreachable: unreachable(BODY_MASK, sim.bud), bodies: sim.bodies.length }; },
  clearStory() { sim.story.beat = null; sim.story.queue.length = 0; sim.ui.banner = null; return true; },
  artSheet(ids, kind) { Loop.sheet = ids ? { ids, kind: kind || 'floor' } : null; render(); return !!Loop.sheet; },
  caption(text) { Loop.caption = text || null; return true; },
  combatAudit() { return Art.combatAudit(); },
  // The combat lab, entered the way a combat\ copy of this file enters it at boot.
  enterLab(speciesId, seed) { enterLab(speciesId || 1, Number(seed) >>> 0); return JSON.parse(JSON.stringify(sim.lab)); },
  labInfo() { return sim.lab ? JSON.parse(JSON.stringify(Object.assign({ spec: FIGHTERS[sim.lab.speciesId] }, sim.lab))) : null; },
  labRequested(path, hash) { return labRequested(path, hash); },
  sourceHash() { return SOURCE_HASH; },
  // Every string the screen showing right now draws, with the box it occupies, so a bot can prove nothing runs off the
  // canvas, nothing overlaps, and no number on the instructions is a typed-in copy of one CFG owns. Step past the wipe
  // before calling it in 'help', or strings still clipped out of view will be in the list.
  screenText() { TEXT_LOG = []; render(); const out = TEXT_LOG; TEXT_LOG = null; return out; },
  // Where the INSTRUCTIONS button is drawn, in canvas pixels. #btnHelp is positioned from these same numbers at boot,
  // so a bot can check the transparent hit area still sits exactly on the drawn button at any window size.
  titleButton() { return { x: HELP_BTN.x, y: HELP_BTN.y, w: HELP_BTN.w, h: HELP_BTN.h, label: HELP_BTN.label, hot: helpHot, shown: sim.mode === 'title' }; },
  titleArt() { const T = TitleArt.build(); return { bodies: T.bodies, icons: T.icons, box: T.box, species: CFG.species, iconKinds: Art.drinks.length + Art.plates.length }; },
  // The difficulty control, in canvas pixels: the frame, the three segments, which one is selected, and what the
  // level actually does. #btnD0..2 are positioned from the same DIFF_SEG boxes at boot, so a bot can check the hit
  // areas still sit on the drawn segments at any window size, exactly as it does for INSTRUCTIONS.
  difficultyButton() {
    return { x: DIFF_BTN.x, y: DIFF_BTN.y, w: DIFF_BTN.w, h: DIFF_BTN.h, label: DIFF_BTN.label, hot: diffHot,
      shown: sim.mode === 'title', selected: diffIdx, segments: DIFF_SEG.map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h, name: s.name })) };
  },
  difficultyInfo() {
    return { index: diffIdx, key: LEVELS[diffIdx].key, name: LEVELS[diffIdx].name, pace: LEVELS[diffIdx].pace,
      shift: sim.difficulty, boot: DIFF_BOOT, levels: LEVELS.map(L => ({ key: L.key, name: L.name, pace: L.pace, queueMax: L.queueMax })) };
  },
  // The waiting line: the whole audit, and the staging hook the screenshot uses.
  queueAudit() { return Queue.audit(); },
  pacingAudit() { return Pacing.audit(); },
  /* THE LEVEL AUDIT. Renders every sound and every one of the twenty voices and checks the two things that are
     hard failures rather than matters of taste: nothing CLIPS, and nothing is SILENT. Both have happened here —
     an earlier pass pushed four voices past 1.0 by giving all twenty a trim measured from one of them.
     It also checks the table's shape, which is how that bug would have been caught before it was heard: a name
     the game can play with no entry beside it, or a voice missing from the per-species table.
     It is its own hook rather than part of artAudit because it renders ninety-one sounds and is slow. Whether the
     result is PLEASANT is not checkable here and never will be; that is the human's ear. */
  async levelAudit() {
    const problems = [], note = s => problems.push(s), notes = [];
    const BAND_FLOOR = 0.10;   // measured: the buzz source lands at 0.225-0.244, the sine it replaced at 0.059-0.091
    const names = this.soundNames();
    const missing = names.filter(n => !Cook.isVoice(n) && n !== 'voice' && !(n in LEVEL));
    if (missing.length) note(`levels: no trim for ${missing.join(', ')} — they play at whatever the synth emits`);
    const extra = Object.keys(LEVEL).filter(n => !names.includes(n));
    if (extra.length) note(`levels: the table trims ${extra.join(', ')}, which the game never plays`);
    if (VOICE_LEVEL.length !== CFG.species + 1) note(`levels: VOICE_LEVEL has ${VOICE_LEVEL.length - 1} species, the game has ${CFG.species}`);
    for (let i = 1; i <= CFG.species; i++) if (!(VOICE_LEVEL[i] > 0)) note(`levels: species ${i} has no voice trim`);
    const rows = [];
    for (const n of names) {
      if (n === 'voice') continue;
      const r = await this.renderSound(n);
      let peak = 0, sum = 0;
      for (const v of r.samples) { const m = Math.abs(v); if (m > peak) peak = m; sum += v * v; }
      rows.push({ n, peak, rms: Math.sqrt(sum / r.samples.length) });
    }
    for (let id = 1; id <= CFG.species; id++) {
      const r = await this.renderSound('voice', { speciesId: id, seed: 4242 });
      let peak = 0, sum = 0;
      for (const v of r.samples) { const m = Math.abs(v); if (m > peak) peak = m; sum += v * v; }
      rows.push({ n: 'voice' + String(id).padStart(2, '0'), peak, rms: Math.sqrt(sum / r.samples.length) });
    }
    const clip = rows.filter(r => r.peak > 1.001);
    if (clip.length) note(`levels: ${clip.length} sound(s) clip — ${clip.map(r => `${r.n} ${r.peak.toFixed(2)}`).join(', ')}`);
    const dead = rows.filter(r => r.rms < 0.0005);
    if (dead.length) note(`levels: ${dead.length} sound(s) are silent — ${dead.map(r => r.n).join(', ')}`);
    /* ---- CAN A PHONE REPRODUCE IT? ----
       The report said some sounds were almost imperceptible on mobile. Level alone does not answer that: a small
       speaker radiates very little below about 300 Hz, so energy under that band is measured by a meter and not
       heard by a player. The cook was the extreme case — 99.3% of everything he said sat below 300 Hz, so a phone
       was reproducing under one percent of him however loud the number said he was. It is also why he was
       unintelligible: vowels are told apart by resonances between 300 and 2500 Hz, and he had nothing there.
       A one-pole 300 Hz highpass over the rendered samples, compared against the whole, is enough to assert it. */
    /* THE VOWEL BAND, 400 to 2500 Hz. Three one-pole sections each way, so the skirts are steep enough that a
       64 Hz fundamental leaking through cannot be mistaken for a formant — a single pole at 300 Hz still passes
       64 Hz only 13 dB down, which is not a measurement, it is a rumour. */
    const bandShare = (samples, sr, lo, hi) => {
      const ka = f => { const rc = 1 / (2 * Math.PI * f), dt = 1 / sr; return rc / (rc + dt); };
      const ah = ka(lo), al = 1 / (1 + 1 / (2 * Math.PI * hi) / (1 / sr));
      const yp = [0, 0, 0], xp = [0, 0, 0], lp = [0, 0, 0];
      let inb = 0, all = 0;
      for (let i = 0; i < samples.length; i++) {
        let v = samples[i];
        all += v * v;
        for (let k = 0; k < 3; k++) { const y = ah * (yp[k] + v - xp[k]); xp[k] = v; yp[k] = y; v = y; }
        for (let k = 0; k < 3; k++) { lp[k] += al * (v - lp[k]); v = lp[k]; }
        inb += v * v;
      }
      return all > 0 ? inb / all : 0;
    };
    /* CALIBRATION. A cascade like that has real insertion loss, so its raw ratio is an index and not a percentage —
       reporting it as one would be a number that does not mean what it says. White noise has a known answer: the
       share of its energy in 400-2500 Hz is simply that bandwidth over the whole, so running the noise through the
       same filter gives exactly the factor that turns the index back into a fraction of the signal. */
    const calib = (function () {
      const sr = 48000, n = sr, rnd = makeRng(4242), buf = new Float32Array(n);
      for (let i = 0; i < n; i++) buf[i] = rnd.next() * 2 - 1;
      const truth = (2500 - 400) / (sr / 2);
      const got = bandShare(buf, sr, 400, 2500);
      return got > 0 ? truth / got : 1;
    })();
    const voiceBand = [];
    for (let n = 1; n <= 5; n++) {
      const r = await this.renderSound('cookVoice' + n);
      const share = Math.min(1, bandShare(r.samples, r.sampleRate, 400, 2500) * calib);
      voiceBand.push(share);
      if (share < BAND_FLOOR) note(`levels: only ${(share * 100).toFixed(1)}% of the cook's line ${n} sits in the 400-2500 Hz vowel band — below ${(BAND_FLOOR * 100).toFixed(0)}% a phone speaker reproduces almost none of him and one vowel cannot be told from another`);
    }
    notes.push(`levels (note): the cook's five lines put ${voiceBand.map(v => (v * 100).toFixed(1) + '%').join('/')} of their energy in the 400-2500 Hz vowel band, against a floor of ${(BAND_FLOOR * 100).toFixed(0)}%`);
    const q = rows.slice().sort((a, b) => a.rms - b.rms);
    notes.push(`levels (note): ${rows.length} sounds rendered, worst peak ${Math.max(...rows.map(r => r.peak)).toFixed(3)}, ` +
      `quietest ${q[0].n} at ${(20 * Math.log10(q[0].rms)).toFixed(1)} dB RMS, loudest ${q[q.length - 1].n} at ${(20 * Math.log10(q[q.length - 1].rms)).toFixed(1)} dB`);
    return { ok: problems.length === 0, problems: problems.concat(notes), notes, count: rows.length };
  },

  /* A PASSIVE read of the master analyser: what is coming out of the speakers RIGHT NOW, with nothing played to
     make it happen. liveAnalyse() next door triggers a named sound and measures it, which cannot reach the cook —
     his lines never go through Synth — so metering him playing for real needs a meter that only listens. */
  analyserRead() {
    const an = Sound.analyser;
    if (!an) return null;
    const buf = new Float32Array(an.fftSize);
    an.getFloatTimeDomainData(buf);
    let sum = 0, peak = 0;
    for (const v of buf) { sum += v * v; const m = Math.abs(v); if (m > peak) peak = m; }
    return { rms: +Math.sqrt(sum / buf.length).toFixed(6), peak: +peak.toFixed(4) };

  // The game's own sounds, plus the cook's first two lines. The point of the last two is the level: cookVoice1 is the

  masterGain() { return Sound.master ? Sound.master.gain.value : null; },
  async renderSound(name, arg) {
    if (Cook.isVoice(name)) return Cook.renderVoice(name);
    const sr = 44100, oc = new OfflineAudioContext(1, Math.ceil(sr * SOUND_LEN[name]), sr);
    // through the same bus the live context puts it through, or the number would be about a voice the game never plays
    let dest = isFinSound(name) ? finBus(oc, oc.destination) : oc.destination;
    // The same trim the live bus applies, so a measurement is a measurement of the sound the player hears and not
    // of the one the synth happens to emit before it is levelled.
    const lv = levelOfSound(name);
    if (lv !== 1) { const n = oc.createGain(); n.gain.value = lv; n.connect(dest); dest = n; }
    const meta = Synth[name](oc, dest, 0, arg) || null;
    const buf = await oc.startRendering();
    return { sampleRate: sr, samples: Array.from(buf.getChannelData(0)), meta, bus: isFinSound(name) ? 'fin' : 'master' };
  },
  // Plays a sound on the live context and reads the AnalyserNode after the master gain for ~0.3 s.
  async liveAnalyse(name, arg) {
    const c = Sound.ctx;
    if (!c || c.state !== 'running') return { ok: false, state: c ? c.state : 'none' };
    const an = Sound.analyser, bins = new Float32Array(an.frequencyBinCount);
    // The music runs through the same master gain and so through the same analyser. Ducked for the read, or this
    // would report the bass line's peak rather than the effect's.
    const wasPlaying = Music.playing();
    Music.setDuck(true);
    const abus = isFinSound(name) ? Sound.fin : Sound.master, alv = levelOfSound(name);
    let adest = abus;
    if (alv !== 1) { const gn = c.createGain(); gn.gain.value = alv; gn.connect(abus); adest = gn; }
    Synth[name](c, adest, c.currentTime + 0.01, arg);
    let db = -Infinity, hz = 0, frames = 0;
    for (let k = 0; k < 8; k++) {
      await new Promise(r => setTimeout(r, 40));
      an.getFloatFrequencyData(bins);
      frames++;
      for (let i = 1; i < bins.length; i++) if (bins[i] > db) { db = bins[i]; hz = i * c.sampleRate / an.fftSize; }
    }
    Music.setDuck(false);
    return { ok: true, state: c.state, frames, peakDb: +db.toFixed(1), peakHz: Math.round(hz), muted: PREF.muted, musicWasPlaying: wasPlaying };
  },

  // Stage a finisher for a given species without needing that species to be able to kill him in a shift. It puts a
  // real customer on the floor beside Bud and calls the same startFinisher() budHit() calls, with the same arguments

  forceFinisher(speciesId, opts) {
    opts = opts || {};
    if (sim.fin || sim.mode === 'shiftEnd' || sim.shift.startTick === null) return { ok: false, reason: sim.fin ? 'a finisher is already running' : 'no shift running' };
    const id = clamp(Number(speciesId) | 0, 1, CFG.species), b = sim.bud;
    const table = sim.tables.find(t => t.partyId === null);

  // Renders N bars of the music offline through the identical chain, and returns the samples for measurement.
  async renderMusic(bars, level) {
    const n = Math.max(1, Math.min(64, bars | 0)), sr = 44100, lvl = level === undefined ? PREF.musicVol * MUSIC_GAIN : level;
    const oc = new OfflineAudioContext(1, Math.ceil(sr * (n * Music.BAR + 1.5)), sr);
    const chain = Music.makeChain(oc, oc.destination, lvl);
    let events = 0;
    for (let i = 0; i < n; i++) { events += Music.barEvents(i).length; Music.scheduleBar(oc, chain.input, i, 0.05 + i * Music.BAR); }
    const buf = await oc.startRendering();
    return { sampleRate: sr, bars: n, barSec: Music.BAR, events, level: lvl, samples: Array.from(buf.getChannelData(0)) };
  },
  // The generator's own claim about itself: the bar as a stable fingerprint, for the repeat check.
  musicBarKeys(from, count) {
    const a = Math.max(0, from | 0), n = Math.max(1, Math.min(4000, count | 0)), out = [];
    for (let i = 0; i < n; i++) out.push(Music.barKey(a + i));
    return out;
  },
  musicCycles() { return { bar: Music.BAR, bpm: Music.BPM, period: Music.PERIOD, cycles: Music.CYCLES.map(c => ({ label: c.label, bars: c.bars })) }; },
};

/* ==== BOOT ==== */
// A copy of this file inside a combat\ folder, or any copy opened with #lab, starts in the combat lab instead of the title.
function labRequested(path, hash) { return /[\\/]combat[\\/][^\\/]+\.html$/i.test(decodeURIComponent(path || '')) || hash === '#lab'; }
window.addEventListener('keydown', e => {
  if (Input.keyDown(e.code, e) && e.isTrusted) Sound.unlock();
  // Fullscreen, asked for HERE and not in leaveTitle(): the simulation steps on a later task than this keypress,
  // and by then the user activation this needs has expired. Only the key that starts a shift, only from the title,
  // and only from a real press — a synthetic one from a test has no activation to spend and would be refused.
  if (e.isTrusted && sim && sim.mode === 'title' && KEYMAP[e.code] === 'act') Screen.request();
});
window.addEventListener('keyup', e => Input.keyUp(e.code, e));
window.addEventListener('blur', () => Input.blur());
window.addEventListener('resize', fit);
for (const evt of ['fullscreenchange', 'webkitfullscreenchange']) window.addEventListener(evt, () => Screen.onChange());
// Some browsers resize the viewport a frame or two after the orientation settles rather than on the event itself.
if (window.screen && screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(fit, 120));
for (const [btn, action] of [[btnPause, 'pause'], [btnRestart, 'restart'], [btnSound, 'mute'], [btnHelp, 'help']]) {
  btn.addEventListener('mousedown', e => e.preventDefault());
  btn.addEventListener('click', e => { btn.blur(); if (e.isTrusted) Sound.unlock(); Input.tap(action); });
}
/* The music slider. Three rules, all of them about not stealing the keyboard, because a focused control that eats
   keys is the bug this project has already had once:
     - it is tabindex="-1", so TAB never lands on it;
     - keydown on it is default-prevented, so the arrows that move Bud do not also drag the slider. The event still
       bubbles to the window listener above, so the game sees the key exactly as it always did;
     - it is blurred the moment the pointer comes off it, so SPACE afterwards reaches the game and swings the tray.
   preventDefault on mousedown is deliberately NOT used here: on a range input that is what cancels the drag. */
volMusic.addEventListener('pointerdown', e => { if (e.isTrusted) Sound.unlock(); });
// Deliberately not emit()ed: the event bus feeds sim.eventHash, which the determinism runs compare, and a DOM
// control has no business in it. Music.state() is how a test watches the level instead.
volMusic.addEventListener('input', () => Music.setLevel(volMusic.value / 100));
volMusic.addEventListener('keydown', e => e.preventDefault());
for (const evt of ['pointerup', 'mouseup', 'touchend', 'pointercancel']) volMusic.addEventListener(evt, () => volMusic.blur());
// #btnHelp is transparent and sits exactly on the INSTRUCTIONS button the title draws. Its box is derived from
// HELP_BTN rather than typed into the stylesheet, so the hit area cannot drift away from the art.
btnHelp.style.left = (HELP_BTN.x / W * 100) + '%';
btnHelp.style.top = (HELP_BTN.y / H * 100) + '%';
btnHelp.style.width = (HELP_BTN.w / W * 100) + '%';
btnHelp.style.height = (HELP_BTN.h / H * 100) + '%';
for (const [evt, lit] of [['mouseenter', true], ['mouseleave', false], ['focus', true], ['blur', false]]) {
  btnHelp.addEventListener(evt, () => { helpHot = lit; });
}
/* The difficulty segments. Boxed from DIFF_SEG for the same reason #btnHelp is boxed from HELP_BTN: the thing the
   player sees and the thing they can click must be one rectangle, at every window size.
     - mousedown is default-prevented and the button is blurred on click, exactly as the other buttons are, so the
       press cannot leave focus sitting on a control that would then eat the SPACE that starts the shift;
     - the click taps 'diff0'..'diff2', which goes through Input.tap into the same edge-triggered table the keyboard
       writes into, so a mouse pick and an arrow-key pick are the same event to the simulation;
     - hover only lights it. Nothing the pointer does moves the selection except a completed click. */
diffBtns.forEach((btn, i) => {
  const S = DIFF_SEG[i];
  btn.style.left = (S.x / W * 100) + '%';
  btn.style.top = (S.y / H * 100) + '%';
  btn.style.width = (S.w / W * 100) + '%';
  btn.style.height = (S.h / H * 100) + '%';
  btn.addEventListener('mousedown', e => e.preventDefault());
  btn.addEventListener('click', e => { btn.blur(); if (e.isTrusted) Sound.unlock(); Input.tap('diff' + i); });
  btn.addEventListener('mouseenter', () => { diffHot = i; });
  btn.addEventListener('mouseleave', () => { if (diffHot === i) diffHot = -1; });
});
/* The device segments, boxed from DEV_SEG exactly as the difficulty ones are boxed from DIFF_SEG, and behaving
   identically: mousedown default-prevented, blurred on click, hover lights only. */
devBtns.forEach((btn, i) => {
  const S = DEV_SEG[i];
  btn.style.left = (S.x / W * 100) + '%';
  btn.style.top = (S.y / H * 100) + '%';
  btn.style.width = (S.w / W * 100) + '%';
  btn.style.height = (S.h / H * 100) + '%';
  btn.addEventListener('mousedown', e => e.preventDefault());
  btn.addEventListener('click', e => { btn.blur(); if (e.isTrusted) Sound.unlock(); Input.tap('dev' + i); });
  btn.addEventListener('mouseenter', () => { devHot = i; });
  btn.addEventListener('mouseleave', () => { if (devHot === i) devHot = -1; });
});
/* MOBILE's START button, transparent over the frame the title draws, boxed from START_BTN for the same reason
   every other one is boxed from its constant. It taps 'act' — the same edge SPACE sets — so starting a shift by
   thumb and starting one by key are one event to the simulation. */
btnStart.style.left = (START_BTN.x / W * 100) + '%';
btnStart.style.top = (START_BTN.y / H * 100) + '%';
btnStart.style.width = (START_BTN.w / W * 100) + '%';
btnStart.style.height = (START_BTN.h / H * 100) + '%';
btnStart.addEventListener('mousedown', e => e.preventDefault());
btnStart.addEventListener('click', e => {
  btnStart.blur();
  if (e.isTrusted) { Sound.unlock(); Screen.request(); }
  Input.tap('act');
});
for (const [evt, lit] of [['mouseenter', true], ['mouseleave', false], ['focus', true], ['blur', false]]) {
  btnStart.addEventListener(evt, () => { startHot = lit; });
}
// A click anywhere on the canvas closes the instructions. On the title it does nothing: the shift starts on SPACE or
// nothing, so a stray click cannot begin a ten-minute shift by accident.
cv.addEventListener('mousedown', e => {
  if (e.isTrusted) Sound.unlock();
  if (sim.mode === 'help') Input.tap('any');
});
/* THE TOUCH LAYER'S POINTER EVENTS. Pointer events rather than touch events, so one code path covers a finger, a
   stylus and (on a touch laptop someone has deliberately switched to MOBILE) a mouse. Three rules:
     - the canvas is the only surface they are bound to, so a press on a DOM button is that button's, not the
       stick's, and the two can never both claim one press;
     - Touch.down() returns false for anything MOBILE does not own — the wrong half, the wrong mode, DESKTOP at
       all — and an unclaimed press is left alone rather than swallowed, so the mousedown handler above still
       closes the instructions;
     - setPointerCapture keeps a thumb that slides off the canvas edge steering instead of sticking, and the up
       and cancel handlers are the same handler, so a call, a notification or a browser gesture releases it. */
const canvasPt = e => {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / (r.width || 1) * W, y: (e.clientY - r.top) / (r.height || 1) * H };
};
cv.addEventListener('pointerdown', e => {
  if (e.isTrusted) Sound.unlock();
  if (!Touch.down(e.pointerId, canvasPt(e))) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety, not a requirement */ }
});
cv.addEventListener('pointermove', e => { if (Touch.move(e.pointerId, canvasPt(e))) e.preventDefault(); });
for (const evt of ['pointerup', 'pointercancel']) {
  cv.addEventListener(evt, e => {
    if (!Touch.up(e.pointerId)) return;
    e.preventDefault();
    try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
  });
}
// A blur drops the thumb as well as the keyboard: the window listener above already tells the simulation, and
// this stops a held direction surviving a call, a notification or a tab switch.
window.addEventListener('blur', () => Touch.clear());
Art.build();
// The opening, installed into the hook game_013 built for it. Once per page load: Intro.played survives restart, so a
// retry goes straight to the floor with no walk-in, no cards and no voice, and with the tray already in his hands.
// It is Opening.scene, not Cook.scene: the conversation is the last step of the opening, not the whole of it.
// __test.setIntro() still swaps in its placeholder, and setIntro() with no argument puts this back.
Intro.scene = Opening.scene;
reset((Date.now() % 4294967296) >>> 0, false);
if (labRequested(location.pathname, location.hash)) enterLab(1, (Date.now() % 4294967296) >>> 0);
fit();
UI.soundLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>

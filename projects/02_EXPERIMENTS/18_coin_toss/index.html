<style>
/* Layout: one screen. Label fields on top, the felt table and coin fill the middle, the call and tally sit at the bottom. */
:root{
  color-scheme: dark;
  --felt-deep:#071a14;
  --felt:#0f3a2c;
  --silver:#dfe2e6;
  --silver-dim:#93a39c;
  --copper:#c98249;
  --heads:#1d3f8f;
  --tails:#8f2a1d;
  --line:rgba(223,226,230,.18);
  --display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
html,body{height:100%}
body{
  background:var(--felt-deep);color:var(--silver);
  font-family:var(--body);font-size:15px;
  display:flex;flex-direction:column;overflow:hidden;
}
header,footer{padding-inline:16px;flex:none}
header{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
h1{
  margin:0;font-family:var(--display);font-weight:700;font-size:15px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--copper);
}
.sides{display:flex;gap:12px;flex-wrap:wrap}
.side{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:5px}
.side label{
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--silver-dim);display:flex;align-items:center;gap:7px;
}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--line)}
.dot.h{background:var(--heads)} .dot.t{background:var(--tails)}
.side input{
  width:100%;box-sizing:border-box;font:500 16px var(--body);color:var(--silver);
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;
  padding:9px 11px;
}
.side input::placeholder{color:var(--silver-dim);opacity:.7}
.side input:focus-visible,button:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.side input:disabled{opacity:.5}

#stage{flex:1;min-height:0;position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{
  position:absolute;left:0;right:0;bottom:14px;text-align:center;pointer-events:none;
  font-size:13px;letter-spacing:.08em;color:var(--silver);
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
#hint svg{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
@media (prefers-reduced-motion:reduce){#hint svg{animation:none}}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}

footer{
  padding-block:10px 14px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
}
#call{flex:1;min-width:0}
#eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--silver-dim)}
#result{
  font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;
  overflow-wrap:anywhere;min-height:30px;
}
#result span{border-bottom:4px solid transparent;padding-bottom:1px}
#result.h span{border-color:var(--heads)} #result.t span{border-color:var(--tails)}
#tally{font-size:12px;color:var(--silver-dim);font-variant-numeric:tabular-nums;margin-top:3px}
#tossBtn{
  flex:none;font:600 13px var(--body);letter-spacing:.12em;text-transform:uppercase;
  color:var(--felt-deep);background:var(--copper);border:0;border-radius:6px;padding:11px 16px;cursor:pointer;
}
#tossBtn:disabled{opacity:.45;cursor:default}
</style>

</head>
<body>
<header>
  <h1>Quarter Toss</h1>
  <div class="sides">
    <div class="side">
      <label for="headsLabel"><span class="dot h"></span>Heads means</label>
      <input id="headsLabel" type="text" maxlength="18" placeholder="e.g. Pizza" autocomplete="off">
    </div>
    <div class="side">
      <label for="tailsLabel"><span class="dot t"></span>Tails means</label>
      <input id="tailsLabel" type="text" maxlength="18" placeholder="e.g. Tacos" autocomplete="off">
    </div>
  </div>
</header>

<main id="stage" aria-label="Coin. Flick upward to toss.">
  <div id="hint">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l7-7 7 7"/><path d="M11 6v12"/></svg>
    Flick your thumb up to toss
  </div>
</main>

<footer>
  <div id="call" aria-live="polite">
    <div id="eyebrow">Ready</div>
    <div id="result"><span>Heads up</span></div>
    <div id="tally">Heads 0 · Tails 0</div>
  </div>
  <button id="tossBtn" type="button">Toss</button>
</footer>

/* circulation wear: fine scratches, drawn once per face so typing a label does not reshuffle them */
function scratches(style){
  const c=mk(1024,1024),x=c.getContext('2d');
  for(let i=0;i<360;i++){
    const px=Math.random()*1024,py=Math.random()*1024,a=Math.random()*Math.PI,l=6+Math.random()*80;
    x.strokeStyle=style();x.lineWidth=.5+Math.random();
    x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke();
  }
  return c;
}

  const a=F.a.getContext('2d');a.globalCompositeOperation='source-over';a.globalAlpha=1;
  a.drawImage(F.t,0,0,1024,1024);
  a.globalCompositeOperation='multiply';a.fillStyle='#e6e1d8';a.fillRect(0,0,1024,1024);
  a.globalCompositeOperation='source-over';a.drawImage(F.sa,0,0);
  const o=F.o.getContext('2d');o.fillStyle='rgb(0,88,255)';o.fillRect(0,0,1024,1024);o.drawImage(F.so,0,0);
  const text=(label||'').trim();if(!text)return;
  /* the label is written across the coin in permanent marker */
  let px=176;a.font=px+'px '+MARKER;
  while(px>48&&a.measureText(text).width>760){px-=6;a.font=px+'px '+MARKER;}
  [a,o].forEach((c,i)=>{c.save();c.translate(512,560);c.rotate(-.07);c.font=px+'px '+MARKER;
    c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=7;
    c.fillStyle=c.strokeStyle=i?'rgb(0,170,0)':ink;c.globalAlpha=i?1:.95;
    c.strokeText(text,0,0);c.fillText(text,0,0);c.restore();});
}

/* ---------- scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
stage.insertBefore(renderer.domElement,hint);
const scene=new THREE.Scene();
scene.background=new THREE.Color(COL.deep);
scene.fog=new THREE.Fog(COL.deep,14,48);
const camera=new THREE.PerspectiveCamera(40,1,.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x1c3a2e,.9));
const sun=new THREE.DirectionalLight(0xfff4e2,1.5);sun.position.set(3,9,5);scene.add(sun);

/* room for the metal to reflect: bright ceiling with light panels, dark walls, green bounce from the felt */
const envCv=mk(512,256);(function(){const x=envCv.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#70757b');g.addColorStop(.3,'#41474c');g.addColorStop(.5,'#20282a');g.addColorStop(1,'#0d2a1f');
  x.fillStyle=g;x.fillRect(0,0,512,256);
  x.fillStyle='#ffffff';x.fillRect(30,6,150,60);x.fillRect(280,0,180,50);
  x.fillStyle='#ffe2b8';x.fillRect(200,62,50,26);
  x.fillStyle='#1a211f';x.fillRect(180,20,14,60);x.fillRect(470,10,12,70);})();
let env=null;
try{const pm=new THREE.PMREMGenerator(renderer);const et=new THREE.CanvasTexture(envCv);
  et.encoding=THREE.sRGBEncoding;et.mapping=THREE.EquirectangularReflectionMapping;
  env=pm.fromEquirectangular(et).texture;pm.dispose();}catch(e){env=null;}

const R=1,H=.14,G=22;
const aniso=renderer.capabilities.getMaxAnisotropy();
function tex(cv,linear){const t=new THREE.CanvasTexture(cv);if(!linear)t.encoding=THREE.sRGBEncoding;t.anisotropy=aniso;return t;}

/* felt */
const feltCv=mk(256,256);(function(){
  const x=feltCv.getContext('2d');x.fillStyle=COL.felt;x.fillRect(0,0,256,256);
  for(let i=0;i<5000;i++){x.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.09)';
    x.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,1);}
})();
const feltTex=tex(feltCv);feltTex.wrapS=feltTex.wrapT=THREE.RepeatWrapping;feltTex.repeat.set(70,70);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({map:feltTex,roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* soft shadow */
const shCv=mk(128,128);(function(){const x=shCv.getContext('2d');const g=x.createRadialGradient(64,64,10,64,64,64);
  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.7,'rgba(0,0,0,.75)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);})();
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(2.6,2.6),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(shCv),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=.008;scene.add(shadow);

/* coin: real geometry. Each face is a dense disc pushed out by the height map; the edge has 119 cut reeds. */
const S=.036,HE=H/2-.35*S;
const FACES={heads:{},tails:{}};
function lin(img){const t=new THREE.Texture(img);t.anisotropy=aniso;t.needsUpdate=true;return t;}
function faceMesh(F,up){
  F.a=mk(1024,1024);F.o=mk(1024,1024);
  F.sa=scratches(()=>Math.random()<.5?'rgba(255,255,255,.09)':'rgba(30,30,30,.10)');
  F.so=scratches(()=>'rgba(0,'+(40+Math.random()*150|0)+',255,.55)');
  F.tA=tex(F.a);F.tO=tex(F.o,true);
  const m=new THREE.Mesh(new THREE.RingGeometry(.0004,R,101,51),new THREE.MeshStandardMaterial({
    map:F.tA,normalMap:lin(F.n),displacementMap:lin(F.h),displacementScale:S,
    roughnessMap:F.tO,metalnessMap:F.tO,roughness:1,metalness:1,envMap:env,envMapIntensity:1.1}));
  m.rotation.x=up?-Math.PI/2:Math.PI/2;m.position.y=(up?1:-1)*(H/2-S);return m;
}
function redraw(){if(!FACES.heads.a)return;
  paint(FACES.heads,inH.value,'#12297a');paint(FACES.tails,inT.value,'#9c1710');
  [FACES.heads,FACES.tails].forEach(F=>{F.tA.needsUpdate=F.tO.needsUpdate=true;});}
const edgeCv=mk(4,64);(function(){const x=edgeCv.getContext('2d');
  x.fillStyle='#cbc7bf';x.fillRect(0,0,4,64);x.fillStyle='#b06a3c';x.fillRect(0,15,4,34);})();
const edgeMat=new THREE.MeshStandardMaterial({map:tex(edgeCv),metalness:1,roughness:.4,envMap:env,flatShading:true});
const coin=new THREE.Group();
(function(){
  const segs=119*2,eg=new THREE.CylinderGeometry(R,R,2*HE,segs,1,true),p=eg.attributes.position,f=(R-.014)/R;
  for(let i=0;i<p.count;i++){if((i%(segs+1))%2>=1){p.setX(i,p.getX(i)*f);p.setZ(i,p.getZ(i)*f);}}
  coin.add(new THREE.Mesh(eg,edgeMat));
  const capMat=new THREE.MeshStandardMaterial({color:0xcbc7bf,metalness:1,roughness:.4,envMap:env,side:THREE.DoubleSide});
  [1,-1].forEach(s=>{const c=new THREE.Mesh(new THREE.RingGeometry(R-.03,R,238,1),capMat);c.rotation.x=-s*Math.PI/2;c.position.y=s*(HE-.002);coin.add(c);});
})();
scene.add(coin);
let state='loading';
Promise.all(['heads','tails'].map(k=>Promise.all(['n','h','t'].map(c=>load(SRC[k][c]))).then(im=>{FACES[k].n=im[0];FACES[k].h=im[1];FACES[k].t=im[2];})))
.then(()=>{coin.add(faceMesh(FACES.heads,true));coin.add(faceMesh(FACES.tails,false));redraw();state='idle';busy(false);
  if(document.fonts&&document.fonts.load){document.fonts.load('100px "Permanent Marker"').then(redraw).catch(()=>{});}})
.catch(()=>{eyebrow.textContent='Error';result.firstElementChild.textContent='Coin artwork failed to load';});
inH.addEventListener('input',redraw);inT.addEventListener('input',redraw);

/* ---------- sound: the ring of a coin on a table ---------- */
let ac=null;
function ping(vol){
  if(!ac)return;
  try{const t0=ac.currentTime;
    [3120,5270,7930,10480].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();
      o.frequency.value=f*(1+Math.random()*.004);
      g.gain.setValueAtTime(vol/(i+1),t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.55-i*.09);
      o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+.6);});}catch(e){}
}

/* ---------- toss state ---------- */
let face=0,outcome=0,ang=0,a0=0,t=0,T=1,vy0=0,turns=0,st=0,wob=0,y=H/2,bounced=false;
const counts=[0,0];
function minY(a,w){return Math.max(H/2*Math.abs(Math.cos(a))+R*Math.abs(Math.sin(a)),H/2+R*Math.abs(Math.sin(w)));}
function busy(b){inH.disabled=inT.disabled=btn.disabled=b;stage.style.cursor=b?'default':'grab';}
function showResult(){
  const isH=face===0,name=isH?'Heads':'Tails',label=(isH?inH.value:inT.value).trim();
  eyebrow.textContent=label?name:'Landed on';
  result.className=isH?'h':'t';
  result.firstElementChild.textContent=label||name;
  tallyEl.textContent='Heads '+counts[0]+' · Tails '+counts[1];
}
function toss(power){
  if(state!=='idle')return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){ac=null;}
  ping(.04);
  const r=new Uint32Array(1);
  try{crypto.getRandomValues(r);outcome=r[0]&1;}catch(e){outcome=Math.random()<.5?0:1;}
  vy0=7+9*power;T=2*vy0/G;
  turns=Math.round(6+10*power);
  if((turns%2===1)!==(outcome!==face))turns++;
  a0=face*Math.PI;t=0;state='air';busy(true);hint.hidden=true;
  eyebrow.textContent='In the air';result.className='';result.firstElementChild.textContent='…';
}

/* flick detection */
let trail=null;
stage.addEventListener('pointerdown',e=>{
  if(state!=='idle')return;
  trail=[{t:e.timeStamp,y:e.clientY}];
  try{stage.setPointerCapture(e.pointerId);}catch(_){}
});
stage.addEventListener('pointermove',e=>{if(trail){trail.push({t:e.timeStamp,y:e.clientY});if(trail.length>40)trail.splice(1,1);}});
function release(e){
  if(!trail)return;
  trail.push({t:e.timeStamp,y:e.clientY});
  const last=trail[trail.length-1],first=trail[0];
  let ref=first;
  for(let i=trail.length-2;i>=0;i--){ref=trail[i];if(last.t-trail[i].t>=110)break;}
  const dt=Math.max(last.t-ref.t,16),v=(ref.y-last.y)/dt,travel=first.y-last.y;
  trail=null;
  if(travel>30&&v>.25)toss(Math.min(1,Math.max(0,(v-.25)/2.2)));
}
stage.addEventListener('pointerup',release);
stage.addEventListener('pointercancel',()=>{trail=null;});
btn.addEventListener('click',()=>toss(.6));

/* ---------- camera ---------- */
let dist=6;
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),wantPos=new THREE.Vector3(),wantLook=new THREE.Vector3();
function resize(){
  const w=stage.clientWidth||1,h=stage.clientHeight||1;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  dist=Math.min(14,Math.max(4.6,3.7/camera.aspect));
}
function aim(){
  const flying=state==='air'||(state==='settle'&&st<.15);
  if(flying){wantPos.set(0,1.6+y*.35,dist*.9+4);wantLook.set(0,y*.85,0);}
  else{wantPos.set(0,dist*.9,dist*.44);wantLook.set(0,0,0);}
}
busy(true);resize();aim();camPos.copy(wantPos);camLook.copy(wantLook);
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else addEventListener('resize',resize);

/* ---------- loop ---------- */
let prev=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  if(state==='air'){
    t+=dt;
    if(t>=T){
      face=outcome;ang=face*Math.PI;y=H/2;wob=0;state='settle';st=0;bounced=false;counts[face]++;showResult();ping(.12);
      try{navigator.vibrate&&navigator.vibrate(18);}catch(_){}
    }else{
      ang=a0+turns*Math.PI*(t/T);
      wob=.1*Math.sin(Math.PI*t/T)*Math.sin(11*t);          /* a thumbed coin never spins perfectly true */
      y=Math.max(H/2+vy0*t-G*t*t/2,minY(ang,0));
    }
  }else if(state==='settle'){
    st+=dt;
    const T2=.22,v2=G*T2/2;
    if(!bounced&&st>=T2){bounced=true;ping(.05);}
    wob=.22*Math.exp(-5*st)*Math.sin(24*st+18*st*st);       /* rattle speeds up as it dies down */
    y=Math.max(H/2+Math.max(0,v2*st-G*st*st/2),minY(ang,wob));
    if(st>1){state='idle';wob=0;y=H/2;busy(false);}
  }
  coin.position.y=y;coin.rotation.set(-ang,0,wob);
  const lift=y-H/2;
  shadow.scale.setScalar(1+lift*.2);shadow.material.opacity=.6/(1+lift*.6);
  aim();
  const k=1-Math.exp(-dt*6);
  camPos.lerp(wantPos,k);camLook.lerp(wantLook,k);
  camera.position.copy(camPos);camera.lookAt(camLook);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
